a manbalarga ko'ra, mil.avv. VII-VI asrlarda O'zbekiston hududida yashagan sug'diylar qayerda istiqomat qilganlar va ularning hududi qanday nomlar bilan atalgan?", "Zarafshon bo'ylarida yashagan bo'lib, ularning yurti «Avesto»da Sug'da, Behustun yozuvlarida Sug'uda, Arrian va Strabon asarlarida Sogdiyona deb nomlangan.", "Amudaryoning quyi oqimida yashab, Xvarizom (Avesto) va Xvarazmish (Behustun yozuvlari) deb atalgan, Arrian asarlarida Xorasmiya deb zikr etilgan.", "Surxandaryo vodiysi va Afg'onistonning shimoliy qismida yashagan, «Avesto»da Baxdi, Behustun yozuvlarida Baktrish va yunon-rim manbalarida Baqtriana deb nomlangan.", "Tyan-Shan tog'ining g'arbiy etaklarida joylashgan bo'lib, ularning hududi qadimiy manbalarda Sakalar yoki Massagetlar deb atalgan, harbiy yurishlari bilan mashhur edi."], ["Qadimgi yunon tarixchisi Gerodot nima uchun «tarix fanining otasi» deb atalgan va uning «Tarix» nomli asari qaysi davr voqealarini yoritgan?", "Uning asari umumiy tarix tilida yozilgan birinchi asar bo'lganligi sababli, mil.avv. 479-yilgacha bo'lgan ijtimoiy-siyosiy hayotdan hikoya qiladi.", "U o'zining safarlari davomida shaxsiy kuzatuvlari va to'plagan ma'lumotlari asosida turli xalqlarning madaniyatini chuqur tahlil qilganligi uchun.", "Uning asarlarida qadimgi yunon mifologiyasi va afsonalari ilmiy nuqtai nazardan tahlil qilinganligi, bu esa yangi tarix metodologiyasiga asos solganligi sababli.", "Gerodot harbiy strategiya va diplomatiya bo'yicha nazariyalar ishlab chiqqan, bu esa keyingi avlod tarixchilari uchun muhim qo'llanma bo'lib xizmat qilganligi sababli."], ["Arrian Flaviyning to'liq ismi va tug'ilgan joyi qanday bo'lgan, u qaysi asarlarning muallifi sifatida tanilgan?", "Kvint Eptey Arrian Kichik Osiyoning Vifina shahrida tug'ilgan bo'lib, «Aleksandr haqida», «Parfiyaliklar haqida», «Hindiston» va «Aleksandrning yurishlari» asarlarining muallifidir.", "Gay Svetoniy Trankvill Rim imperiyasining Palatin tepaligida tug'ilgan bo'lib, «O'n ikki Sezarning hayoti» va «Mashhur notiqlar» asarlarining egasidir.", "Publiy Korneliy Tasit Qadimgi Rimning Galalar provinsiyasida tug'ilgan bo'lib, «Tarixlar» va «Germaniya» nomli jildlarning asosiy ijodkori sifatida e'tirof etilgan.", "Titus Liviy Pataviumda tug'ilgan bo'lib, «Rim tarixi shahar tashkil topganidan beri» nomli monumenta asarning muallifi sifatida e'tirof etilgan."], ["Arrianning «Aleksandrning yurishlari» asarida Oks daryosi haqida qanday ma'lumotlar keltirilgan va Aleksandr qo'shinlari uni qanday kesib o'tishgan?", "Oks hozirgi Amudaryo bo'lib, Osiyodagi eng katta daryolardan biri ekanligi, kengligi 6 stadiy ekanligi va Aleksandrning uni teridan qayiqqa o'xshash moslamalar yordamida besh kunda kechib o'tgani qayd etilgan.", "Daryo Nil daryosining irmog'i bo'lib, suv sathi yil davomida o'zgarib turganligi, Aleksandr qo'shinlari suv osti tunneli orqali xavfsiz o'tgani haqida ma'lumotlar berilgan.", "Bu Gang daryosining qadimgi nomi bo'lib, uning qirg'oqlari o'rmonlar bilan qoplanganligi, Aleksandr qo'shinlari suzishga yaroqli katta to'qimachilik vositalaridan foydalanib o'tgani tasvirlangan.", "Oks Furot daryosining boshqa bir nomi bo'lib, suvi juda tez oqadigan, Aleksandrning buyrug'i bilan uzun ko'prik qurilib, qo'shinlar u orqali qisqa muddatda muvaffaqiyatli o'tgani aytilgan."], ["Matnda keltirilishicha, 'epigrafika' so'zi (grekcha) qanday ma'noni anglatadi va u qanday yozuvlarni o'rganadi?", "U 'ustidan, tepasida' va 'yozuv' ma'nosini anglatib, predmet ustidagi qadimgi yozuvlarni o'rganadi.", "U 'qadimgi bilim' va 'san'at' ma'nosini anglatib, diniy marosimlarni o'rganadigan fan sohasi hisoblanadi.", "U 'er osti' va 'topilmalar' ma'nosini anglatib, yer ostidan topilgan buyumlarni chuqur o'rganadi.", "U 'tarixiy hujjat' va 'saqlash' ma'nosini anglatib, faqat qog'ozdagi qadimiy manbalarni o'rganadi."], ["Ahmoniylarning qadimgi poytaxti Persepolis va Suza shaharlarida topilgan yozuvlar nima haqida ma'lumot beradi?", "Ular Doro I hukmronligining dastlabki yillarida Suzida bunyod etilgan saroy qurilish tafsilotini aytadi.", "Ular faqat Doro I ning harbiy yurishlari va zafar qozongan jangu-jadallari haqida batafsil ma'lumot beradi.", "Ular Persiya imperiyasining turli viloyatlaridan to'lanadigan soliq miqdorini aniq ko'rsatib beradi.", "Ular qadimiy Eron xalqlarining diniy e'tiqodlari va ularning kundalik turmush tarzi haqida yozilgan."], ["Doro I ning Suzadagi saroy qurilishi tafsilotida keltirilganidek, lazurit va serdolik qaysi mamlakatdan keltirilgan?", "Tovlanib turgan lazurit va qizg'ish rangdagi serdolik toshi Sug'diyonadan keltirilgan.", "Bino qurilishi uchun zarur bo'lgan lazurit va serdolik toshi Lidiyadan olib kelingan.", "Saroy qurilishida ishlatilgan lazurit va serdolik toshi Xorazmdan olib kelingan.", "Qurilishga ishlatilgan lazurit va serdolik toshi, asosan, Baqtriyadan olib kelingan edi."], ["Perespol saroy devorlariga o'yilgan manzarada Markaziy Osiyo xalqlari orasidan Sug'diylar qanday tasvirlangan?", "Ular o'ziga xos oyoq kiyimida, qo'llarida qadah, mato, hayvon terisi va ikki bosh qo'yni etaklab kelmoqda.", "Ular uchli kigiz qalpoqli, ot etaklagan va qo'llarida qimmatbaho sovg'alar bilan kelmoqda.", "Ular turli idishlar, teri, mo'yna va tuya olib kelayotgan holda tasvirlanganlar.", "Ular kalta qilich va oybolta bilan qurollangan, ot etaklagan holda tasvirlanganlar."], ["Behustun yozuvlari qanday ahamiyatga ega va u kimning g'alabasini yodga olib bunyod etilgan?", "U Doro I ning amri bilan yozdirilgan, uning g'alabasini aks ettiruvchi muhim tarixiy yodgorlikdir.", "U Aleksandr Makedonskiyning Sharqqa yurishlari haqida ma'lumot beruvchi katta ahamiyatga ega manba.", "U Ahamoniylar imperiyasining qulashini va yangi sulolaning hokimiyatga kelishini tasvirlaydi.", "U O'rta Osiyo xalqlarining forslarga qarshi ko'targan yirik qo'zg'olonlarini batafsil hikoya qiladi."], ["Behustun yozuvlari qaysi uch tilda yozilganligi matnda aniq ko'rsatilgan?", "U Elam, bobil va qadimgi Eron tillarida bitilgan va o'yib yozilgan yodgorlikdir.", "U faqatgina qadimgi fors tilida yozilgan bo'lib, keyinchalik boshqa tillarga tarjima qilingan.", "U grek, lotin va fors tillarida yozilgan, ammo qadimiy nusxasi yo'qotilgan edi.", "U barcha 23 satraplikning mahalliy tillarida yozilgan, shu tufayli tushunish qiyin edi."], ["Poliyen rivoyatiga ko'ra, cho'pon Shiroqning forslarni aldashdan asosiy maqsadi nima bo'lgan?", "Uning maqsadi saklarni tashnalik va ochlikdan saqlab qolish uchun forslarni aldash edi.", "U forslar bilan birga sak qabilalariga hujum qilish uchun yashirin yo'l topishga harakat qilgan.", "U forslardan qochib, o'z qabiladoshlariga yordam berish uchun yolg'on ma'lumot bergan edi.", "U forslarning ishonchiga kirib, ulardan qimmatbaho sovg'alarni olishni niyat qilgan edi."], ["Matnga ko'ra, Zardushtiylik dini O'rta Osiyoda qachon keng tarqala boshlagan va uning asoslari nimadan kelib chiqqan?", "Mil.avv. 1 ming yillikning birinchi yarmida tarqalgan, asoslari tabiyatni ilohiylashtirishdan kelib chiqqan.", "Milodiy I-IV asrlarda Kushon podsholigi davrida tarqalgan, asoslari buddist ta'limotiga asoslangan.", "Mil.avv. VI-V asrlarda keng tarqalgan, asoslari monoteistik diniy islohotlardan kelib chiqqan.", "O'rta asrning boshida tarqalgan, asoslari Xorazmda paydo bo'lgan qabilaviy e'tiqodlardan kelib chiqqan."], ["Zardushtiylik dinining ilk tarafdorlari qanday elementlarga sig'inganlar va ularni muqaddas deb bilganlar?", "Ular olov (quyosh)ga, er, suv, oy va yulduzlarga sig'inganlar va ularni muqaddas deb bilishgan.", "Ular faqatgina bir ilohga sig'inganlar, chunki zardushtiylik dini monoteistik e'tiqodga asoslangan.", "Ular hayvonlarga va o'simliklarga sig'inganlar, ularni tabiatning ruhlari deb hisoblaganlar.", "Ular o'z ajdodlarining ruhlariga va qadimgi qabila boshliqlariga hurmat bajo keltirganlar."], ["'Avesto' muqaddas kitobi qachon yozilgan va u qaysi xalqlarning madaniyatini o'rganishda asosiy manba hisoblanadi?", "Mil.avv. VI – V asrlarda yozilgan va Eron hamda O'rta Osiyo xalqlarining madaniyatini o'rganishda manbadir.", "Milodiy III asrda yozilgan va asosan yunon-rim madaniyatining O'rta Osiyoga ta'sirini tasvirlaydi.", "Milodiy VII-VIII asrlarda yozilgan va arab xalqlari madaniyati va urf-odatlari haqida ma'lumot beradi.", "Mil.avv. I ming yillikning boshida yozilgan va faqatgina fors shohlarining tarixi haqida ma'lumot beradi."], ["'Avesto' kitobining to'liq nusxalaridan biri qaysi hukmdorning buyrug'i bilan yoqib yuborilgan?", "Aleksandr Makedonskiyning amru-farmoni bilan bir nusxasi yoqib yuborilganligi ma'lumotlarda keltirilgan.", "Doro I ning amri bilan barcha eski diniy yozuvlar yoqib yuborilgan, 'Avesto' ham shular jumlasidandir.", "Sosoniy Shopur II ning farmoni bilan 'Avesto'ning barcha nodir nusxalari ataylab yo'q qilingan.", "Parfiya podshosi Volgash III 'Avesto'ning ayrim qismlarini ataylab yo'q qilishga buyruq bergan."], ["Mil.av. VII-VI asrlarda O'zbekiston hududida yozma manbalarga ko'ra qaysi elatlar yashagan?", "U erda sug'diylar, baqtriyaliklar, xorazmliklar, sak va massaget elatlari yashaganlar.", "U erda faqatgina forslar va yunonlar yashagan, boshqa xalqlar u hududda istiqomat qilmagan.", "U erda, asosan, skiflar va sarmatlar yashagan, boshqa xalqlar u yerda yashashmagan edi.", "U erda turli ko'chmanchi qabilalar yashagan, ammo dehqonchilik bilan shug'ullanuvchi xalqlar yo'q edi."], ["Gerodotning ma'lumotiga ko'ra, qadimgi Baqtriyaning poytaxti qaysi shahar bo'lgan va u qaerda joylashgan edi?", "Baqtriyaning poytaxti Balx shahri bo'lgan va u Turkmanistonning janubi-g'arbiy qismida joylashgan.", "Baqtriyaning poytaxti Marokanda shahri bo'lib, u Zarafshon bo'ylarida, Sug'dlar hududida joylashgan edi.", "Baqtriyaning poytaxti Kesh shahri bo'lib, Tyan-Shan tog'ining g'arbiy etaklarida joylashgan edi.", "Baqtriyaning poytaxti Termez shahri bo'lib, u Amudaryo bo'ylarida muhim savdo markazi hisoblangan."], ["Kushon davri Termezning buddaviylik ibodatxonalari va Qoratepadagi arxeologik topilmalar nima haqida qimmatli dalillar beradi?", "Ular Kushon davri shahar aholisining diniy e'tiqodlari, tili va yozuvini o'rganishda qimmatli dalillar beradi.", "Ular faqat Kushon podsholarining shaxsiy buyumlari va ularning dafn marosimlari haqida ma'lumot beradi.", "Ular Kushon davridagi harbiy texnologiyalar va mudofaa inshootlari haqida to'liq tasavvur beradi.", "Ular Kushonlar davrida mavjud bo'lmagan qadimiy shaharlarning joylashuvini aniqlashga yordam beradi."], ["Qadimgi Yunon va Rim manbalarida Gerodotning 'tarix fanining otasi' deb atalishiga kimning so'zlari asos qilib keltirilgan?", "U Siseronning so'zlari bilan 'tarix fanining otasi' deb nomlangan, uning 'Tarix' asari bilan mashhur.", "U Strabonning fikriga ko'ra 'tarix fanining otasi' deb atalgan, chunki u geografik bilimlarni yozgan.", "U Arrianning asarlarida 'tarix fanining otasi' deb tilga olingan, chunki u Aleksandr yurishlarini yozgan.", "U Plutarxning ma'lumotlarida 'tarix fanining otasi' deb e'tirof etilgan, chunki u qadimgi biografiyalarni yozgan."], ["Arrian Flaviyning 'Aleksandrning yurishlari' asarida Oks daryosi (hozirgi Amudaryo) qanday ta'riflangan?", "U Hind daryolarini hisobga olmaganda Osiyodagi eng katta daryolardan biri edi deb ta'riflangan.", "U butun dunyodagi eng uzun va keng daryolardan biri deb ta'riflangan, uning ahamiyati juda katta edi.", "U faqatgina Markaziy Osiyo hududidagi eng katta daryo deb ta'riflangan, ammo suv sathi past bo'lgan.", "U kichik va sayoz daryo deb ta'riflangan, shuning uchun Aleksandr qo'shinlari uni osonlik bilan kechib o'tganlar."], ["O'rta Osiyo qadimgi Sharq tarixining ajralmas qismini tashkil etib, kishilik madaniyatining ilk markazlaridan biri hisoblanishiga nimalar asos bo'lgan?", "Tabiiy sharoitining xilma-xilligi, boy o'simlik va hayvonot dunyosi hamda mo'tadil iqlim sharoitlari.", "Yirik davlatlarning mavjudligi, qadimiy savdo yo'llarining kesishganligi va noyob minerallarga boyligi.", "Ijtimoiy-siyosiy tuzilmalarning rivojlanganligi, mudofaa tizimlarining mustahkamligi va harbiy texnologiyalar.", "Diniy ta'limotlarning keng yoyilganligi, yozma adabiyotning taraqqiyoti va falsafiy maktablarning shakllanishi."], ["Perespol'dagi qoyatoshlarga o'yilgan tasvirlar Markaziy Osiyo xalqlaridan qaysi birining Ahmoniylarga xiroj keltirganini ko'rsatadi?", "Sug'diylar, baqtriyaliklar va xorazmliklar kabi elatlar.", "Massagetlar, skiflar va sarmatlar kabi ko'chmanchi qabilalar.", "Parfiyaliklar, midiyaliklar va elamliklar kabi qadimiy davlatlar.", "Kushonlar, eftaliylar va g'o'rlar kabi ilk o'rta asr imperiyalari."], ["Epigrafika atamasi grekcha \"epi\" va \"grafio\" so'zlaridan kelib chiqqan bo'lib, quyidagi ma'nolardan qaysi birini ifodalaydi?", "Biror predmet ustidagi yozuvlarni o'rganuvchi fan sohasi.", "Qadimgi madaniyatlarning ijtimoiy tuzilmalarini tahlil qiluvchi yo'nalish.", "Jonivorlar va o'simliklarning evolyutsiyasini tadqiq etuvchi biologiya bo'limi.", "Tarixiy davrlardagi savdo aloqalarini aniqlovchi iqtisodiy tadqiqotlar."], ["Doro I ning Suzidagi saroyi qurilishida Sog'diyonadan qaysi turdagi qurilish materiallari olib kelinganligi ta'kidlangan?", "Tovlanib turgan toshlar, lazurit va qizg'ish rangdagi serdolik.", "Oltin qumlar, kumush tangalar va qimmatbaho ipak matolar.", "Firuza toshi, gips, marmar hamda turli xildagi yog'ochlar.", "Qattiq sopol taxtachalar, shishasimon qum va temir rudalari."], ["Perespol'dagi Ahmoniylar tasvirlarida Xorazmliklar qaysi guruhga mansubligi va qanday ko'rinishda tasvirlangani ko'rsatilgan?", "O'n ettinchi guruh bo'lib, kalta qilich va oybolta bilan qurollangan holda tasvirlangan.", "O'n birinchi guruh bo'lib, o'tkir kigiz qalpoq kiygan, ot etaklagan holatda tasvirlangan.", "Sakkizinchi guruh bo'lib, idishlar, matolar va qo'ylar bilan xiroj keltirayotgan.", "O'n uchinchi guruh bo'lib, baqtriya tuyalarini va qadahlar bilan ko'rsatilgan."], ["Behustun yozuvlari Ahamoniylar imperiyasini larzaga keltirgan qaysi hodisa haqida hikoya qiladi?", "Gaumata, Frada, Skunka boshliq xalq harakatlari va qo'zg'olonlari.", "Aleksandr Makedonskiyning harbiy yurishlari va shoh Doro III ning mag'lubiyati.", "Markaziy Osiyo xalqlarining erkinlik uchun kurashlari va mustaqillik talablari.", "Doro I ning o'z imperiyasi chegaralarini kengaytirish uchun olib borgan urushlari."], ["Behustun yozuvlari Doro I ning amri bilan qaysi uch tilda bitilganligi ma'lum qilingan?", "Elam, bobil va qadimgi Eron tillarida.", "Akkad, ossuriy va fors-pahlaviy tillarida.", "Aram, yunon va sug'd tillarida.", "Lotin, hind va sanskrit tillarida."], ["\"Avesto\"da asoslari yoritilgan zardushtiylik dini qaysi davrda va qanday sharoitda shakllangan?", "Ibtidoiy jamoa sharoitida tabiyatni ilohiylashtirish davrida shakllangan.", "Ahamoniylar davrida shoh Doro I tomonidan imperiyaning rasmiy dini sifatida.", "Sosoniylar davrida Markaziy Osiyo va Eron xalqlarining madaniy birlashishi.", "Yunon-Baqtriya davrida, Aleksandr Makedonskiy yurishlaridan so'ng."], ["\"Avesto\" kitobining yozilgan joyi haqida olimlar o'rtasida qanday asosiy qarashlar mavjud?", "Midiyada yoki Amudaryo bo'yidagi viloyatlarda yaratilgan degan fikrlar.", "Hindistonning shimoliy hududlarida yoki Qora dengiz bo'ylarida yaratilgan.", "O'rta Osiyoning tog'li hududlarida yoki Qozog'iston dashtlarida yozilgan.", "Mesopotamiya yoki Kichik Osiyo hududlarida, turli sivilizatsiyalar ta'siri ostida."], ["Gerodotning O'rta Osiyo haqida keltirgan ma'lumotlari qanday ahamiyatga ega va u qaysi xalqlarni tilga oladi?", "Tarixiy jihatdan muhim bo'lib, Baqtriya, Girkaniya, Kaspiy, Sug'dlar, Saklar, Xorazmiylar va Ariylarni tilga oladi.", "Geografik ma'lumotlarni o'z ichiga olib, G'arbiy Xitoy va Sibirning qadimiy qabilalarini eslatib o'tadi.", "Ijtimoiy-siyosiy hayotdan bahs yuritib, Misr, Lidiya va Bobilning qabilaviy tuzilmalarini yoritadi.", "Etnografik xususiyatlarni ta'kidlab, Hindiston va Qora dengiz bo'yi xalqlarining urf-odatlarini tasvirlaydi."], ["Gerodot asarlarida Xorazm o'lkasini qaysi daryo bilan bog'liq holda tasvirlaydi va bu daryoning ahamiyati nimada?", "Ares daryosi bilan bog'lab, uning sug'orish kanallaridan dehqonchilikda unumli foydalanilganini ta'kidlaydi.", "Oks daryosi bilan bog'lab, uning yirik savdo yo'li sifatida muhimligini izohlaydi, Sharq va G'arbni bog'laydi.", "Zarafshon daryosi bilan bog'lab, uning atroflarida yirik shahar-davlatlar mavjudligini qayd etadi.", "Sirdaryo bilan bog'lab, u Markaziy Osiyo qabilalarining madaniy markazi ekanligini, aholi zichligini yozadi."], ["Arrian Flaviyning \"Aleksandrning yurishlari\" asari qanday ma'lumotlar bilan qimmatli hisoblanadi va u nimaga bag'ishlangan?", "Aleksandr Makedonskiyning harbiy yurishlari bo'yicha muhim manba bo'lib, O'rta Osiyo tarixiga bag'ishlangan.", "Qadimgi Rim va Yunon imperiyalarining siyosiy tarixi bo'yicha tahliliy ma'lumotlar berib, iqtisodiy aloqalarni yoritgan.", "Parfiyaliklar va hindlarning urf-odatlari, diniy e'tiqodlari haqida chuqur ma'lumotlar taqdim etib, mintaqaviy aloqalarni ko'rsatgan.", "Antik davrdagi geografik kashfiyotlar va turli xalqlarning migratsiya yo'llari haqida ilmiy nazariyalarni ilgari surgan."], ["Arrianga ko'ra, Oks daryosi (hozirgi Amudaryo) qanday xususiyatga ega bo'lgan va Aleksandr qo'shinlari uni qanday kesib o'tgan?", "Osiyodagi eng katta daryolardan biri bo'lib, Aleksandr teridan qayiqqa o'xshash moslamalar yasatib o'tgan.", "Kichik daryo bo'lib, qishda muzlab qolgan va qo'shinlar muz ustidan piyoda yurib o'tgan.", "Juda chuqur va tez oqar daryo bo'lib, Aleksandr maxsus ko'priklar qurishni buyurgan.", "Chegara daryosi bo'lib, qo'shinlar uzoq vaqt kutib, suzuvchi vositalar yordamida sekin o'tgan."], ["Ko'hna Termezning Kushon davri diniy markazi hisoblanishida Qoratepa qanday rol o'ynagan va u yerda qanday tadqiqotlar o'tkazilgan?", "1961-yildan boshlab Moskvadagi va Sankt-Peterburg Ermitajining ekspeditsiyalari buddaviylik dinining tarqalishiga oid dalillar topgan.", "Qoratepa 1926-yilda ilk arxeologik qazishmalar o'tkazilgan hudud bo'lib, aholining urf-odatlari va qadimiy iqtisodiy faoliyatiga oid topilmalar bergan.", "Kushon davrining eng yirik savdo markazlaridan biri bo'lib, u yerda topilgan tovarlar orqali Sharq va G'arb aloqalari o'rganilgan.", "Qoratepa Termez shahrining mudofaa inshootlari joylashgan strategik nuqta bo'lib, harbiy texnologiyalar va istehkomlarga oid ma'lumotlarni taqdim etgan."], ["O'rta Osiyo hududida ibtidoiy va qadimgi davr kishilarining faoliyati haqida qanday xilma-xil obidalar keng tarqalgan?", "Tosh asri makonlari, g'orlar, bronza davri qishloqlari va mozorlari, temir davri qal'alari, qoyatosh rasmlari, sug'orish inshootlari qoldiqlari.", "Erta o'rta asr shaharlari, karvonsaroylar, masjidlar va minoralarning qoldiqlari, shuningdek savdo yozishmalarining turli namunalaridir.", "Yunon-Baqtriya davrining tangalari, saroy xarobalari va yozma yodgorliklari, qadimiy elatlarning hunarmandchilik ashyolaridir.", "Qadimgi sug'orish tizimlari, ibodatxonalar va savdo yo'llari bo'ylab qadimiy aholi punktlari, turli xil sopol idishlarining qoldiqlari."], ["Zardusht miloddan avvalgi 1 ming yillikning birinchi choragida yashaganligi va 77 yoshida qanday sharoitda halok bo'lganligi ma'lum?", "Zoroastrizm e'tiqodi dushmanlari qo'lida halok bo'lgan.", "Tabiiy ofat natijasida, yirik zilzila yoki toshqin paytida.", "Qadimgi urushlarda qo'shiniga boshchilik qilayotganida vafot etgan.", "Keksalik va og'ir kasallik tufayli o'z yotoq joyida vafot etgan."], ["Yozma manbalarning guvohlik berishicha, mil.av. VII-VI asrlarda O'zbekiston hududida qaysi elatlar yashagan?", "Sug'diylar, baqtriyaliklar, xorazmliklar, saklar va massagetlar.", "Parfiyaliklar, girkaniyaliklar, eftaliylar, xionitlar va toxarlar.", "Kushonlar, salavkiylar, elamliklar, midiyaliklar va ossuriylar.", "So'g'd qabilalari, skiflar, sarmatlar, ariylar va yunon mustamlakachilari."], ["Hamdulloh Qazviniyning 'Tarixi guzida' asari qaysi davr voqealari va hududlarini oʻz ichiga oladi?", "Asar qadim zamonlardan 1330-yilgacha Eron va qisman O'rta Osiyo voqealarini bayon etgan.", "Asar XIII asrdan XVI asrgacha G'arbiy Yevropa va Shimoliy Afrika voqealarini bayon etgan.", "Asar faqatgina mo'g'ullar istilosidan keyingi Xitoy va Hindiston tarixini yoritgan, xolos.", "Asar Temuriylar davrining to'liq tarixini va Markaziy Osiyo xalqlari madaniyatini yoritgan."], ["Rui Gonsales de Klavixo oʻzining 'Kundaliklari' asarida qaysi voqeani Samarqandga kelishidan avval guvohi bo'lganini yozgan?", "U Amir Temur va Boyazid I Yildirim qo'shinlari o'rtasidagi eng katta qirg'in barot urushini tomosha qilgan.", "U Shayboniyxonning Boburga qarshi jangda qozongan g'alabasiga bevosita guvoh bo'lganligi haqida eslatib o'tgan.", "U Elxoniy Abu Sa'idning taxtga o'tirish marosimi va uning harbiy yurishlari haqida batafsil ma'lumot bergan.", "U Oltin O'rdaning markaziy qismi vayron qilinishi va yangi shaharlar qurilishi jarayonini kuzatgan."], ["Klavixoning Amir Temur yurtiga qilgan elchilik sayohati qachon boshlangan va Samarqandga necha oyda yetib kelgan?", "Sayohat 1403-yilning 22-mayida boshlanib, u 15 oy deganda Samarqandga yetib keladi, xolos.", "Sayohat 1402-yilning bahorida boshlanib, u to'rt oy ichida faqat Fors hududlariga yetib borgan, xolos.", "Sayohat 1410-yilning kuzida boshlanib, ikki yildan so'ng Afg'onistonning Kobul shahriga yetib borgan.", "Sayohat 1398-yilning yozida boshlanib, saksonta kundan keyin Hindistonning poytaxtiga yetib kelgan."], ["Klavixo o'zining 'Kundaliklari' asarida Ko'ksaroy qasri haqida qanday ma'lumotlarni keltiradi?", "U qasr shahar chetida bo'lib, suv oqib turgan xandaq bilan o'ralgan, unda mingga yaqin hunarmand ishlagan.", "U qasrning faqat Temuriy shahzodalari yashaydigan saroy bo'lganini, uning ichida kutubxona borligini qayd etadi.", "U qasrni markaziy bozordan uncha uzoq bo'lmagan hududda joylashgan diniy majmua sifatida ta'riflagan.", "U qasrni savdo karvonlarining asosiy to'xtash joyi deb tasvirlagan va uning faqat bitta minorasi borligini yozgan."], ["Sharafuddin Ali Yazdiyning 'Zafarnoma' asari qaysi nomlar bilan ham mashhur bo'lgan?", "'Temur Zafarnomasi', 'Jahongir Temur tarixi', 'Sohibqiron fathnomasi' va 'Jahongir tarixi' nomlari bilan.", "'Tarixi guzida', 'Nuzhat ul-qulub' va 'Ravzat us-safo' kabi umumiy tarixiy manbalar nomi bilan.", "'Matlai us-sa'dayn', 'Lubob ul-albob' va 'Tazqirat ush-shuaro' kabi tarixiy-adabiy asar nomlari bilan.", "'Ziji Jadidi Ko'ragoniy', 'Ulus-i arba'yi Chingizxon' kabi astronomik va geografik risolalar nomi bilan."], ["Sharafuddin Ali Yazdiyning 'Zafarnoma' asari kimning istagi bilan va qachon tugallangan?", "Temuriy shahzoda Sulton Ibrohimning istagi bilan 858 (1424-1425 yy.) yillarda tugallanadi.", "Amir Temurning farmoyishi bilan 1405-yilda Samarqandda yozib tamomlangan asar edi.", "Elxoniy Abu Sa'idning topshirig'i bilan 1330-yilda fors tilida yaratilgan bo'lib, xotimasi yo'q.", "Muhammad Payg'ambar davrida yozilib, Abbosiylar hukmronligi davrida yakunlangan edi."], ["Mirxond o'zining 'Ravzat us-safo' asarida qaysi davr voqealarini Amir Temur zamonidan to Sulton Abu Sa'idning vafotigacha yoritgan?", "Asarning oltinchi jildida Amir Temur va uning zamonidan to Sulton Abu Sa'idning o'limigacha (1469y.) bo'lgan voqealar.", "Asarning ikkinchi jildida faqat Rashiduddin davri va Umayyad xalifalarining hukmronlik yillari haqida so'z boradi.", "Asarning birinchi jildida Sosoniy Yazdijard III davridan avvalgi qadimiy Eron shohlari tarixining qisqacha bayoni.", "Asarning uchinchi jildida faqatgina Chingizxon va uning avlodlarining mo'g'ullar imperiyasini qanday boshqarganligi."], ["Abdurazzoq Samarqandiyning 'Matlai us-sa'dayn va majis ul-bahrayn' asari nechta qismdan iborat?", "Asar ikki asosiy qismdan iborat bo'lib, birinchi qism Elxon Abu Sa'id, ikkinchi qism Shohrux davrini yoritgan.", "Asar yetti jildli muqaddima, xotima va olti qismdan tashkil topgan, uning asosi Temuriy tarixi emas.", "Asar faqat bitta umumiy qismdan iborat bo'lib, unda faqat Muhammad Payg'ambar hayoti tasvirlangan, xolos.", "Asar to'rtta qismdan iborat bo'lib, uning to'rtinchi qismi Alisher Navoiyning hayoti va ijodini o'z ichiga olgan."], ["Abdurazzoq Samarqandiy qaysi davlatlar bilan bo'lgan munosabatlarni mustahkamlashda muhim rol o'ynagan?", "U 1441-yilda Janubiy Hindistonga elchi qilib yuborilib, Temuriylar-Hindiston aloqalarini rivojlantirgan.", "U Xitoy va Mo'g'iliston davlatlari bilan savdo munosabatlarini yaxshilashga mas'ul bo'lgan diplomat edi.", "U Yevropa davlatlari, xususan Ispaniya va Angliya bilan diplomatik aloqalarni mustahkamlashga harakat qilgan.", "U Usmonli imperiyasi bilan Temuriylar davlati o'rtasidagi harbiy-siyosiy ittifoqni shakllantirishga hissa qo'shgan."], ["Davlatshoh Samarqandiyning 'Tazqirat ush-shuaro' asarining uchinchi-beshinchi tabaqalarida kimlar haqida ma'lumot berilgan?", "Xorazmshohlar-Anushteginlar (1077-1231-yy.), Elxoniylar (1256-1353-yy.) va Muzaffariylar zamonidagi shoirlar.", "Abbosiylar va Somoniylar davrida yashagan faylasuflar va ularning ilmiy merosi haqidagi muhim ma'lumotlar.", "Temur va temuriylar davrida ijod etgan yozuvchilar, olimlar va davlat arboblari haqidagi batafsil ma'lumotlar.", "Arabiy navis shoirlar va qadimiy turk afsonaviy dostonchilari haqidagi umumiy, lekin qisqacha ma'lumotlar."], ["Mirzo Ulug'bekning 'Tarixi arba' ulus' asarining birinchi qismida qaysi hudud va hukmdorlar tarixi yoritilgan?", "Ulug' yurt, ya'ni Mo'g'uliston va Shimoliy Xitoy tarixi Ugadayxondan Urdayxongacha bayon etilgan.", "Jush ulusi, ya'ni Oltin O'rda tarixi Juchixondan Shohrux zamondoshi Muhammadxongacha yoritilgan, xolos.", "Chig'atoy ulusining XIII-XIV asrlardagi ijtimoiy-siyosiy ahvoli, faqat Temuriy hukmdorlarining taxtga kelishi.", "Ilxonid ulusining umumiy tarixi, asosiy e'tibor Abulxayrxon davriga qaratilgani, uning islohotlari."], ["Zahiriddin Muhammad Bobir Andijonda qachon tavallud topgan va necha yoshida taxtga o'tgan?", "U 1483-yil 14-fevralda Andijonda tug'ilgan va 1494-yil 5-iyunda 12 yoshida Farg'ona taxtiga o'tkazilgan.", "U 1461-yilda Samarqandda dunyoga kelgan va 1480-yilda 19 yoshida Boburiylar davlatini boshqarishga kirishgan.", "U 1500-yilning bahorida Qobul shahrida tug'ilgan va 15 yoshida Afg'onistonning hukmdori etib tayinlangan edi.", "U 1475-yilning kuzida Toshkentda tavallud topgan va 13 yoshida otasining o'rniga taxtga o'tirgan yosh hukmdor."], ["Bobur Hindistonni bosib olib, qanday imperiyaga asos solgan va qachon vafot etgan?", "U 1526-yilda Hindistonni bosib olib, Boburiylar (G'arbda Buyuk mo'g'ullar) imperiyasiga asos solgan va 1530-yil 26-dekabrda vafot etgan.", "U 1504-yilda Hindistonni zabt etib, Temuriylar davlatiga asos solgan va 1520-yillarda jangda halok bo'lgan, xolos.", "U 1497-yilda Hindistonni egallab, Ismoil Safaviy davlatiga asos solgan va 1511-yilda Andijonda vafot etgan.", "U 1530-yili Hindistonda g'alaba qozonib, Chingiziylar sulolasiga asos solgan va 1545-yilda Samarqandda vafot etgan."], ["'Boburnoma' asari qaysi tipdagi manba bo'lib, uning asosiy mazmuni nimadan iborat?", "'Boburnoma' memuar tipdagi asar bo'lib, XV asr oxiri va XVI asr boshidagi ijtimoiy-siyosiy ahvolni yoritgan.", "'Boburnoma' faqatgina she'riy asar bo'lib, Amir Temurning jangovor yurishlari va g'alabalari haqidadir.", "'Boburnoma' astronomik kuzatishlar va matematik hisob-kitoblarni o'z ichiga olgan ilmiy risoladir, xolos.", "'Boburnoma' diniy mazmundagi tazkira bo'lib, unda faqat Payg'ambarlar va Avliyolar hayoti tasvirlangan."], ["'Boburnoma' ning birinchi to'liq inglizcha nashrini kimlar amalga oshirgan va qachon?", "Birinchi to'liq nashrini 1826-yilda J. Leyden va V. Erskin amalga oshirgan, bu Yevropada yuz bergan edi.", "Birinchi to'liq nashrini 1921-yilda A. Beverij tomonidan amalga oshirilgan, u matnni asl nusxadan tarjima qilgan.", "Birinchi to'liq nashrini 1586-yilda fors tilida Muhammad Ali ibn Darvishali Buxoriy tomonidan chop etilgan.", "Birinchi to'liq nashrini 1993-yilda professor V. Takston AQSHda ikki jild hajmda, mukammal so'zlik bilan nashr qilgan."], ["Rui Gonsales de Klavixo oʻzining 'Kundaliklari' asarida Samarqandning boyligi haqida qanday ta'rif beradi?", "U 'Bu yurt don-dun, may, meva-cheva, parranda go'shti, har xil go'sht, qo'yinki hamma narsa boydir' deb ta'riflaydi.", "U 'Samarqand faqatgina ilm-fan markazi bo'lib, uning savdo-sotiq ahamiyati kam edi' deb qayd etgan.", "U 'Samarqand faqatgina harbiy kuch markazi bo'lib, uning iqtisodiyoti rivojlanmagan edi' deb ta'riflaydi.", "U 'Samarqand faqatgina chorvachilik bilan shug'ullanadigan shahar bo'lib, ekinzorlari juda kam edi' deb qayd etgan."], ["Mirxondning 'Ravzat us-safo' asarida Chingizxon va uning avlodi haqida qaysi jildda ma'lumot berilgan?", "Asarning beshinchi jildida Chingizxon va uning avlodlari tarixi atroflicha yoritilgan.", "Asarning birinchi jildida Dunyoning yaratilishidan Sosoniy Yazdijard III davrigacha bo'lgan voqealar bayoni.", "Asarning ikkinchi jildida Muhammad Payg'ambar va xalifa Roshiddin davrida bo'lib o'tgan voqealar.", "Asarning to'rtinchi jildida Abbosiylar bilan zamondosh sulolalar tarixi to'g'risida keng ma'lumotlar mavjud."], ["Sharafuddin Ali Yazdiyning 'Zafarnoma' asaridagi Temurning shaxsi qanday tasvirlangan va bu asar qanday baholanadi?", "Asarda Temurning shaxsi nihoyatda ideallashtirilgan, biroq mo'g'ullar imperiyasi tarixiga oid qimmatli ma'lumotlar bor.", "Asarda Temurning salbiy xususiyatlari ham to'liq yoritilgan, uni G'arb manbalarida faqat salbiy qahramon sifatida baholashgan.", "Asar faqat Temurning harbiy yutuqlarini tasvirlashga qaratilgan bo'lib, uning shaxsiy fazilatlari haqida hech qanday ma'lumot yo'q.", "Asar Temurning ijtimoiy-iqtisodiy islohotlariga qaratilgan bo'lib, uning hukmronligi davridagi siyosiy vaziyatga umumiy nazar tashlagan, xolos."], ["Hamdulloh Qazviniyning «Tarixi guzida» asarida qanday tarixiy voqealar bayon etilgan?", "Qadim zamonlardan to 1330-yilgacha Eron va qisman O'rta Osiyoda bo'lib o'tgan voqealar tasvirlangan.", "Amir Temur davri va Temuriylar hukmronligi davridagi siyosiy va iqtisodiy munosabatlar yoritilgan.", "Chingizxon avlodlarining to'rt ulusi va ularning hukmdorlari haqidagi voqealar keltirilgan.", "VII-X asrning birinchi yarmida yashagan arabiy shoirlarning hayoti va ijodi haqida ma'lumotlar berilgan."], ["«Tarixi guzida» asari Eron, O'rta Osiyo va O'zbekiston tarixini o'rganishda nima uchun muhim hisoblanadi?", "U XIII-XIV asrning birinchi yarmidagi tarixini o'rganishda muhim ahamiyat kasb etuvchi manbadir.", "U 15-asr oxiri va 16-asr boshlaridagi mintaqaning iqtisodiy aloqalarini to'liq yoritib bergan.", "Unda Temur davlatining tashqi siyosati va diplomatik munosabatlari chuqur tahlil qilingan.", "Asar milodiy 623-651 yillar oralig'idagi Sosoniylar davlatining ijtimoiy-siyosiy ahvolini tavsiflaydi."], ["Klavixo Samarqandning boyligi haqida o'z «Kundaliklari»da nimalarni yozgan?", "U «Bu yurt don-dun, may, meva-cheva, parranda go'shti, har xil go'sht, qo'yinki hamma narsa boydir» degan.", "Uning yozishicha, Samarqandda asosan qishloq xo'jaligi mahsulotlari kam bo'lgan va qimmatga sotilgan.", "Klavixo Samarqand bozorlarida faqat Xitoydan keltirilgan qimmatbaho mollar sotilganini ta'kidlagan.", "Shaharda savdo-sotiq juda sekin kechgan va aholining asosiy tirikchiligi hunarmandchilik bo'lgan."], ["Klavixo o'z «Kundaliklari»da Samarqanddagi savdo rastalarini qanday tasvirlagan?", "Katta xiyobon va savdo rastalari ikki chekkasiga dehqonlar joylashgan, usti gumbazli va yorug'lik tushadigan tuynukchalari bor edi.", "Savdo rastalari kichik va tor bo'lib, asosan mahalliy hunarmandlar mahsulotlarini sotish uchun ishlatilgan.", "Samarqandda savdo rastalari juda oz bo'lib, aksariyat savdo faqat shaharning bir nechta kichik maydonlarida olib borilgan.", "Rastalar usti ochiq, yomg'ir va quyoshdan himoyalanmagan, tovarlar yerda savdo qilingan."], ["Klavixo o'z «Kundaliklari»da Amir Temurning ko'chma masjidi haqida nimalarni yozgan?", "U Amir Temurning o'zi bilan birga olib yuradigan ko'chma masjidi haqida ma'lumotlarni qayd etgan.", "Klavixo Amir Temurning Samarqandda katta va doimiy masjidlar qurishga bergan buyruqlarini tasvirlaydi.", "Uning yozishicha, Amir Temur masjidga bormay, ibodatlarni faqat saroyda maxsus xonalarda ado etgan.", "Asarda Amir Temurning islom diniga bo'lgan e'tiqodi haqida hech qanday ma'lumot berilmagan."], ["Sharafuddin Ali Yazdiyning «Zafarnoma» asari muallifning dastlabki rejasiga ko'ra nechta qismdan iborat bo'lishi kerak edi va hozirda nechtasi saqlangan?", "Dastlabki reja uch qismdan iborat bo'lishi kerak edi, lekin hozir asarning birinchi qismigagina egamiz.", "Asar to'rt qismdan iborat bo'lishi rejalashtirilgan, ammo faqat ikkinchi va uchinchi qismlari saqlanib qolgan.", "Muallif uni bir butun holda yozgan, lekin afsuski, faqat oxirgi qismi bizgacha yetib kelgan.", "«Zafarnoma» yetti jilddan iborat bo'lishi rejalashtirilgan, ammo hozir faqat birinchi jildining bir qismi bor."], ["Sharafuddin Ali Yazdiyning «Zafarnoma» asarining asosiy qismi qachon yozib tamomlangan?", "«Zafarnoma»ning asosiy qismi 1425-yili yozib tamomlangan.", "Uning yozilishi 1330-yili yakunlangan, Hamdulloh Qazviniy vafotidan so'ng davom ettirilgan.", "Asar 1469-yili tugallangan, Sulton Abu Said o'limi bilan bog'liq voqealar bilan yakunlangan.", "1530-yili yakunlangan bo'lib, Zahiriddin Muhammad Boburning Hindistonga yurishlarini o'z ichiga oladi."], ["Sharafuddin Ali Yazdiyning «Zafarnoma» asarining «Muqaddimai Zafarnoma» qismida nimalar tafsiloti beriladi?", "Temurning nasl-nasabi, O'rta Osiyo Chingizxondan to Temurgacha bo'lgan mo'g'ullar tarixi va Temur tarixining ilk voqealari tasvirlangan.", "Unda Ibrohim Sulton davrida bo'lib o'tgan siyosiy va ijtimoiy voqealar chuqur tahlil qilingan.", "Payg'ambarlar va avliyolar hayoti, shuningdek Islomiyatdan avvalgi Eron podshohlari haqida ma'lumotlar berilgan.", "Asosan Kastiliya elchisining Samarqandga qilgan sayohati va Amir Temur saroyidagi qabul marosimlari tavsiflangan."], ["Mirxondning «Ravzat us-safo» asari qanday tuzilishga ega?", "Asar muqaddima, xotima va yetti jilddan iborat bo'lib, keng qamrovli tarixiy ma'lumotlar beradi.", "«Ravzat us-safo» ikki asosiy qismdan iborat bo'lib, Temur va Temuriylar davri tarixini yoritadi.", "Uchta mustaqil bobdan tashkil topgan bo'lib, har biri alohida geografik mintaqani tasvirlaydi.", "Asarning tuzilishi beshta tabaqadan iborat bo'lib, shoirlarning ijodiy yo'llarini tahlil qiladi."], ["Mirxondning «Ravzat us-safo» asarining oltinchi jildida qanday tarixiy voqealar yoritilgan?", "Amir Temur va uning zamonidan to Sulton Abu Said o'limigacha (1469-y.) bo'lib o'tgan voqealar.", "Dunyoning yaratilishidan Sosoniy Yazdijard III (623-651 yy.) davrigacha o'tgan ijtimoiy-siyosiy voqealar.", "Muhammad Payg'ambar, xalifayi roshidin, ummaviylar va Abbosiylar davri tarixi.", "Chingizxon va uning avlodi, mo'g'ul istilolari davridagi siyosiy o'zgarishlar."], ["Abdurazzoq Samarqandiyning «Matlai us-sa'dayn va majis ul-bahrayn» asari nomining ma'nosi nima?", "Ushbu asarning nomi \"Ikki saodatli yulduzning chiqishi va ikki dengizning qo'shilishi o'rni\" degan ma'noni anglatadi.", "Bu nom \"Hikmat bog'i va bilimlar bulog'i\" ma'nosini bildiradi, olimning adabiy faoliyatini ifodalaydi.", "\"Buyuk hukmdorlarning shon-shuhrati va davlat boshqaruvi sirlari\" mazmunini aks ettiradi.", "\"Tarixning gullagan davri va siyosiy g'alabalar\" deb tarjima qilinib, muallifning nazariyalarini ifodalaydi."], ["Abdurazzoq Samarqandiyning «Matlai us-sa'dayn» asari ikki qismdan iborat bo'lib, ularda qanday davrlar yoritilgan?", "Birinchi qism Elxon Abu Said (1317-1335) davridan Temur vafoti va Xalil Sulton Samarqand taxtiga o'tirigacha (1304-1405-yy.) bo'lgan davrni qamraydi, ikkinchi qism Shohruxning Temuriylar imperiyasi hukmdori e'lon qilinishidan (1405-y.) Temuriy Abu Saidning o'ldirilishigacha (1469-y.) bo'lgan davr tarixini yoritadi.", "Asarning birinchi qismida Islomiyatdan avvalgi Eron podshohlari, ikkinchi qismida esa Muhammad Payg'ambar va xalifalarning davri tarixi bayon etilgan.", "Asarning dastlabki qismi Chingizxon istilosidan Oltin O'rdaning shakllanishigacha bo'lgan davrni, keyingi qismi esa Shayboniylar hukmronligini o'z ichiga oladi.", "Birinchi qismda O'rta Osiyoning VII-X asrlardagi madaniy hayoti, ikkinchi qismda esa Eron va O'rta Osiyo shoirlarining tarjimai holi keltirilgan."], ["«Tazqirat ush-shuaro» asarining uchinchi-beshinchi tabaqalarida qaysi davr shoirlari haqida ma'lumotlar berilgan?", "Xorazmshohlar-Anushteginlar (1077-1231-yy.), Elxoniylar (1256-1353-yy.) va Muzaffariylar (1314-1396-yy.) zamonida o'tgan 54 shoir haqida ma'lumot bor.", "Unda Temur va temuriylar zamonida yashagan 41 shoirning ijodiy faoliyati va hayoti tavsiflangan.", "Birinchi va ikkinchi qism X-XI asrlarda Eron va O'rta Osiyoda yashab ijod etgan 40 ta yirik shoirning tarjimai holi yoritilgan.", "VII-X asrning birinchi yarmida o'tgan 10 nafar arabiy navis shoirlarning hayoti va ijodiy yo'li haqida ma'lumotlar keltirilgan."], ["Mirzo Ulug'bekning «Tarixi arba' ulus» (\"To'rt ulus tarixi\") asari nimalarga asosiy e'tiborni qaratadi?", "Unda XIII-XIV asrlarda mo'g'ul imperiyasi tarkibiga kirgan mamlakatlarning ijtimoiy-siyosiy tarixi bayon etilgan.", "Asar asosan astronomiya fanining rivojlanishi va Samarqanddagi observatoriya faoliyatini yoritadi.", "Unda Amir Temur va temuriylar sulolasining Hindistonda qanday imperiya barpo etgani batafsil tasvirlangan.", "Mirzo Ulug'bekning o'z davridagi diplomatik yozishmalari va elchilik faoliyati to'liq yoritilgan."], ["Hamdulloh Qazviniy qalamiga mansub boʻlgan \"Tarixi guzida\" asarining asosiy maqsadlaridan biri nimadan iborat?", "Qadim zamonlardan to 1330-yilgacha Eron va qisman Oʻrta Osiyoda boʻlib oʻtgan voqealarni bayon etish.", "Elxoniylar davlatining faqatgina ijtimoiy-siyosiy ahvolini yoritish va uning ta'sirini tahlil qilish.", "Markaziy Osiyo xalqlarining VIII asrdan XVI asrgacha boʻlgan madaniy hayotini batafsil tasvirlash.", "Temuriylar sulolasining faoliyatini va ularning Xitoy bilan savdo aloqalarini chuqur oʻrganish."], ["Rui Gonsales de Klavixoning \"Kundaliklari\" asari kimning saroyiga qilingan elchilik sayohati xotiralaridan iborat?", "Kastiliya qiroli Genrix III ning Amir Temur saroyiga yuborgan elchisi sayohatining xotiralari.", "Buyuk Boburning Hindistonga qilgan yurishlari va u yerdagi xalqlar turmush tarzi haqidagi esdaliklari.", "Sultan Husayn Boyqaro tomonidan tashkil etilgan diplomatik missiyaning Fors davlatiga safar tafsilotlari.", "Mirzo Ulugʻbekning Yevropaga yuborilgan astronomlar guruhi boshligʻining ilmiy izlanishlari."], ["Sharafuddin Ali Yazdiyning \"Zafarnoma\" asarida Amir Temur shaxsi qanday tasvirlangan?", "Temurning shaxsi asarda nihoyatda idellashtirilgan, biroq uning faoliyatiga qarama-qarshiliklar ham berilgan.", "U faqatgina zolim fotih va qonxoʻr hukmdor sifatida salbiy jihatdan tasvirlangan, ijobiy tomonlari yashirilgan.", "Temurning faqat adolatli hukmdor va ilm-fanga homiy sifatida tasvirlangan, uning harbiy yurishlari chetlab oʻtilgan.", "Asar Temurning oddiy askarlikdan imperatorlikka erishgan hayot yoʻlini barcha murakkabliklari bilan koʻrsatgan."], ["Abdurazzoq Samarqandiyning \"Matlai us-sa'dayn va majis ul-bahrayn\" asarining birinchi qismi qaysi davrni qamrab oladi?", "Elxon Abu Said davridan to Amir Temurning vafotigacha va Xalil Sultonning Samarqand taxtiga oʻtirishigacha.", "Muhammad Paygʻambar va xalifayi roshidin davrida boʻlib oʻtgan siyosiy va ijtimoiy-iqtisodiy voqealarni yoritgan.", "Qadim zamonlardan to Islomiyatning boshlanishiga qadar boʻlgan davrda Eron podshohlari hukmronligi.", "Bobur Mirzoning Fargʻona viloyatida hukmronlik qilgan davri va uning keyingi Hindiston yurishlari tarixi."], ["Mirzo Ulugʻbekning \"Tarixi arba' ulus\" asari nechta qismdan iborat va unda nimalar haqida ma'lumot berilgan?", "Muqaddima va toʻrt qismdan iborat, moʻgʻul imperiyasiga kirgan mamlakatlarning ijtimoiy-siyosiy tarixi.", "Uch qismdan iborat, Oʻrta Osiyo va Eron xalqlarining XIII-XV asrlardagi madaniy aloqalarining chuqur tahlili.", "Yetti qismdan iborat, Islomiyatdan avvalgi Eron podshohlarining harbiy yurishlari va diplomatiyasi haqida.", "Ikki qismdan iborat, Temuriylar davlatining Xitoy va Hindiston bilan savdo-iqtisodiy munosabatlari tahlili."], ["Zahiriddin Muhammad Boburning \"Boburnoma\" asarida qaysi hududlarning XV asrning oxiri va XVI asrning boshidagi ijtimoiy-siyosiy ahvoli yoritilgan?", "Fargʻona, Toshkent, Samarqand, Hisori shodmon, Afgʻoniston va Shimoliy Hindiston.", "Kavkazorti, Gʻarbiy Yevropa va Shimoliy Afrika davlatlarining madaniy rivojlanishi va turizm salohiyati.", "Sharqiy Xitoy, Yaponiya va Koreya yarimorolidagi davlatlarning oʻzaro savdo-sotiq munosabatlari.", "Arabiston yarimoroli, Mesopotamiya va Misrning antik davrdagi siyosiy va iqtisodiy tizimlari."], ["Hamdulloh Qazviniy \"Tarixi guzida\" asarining yozilish jarayonida qaysi olimning xizmatida boʻlgan?", "Rashiduddin qatl etilgandan soʻng uning oʻgʻli Gʻiyosuddin Muhammadning xizmatida boʻlgan.", "Amir Temurning elchisi Rui Gonsales de Klavixo bilan Samarqandda uchrashgan va uning tavsiyasiga koʻra yozgan.", "Sulton Ibrohim saroyida xizmat qilgan va uning buyrugʻi bilan \"Zafarnoma\"ni yozishni boshlagan.", "Mirzo Ulugʻbekning astronomiya maktabida faoliyat yuritgan va uning ilmiy maslahatlari asosida ishlar yaratgan."], ["Rui Gonsales de Klavixo va uning hamrohlari Amir Temur yurtiga qilingan elchilik sayohatini qachon boshlagan va Samarqandga qancha vaqtda yetib kelishgan?", "1403-yil 22-mayda boshlab, 15 oy deganda Samarqandga yetib kelishgan.", "1402-yil 15-aprelda boshlab, 12 oy deganda Samarqandga yetib kelishgan.", "1404-yil 10-iyunda boshlab, 20 oy deganda Samarqandga yetib kelishgan.", "1398-yil 5-martda boshlab, 8 oy deganda Samarqandga yetib kelishgan."], ["Sharafuddin Ali Yazdiyning \"Zafarnoma\" asarining \"Tarixi jahongir\" yoki \"Muqaddimai Zafarnoma\" deb nomlanuvchi qismi qaysi davrni yoritadi va qachon tugallangan?", "Chingizxon zamonidan to Temur davlatining paydo boʻlishigacha boʻlgan ijtimoiy-siyosiy tarixi, 1419-yilda.", "Amir Temurning Hindiston yurishlari va Oltin Oʻrda bilan munosabatlari, 1405-yilda.", "Bobur Mirzoning Fargʻona va Samarqand uchun kurashlari, 1526-yilda.", "Muhammad Paygʻambar va ilk xalifalar davridagi voqealar, 651-yilda."], ["Mirxondning \"Ravzat us-safo\" asarining birinchi jildida qaysi davrdagi ijtimoiy-siyosiy voqealar yoritilgan?", "Dunyoning yaratilishidan to Sosoniy Yazdijard III (623-651 yy.) davrigacha oʻtgan ijtimoiy-siyosiy voqealar.", "Chingizxon va uning avlodlarining Oʻrta Osiyo va Yaqin Sharqdagi hukmronlik davri va ularning siyosiy qarorlari.", "Amir Temur davrida qurilgan binolar, qasrlar va boshqa me'moriy inshootlarning oʻziga xos xususiyatlari.", "Islomiyatning dastlabki yillarida Arab xalifaligining kengayishi va yangi diniy ta'limotlarning tarqalishi."], ["Abdurazzoq Samarqandiyning \"Matlai us-sa'dayn va majis ul-bahrayn\" asarining ikkinchi qismi qaysi davrni qamrab oladi?", "Shohruxning Temuriylar imperiyasining oliy hukmdori deb e'lon qilinishidan Temuriy Abu Saidning oʻldirilishigacha.", "Muhammad Paygʻambar va xalifayi roshidin davrida boʻlib oʻtgan siyosiy va ijtimoiy-iqtisodiy voqealarni yoritgan.", "Qadim zamonlardan to Islomiyatning boshlanishiga qadar boʻlgan davrda Eron podshohlari hukmronligi.", "Bobur Mirzoning Fargʻona viloyatida hukmronlik qilgan davri va uning keyingi Hindiston yurishlari tarixi."], ["Davlatshoh Samarqandiy \"Tazqirat ush-shuaro\" asarini yozishda qaysi manbalardan keng foydalangan?", "Abu Tohir Hotuniyning \"Manaqob ush-shuaro\", Avfiyning \"Lubob ul-albob\", tarixiy va geografik asarlar.", "Sharafuddin Ali Yazdiyning \"Zafarnoma\"si va Mirzo Ulugʻbekning \"Ziji Jadidi Koʻragoniy\" asarlarining tahlillari.", "Rui Gonsales de Klavixoning \"Kundaliklari\" hamda Zahiriddin Boburning \"Boburnoma\" asarlari.", "Mirxondning \"Ravzat us-safo\" va Abdurazzoq Samarqandiyning \"Matlai us-sa'dayn\" asarlari."], ["Mirzo Ulugʻbekning \"Ziji Jadidi Koʻragoniy\" asari nimani oʻz ichiga olgan va qaysi soha uchun muhim hisoblanadi?", "Klassik astronomiyaning nazariy va amaliy masalalarini qamrab olgan, Samarqand astronomlarining ilmiy kuzatishlari.", "Oʻrta asrlar geometriya va trigonometriya fanlarining rivojlanishi, yangi matematik formulalarning kiritilishi.", "Geografik kashfiyotlar va yangi hududlarning xaritalari, ekspeditsiya natijalari va tabiiy resurslar joylashuvi.", "Fiziologiya va anatomiya boʻyicha oʻrta asr tibbiyotining erishgan yutuqlari, kasalliklarni davolash usullari."], ["Zahiriddin Muhammad Bobur qachon Fargʻona taxtiga oʻtkazilgan va necha yoshida hokim boʻlgan?", "1494-yil 5-iyunda, 12 yoshida otasi oʻrniga Fargʻona taxtiga oʻtkazilgan.", "1483-yil 14-fevralda, 18 yoshida Amudaryo viloyatining hokimi etib tayinlangan.", "1504-yil iyun oyida, 21 yoshida Afgʻonistonning Qobul shahrini egallagan va hokim boʻlgan.", "1511-yilning kuzida, 28 yoshida Eron podshosi Ismoil Safaviyning yordami bilan Samarqandni egallagan."], ["Klavixoning \"Kundaliklari\" asarida Samarqandning boyligi va savdo rastalari qanday tasvirlangan?", "U yurt don-dun, may, meva-cheva, parranda goʻshti, har xil goʻshtga boyligi, katta xiyobon va savdo rastalari.", "Faqatgina qimmatbaho toshlar va oltin buyumlar bilan toʻlib-toshgan, boshqa hech qanday mahsulotlar yoʻqligi.", "Samarqandning faqat qurol-yarogʻ ishlab chiqarish bilan mashhur boʻlganligi, boshqa savdo turlari rivojlanmaganligi.", "Shahar faqatgina baliqchilik va dengiz mahsulotlari savdosi bilan shugʻullanganligi, ichki bozorlar yoʻqligi."], ["Boburnomaning birinchi toʻliq inglizcha nashrini kimlar amalga oshirgan va qaysi yilda nashr etilgan?", "J. Leyden va V. Erskin tomonidan 1826-yilda amalga oshirilgan, jahonda birinchi toʻliq nashr.", "A. Beverij tomonidan 1921-yilda asl nusxadan qayta tarjima qilinib, mustaqil nashr etilgan.", "Pave de Kurteyl tomonidan 1871-yilda toʻla holda fransuz tiliga tarjima qilinib, keyinchalik inglizchaga oʻgirilgan.", "N. I. Ilminskiy tomonidan 1857-yilda Qozonda rus tilida nashr etilib, keyinchalik turli tillarga tarjima qilingan."], ["Hamdulloh Qazviniyning \"Tarixi guzida\" asarining asosiy qismi kimga bagʻishlangan?", "Kitobning asosiy qismi hoji Gʻiyosuddin Muhammadga bagʻishlangan.", "Amir Temurning oʻzi va uning yaqin oila a'zolarining sharafiga bitilgan.", "Ispaniya qiroli Genrix III ga bagʻishlangan diplomatik munosabatlarni mustahkamlash maqsadida.", "Mirzo Ulugʻbekning astronomik tadqiqotlariga bagʻishlangan ilmiy-amaliy risola sifatida."], ["Abdurazzoq Samarqandiyning asosiy faoliyati nimadan iborat boʻlgan?", "Koʻproq boshqa davlatlar bilan yozishmalar va elchilik ishlari bilan mashgʻul boʻlgan.", "Alohida fanlar boʻyicha ilmiy asarlar yozish va madrasalarda dars berish.", "Samarqanddagi rasadxonani boshqarish va astronomik kuzatuvlar olib borish.", "Harbiy yurishlarda qatnashish va yangi hududlarni zabt etishni boshqarish."], ["\"Silsilat as-salotin\" asari O'rta Osiyoning XVI-XVII asrlardagi diplomatik munosabatlariga oid qanday ma'lumotlarni o'z ichiga oladi?", "Shayboniylar va Ashtarxoniylar hukmronligi davridagi xatlar matnlari.", "Hududdagi savdo aloqalarining rivojlanish tarixi haqidagi ma'lumotlar.", "Harbiy yurishlar va harbiy tuzilmalar haqidagi batafsil tavsiflar.", "Mintaqaning ijtimoiy-iqtisodiy ahvolini yorituvchi statistikalar."], ["\"Silsilat as-salotin\" ma'lumotlariga ko'ra, Hindiston podshohi Akbar 1586-yili Buxoro xoni Abdullaxon II ga kimlar orqali maktub yuborgan?", "Elchilari Hakim Humom va Sadri Jahon orqali yuborgan maktubi.", "Elchi Yodgor sulton eramli orqali Balx xoniga yuborgan xati.", "Elchi Ali Yorbek orqali Eron podshosiga yo'llagan javob maktubi.", "Elchi Donish munshiy orqali Imomqulixon nomiga yuborgan xati."], ["O'zbek tilidagi birinchi aruz risolasi qaysi asrda va qayerda yaratilganligi matnda qayd etilgan?", "XV asr o'rtalarida Misrda, adabiyot nazariyasi sifatida ilk bor.", "XIII asrda Oltin O'rdada, dostonlar yozish uchun asos bo'lgan.", "XIV asr oxirida Buxoroda, she'riyat san'atini o'rgatish maqsadida.", "XVI asr boshlarida Samarqandda, tilshunoslikni rivojlantirish uchun."], ["XIII asrda Oltin O'rdada o'zbek tilida yozilgan \"Yusuf va Zulayho\" dostonining muallifi kim?", "Qul Ali, o'zbek adabiyotining yorqin vakili va yirik shoiri sifatida tanilgan.", "Alisher Navoiy, g'azal va dostonlar ustasi, buyuk mutafakkir olim.", "Nosiriddin Rabg'uziy, diniy-axloqiy asarlarning asosiy ijodkori.", "Zahiriddin Muhammad Bobur, tarixchi va davlat arbobi, memuar yozuvchisi."], ["XIV asr oxirida yuzaga kelgan \"Temur tuzuklari\" asari o'zbek tilining taraqqiyotiga qanday ta'sir ko'rsatgan?", "Turkiy-o'zbek tilining rivojiga katta hissa qo'shib, adabiy tilni mustahkamladi.", "Tilshunoslikda yangi yo'nalishlar ochib, ilmiy terminologiyani boyitdi.", "Madaniy aloqalarni kengaytirib, boshqa tillarning ta'sirini kuchaytirdi.", "Yozma manbalarning ko'payishiga sabab bo'lib, tarixiy tadqiqotlarni rag'batlantirdi."], ["Alisher Navoiyning matnda keltirilgan nasriy tarixiy asarlari qatoriga quyidagilardan qaysilari kiradi?", "\"Tarixi anbiyo va hukamo\", \"Tarixi muluki Ajam\" va \"Xamsat ul-mutaxayyirin\" kabi asarlar.", "\"Xamsa\" dostonlari, \"Lison ut-tayr\" dostoni va \"Farhod va Shirin\" kabi she'riy to'plamlar.", "\"Majolis un-nafois\" tazkirasi, \"Mahbub ul-qulub\" va \"Vaqfiya\" kabi risolalar.", "\"Nasoyim ul-muhabbat\" va \"Munshaot\" to'plamlari bilan birga \"Xazoyin ul-maoniy\" devonlari."], ["Zahiriddin Muhammad Boburning \"Vaqoyi'\" (\"Boburnoma\") asarining ahamiyati va uning tarjimalari haqida qanday ma'lumot berilgan?", "Jahonshumul manba bo'lib, to'rt marta fors tiliga va to'rt marta ingliz tiliga tarjima qilingan.", "Buyuk shohning shaxsiy hayoti haqidagi yagona manba, bir marta fors tiliga o'girilgan.", "O'zbek davlatchiligi tarixini aks ettiruvchi hujjat, uch marta fors tiliga tarjima qilingan.", "Markaziy Osiyo xalqlarining urf-odatlarini yorituvchi asar, ikki marta ingliz tiliga o'girilgan."], ["O'zbekistonda yozuv alifbosining o'zgarishi tarixiga oid ma'lumotlarga ko'ra, lotin alifbosiga o'tish qaysi yilda amalga oshirilgan?", "1929-yili, respublikaning madaniy-ma'rifiy sohasida muhim o'zgarishlar keltirgan.", "1940-yili, rus-kirill alifbosi joriy qilingan, bu esa ta'lim tizimiga ta'sir etgan.", "Mustaqillik yillarida, lotin alifbosini qayta tiklangan, ko'p afzalliklari mavjud.", "XX asr boshlarida, arab alifbosini isloh qilishga urinishlar amalga oshirilgan."], ["XV asrdan boshlab yaratilgan qo'lyozmalarning san'at darajasi va ularning mo'ljallangan auditoriyasi haqida qanday ma'lumot berilgan?", "Yuksak saviyali, badiiy bezaklarga ega, asosan podshoh va a'yonlar uchun mo'ljallangan.", "Oddiy va sodda, keng jamoatchilik uchun mo'ljallangan, ko'proq diniy mazmunli.", "Faqat ilmiy maqsadlarda yaratilgan, san'atga e'tibor berilmagan.", "Harbiy yo'nalishdagi qo'lyozmalar ustunlik qilgan, bezaklari kam bo'lgan."], ["\"Hudud ul-olam\" asari qaysi tilda yozilgan va uning muallifi haqida matnda qanday ma'lumot berilgan?", "Fors tilida yozilgan, muallifi noma'lum, Guznono hokimlaridan biriga atalgan.", "Arab tilida yozilgan, muallifi Al-Beruniy, geografiya sohasidagi yirik olim.", "O'zbek tilida yozilgan, muallifi Alisher Navoiy, Xuroson hududlariga bag'ishlangan.", "Turk tilida yozilgan, muallifi Mahmud Koshg'ariy, turkiy qabilalarni o'rgangan."], ["\"Kitobi Mullazoda\" asarining muallifi Ahmad ibn Mahmud qaysi taxallus bilan mashhur bo'lgan?", "Mo'in ul-fuqaro, u fuqarolarning tayanchi sifatida tanilgan yirik ilohiyotchi.", "Sadri Jahon, u Buxoroda diniy ilmlarning eng yirik targ'ibotchisi bo'lgan.", "Hakim Humom, u diplomatik faoliyatda muhim o'rin tutgan adib va shoir.", "Yodgor Sulton, u saroyda muhim xizmatlarni bajargan, amaldor va yozuvchi."], ["Hofiz Tanish Buxoriyning \"Sharafnomayi shohiy\" asarida hukmron sinfning maqsad va manfaatlarini ifodalash qanday ko'rinishda bo'lgan?", "Xon va uning atrofidagi aslzodalarni ko'klarga ko'tarib maqtagan, umumiy obyektivlikni saqlagan.", "Mehnatkash xalqning og'ir turmush sharoitlarini tanqid qilgan, ijtimoiy adolatni talab etgan.", "Faqatgina siyosiy voqealarni bayon qilgan, muallifning shaxsiy fikrlarini qo'shmagan.", "Boshqa davlatlarning tajribalarini o'rgangan, taqqosiy tahlillar asosida xulosa bergan."], ["\"Sharafnomayi shohiy\" asarini yozishda muallif qaysi manbalardan foydalanganligi matnda ko'rsatilgan?", "Xon saroyida yuritilgan maxsus kundaliklar va voqealar guvohlari og'zidan olingan ma'lumotlar.", "Eron va Hindistonning diplomatik arxiv hujjatlari, elchilik hisobotlari.", "Qadimiy turk-mo'g'ul qabilalarining yozma rivoyatlari va afsonaviy hikoyalari.", "Arab va fors tillarida yozilgan tarixiy risolalar, shuningdek shaxsiy kuzatuvlar."], ["Shayboniylar davlatining markaziy boshqaruvidagi devonlarda qaysi mansabdorlar faoliyat olib borgan?", "Otaliq, naqib, vaziri a'zam, devonbegi, miroxur, chuxra og'asi kabi lavozim egalari.", "Viloyatlardagi beklar, tuman boshliqlari, qishloq oqsoqollari, yer egalari.", "Harbiy qo'mondonlar, chekinish bo'linmalari rahbarlari, harbiy qurol omborchilari.", "Diniy rahnamolar, madrasalar mudirlari, shahar qozilari, imomlar."], ["\"Bahr ul-Asror\" asari kimning topshirig'iga binoan yozilgan va uning asosiy xarakteri qanday ta'riflangan?", "Balx xoni Nodir Muhammadxonning topshirig'i bilan yozilgan qomusiy asar bo'lgan.", "Buxoro xoni Abdulazizxonning iltimosi bilan yozilgan, biografik xususiyatga ega.", "Eron shohi Abbos I ning ko'rsatmasi bilan yozilgan, siyosiy risolalar to'plami.", "Hindiston podshohi Shahobiddin Shohijahonning buyrug'i bilan yozilgan, harbiy tarixiy asar."], ["Mahmud ibn Valining \"Bahr ul-Asror\" asarining matnda qayd etilishicha, bizgacha faqatgina qaysi jildlari yetib kelgan?", "Birinchi va oltinchi jildlar, ular asarning muhim qismlarini tashkil etadi.", "Ikkinchi va yettinchi jildlar, ular ko'proq geografik ma'lumotlarni o'z ichiga oladi.", "Uchinchi va beshinchi jildlar, ular siyosiy va madaniy jarayonlarni yoritadi.", "To'rtinchi va oltinchi jildlar, ular diniy va ilmiy masalalarga bag'ishlangan."], ["Qadimgi \"Silsilat as-salotin\" asarining asosiy mazmuni Shayboniylar va Ashtarxoniylar hukmronligi davrida nimaga qaratilgan?", "Shayboniylar va Ashtarxoniylar hukmronligi davridagi diplomatik yozishmalar matnlarini keltiradi.", "O'rta Osiyoning ijtimoiy-iqtisodiy rivojlanish bosqichlari haqidagi maʼlumotlarni jamlaydi.", "Hindiston va Eron podshohliklari o'rtasidagi harbiy yurishlar tafsilotini bayon etadi.", "Ushbu asar o'zbek xonliklariga yuborilgan turkiy farmonlarning to'liq to'plamini o'z ichiga oladi."], ["\"Silsilat as-salotin\" asarida qayd etilishicha, 1586-yili Buxoro xoni Abdullaxon II ga kim o'z elchilari Hakim Humom va Sadri Jahonni yuborgan?", "Hindiston podshohi Akbar o'z elchilari Hakim Humom va Sadri Jahonni yuborgan edi.", "Eron podshohi shoh Abbos I elchi Yodgor Sultonni Balx xoni Abdulmo'minxonga jo'natgan.", "Turkiya sultoni Murod II Balx xoni Abdulmo'minxonga maxsus xat yuborgan shaxs edi.", "Buxoro xoni Imomqulixon Hindiston hukmdoriga muhim diplomatik maktublar yo'llagan edi."], ["Qul Ali tomonidan Oltin O'rdada o'zbek tilida bitilgan \"Yusuf va Zulayho\" dostoni qaysi asrda yaratilganligi matnda ko'rsatilgan?", "Ushbu \"Yusuf va Zulayho\" dostoni XIII asrda Oltin O'rdada yorqin tarzda yaratilgan.", "Mazkur doston XVI asrda Misr mamlakatida keng targ'ib etilgan mashhur asar edi.", "O'zbek tilidagi bu dostoni XIV asrning oxirida Sharqiy Turkistonda yozilgan.", "Doston XVII asr boshlarida Buxoro xonligida faol tarzda bitilgan muhim asardir."], ["Alisher Navoiyning yirik nasriy tarixiy asarlari qatorida matnda qaysi asar nomi alohida tilga olingan?", "\"Tarixi anbiyo va hukamo\" Alisher Navoiyning muhim nasriy tarixiy asarlaridan biridir.", "\"Majolis un-nafois\" Alisher Navoiy tomonidan yozilgan mashhur she'riy to'plam hisoblanadi.", "\"Lison ut-tayr\" Navoiy qalamiga mansub bo'lgan yirik badiiy asarlar sirasiga kiradi.", "\"Xazoyin ul-maoniy\" Navoiyning qisqa nasriy hikoyalar to'plami sifatida qayd etilgan."], ["XV asrdan boshlab yaratilgan tarixiy, badiiy va ilmiy asarlar qo'lyozmalarining asosiy xususiyatlari nimadan iborat edi?", "Yozuv, xat turi, kitobat fani va san'ati jihatidan alohida yuksak saviyasi bilan ajralib turardi.", "Ular asosan oddiy, kundalik hayotga oid mavzularni yoritishga qaratilgan edi.", "Asosiy qismi siyosiy farmonlar va harbiy hujjatlardan iborat bo'lgan.", "Yaratilgan qo'lyozmalarda asosan arab va fors tillari qamrab olingan edi."], ["\"Hudud ul-olam\" asarining yagona qo'lyozma nusxasi sharqshunos A.G.Tumanskiy tomonidan qaysi yili va qayerdan topilgan?", "Sharqshunos A.G.Tumanskiy tomonidan 1892-yilda Buxorodan topilgan edi.", "V.V.Bartold tomonidan XVII asrda Samarqand kutubxonalarida topilgan asardir.", "V.F.Minorskiy tomonidan Balxda XIX asrning oxirida topilgan nodir qo'lyozmadir.", "M.Sotude va Sayyid Jaloluddin Tehroniy tomonidan Eronda topilgan muhim manbadir."], ["\"Hudud ul-olam\" asarining 1-7-boblarida asosan qanday mavzular haqida umumiy mulohazalar yuritilgan?", "Yerning tuzilishi, dengiz, orol, tog' va dunyoning aholi yashaydigan qismi haqida mulohaza yuritiladi.", "O'rta Osiyodagi turli hukmdorlarning hayoti va siyosiy faoliyati haqidagi ma'lumotlar berilgan.", "Qadimgi savdo yo'llari, karvon saroylar va savdo aloqalari tizimlari tahlil qilingan.", "Sharqiy mamlakatlarning siyosiy tizimi va ijtimoiy tuzilishi batafsil tasvirlangan."], ["\"Kitobi Mullazoda\" asarining muallifi kim bo'lganligi matnda qanday qayd etilgan?", "Muallif Ahmad ibn Mahmud bo'lib, Mo'in ul-fuqaro taxallusi bilan mashhur edi.", "V.V.Bartold va V.F.Minorskiy bu asarni Eronda nashr etishga katta hissa qo'shgan olimlardir.", "A.G.Tumanskiy va R.L.G'afurova asarni rus tiliga tarjima qilgan mashhur sharqshunoslardir.", "M.Sotude va Sayyid Jaloluddin Tehroniy asarning tojikcha nashrini amalga oshirgan edi."], ["\"Kitobi Mullazoda\" asari asosan Buxoroning qaysi davriga oid ob'ektlari va mashhur shaxslari haqida ma'lumot beradi?", "Buxoroning XIV-XV asrlardagi osori-atiqalari, ziyoratgohlari va shu yerda dafn etilgan kishilar haqida.", "Markaziy Osiyo va Eron o'rtasidagi diplomatik aloqalar va elchilik vazifalari haqida ma'lumotlar beradi.", "O'rta asr fanining ilm nujum, jug'rofiya va tarix sohalaridagi yangi kashfiyotlarni o'z ichiga oladi.", "Shayboniylar hukmronligi davrida Buxoro xonligining siyosiy va harbiy tuzilishi haqida ma'lumot beradi."], ["Hofizi Tanish Buxoriyning \"Sharafnomayi shohiy\" asari qaysi xonning topshirig'i bilan yozilgan va yana qaysi nom bilan mashhur?", "\"Sharafnomayi shohiy\" (yoki \"Abdullanoma\") Shayboniy Abdullaxon II buyrug'i bilan yozilgan.", "\"Bahr ul-Asror\" Nodir Muhammadxon topshirig'iga binoan Mahmud ibn Vali tomonidan yozilgan.", "\"Majolis un-nafois\" Alisher Navoiy tomonidan yaratilgan, Boburiy hukmdorlari uchun muhim manbadir.", "\"Vaqoyi'\" Zahiriddin Muhammad Boburning asari bo'lib, Shohijahon tomonidan katta qadrlangan edi."], ["Hofizi Tanish Buxoriyning \"Sharafnomayi shohiy\" asari asosan qaysi davrga oid ma'lumotlarni o'z ichiga oladi?", "XVI asrda O'rta Osiyo, Qozog'iston va qo'shni mamlakatlarning tarkibi bo'yicha ma'lumotlarni o'z ichiga oladi.", "XVII asr boshlaridagi Eron, Hindiston va turkiy davlatlar o'rtasidagi savdo-sotiq aloqalarini tahlil qiladi.", "XV asr oxiri va XVI asr boshlaridagi Movarounnahrning ijtimoiy-siyosiy ahvolini yoritadi.", "XVIII-XIX asrlardagi Buxoro va Xorazm xonliklarining madaniy hayoti haqida keng ma'lumotlar beradi."], ["\"Sharafnomayi shohiy\" asarini yozishda muallif asosan qaysi turdagi manbalardan foydalanganligi ta'kidlangan?", "Xon saroyida yuritilgan maxsus kundaliklar va voqealar shohidi bo'lgan kishilarning og'zidan olingan ma'lumotlar.", "Asosan fors va arab tillaridagi eski qo'lyozma manbalar hamda arxiv hujjatlariga asoslangan edi.", "Turkiy xalqlarning folklori, afsonalari va og'zaki ijod namunalaridan keng foydalanilgan.", "Hindiston va Eron tarixchilari tomonidan yozilgan zamonaviy tarixiy asarlarga tayangan edi."], ["Abdullaxon II davrida Buxoro shahrida amalga oshirilgan muhim qurilish ishlari qatoriga nimalar kiradi?", "Sumijon qishlog'i shaharga qo'shilib, yangi devor, madrasalar, Chorsu va ko'priklar qurilgan.", "Faqatgina Jizzax, Nasaf va Hisori viloyatlarida yirik harbiy istehkomlar barpo etilgan edi.", "Samarqand va Toshkentda yangi masjidlar, karvonsaroylar hamda hammomlar qurilgan.", "Balx xonligida bir nechta yangi bozorlar, sardobalar va suvhovuzlar barpo etilgan."], ["Hofizi Tanish Buxoriy ma'lumotlariga ko'ra, Shayboniylar qo'shinining asosiy tarkibi qanday qismlardan iborat bo'lgan?", "Otliq va piyoda askarlar, shuningdek, o'ziga xos zambarakchilardan tashkil topgan.", "Qo'shinning asosiy qismi yollanma chet ellik jangchilardan va yengil qurollangan otliq guruhlardan iborat.", "Shayboniylar armiyasi asosan qurol-yarog' ishlab chiqarish bo'yicha mutaxassislar va mardikorlardan tuzilgan.", "Ular asosan chegara hududlarida joylashgan doimiy harbiy garnizonlar va xon gvardiyasidan iborat."], ["\"Bahr ul-Asror\" asari qanday mavzularni o'z ichiga olgan qomusiy asar hisoblanadi?", "O'rta asr fanining ilm nujum, jug'rofiya va tarix sohalarini o'z ichiga olgan qomusiy asardir.", "XVI asrdagi turkiy xalqlarning urf-odatlari, diniy marosimlari va ijtimoiy tuzilishi haqida ma'lumot beradi.", "Buxoro xonligining Eron va Hindiston bilan bo'lgan madaniy almashinuvlari va san'at rivojlanishi haqidadir.", "Ashtarxoniylar sulolasining harbiy strategiyalari, qo'shin turlari va ularning jangovar yurishlari haqidadir."], ["\"Bahr ul-Asror\" asari kimning topshirig'iga binoan yozilganligi matnda qayd etilgan?", "Ashtarxoniylardan Balx xoni Nodir Muhammadxonning topshirig'iga binoan yozilgan.", "Shayboniy Abdullaxon II ning buyrug'iga ko'ra Hofizi Tanish Buxoriy tomonidan bitilgan edi.", "Mirza Ulug'bekning shaxsiy kutubxonasi uchun maxsus ravishda yaratilgan qo'lyozmadir.", "Zahiriddin Muhammad Boburning o'g'li Humoyunshohning talabiga binoan yozilgan."], ["\"Bahr ul-Asror\" asarining oltinchi jildi qaysi mashhur muharrirlarning asarlariga asoslangan holda yozilgan?", "Rashiddin, Mirza Ulug'bek, Sharafiddin Ali Yazdiy, Mirza Muhammad Haydar va Hofiz Tanish Buxoroiy asarlariga asoslangan.", "Qul Ali, Nosiriddin Rabg'uziy, Muhammad Mirxond va Alisher Navoiy kabi ijodkorlarning asarlaridan foydalanilgan.", "Abulg'oziy Bahodirxon, Munis va Ogahiy kabi Xorazm tarixchilarining yozma manbalariga tayanilgan.", "Durbek, Sayid Qosimiy, Lutfiy va Hofiz Xorazmiyning adabiy va she'riy asarlari asosida yozilgan."], ["Oʻrta Osiyoning XVI-XVII asrlar tarixiga oid yozma manbalaridan biri boʻlgan 'Silsilat as-salotin' asari nima bilan mashhur?", "Shayboniylar, Ashtarxoniylar, Safaviylar va Boburiylar oʻrtasidagi diplomatik yozishmalar matnlari.", "Amir Temur davri harbiy yurishlari va fathlari haqidagi batafsil maʼlumotlarni jamlagan yilnoma.", "Buxoro xonligining ijtimoiy-iqtisodiy ahvoli, soliq tizimi va savdo aloqalari tahlili.", "Oʻzbek adabiy tilining rivojlanish bosqichlari va yirik shoirlarning tarjimai hollari."], ["Oʻzbek tilining 20-asrda foydalanilgan yozuv tizimlari ketma-ketligi, mustaqillikka qadar va undan keyin qanday oʻzgargan?", "Arab alifbosidan lotin alifbosiga, soʻngra rus-kirill alifbosiga oʻtildi.", "Kirill alifbosidan arab alifbosiga, soʻngra lotin alifbosiga oʻtildi.", "Faqatgina arab alifbosidan toʻgʻridan-toʻgʻri lotin alifbosiga oʻtildi.", "Lotin alifbosidan rus-kirill alifbosiga, soʻngra yana lotin alifbosiga qaytildi."], ["'Hudud ul-olam' asari qanday xarakterga ega va qaysi tilda yaratilgan birinchi jugʻrofiy manba sifatida taʼriflanadi?", "Bu fors tilida yozilgan birinchi jugʻrofiy asar boʻlib, 982-yilda yaratilgan.", "Bu arab tilida yaratilgan eng qadimgi tarixiy asar boʻlib, VIII asrga tegishli.", "Bu turkiy tilda bitilgan ilk adabiy manba boʻlib, XIII asrda yozib tugallangan.", "Bu oʻzbek tilida yozilgan diniy-falsafiy asar boʻlib, X asrga mansub sanaladi."], ["Sharqshunos A.G.Tumanskiy 1892-yilda 'Hudud ul-olam' asarining yagona qoʻlyozma nusxasini qaysi shahardan topgan?", "Sharqshunos A.G.Tumanskiy 1892-yilda Buxorodan yagona qoʻlyozma nusxasini topgan.", "V.V.Bartold 1930-yilda ushbu asarning forsiy matnini nashr ettirgan.", "V.F.Minorskiy 1937-yilda asarning inglizcha tarjimasini tadqiqotlar bilan eʼlon qilgan.", "M.Sotude va Sayyid Jaloluddin Tehroniy asarning forscha matnini chop etganlar."], ["'Kitobi Mullazoda' ('Mullazoda kitobi') asarining asosiy mavzusi nimadan iborat?", "Buxoroning XIV-XV asrlardagi osori-atiqalari va mashhur ziyoratgohlari haqida maʼlumot.", "Oʻrta Osiyo xonliklarining XVI asrdagi siyosiy va iqtisodiy ahvoli tahlili.", "Sharqiy Turkistondagi turk-moʻgʻul qabilalari va ularning urf-odatlari tavsifi.", "Temuriylar davri adabiyoti va sanʼati namunalari, ularning yaratilish tarixi."], ["'Kitobi Mullazoda' asarining muallifi kim va u qaysi taxallus bilan mashhur boʻlgan?", "Muallif Ahmad ibn Mahmud boʻlib, Moʻin ul-fuqaro taxallusi bilan mashhur boʻlgan.", "Hofiz Tanish Buxoriy boʻlib, 'Sharafnomayi shohiy' asarining ham muallifi hisoblanadi.", "Mahmud ibn Vali boʻlib, Balx xoni Nodir Muhammadxonning topshirigʻi bilan yozgan.", "Mirza Ulugʻbek boʻlib, uning asari 'Tarixi arbai' ulus' manbasi sifatida qoʻllanilgan."], ["'Kitobi Mullazoda' asarining birinchi qismida qanday maʼlumotlar berilgan?", "Shahar ichi va tashqarisida dafn etilgan ulugʻ shaxslar, shayxlar va mozorlari haqida.", "Buxoro xonligining tashqi siyosati va diplomatik aloqalari haqidagi toʻliq maʼlumot.", "Oʻzbekistonning qadimiy shaharlari, ularning aholisi va iqtisodiy rivojlanishi.", "Islom diniy taʼlimotining asoslari, shariat qoidalari va fiqh masalalari."], ["Hofiz Tanish Buxoriyning 'Sharafnomayi shohiy' asari asosan qaysi hukmdor va davrga bagʻishlangan?", "XVI asrda Shayboniy Abdullaxon II ning hukmronligi va uning siyosati.", "XV asrda Temuriylar davrining madaniy hayoti va ilmiy yutuqlari yoritilgan.", "XVII asrda Ashtarxoniylar sulolasining ichki nizolari va tashqi munosabatlari.", "XIV asrda Chingizxon avlodlarining Oʻrta Osiyodagi hukmronlik davrlari."], ["Hofiz Tanish Buxoriyning 'Sharafnomayi shohiy' asari qaysi hukmdorning topshirigʻi bilan yozilgan va yana qanday nom bilan mashhur?", "Hofiz Tanish Ibn Mir Muhammad al-Buxoriy muallifi, 'Abdullanoma' nomi bilan ham mashhur.", "Sharafuddin Ali Yazdiy muallifi, 'Zafarnoma' nomi bilan koʻproq tanilgan.", "Muhammad Solih muallifi, 'Shayboniynoma' nomi bilan keng qoʻllanilgan.", "Muhammad Mirxond muallifi, 'Ravzat us-safo' nomi ostida mashhur boʻlgan."], ["'Sharafnomayi shohiy' asarida Buxoro xonligining XVI asrdagi qaysi mamlakatlar bilan diplomatik va savdo aloqalari haqida muhim maʼlumotlar keltirilgan?", "Eron, Hindiston, Turkiya, Qoshgʻar va Rossiya bilan olib borilgan aloqalar.", "Faqatgina Usmonli imperiyasi va Safaviylar davlati bilan munosabatlar.", "Sharqiy Turkiston va Xitoy bilan savdo-iqtisodiy hamkorlikning yagona jihatlari.", "Yevropa mamlakatlari va Shimoliy Afrika bilan madaniy almashinuvlar."], ["'Sharafnomayi shohiy' asarida xonlikning ijtimoiy-iqtisodiy ahvoli borasida qanday feodal institutlar va soliq turlari haqida maʼlumotlar keltiriladi?", "'Iqto', 'suyurgʻol', 'tanho', 'jogir' feodal institutlari, xiroj, boj kabi soliqlar.", "'Vaqf', 'mulk', 'tayu' kabi yer egaligi turlari, zakot va ushr kabi toʻlovlar.", "'Tamar', 'darogʻa', 'amir' kabi maʼmuriy lavozimlar va ularning vazifalari.", "'Jizya', 'xaroj', 'taxsildor' kabi soliqlar va ularning aholiga taʼsiri."], ["Abdullaxon II davrida Buxoro va uning atrofida amalga oshirilgan muhim shaharsozlik va qurilish loyihalari 'Sharafnomayi shohiy'da qanday tavsiflangan?", "Sumijon qishlogʻining shaharga qoʻshilishi, yangi devor, madrasalar, Chorsu, koʻprik va bozor qurilishi.", "Yangi poytaxt bunyod etilishi, karvonsaroylar tarmogʻini kengaytirish va suv inshootlari qurish.", "Qadimiy shahar qalʼasini qayta tiklash, yangi masjidlar va hammomlar majmuasini barpo etish.", "Bogʻlar va parklar yaratilishi, xon saroyi va amaldorlar uchun qasrlar qurilishi."], ["Mahmud ibn Valining 'Bahr ul-Asror' asari qanday turdagi manba hisoblanadi va u kimning topshirigʻiga binoan yozilgan?", "Ashtarxoniylar hukmdori Nodir Muhammadxon topshirigʻi bilan yozilgan qomusiy asar.", "Shayboniylar xoni Abdullaxon II buyrugʻi bilan yozilgan tarixiy yilnoma.", "Temuriylar hukmdori Ulugʻbek tomonidan yozilgan astronomik va matematik risolalar.", "Safaviylar shohi Abbos I uchun maxsus tayyorlangan diplomatik yozishmalar toʻplami."], ["Mahmud ibn Vali 'Bahr ul-Asror' asarini dastlab qancha jilddan iborat qilib yozishni rejalashtirgan va bugungi kungacha nechtasi yetib kelgan?", "Asar 7 jilddan iborat boʻlishi rejalashtirilgan, bizgacha faqat birinchi va oltinchi jildlari yetib kelgan.", "Asar 5 jilddan iborat boʻlishi rejalashtirilgan, bizgacha faqat uchinchi va beshinchi jildlari yetib kelgan.", "Asar 10 jilddan iborat boʻlishi rejalashtirilgan, bizgacha faqat ikkinchi va toʻrtinchi jildlari yetib kelgan.", "Asar 3 jilddan iborat boʻlishi rejalashtirilgan, bizgacha faqat bitta jildi toʻliq holatda saqlangan."], ["'Bahr ul-Asror' asarining oltinchi jildini yozishda qaysi mashhur asarlar asos qilib olingan?", "Rashiddinning 'Jome' ut-tavorix', Mirza Ulugʻbekning 'Tarixi arbai' ulus', Hofiz Tanish Buxoriyning 'Sharafnomayi Shohiy'.", "Alisher Navoiyning 'Xamsa'si, Boburning 'Boburnoma'si, va Husayn Boyqaroning 'Majolis un-nafois'i kabi forsiy manbalar.", "Muhammad Mirxondning 'Ravzat us-safo'si, Sharafuddin Ali Yazdiyning 'Zafarnoma'si va Qul Alining 'Yusuf va Zulayho' dostonlari.", "Abu Nasr Forobiyning 'Al-Madina al-Fozila'si, Ibn Sinoning 'Tib qonunlari' va Imom Buxoriyning 'Al-Jome' as-sahih'i."], ["'Bahr ul-Asror' asarida Ashtarxoniylar sulolasi haqida qanday maʼlumotlar berilgan?", "Ashtarxoniylar sulolasining kelib chiqishi, asoschisi Joni Muhammad va Toʻqay Temur ulusi tarixi.", "Ashtarxoniylar hukmdorlarining harbiy yurishlari, qoʻshin tuzilishi va diplomatik kelishuvlari.", "Ashtarxoniylar davrida adabiyot va sanʼatning rivojlanishi, madaniy meros obidalari.", "Ashtarxoniylar sulolasining ichki siyosati, iqtisodiy islohotlar va yer taqsimoti tizimi."], ["Alisher Navoiyning matnda keltirilgan nasriy tarixiy asarlariga qaysilar misol boʻla oladi?", "'Tarixi anbiyo va hukamo', 'Tarixi muluki Ajam', 'Holoti Sayyid Hasan Ardasher', 'Majolis un-nafois'.", "'Xamsa', 'Lison ut-tayr', 'Xazoyin ul-maoniy', 'Sab'ai sayyor', 'Saddi Iskandariy'.", "'Mezon ul-avzon', 'Muhokamat ul-lugʻatayn', 'Nazm ul-javohir', 'Munshaot'.", "'Arba'in', 'Chor devon', 'Devoni Foniy', 'Badoe' ul-bidoya', 'Navodir un-nihoya'."]]}, {"name": "O‘zbek tilining sohada qo‘llanilishi", "q": [["Oʻzbek tilini sohaga yoʻnaltirib oʻqitishning asosiy mohiyati nimadan iborat?", "Til bilimlarini muayyan kasb va faoliyat turi ehtiyojlari bilan bog'lab o'rgatishga qaratilgan ta'lim yoʻnalishi.", "Grammatik qoidalarni chuqur oʻrganish va ularni tilshunoslik nazariyalarida tahlil qilishga yoʻnaltirilgan uslub.", "Faqat ogʻzaki nutq madaniyatini rivojlantirishga qaratilgan, yozma nutqni cheklovchi yondashuv.", "Talabalarga xorijiy tillarni oʻrganishda yordam berish va ularning lingvistik bilimini kengaytirish."], ["Sohaga yoʻnaltirib oʻqitishning asosiy maqsadi nima deb belgilangan?", "Boʻlajak mutaxassisning kasbiy muloqot kompetensiyasini shakllantirish va adabiy tildan samarali foydalanishga oʻrgatish.", "Talabalarning umumiy tilshunoslik bilimlarini oshirish va ularni chuqur nazariy jihatdan tahlil qilish.", "Faqatgina grammatik qoidalarga rioya etgan holda yozma ishlarni bajarish koʻnikmalarini rivojlantirish.", "Soha terminlarini yodlash va ularning lugʻaviy maʼnolarini mustaqil ravishda izohlash qobiliyatini rivojlantirish."], ["Oʻzbek tilini sohaga yoʻnaltirib oʻqitish talabada grammatik bilimlardan tashqari qaysi koʻnikmalarni shakllantiradi?", "Fikrni ogʻzaki va yozma shaklda aniq, mantiqli, savodli hamda vaziyatga mos ifodalash koʻnikmasini rivojlantiradi.", "Faqatgina toʻgʻri yozish qobiliyatini, nutq madaniyatiga eʼtibor bermasdan, rivojlantirishga qaratiladi.", "Asosan tilning nazariy jihatlarini chuqur oʻrganish, uning tarixiy taraqqiyotini tahlil qilish imkoniyatini beradi.", "Professional terminlarni oʻzbek tiliga tarjima qilish va ularning etimologiyasini tadqiq etish qobiliyatini shakllantiradi."], ["Sohaga yoʻnaltirib oʻqitishning asosiy vazifalaridan biri nima hisoblanadi?", "Adabiy til meʼyorlariga tayangan holda toʻgʻri gapirish va yozish ko'nikmasini rivojlantirish.", "Soha terminlarining yagona lugʻatini tuzish va ularning ishlatilishini qatʼiy nazorat qilish.", "Tilning sheva va lahja xususiyatlarini saqlab qolish, ularni adabiy til meʼyorlariga aralashtirish.", "Faqatgina yozma nutqning grammatik jihatlarini tahlil qilish, ogʻzaki nutqni eʼtiborsiz qoldirish."], ["Matnda berilgan taʼrifga koʻra, \"Til meʼyori\" tushunchasi nimani anglatadi?", "Adabiy til birliklarining jamiyat tomonidan toʻgʻri, maqbul va barqaror deb eʼtirof etilgan qoʻllanish shaklidir.", "Tilning faqatgina fonetik va grammatik qoidalarini oʻz ichiga olgan, oʻzgaruvchan qoidalar majmuasi.", "Har bir insonning shaxsiy nutq uslubini belgilovchi, universal qoidalarga boʻysunmaydigan individual talablar.", "Til rivojlanishidagi oʻzgarishlarni aks ettiruvchi, ammo jamiyat tomonidan tasdiqlanmagan, vaqtinchalik qoidalar tizimi."], ["Quyidagilardan qaysi biri matnda keltirilgan adabiy til meʼyorlari turlari tarkibiga toʻgʻridan-toʻgʻri kiritilmagan?", "Etik-axloqiy qoidalarga oid meʼyorlar toifasiga mansub boʻlgan talablar majmuasi.", "Soʻzlarning maʼnosiga mos va oʻrinli qoʻllanilishini tartibga soluvchi leksik-semantik meʼyor.", "Gaplarning morfologik va sintaktik tuzilishini belgilovchi grammatik meʼyor.", "Ogʻzaki nutqda soʻzlarning toʻgʻri talaffuzini aniqlovchi orfoepik meʼyor."], ["Leksik meʼyor adabiy tilda asosan qaysi jihatni tartibga solishga xizmat qiladi?", "Soʻzlarning maʼnosiga mos, oʻrinli va maqsadga muvofiq qoʻllanishini taʼminlaydi.", "Ogʻzaki nutqda soʻzlarning toʻgʻri talaffuzini va ohangini belgilaydi.", "Gaplardagi tinish belgilarining toʻgʻri ishlatilishini va ularning sintaktik vazifasini aniqlaydi.", "Soʻzlarning morfologik tuzilishini va ularning shakl oʻzgarishlarini qoidalashtiradi."], ["Orfoepik meʼyorning asosiy vazifasi va u qanday xizmatni bajaradi?", "Soʻz va soʻz shakllarining ogʻzaki nutqda adabiy til talablariga muvofiq talaffuz qilinishini belgilaydi.", "Yozma nutqda harflarning toʻgʻri ishlatilishi va matnlarning vizual koʻrinishini nazorat qiladi.", "Soʻzlarning lugʻaviy maʼnolarini aniqlash va ularning sinonimik qatorlarini oʻrganish bilan shugʻullanadi.", "Gaplarning sintaktik tuzilishini va soʻz birikmalarining oʻzaro munosabatlarini tahlil etadi."], ["Aksentologik meʼyor buzilganda, yaʼni urgʻu notoʻgʻri qoʻyilganda qanday oqibatlar yuzaga kelishi mumkin?", "Nutq gʻalizlashishi yoki soʻzning anglashilishiga salbiy taʼsir qilishi mumkin.", "Yozma matnlarda imlo xatolari yuzaga keladi va ularning oʻqilishi qiyinlashadi.", "Gaplarning grammatik tuzilishi buziladi, bu esa sintaktik xatolarga olib keladi.", "Soʻzlarning semantik maʼnosi butunlay oʻzgaradi, bu esa suhbatda tushunmovchilikka sabab boʻladi."], ["Oʻzbek tilida urgʻu asosan soʻzning qaysi qismiga tushishi qayd etilgan?", "Asosan soʻzning oxirgi boʻgʻiniga tushishi.", "Koʻpincha soʻzning birinchi boʻgʻiniga tushishi.", "Har doim soʻzning oʻrta boʻgʻiniga tushishi.", "Nutq uslubiga qarab, urgʻu ixtiyoriy ravishda tushishi."], ["Grammatik meʼyor adabiy tilda nimalarni toʻgʻri tuzishni belgilaydi?", "Soʻz shakllari, soʻz birikmalari va gaplarning morfologik hamda sintaktik jihatdan toʻgʻri tuzilishini belgilaydi.", "Soʻzlarning toʻgʻri talaffuzini, yaʼni ularning orfoepik qoidalariga muvofiqligini taʼminlaydi.", "Matnlarning umumiy uslubiy xususiyatlarini, jumladan, ilmiy, rasmiy va soʻzlashuv uslublarini aniqlaydi.", "Yangi soʻzlarning hosil boʻlish qoidalarini, mavjud affikslar va modellar asosida ularning yasalishini tartibga soladi."], ["Soʻz yasalish meʼyori kasbiy sohada qanday ahamiyatga ega ekanligi matnda qayd etilgan?", "Soha terminlarini shakllantirishda tilning soʻz yasash imkoniyatlaridan toʻgʻri foydalanishni taʼminlaydi.", "Professional nutqda yangi terminlar oʻrniga eski va umumiy soʻzlardan foydalanishni qatʼiy talab qiladi.", "Chet tillardan kirib kelgan soʻzlarni aslidek qabul qilib, ularni oʻzbek tiliga moslashtirishga yoʻl qoʻymaydi.", "Faqatgina adabiy til meʼyorlariga mos keladigan soʻzlarni oʻzgartirishsiz ishlatishni cheklaydi."], ["Imloviy meʼyor yozma nutqda nimalarni belgilaydi va qanday ahamiyatga ega?", "Soʻz va gaplarning yozma nutqda toʻgʻri yozilishini belgilaydi va savodxonlikning asosiy mezonlaridan biridir.", "Ogʻzaki nutqda soʻzlarning intonatsiyasini va ritmini, yaʼni ovoz balandligini toʻgʻri qoʻllashni taʼminlaydi.", "Nutqning toza va adabiy boʻlishini, unda varvarizm va jargonlardan foydalanmaslikni qatʼiy nazorat qiladi.", "Matnlardagi grafik elementlarning, jumladan, chizmalar va diagrammalarning toʻgʻri joylashtirilishini belgilaydi."], ["Grafik meʼyor adabiy tilda nimalarning toʻgʻri qoʻllanishini belgilaydi?", "Harflar, bosh va kichik harflar, qisqartmalar hamda yozuv shakllarining toʻgʻri qoʻllanishini belgilaydi.", "Gaplardagi tinish belgilarining izchilligini va ularning mantiqiy joylashtirilishini tartibga soladi.", "Soʻzlarning maʼnosini aniqlash, ularning kontekstga mos kelishini taʼminlash va sinonimlarini tanlash.", "Ogʻzaki nutqning ravonligi va taʼsirchanligini, jumladan, urgʻu va talaffuzning aniqligini nazorat qiladi."], ["Uslubiy meʼyorning asosiy vazifasi nimadan iborat?", "Nutq birliklarining aloqa vaziyati, nutq turi va maqsadga mos holda tanlanishini taʼminlash.", "Soʻzlarning imlosini va tinish belgilarining toʻgʻri qoʻllanilishini qatʼiy nazorat qilish.", "Gaplarning grammatik tuzilishini va soʻz birikmalarining sintaktik mosligini belgilash.", "Tilga yangi soʻzlar kiritish qoidalarini yaratish va ularning morfologik tuzilishini standartlashtirish."], ["Punktuatsion meʼyor yozma nutqda qanday ahamiyatga ega va nimani taʼminlaydi?", "Yozma nutqda tinish belgilarining toʻgʻri va oʻrinli qoʻllanishini belgilaydi, matn aniqligi uchun zarurdir.", "Ogʻzaki nutqda intonatsiya va pauzalarni toʻgʻri ifodalashga xizmat qiladi, tinglovchining tushunishini osonlashtiradi.", "Soʻzlarning etimologiyasini oʻrganish va ularning kelib chiqishini aniqlashga yordam beradi.", "Harflarning yozma shakllarini, qisqartmalarni va bosh harflarning ishlatilishini tartibga soladi."], ["Nutqning sofligi deganda matnda nima nazarda tutilgan?", "Adabiy til va jamiyatdagi maʼnaviy-axloq qoidalariga yot unsurlardan xoli boʻlish.", "Faqatgina grammatik jihatdan toʻgʻri, ammo maʼnosiz soʻzlardan foydalanish.", "Nutqda imkon qadar koʻproq chet soʻzlarni ishlatish orqali uning zamonaviyligini oshirish.", "Sheva va lahja xususiyatlarini saqlab qolish va ularni adabiy til meʼyorlari bilan uygʻunlashtirish."], ["Matnga koʻra, quyidagi misollardan qaysi biri \"varvarizm\"ga yaqqol misol boʻla oladi?", "\"Bekat\" oʻrniga \"ostanovka\" soʻzini ishlatish.", "\"Kitob\" oʻrniga \"asar\" soʻzini qoʻllash.", "\"Maktab\" oʻrniga \"taʼlim muassasasi\" iborasini qoʻllash.", "\"Yugurmoq\" oʻrniga \"chopmoq\" soʻzini ishlatish."], ["Kasbiy muhitdagi jargonning rasmiy va ommaviy nutqdagi oʻrni qanday baholanadi?", "Ichki muloqotda uchrashi mumkin, ammo rasmiy va ommaviy nutqda umumiy tushunarlilik ustun boʻlishi lozim.", "Har qanday kasbiy muloqotda, jumladan rasmiy nutqda ham, imkon qadar keng qoʻllanilishi shart.", "Tilning boyligini oshiruvchi asosiy vosita boʻlib, uning ishlatilishi doimo ragʻbatlantiriladi.", "Hech qachon professional muloqotda, hatto ichki doirada ham, ishlatilishiga yoʻl qoʻyilmasligi kerak."], ["Xulosaga koʻra, adabiy til meʼyorlariga rioya qilish nutqning qaysi sifatlarini taʼminlaydi?", "Nutqning aniqligi, ravonligi, sofligi va taʼsirchanligini taʼminlaydi.", "Nutqning uzunligi va murakkabligini oshiradi, eshituvchini charchatadi.", "Nutqda individual uslubning shakllanishini cheklaydi, uni bir xil qilib qoʻyadi.", "Nutqni
