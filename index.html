 yangi e'tiqodning tarqalishi davlatchilikni vujudga keltirishda hal qiluvchi rol oʻynagan."], ["Buyuk Ipak yoʻli turkiy siyosiy tuzilmalarning shakllanishida qanday rol oʻynaganligini ta'riflang?", "Turkiy siyosiy tuzilmalar Buyuk Ipak yo'lining ayrim yoʻnalishlari ustidan nazorat qilish va xalqaro savdoda faol ishtirok etish imkoniyatiga ega boʻlgan.", "Buyuk Ipak yoʻli turkiy xalqlarni butunlay savdo faoliyatidan uzoqlashtirib, faqatgina chorvachilikka e'tibor qaratishga undagan.", "Ushbu yoʻl faqatgina madaniy almashinuvga xizmat qilgan, ammo turkiy davlatlarning iqtisodiy yoki siyosiy rivojlanishiga ta'sir koʻrsatmagan.", "Buyuk Ipak yoʻli tufayli turkiy qabilalar oʻrtasida doimiy urushlar va nizolar yuzaga kelgan, bu davlatchilikka salbiy ta'sir koʻrsatgan."], ["Turk xoqonligining siyosiy tizimida oliy hokimiyatni kim ifodalagan va qanday mansablar mavjud boʻlgan?", "Xoqon oliy siyosiy hokimiyatni ifodalagan, uning atrofida yabgʻu, shad, eltabar, tudun kabi turli darajadagi siyosiy va harbiy mansablar mavjud bo'lgan.", "Oliy hokimiyat faqat zodagonlar kengashiga tegishli boʻlgan, xoqonning roli esa asosan ramziy tusga ega boʻlib, harbiy boshqaruvni ta'minlagan.", "Demokratik tizimga asoslangan boʻlib, har bir qabila oʻz vakilini saylagan va bu vakillar umumiy kengashda hokimiyatni birgalikda boshqarganlar.", "Din peshvolari oliy hokimiyatni boshqargan, xoqon esa faqatgina diniy marosimlarni oʻtkazuvchi ruhoniy vazifasini bajargan, dunyoviy hokimiyatga ega boʻlmagan."], ["Turkiy davlatlar tarixini oʻrganishda tizimli yondashuvning asosiy bosqichlaridan biri nima hisoblanadi?", "Voqeaning vaqtini, hududini, subyektlarini, sabablarini, jarayonini va natijalarini aniqlash kabi kompleks tahlil qilish bosqichlari.", "Faqatgina tarixiy voqealarning sanasini yod olish va ularni xronologik tartibda roʻyxatlash bilan cheklanib qolish.", "Asosan tarixiy hodisalarning qaysi shaxslar tomonidan amalga oshirilganini oʻrganish va ularning shaxsiy sifatlariga baho berish.", "Tarixiy voqealarni boshqa jarayonlardan ajratib, har bir hodisani alohida, mustaqil ravishda tahlil qilish."], ["\"Turkiy davlatlar tarixi\" fanining predmeti nimani oʻrganishga qaratilgan asosiy jihatlarni belgilaydi?", "Turkiy xalqlarning etnik va siyosiy shakllanish jarayonlari, qadimgi davlatchilikning vujudga kelishi, davlat boshqaruvi va siyosiy institutlarining tarixiy oʻrnini tadqiq etishdir.", "Faqatgina yozma manbalar asosida turkiy sulolalarning tashqi siyosiy aloqalari, savdo shartnomalari va diplomatik munosabatlarini tahlil qilishdir.", "Qadimgi turkiy jamiyatda faqatgina ko'chmanchilik bilan bog'liq bo'lgan harbiy tizimlar, yaylovlar boshqaruvi va ularning ijtimoiy hayotga ta'sirini o'rganishdir.", "Zamonaviy davlatlarning shakllanish sabablari, ularning iqtisodiy tizimlari, jahon savdosiga ta'siri va madaniy o'zgarishlarini ilmiy asosda tahlil etishdir."], ["\"Turkiy davlatlar tarixi\" fanining asosiy maqsadi bakalavr talabalarga nimalarni taqdim etishdan iborat?", "Turkiy xalqlar va davlatlarning tarixiy taraqqiyoti haqida ilmiy, tizimli, xolis bilim berish, jahon tarixidagi oʻrnini tushuntirish hamda tarixiy manbalarni mustaqil tahlil qilish ko'nikmasini shakllantirish.", "Faqatgina qadimgi davr turkiy sulolalarning hukmdorlari ro'yxatini yodlatish, ularning boshqaruv usullarini eslab qolish va harbiy g'alabalarini sanashni o'rgatish.", "Turkiy tillar grammatikasi va adabiyotining rivojlanish bosqichlari haqida chuqur ma'lumotlar berish, tilshunoslik sohasida tadqiqotlar o'tkazishga ko'niktirish.", "Zamonaviy turkiy davlatlarining siyosiy iqtisodiy tizimini taqqoslash, ularning xalqaro munosabatlardagi o'rnini tushuntirish va diplomatik aloqalarni o'rganish."], ["\"Turkiy davlatlar tarixi\" fanining asosiy vazifalaridan biri boʻlgan \"Tarixiy bilim berish\" nimani oʻz ichiga oladi?", "Talabalarga qadimgi davrdan boshlab turkiy xalqlarning siyosiy va madaniy taraqqiyoti haqida izchil, tizimli hamda haqqoniy bilim berishdir.", "Faqatgina keyingi davrlardagi turkiy sulolalarning davlat boshqaruvi tizimlari va ularning qo'shni xalqlar bilan aloqalari haqida ma'lumot berishdir.", "Turkiy davlatlarning harbiy strategiyalari va urush olib borish usullari haqida batafsil ma'lumot berish hamda ularning g'alabalari sababini tushuntirishdir.", "Turkiy xalqlarning etnik tarkibi va ularning tildagi farqlari haqida to'liq bilim berish, shuningdek, tilshunoslik asoslarini chuqur o'rgatishdir."], ["Qadimgi turkiy davlatchilikning shakllanishiga zamin yaratgan \"siyosiy birlashuv\" omili nimani anglatadi?", "Turli qabila va urug'larning umumiy siyosiy manfaatlar asosida birlashuvi, bu esa yirik siyosiy tuzilmalarning vujudga kelishiga olib kelgan.", "Yevropadan kelgan davlatlarning turkiy qabilalarni harbiy kuch bilan o'zaro ittifoq tuzishga majburlashi natijasida siyosiy birlik yuzaga kelishi.", "Ko'chmanchilik bilan shug'ullanuvchi jamoalar o'rtasidagi iqtisodiy kelishuvlar, savdo yo'llarini taqsimlash va qo'shma bozorlarni yaratish jarayoni.", "Diniy e'tiqodlarning umumiy tamoyillari asosida qabilalarning bir bayroq ostida birlashuvi va madaniy merosni saqlab qolishga intilishi."], ["Qadimgi turkiy davlatchilikning shakllanishida \"iqtisodiy manfaatlar\" omili nimani o'z ichiga oladi?", "Ko'chmanchi chorvachilik bilan shugʻullangan jamoalar va voha-shahar aholisi o'rtasidagi savdo-iqtisodiy aloqalar rivojlanishi, strategik hududlarni nazorat qilishga intilish.", "Faqatgina yerlarni dehqonchilik uchun ishlatish, sug'orish tizimlarini rivojlantirish va dehqonchilik mahsulotlarini yetishtirishga e'tibor qaratish.", "Moliya tizimini yaratish, soliq undirish mexanizmlarini joriy etish, ammo savdo aloqalarini qo'shni davlatlar bilan chegaralashga urinishdir.", "Ichki bozorlarni rivojlantirish, hunarmandchilikni qo'llab-quvvatlash va valyuta almashinuvi uchun yagona valyuta tizimini yaratish harakatlari."], ["Qadimgi turkiy davlatchilikning shakllanishida \"Buyuk Ipak yo'li\" omili qanday rol o'ynagan?", "Turkiy siyosiy tuzilmalar Buyuk Ipak yo'lining ayrim yoʻnalishlari ustidan nazorat qilish va xalqaro savdoda faol ishtirok etish imkoniyatiga ega boʻlgan.", "Buyuk Ipak yo'li faqatgina qo'shni davlatlarning savdo-iqtisodiy rivojlanishiga xizmat qilgan, turkiy davlatlar unda cheklangan rol o'ynagan.", "Bu yo'l asosan harbiy kuchlar tashish va harbiy ekspansiya uchun ishlatilgan, iqtisodiy ahamiyati esa ikkinchi darajali bo'lgan.", "Buyuk Ipak yo'li turkiy xalqlarning ichki iqtisodiy aloqalarini mustahkamlashga qaratilgan bo'lib, tashqi savdoda ahamiyati past edi."], ["Turk xoqonligining siyosiy tizimida uchraydigan, manbalarda qayd etilgan unvon va lavozimlar qaysilar?", "Xoqon oliy hokimiyatni ifodalagan, uning atrofida yabgʻu, shad, eltabar, tudun kabi turli darajadagi siyosiy va harbiy mansablar mavjud bo'lgan.", "Qadimgi Rim imperiyasidagi imperator, senator, konsul kabi unvonlar tizimi qo'llanilgan, bu esa markazlashgan boshqaruvni ta'minlagan.", "Faqatgina xoqon va uning yaqin oila a'zolari davlatni boshqargan, boshqa lavozimlar faqat nomigagina bo'lib, haqiqiy hokimiyatga ega bo'lmagan.", "Zamonaviy davlatlardagi prezident, bosh vazir, parlament a'zolari kabi lavozimlar joriy etilgan bo'lib, demokratik boshqaruv tamoyillari amal qilgan."], ["Qadimgi turkiy tarixni oʻrganishda \"millat\" tushunchasini zamonaviy siyosiy mazmunini VI-VIII asrlar jamiyatiga koʻchirish nega notoʻgʻri?", "\"Millat\" tushunchasining zamonaviy siyosiy mazmunini qadimgi jamiyatga bevosita koʻchirish anaxronizmga olib keladi, sababi mazmun o'zgargan.", "Qadimgi turkiy jamiyatda \"millat\" tushunchasi mavjud bo'lmagan, shuning uchun bu atama umuman qo'llanilmasligi kerak.", "Faqatgina \"xalq\" yoki \"qabila\" kabi etnik birliklarni ifodalovchi tushunchalardan foydalanish kerak, \"millat\" esa faqat davlatni bildiradi.", "Qadimgi davrlarda \"millat\" tushunchasi faqat diniy jamoalarni ifodalagan, shuning uchun siyosiy kontekstda qo'llanilishi mumkin emas."], ["Nima sababdan aynan VI asrda turkiy xalqlar orasida siyosiy birlashuv yuzaga keldi?", "Rouran xoqonligining siyosiy mavqei, Ashina sulolasining kuchayishi, qabila ittifoqlari, harbiy salohiyat, metallurgiya, savdo yo'llari va xalqaro siyosiy vaziyat kabi omillarning birgalikdagi ta'siri.", "Faqatgina Bumin xoqonning shaxsiy yetakchiligi va uning harbiy yurishlari natijasida, boshqa omillar ahamiyatga ega bo'lmaganligi sababli.", "Buyuk Ipak yo'lining to'liq nazoratga olinishi va undan tushgan barcha daromadlar faqatgina harbiy kuchlarni mustahkamlashga yo'naltirilganligi sababli.", "Xitoy imperiyasining yordami va harbiy ko'magi tufayli turkiy qabilalar o'rtasida birdamlik paydo bo'lgan, shuningdek, madaniy almashinuvlar sababli."], ["Turkiy xalqlarning etnogenezi masalasi qanday usullarda o'rganilishi lozim?", "Yozma manbalar bilan birga arxeologiya, tarixiy antropologiya, tilshunoslik va boshqa fanlarning ma'lumotlarini qiyoslash orqali o'rganish zarur.", "Faqatgina afsonalar va og'zaki rivoyatlar asosida o'rganish, ilmiy manbalarni e'tiborsiz qoldirish orqali etnogenez haqida xulosa chiqarish kerak.", "Etnogenezni bitta qabila yoki bitta tarixiy voqea bilan izohlash, boshqa omillarning ta'sirini inkor etish orqali tahlil qilish lozimdir.", "Zamonaviy etnik guruhlarning hududiy joylashuvini o'rganish va ularning genetik tahlillariga asoslanib, o'tmish haqida xulosa chiqarish kerak."], ["Markaziy Osiyoda koʻchmanchi va oʻtroq jamiyat munosabatlari qanday koʻrinishda bo'lgan?", "Koʻchmanchi chorvachilik, voha dehqonchiligi, shahar madaniyati va savdo oʻzaro aloqada boʻlgan, bu iqtisodiy va madaniy taraqqiyotga ta'sir ko'rsatgan.", "Ko'chmanchilar va o'troq aholi orasida faqatgina harbiy to'qnashuvlar va hududiy da'volar hukm surgan, iqtisodiy aloqalar mavjud bo'lmagan.", "O'troq aholi ko'chmanchilarga qaram bo'lib, ular uchun soliqlarni yig'ib bergan, ammo o'z navbatida ko'chmanchilardan hech narsa olmagan.", "Shahar madaniyati faqatgina o'troq dehqonchilik bilan bog'liq bo'lgan, ko'chmanchilar esa shahar hayotidan butunlay ajralib yashashgan va o'zaro aloqa qilmagan."], ["Buyuk Ipak yoʻli turkiy davlatlar uchun qanday vazifalarni bajargan?", "U iqtisodiy aloqalarni, diplomatik munosabatlarni, madaniy almashinuvni, texnologiyalar tarqalishini va diniy g'oyalarning harakatini tezlashtirgan.", "Asosan harbiy qo'shinlar harakati uchun xizmat qilgan, ammo savdo va madaniy almashinuvda ahamiyati deyarli bo'lmagan, faqatgina harbiy maqsadlar uchun ishlatilgan.", "Faqatgina Xitoy va G'arb davlatlari o'rtasidagi savdo yo'li bo'lib, turkiy davlatlar uning ustidan hech qanday nazoratga ega bo'lmaganlar.", "U faqatgina ichki savdo aloqalarini rivojlantirishga qaratilgan bo'lib, tashqi diplomatik munosabatlar va madaniy almashinuvda hech qanday rol o'ynamagan."], ["Qoraxoniylar davrida turkiy yozma madaniyat taraqqiyotiga hissa qoʻshgan eng mashhur asarlar qaysilar?", "Yusuf Xos Hojibning “Qutadgʻu bilig”i va Mahmud Koshgʻariyning “Devonu lugʻotit turk”i.", "Abulqosim Firdavsiyning “Shahnoma”si va Umar Xayyomning “Ruboiylar” toʻplami.", "Zahiriddin Muhammad Boburning “Boburnoma”si va Alisher Navoiyning “Xamsa”si.", "Abu Rayhon Beruniyning “Qonuni Maʼsudiy”si va Ibn Sinoning “Tib qonunlari” kitobi."], ["Gʻaznaviylar davlatining siyosiy asoslari qaysi shaxslarning faoliyati bilan bogʻliq boʻlgan edi?", "Alptigin va Sobuktigin faoliyatlari, Mahmud Gʻaznaviy davrida davlat kuchaygan.", "Malikshoh va Sanjar hukmronliklari, ularning davlatni boshqarish usullari.", "Amir Temur va Mirzo Ulugʻbekning ilmiy hamda siyosiy islohotlari natijasi.", "Nizomulmulkning siyosiy nazariyalari, uning davlat tuzilishi haqidagi fikrlari."], ["Gʻaznaviylar davrida ilm-fan sohasining eng mashhur namoyandalaridan biri kim edi?", "Abu Rayhon Beruniy oʻzining ilmiy tadqiqotlari bilan mashhur boʻlgan alloma.", "Firdavsiy asarlari ham bu davr madaniy muhitida faoliyat yuritgan adib sifatida.", "Mahmud Koshgʻariy turkiy tillar boʻyicha muhim asarlar yozgan olim sifatida.", "Yusuf Xos Hojib “Qutadgʻu bilig” asari bilan tanilgan faylasuf shaxs sifatida."], ["1040-yildagi qaysi jang Saljuqiylarning Xurosondagi mavqeini mustahkamladi va ularni qudratli kuchga aylantirdi?", "Dandanakon jangi Saljuqiylar uchun hal qiluvchi gʻalaba boʻldi, bu ularning mavqeini mustahkamladi.", "Malazgirt jangi Vizantiya ustidan gʻalaba qozonishga yordam berdi va Anadoluga yoʻl ochdi.", "Talas jangi arablar bilan turklar oʻrtasidagi toʻqnashuvni belgiladi va Movarounnahrga ta'sir qildi.", "Qodisiya jangi Sosoniylar imperiyasining magʻlubiyatiga olib keldi, Islom davlatini kengaytirdi."], ["Xorazmshohlar davlatining boshqaruv shakli qanday xususiyatlarga ega boʻlgan edi?", "Davlat markazlashgan monarxiya shakliga ega boʻlib, hukmdor oliy rahbar boʻlgan.", "Konfederativ ittifoq tuzilishiga ega boʻlib, bir nechta mustaqil qabilalar birlashgan.", "Fevdal tarqoqlik asosida boshqarilgan boʻlib, markaziy hokimiyat juda zaif edi.", "Teokratik davlat sifatida shakllangan boʻlib, diniy liderlar asosiy boshqaruvchi edi."], ["Amir Temur Movarounnahrda hokimiyatni qaysi yilda qoʻlga kiritgan va siyosiy markazni shakllantirgan?", "1370-yilda Amir Temur Movarounnahrda hokimiyatni qoʻlga kiritib, Samarqandni markaz qilgan.", "1227-yilda moʻgʻul hukmronligini yakunlagan va Chingizxon merosini oʻzgartirishga harakat qilgan.", "1405-yilda imperiyasini kengaytirgan va Yevropa bilan savdo aloqalarini mustahkamlagan.", "1500-yilda Shayboniylar bilan kurashgan va ularni Movarounnahrdan quvib chiqarishga uringan."], ["Temuriylar davrining eng katta tarixiy meroslaridan biri nima hisoblanadi va nimada namoyon boʻladi?", "Ilm-fan va madaniyatning yuksak darajaga koʻtarilishi, ayniqsa Ulugʻbek faoliyati bilan.", "Harbiy sohadagi muvaffaqiyatlar va gʻalabalar, bu hududlarni birlashtirishga xizmat qilgan.", "Iqtisodiy islohotlar va savdo aloqalarining rivoji, shaharsozlikda ham katta yutuqlar.", "Siyosiy barqarorlik va mustahkam hukmronlik, bu keyingi sulolalarga oʻrnak boʻlgan."], ["Mirzo Ulugʻbek qaysi sohalarda faoliyat yuritgan hukmdor va olim edi, uning asosiy yutuqlari nimada?", "Astronom, matematik, ilm-fan homiysi sifatida rasadxona qurib, ilmiy jadvallar yaratgan.", "Tarixchi, geografer, adabiyotshunos sifatida qimmatli tarixiy asarlar yozgan va nashr etgan.", "Diniy ulamo, faylasuf, huquqshunos sifatida islom huquqini rivojlantirishga katta hissa qoʻshgan.", "Harbiy strateg, diplomat, siyosatchi sifatida imperiyani kengaytirib, xalqaro aloqalarni mustahkamlagan."], ["Shayboniylar davrida Temuriylar siyosiy tizimining oʻrniga kelgan yangi sulola qanday yoʻl tutgan edi?", "Mavjud siyosiy, iqtisodiy va ma'muriy tajribalarning bir qismini davom ettirganlar.", "Barcha eski an'analarni butunlay inkor etib, yangi davlat boshqaruvini oʻrnatganlar.", "Faqatgina harbiy tizimni saqlab qolgan, boshqa barcha sohalarni tubdan oʻzgartirganlar.", "Yevropadagi davlat boshqaruvi usullarini joriy etgan va yangi madaniyatni shakllantirganlar."], ["Usmoniylar davlatiga taxminan qaysi yilda va qayerda asos solingan edi?", "Usmon I tomonidan taxminan 1300-yillar atrofida Kichik Osiyoda asos solingan.", "999-yilda Qoraxoniylar Movarounnahrda tashkil topgan turkiy sulola sifatida shakllangan.", "1040-yilda Dandanakon jangi natijasida Xurosonda Saljuqiylar hukmronligi oʻrnatilgan.", "1453-yilda Fatih Sulton Mehmet tomonidan Istanbulni egallash bilan kuchli imperiyaga aylangan."], ["Markaziy Osiyoda moʻgʻul va turkiy siyosiy-madaniy an'analarning uygʻunlashuvi qaysi davlatga xos edi?", "Chigʻatoy ulusi davrida “chigʻatoylashuv” jarayoni natijasida bu uygʻunlashuv kuchaydi.", "Saljuqiylar imperiyasida shunday tizim shakllangan boʻlib, turkiy va islomiy an'analar bogʻlandi.", "Qoraxoniylar davlatida ilk bor rivojlangan boʻlib, bu yangi siyosiy va madaniy model edi.", "Usmoniylar imperiyasida bu hodisa kuzatilgan boʻlib, Vizantiya merosi bilan uygʻunlashgan."], ["Temuriylar davrida Samarqand, Buxoro, Hirot kabi shaharlar qanday ahamiyatga ega boʻlgan?", "Bu shaharlar yirik iqtisodiy va madaniy markazlarga aylandi, ilm-fan ham rivojlandi.", "Faqatgina harbiy garnizonlar joylashgan muhim strategik shaharlar vazifasini oʻtagan edi.", "Diniy ziyoratgohlar vazifasini oʻtagan joylar edi, aholining asosiy qismi ulamolar boʻlgan.", "Kichik qishloq xoʻjaligi hududlari boʻlib qolgan, savdo va hunarmandchilik susaygan edi."], ["Oʻrta asrlardagi turkiy davlatchilikning davlat boshqaruvidagi evolyutsiyasi qaysi bosqichlarni oʻz ichiga olgan?", "Qabila-siyosiy ittifoqlar, xoqonlik, sulolaviy monarxiyalar, harbiy-ma'muriy va imperiyaviy tizimlar.", "Demokratik respublikalar, parlamentar monarxiyalar, avtokratik boshqaruvlar kabi zamonaviy bosqichlar.", "Fevdal parchalanish, markazlashgan hokimiyat, oligarxik boshqaruv shakllari bilan almashishgan.", "Teokratiya, anarxiya, kommunal boshqaruv, monastik tuzilmalar kabi noyob tizimlar rivojlangan."], ["Oʻrta asrlardagi turkiy davlatlarning xalqaro munosabatlarida qanday vositalardan foydalanilgan?", "Elchilik, sovgʻa-salom, nikoh ittifoqlari, savdo va harbiy shartnomalar kabi diplomatik vositalar.", "Maxfiy josuslik, iqtisodiy blokadalar, madaniy boykotlar kabi noan'anaviy usullar qoʻllanilgan.", "Faqatgina harbiy kuch ishlatish va hududlarni bosib olish yoʻli bilan aloqalar oʻrnatilgan.", "Diniy targʻibot, olimlar almashinuvi, sport musobaqalari orqali xalqaro aloqalar mustahkamlangan."], ["Qoraxoniylar davlatining siyosiy tuzilmasi qanday xarakterga ega boʻlgan va uning asosida nima yotgan?", "Qabila konfederatsiyasi xarakterida boʻlib, Markaziy Osiyodagi turkiy qabilalar asosida shakllangan.", "Kuchli markazlashgan monarxiya tuzilishi boʻlib, Vizantiya imperiyasi modeliga tayangan.", "Quldorlik tuzumi asosidagi harbiy aristokratiya tomonidan boshqariladigan sulola edi.", "Gʻaznaviylar kabi arab xalifaligiga vassal boʻlib, faqat diniy hokimiyatni nazorat qilgan."], ["Gʻaznaviylar davlatining siyosiy asoslari qaysi shaxslar faoliyati bilan chambarchas bogʻliq edi?", "Alptigin va Sobuktiginning harbiy-siyosiy yurishlari va davlatni mustahkamlash faoliyati bilan.", "Mahmud Koshgʻariy va Yusuf Xos Hojibning ilmiy-madaniy islohotlari bilan.", "Nizomulmulk va Malikshohning boshqaruv tizimini takomillashtirish ishlari bilan.", "Amir Temur va Ulugʻbekning davlatni tashkil etish va ilm-fanga homiylik qilishlari bilan."], ["Saljuqiylar davlatida yer daromadi, harbiy xizmat va davlat boshqaruvi oʻrtasidagi aloqani kuchaytirgan tizim qanday nomlangan?", "Iqto tizimi deb atalib, unda iqtodorlar ma'lum hududlardan daromad olish evaziga harbiy xizmatni bajarardi.", "Vaqf tizimi boʻlib, diniy muassasalarga yer va mulklar ajratish orqali ijtimoiy xizmatlar koʻrsatilgan.", "Mulk tizimi boʻlib, yerga xususiy egalikni anglatgan va harbiy xizmat bilan bevosita bogʻliq boʻlmagan.", "Sugʻorish tizimi, u dehqonchilikni rivojlantirishga qaratilgan boʻlib, asosan qishloq xoʻjaligi sohasiga oid edi."], ["Temuriylar davrida ilm-fan va madaniyatning yuksalishida astronom, matematik va hukmdor sifatida muhim oʻrin tutgan shaxs kim edi?", "Mirzo Ulugʻbek hukmdor, astronom, matematik va ilm-fan homiysi sifatida tarixda muhim iz qoldirgan.", "Alisher Navoiy buyuk shoir va davlat arbobi sifatida oʻzining adabiy merosi bilan tanilgan edi.", "Abu Rayhon Beruniy Gʻaznaviylar davrida yashagan ensiklopedist olim boʻlib, koʻplab sohalarda asarlar yaratgan.", "Nizomulmulk Saljuqiylar davrining mashhur vaziri boʻlib, davlat boshqaruvi haqida qimmatli asarlar yozgan."], ["UNESCO maʼlumotlariga koʻra, Samarqandning Temuriylar davridagi meʼmoriy merosi qanday tarixiy hodisa sifatida baholanadi?", "Butun mintaqa islom meʼmorchiligi rivojiga taʼsir koʻrsatgan tarixiy hodisa sifatida eʼtirof etiladi.", "Faqat mahalliy xarakterga ega boʻlib, boshqa mintaqalarga katta taʼsir koʻrsata olmagan.", "Avvalgi sulolalar, masalan, Qoraxoniylar meʼmorchiligining oddiy davomi sifatida qaraladi.", "Yevropa Uygʻonish davri meʼmorchilik uslublaridan toʻgʻridan-toʻgʻri ilhom olganligi bilan ajralib turadi."], ["Shayboniylar davlat boshqaruvida Temuriylar siyosiy tizimining qaysi jihatlari davom ettirilgan?", "Mavjud siyosiy, iqtisodiy va maʼmuriy tajribalarning bir qismi yangi sulola tomonidan davom ettirilgan.", "Chingiziy legitimlik anʼanalari toʻliq bekor qilinib, butunlay yangi boshqaruv uslubi joriy etilgan.", "Iqto tizimi bekor qilingan va uning oʻrniga faqat markazlashgan byurokratik boshqaruv shakllangan.", "Diniy institutlar va ulamolarning hokimiyatdagi oʻrni butunlay olib tashlangan, secular boshqaruv shakllangan."], ["Oʻrta asrlardagi turkiy davlatchilikning eng uzoq yashagan va hududiy jihatdan eng yirik siyosiy tuzilmasi qaysi davlat edi?", "Usmoniylar davlati Kichik Osiyoda tashkil topib, 1922-yilgacha mavjud boʻlgan yirik imperiya hisoblanadi.", "Saljuqiylar davlati Yaqin Sharqda muhim rol oʻynagan, ammo Usmoniylar kabi uzoq umr koʻrmagan.", "Temuriylar davlati XV asrda Markaziy Osiyoda yuksalgan boʻlsa-da, Usmoniylar bilan taqqoslab boʻlmaydi.", "Xorazmshohlar davlati XIII asrda Markaziy Osiyoda katta siyosiy kuch boʻlgan, ammo tezda qulagan."], ["Usmoniylar siyosiy tizimining muhim xususiyatlaridan biri nimalarning uygʻunlashuvidan iborat edi?", "Anadolu turkiy siyosiy anʼanalari, Vizantiya va islomiy boshqaruv tajribasining uygʻunlashuvi.", "Qadimgi Misr firʼavnlari boshqaruvi, Yevropa feodalizm tuzumi va Xitoy imperatorlik anʼanalarining uygʻunlashuvi.", "Mongol imperiyasi merosi, fors sivilizatsiyasi va hind diniy qonunlarining aralashuvidan tashkil topgan.", "Qoraxoniylar davlatining sulolaviy tuzilishi, Gʻaznaviylarning harbiy tizimi va Saljuqiylar madrasa anʼanalarining uygʻunlashuvi."], ["Oʻrta asrlardagi turkiy davlatlar iqtisodiyotini tushuntiruvchi uchta asosiy tizim qaysilar edi?", "Koʻchmanchi chorvachilik, oʻtroq dehqonchilik hamda shahar hunarmandchiligi va savdo tizimlari.", "Qulchilik tizimi, savdo monopoliyasi va dengiz savdosining ustuvorligi ushbu davr iqtisodiyotini belgilagan.", "Yirik yer egaligi, erkin bozor munosabatlari va sanoat ishlab chiqarishiga asoslangan tizimlar.", "Qabila iqtisodiyoti, davlat tomonidan toʻliq boshqariladigan iqtisodiyot va tabiiy almashinuv tizimi."], ["Turkiy davlatlarning xalqaro munosabatlarda foydalangan diplomatik vositalariga qaysilar kirgan?", "Elchilik, sovgʻa-salomlar ayirboshlash, nikoh ittifoqlari, savdo shartnomalari va harbiy ittifoqlar.", "Iqtisodiy sanksiyalar, embargolar, siyosiy tashviqot va madaniy blokadalar kabi vositalar.", "Keng koʻlamli urushlar, hududiy egallash, mustamlakachilik va harbiy intervensiyalar.", "Xalqaro sudlar, arbitraj, tinchlikparvar kuchlar va umumiy xavfsizlik shartnomalari."], ["Gʻaznaviylarning kelib chiqishi va siyosiy shakllanishi Encyclopaedia Iranica tomonidan qanday taʼriflanadi?", "Turkiy harbiy qullar va Somoniylar davridagi harbiy tizim bilan bogʻliq sulola sifatida.", "Oʻgʻuz turk qabilalari konfederatsiyasidan shakllangan hukmron elita sifatida.", "Markaziy Osiyodagi mahalliy dehqonlar va hunarmandlar ittifoqidan tashkil topgan sulola sifatida.", "Eroniyzabon shahar aholisi va arab xalifaligi oʻrtasidagi siyosiy kelishuv natijasida shakllangan."], ["Qoraxoniylar davrida turkiy yozma madaniyat taraqqiyotida alohida oʻrin tutgan, davlat boshqaruvi va adolat haqidagi mashhur asar qaysi?", "Yusuf Xos Hojibning \"Qutadgʻu bilig\" asari muhim ahamiyatga ega edi.", "Mahmud Koshgʻariyning \"Devonu lugʻotit turk\" lugʻati tilshunoslik uchun.", "Al-Farobiyning \"Fozil odamlar shahri\" risolasi falsafiy qarashlarni ifodalaydi.", "Ibn Sinoning \"Tib qonunlari\" kitobi tibbiyot rivojiga katta hissa qoʻshgan."], ["Gʻaznaviylar davlati iqtisodiyotining rivojlanishida muhim rol oʻynagan va siyosiy aloqalarni kuchaytirgan tashqi bogʻliqlik qaysi davlat bilan edi?", "Hindiston bilan aloqalar iqtisodiy va siyosiy jihatdan muhim edi.", "Xitoy bilan savdo aloqalari sezilarli darajada rivojlangan hisoblanadi.", "Vizantiya imperiyasi bilan diplomatik munosabatlar ustuvor edi.", "Arab xalifaligi bilan diniy va madaniy aloqalar chuqurlashgan."], ["Saljuqiylar davlat boshqaruvi va siyosiy nazariya masalalarini oʻzining \"Siyosatnoma\" asarida bayon qilgan mashhur vazir kim edi?", "Nizomulmulk davlat boshqaruvida katta islohotlar oʻtkazgan edi.", "Alp Arslon Saljuqiylar davlatining buyuk hukmdorlaridan biri hisoblanadi.", "Malikshoh Saljuqiylar imperiyasini kengaytirgan qudratli sulton edi.", "Sanjar Saljuqiylar davlatining soʻnggi buyuk hukmdori boʻlib qolgan."], ["Saljuqiylar davrida davlatning iqtisodiy va harbiy boshqaruvida muhim vosita boʻlgan, yer daromadlari evaziga harbiy xizmat majburiyatini yuklagan tizim qanday nomlangan?", "Iqto tizimi yer egaligi va harbiy xizmatni oʻzaro bogʻlagan.", "Vaqf tizimi diniy-maʼrifiy muassasalarni moliyalashtirishga xizmat qilgan.", "Jizya tizimi nodavlat fuqarolardan olinadigan soliqni anglatardi.", "Zakot tizimi islomiy ehson va xayriya uchun joriy etilgan edi."], ["XII-XIII asr boshlarida Markaziy Osiyoda katta siyosiy kuchga aylangan, dastlabki vakillari Saljuqiylar xizmatida boʻlgan sulola qaysi?", "Xorazmshohlar davlati mintaqada oʻz mavqeini sezilarli mustahkamlagan.", "Qoraxoniylar sulolasi Markaziy Osiyoda avvalroq hukmronlik qilgan edi.", "Gʻaznaviylar davlati asosan Xuroson va Hindiston yoʻnalishida rivojlangan.", "Temuriylar davlati keyingi davrlarda Markaziy Osiyoda shakllangan."], ["Xorazmshohlar davlatining hukmdori siyosiy boshqaruvda qanday asosiy vazifalarni bajargan?", "Davlat boshligʻi, oliy harbiy rahbar hamda tashqi siyosat subyekti boʻlgan.", "Faqat diniy ishlar va adolatni taʼminlash bilan shugʻullanib kelgan.", "Asosan iqtisodiy siyosatni boshqargan va savdo-sotiqni rivojlantirgan.", "Mahalliy hokimlarning faoliyatini nazorat qilgan, lekin ularga aralashmagan."], ["Amir Temur davlat boshqaruvida qaysi uchta asosiy anʼananing uygʻunlashuviga eʼtibor bergan?", "Chingiziy legitimlik, turkiy-moʻgʻul siyosiy va islomiy madaniyat uygʻunlashgan.", "Fors davlatchilik an'analari, mahalliy qabila urf-odatlari va Vizantiya tajribasi.", "Arab xalifaligi boshqaruvi, Yevropa feodalizm va Hindiston kastalar tizimi.", "Xitoy imperiyasi modellari, koʻchmanchi qabilalar qoidalari va Saljuqiylar tizimi."], ["Temuriylar davrida Samarqandni astronomiya va ilm-fanning yirik markaziga aylantirgan, rasadxona qurish tashabbusiga sababchi boʻlgan hukmdor kim edi?", "Mirzo Ulugʻbek hukmdor, astronom, matematik va ilm-fan homiysi sifatida.", "Amir Temur davlatning harbiy-siyosiy asoslarini mustahkamlagan sarkarda.", "Alisher Navoiy buyuk shoir va davlat arbobi, adabiyotga katta hissa qoʻshgan.", "Husayn Boyqaro ilm-fan va madaniyatga homiylik qilgan, ammo astronom emas."], ["Samarqanddagi Registon majmuasi, Bibixonim masjidi, Shohi Zinda va Goʻri Amir kabi yodgorliklar qaysi davr meʼmorchiligining yuksak darajasini namoyon etadi?", "Temuriylar davri meʼmorchilik sanʼatining eng yorqin namunalaridir.", "Qoraxoniylar davri meʼmorchilik uslublari aks etgan bino turlari boʻlgan.", "Gʻaznaviylar davri uslubida qurilgan, harbiy qal'alar bilan xarakterlangan.", "Shayboniylar davri meʼmorchiligiga xos boʻlgan, soddaroq tuzilmalarga ega."], ["XV asr oxiri – XVI asr boshlarida Movarounnahrga kirib kelib, Temuriylar siyosiy hukmronligiga barham bergan va yangi sulolaga asos solgan oʻzbek qabilalari boshligʻi kim edi?", "Muhammad Shayboniyxon yangi siyosiy sulolaning asoschisi boʻlgan.", "Bobur Mirzo Hindistonda yangi imperiya barpo etgan, Movarounnahrda emas.", "Abdullaxon II Shayboniylar davlatini kuchaytirgan, ammo asoschi emas.", "Ulugʻbek oʻz davrida ilm-fan rivojiga eʼtibor bergan buyuk hukmdor edi."], ["Shayboniylar davri tarixini oʻrganishda aynan qaysi jihat juda muhim hisoblanadi?", "Temuriylar siyosiy tizimining oʻrnini toʻliq boʻsh joy egallamaganligi va tajribalarning davomiyligi.", "Moʻgʻul istilosidan keyin barcha eski an'analarning butunlay yoʻq qilinishi va yangilari.", "Arab xalifaligi va Vizantiya imperiyasining boshqaruv modellarini toʻliq qabul qilishi.", "Yevropadagi Uygʻonish davrining asosiy gʻoyalarini oʻzlashtirishi va joriy qilishi."], ["Oʻrta asrlardagi turkiy davlatchilikning eng uzoq yashagan va hududiy jihatdan eng yirik siyosiy tuzilmalaridan biri boʻlgan Usmoniylar davlatiga taxminan 1300-yillar atrofida Kichik Osiyoda asos solgan shaxs kim edi?", "Usmon I Usmoniylar imperiyasining asoschisi va ilk hukmdori boʻlgan.", "Orxon gʻozi imperiyani kengaytirgan va ilk muntazam armiyani tashkil etgan.", "Sulton Murod I Usmoniylar davlatining Bolqondagi mavqeini mustahkamlagan.", "Mehmed II Fotih Konstantinopolni zabt etgan, imperiyani qudratli qilgan."], ["Usmoniylar siyosiy tizimining muhim xususiyati shundaki, u Anadolu turkiy siyosiy an'analarini qaysi ikki tajriba bilan uygʻunlashtirgan edi?", "Vizantiya va islomiy boshqaruv tajribalari bilan oʻzaro uygʻunlashgan.", "Moʻgʻullar harbiy tizimi va Hindistonning qabila boshqaruvi prinsiplari.", "Qadimgi Rim huquqi va Xitoyning byurokratik boshqaruv modellari.", "Yevropa feodalizm tizimi va Qoraxoniylar davlat boshqaruvi anʼanalari."], ["Usmoniylar davlatining geografik joylashuvi uni Yevropa va Osiyo oʻrtasidagi savdo yoʻllarining muhim qismiga aylantirishi natijasida qaysi shahar siyosiy, iqtisodiy, diniy va madaniy markaz sifatida rivojlandi?", "Konstantinopol (Istanbul) muhim strategik va iqtisodiy markaz boʻlgan.", "Bagʻdod Abbosiylar xalifaligining poytaxti, keyinroq ham ilm markazi edi.", "Qohira Mamluklar davlatining markazi, Afrikaning eng yirik shaharlaridan.", "Damashq Islom olamining qadimiy shahri, Umaviylar xalifaligining poytaxti."], ["Oʻrta asrlar turkiy davlatchiligini oʻrganishda alohida sulolalar tarixi yigʻindisi sifatida emas, balki qanday jarayon sifatida koʻrib chiqish maqsadga muvofiq?", "Siyosiy institutlar, harbiy tashkilotchilik, iqtisodiy tizimlar va madaniy taraqqiyotning oʻzaro bogʻliq tarixiy jarayoni sifatida.", "Asosan harbiy yurishlar va imperiya kengayishining oddiy ketma-ketligi sifatida.", "Madaniy va diniy aloqalarning davlat siyosatidan ajratilgan alohida jarayoni tarzida.", "Faqat iqtisodiy omillar va savdo yoʻllarining rivojlanishiga qaratilgan oʻrganish sifatida."], ["Rossiya imperiyasining Turkistondagi siyosiy maqsadlaridan biri nima edi?", "janubiy chegaralarni mustahkamlash va strategik mavqeni kuchaytirishni maqsad qildi.", "Markaziy Osiyoda ilm-fan va madaniyatni rivojlantirishga ko'maklashishni niyat qildi.", "mahalliy davlatlarning ichki boshqaruvini to'liq saqlab qolishni ta'minlashni xohladi.", "boshqa Yevropa davlatlari bilan savdo yo'llarini to'liq yopishni amalga oshirdi."], ["Buxoro amirligi 1868-yildagi Rossiya-Buxoro urushidan soʻng qanday holatga tushdi?", "Rossiya imperiyasi tarkibida cheklangan ichki mustaqillikka ega protektoratga aylandi.", "To'liq mustaqilligini saqlab qoldi va xalqaro munosabatlarda teng huquqli subyekt bo'ldi.", "Rossiya imperiyasiga to'liq qo'shildi va Farg'ona viloyati tarkibiga kiritilgan edi.", "Britaniya imperiyasining mustamlakasiga aylandi va Rossiya ta'siridan to'liq ozod bo'ldi."], ["Jadidchilik harakatining dastlabki bosqichidagi asosiy e'tibori nimaga qaratilgan edi?", "Ta'limni isloh qilish, yangi usul maktablarini tashkil etish va savodxonlikni oshirishga.", "Mustaqil milliy davlatlar tashkil etish va imperiyalarga qarshi qurolli kurash olib borishga.", "Iqtisodiy tizimni to'liq isloh qilish va bozor iqtisodiyotiga tezkor o'tishni ta'minlashga.", "Boshqa Yevropa davlatlari bilan harbiy ittifoqlar tuzish va siyosiy hukmronlikka erishishga."], ["1924-yilgi milliy-hududiy chegaralanish Markaziy Osiyoning siyosiy xaritasini qanday oʻzgartirdi?", "Turkiston, Buxoro va Xorazm siyosiy tuzilmalari tugatilib, milliy respublikalar tashkil etildi.", "Mintaqada yagona va markazlashgan Boshqaruv kengashi tashkil etilib, avvalgi tuzilmalar saqlandi.", "Rossiya imperiyasining protektoratlari tizimi qayta tiklanib, mahalliy boshqaruv kuchaytirildi.", "Markaziy Osiyo davlatlari to'liq mustaqillikka erishib, xalqaro siyosatga to'liq kirishgan edi."], ["Sovet davrida turkiy xalqlarning siyosiy boshqaruvi qanday tizimga asoslangan edi?", "Kommunistik partiya, sovetlar va davlat ma'muriyati tizimiga asoslangan markazlashgan boshqaruv.", "To'liq demokratik saylovlar va ko'ppartiyaviylik tizimi orqali shakllangan mahalliy hukumatlar.", "An'anaviy mahalliy hukmdorlar va ulamolarning to'liq hokimiyatini tan oluvchi avtonom boshqaruv.", "Birlashgan Millatlar Tashkilotining faol ishtirokida mustaqil tashqi siyosat yurituvchi federatsiya."], ["Usmoniylar imperiyasining XIX asr oxiri – XX asr boshlaridagi asosiy muammolari nimadan iborat edi?", "Hududiy yo'qotishlar, milliy harakatlarning kuchayishi, moliyaviy qaramlik va Yevropa davlatlari bosimi.", "Ichki islohotlarning muvaffaqiyatli amalga oshirilishi va iqtisodiyotning tez sur'atlar bilan rivojlanishi.", "Boshqa imperiyalar bilan muvaffaqiyatli harbiy ittifoqlar tuzishi va siyosiy ta'sirini kengaytirishi.", "Oliy ta'lim tizimining to'liq modernizatsiyasi va jamiyatning savodxonlik darajasining keskin oshishi."], ["Qaysi yilgi voqea Turkiston Muxtoriyatining tashkil topishi bilan milliy-siyosiy o'zini o'zi boshqarish g'oyalarining namoyon bo'lishi edi?", "1917-yilgi Turkiston Muxtoriyatining tashkil topishi milliy uyg'onishga olib kelgan edi.", "1867-yilgi Turkiston general-gubernatorligining tuzilishi mahalliy xalqlarga huquq berdi.", "1920-yilgi Buxoro Xalq Sovet Respublikasining tashkil topishi to'liq mustaqillikni ta'minladi.", "1991-yilgi O'zbekistonning mustaqillikka erishishi qadimgi o'zini o'zi boshqarish tizimini tikladi."], ["O'zbekiston davlat mustaqilligini qaysi sanada e'lon qildi va Mustaqillik kuni qachon nishonlanadi?", "1991-yil 31-avgustda mustaqillik e'lon qilinib, 1-sentabr Mustaqillik kuni deb belgilandi.", "1924-yil 27-oktabrda Sovet Ittifoqi tarkibida mustaqil respublika tashkil topdi va shu kun nishonlanadi.", "1917-yil 16-dekabrda Turkiston Muxtoriyati e'lon qilinib, keyinchalik milliy bayramga aylangan edi.", "1991-yil 30-avgustda mustaqillik deklaratsiyasi qabul qilindi va 18-oktabr asosiy bayram bo'lib qoldi."], ["Rossiya imperiyasining Markaziy Osiyoga nisbatan iqtisodiy maqsadlari nimadan iborat edi?", "Xomashyo manbalarini nazorat qilish, paxta yetishtirishni kengaytirish va Rossiya sanoati uchun bozor yaratish.", "Mahalliy hunarmandchilikni rivojlantirish va mintaqaviy savdo yo'llarini mahalliy nazoratga berishni niyat qildi.", "Barcha ichki savdo cheklovlarini bekor qilish va qishloq xo'jaligini to'liq erkinlashtirishni ta'minladi.", "Yevropa davlatlari bilan savdo aloqalarini to'liq uzish va mintaqani izolyatsiya qilish siyosatini olib bordi."], ["Jadidchilikning siyosiy mazmuni kuchayishi bilan uning vakillari qanday masalalarni ko'tara boshladilar?", "Muxtoriyat, siyosiy vakillik, milliy boshqaruv va davlat islohoti kabi masalalarni ilgari surdilar.", "Faqatgina diniy ta'limni isloh qilish va an'anaviy maktablarning mavqeini tiklash haqida bahslashdilar.", "Rossiya imperiyasi bilan harbiy ittifoq tuzish va uning hududiy kengayishini qo'llab-quvvatladilar.", "Ma'rifatparvarlik harakatini to'liq to'xtatib, madaniy rivojlanishdan butunlay voz kechishga undadilar."], ["Qoʻqon xonligi XIX asr oxiriga kelib Rossiya imperiyasi tomonidan qanday holatga tushdi?", "Qoʻqon xonligi 1876-yilda to'liq tugatilib, uning hududlari Farg'ona viloyati tarkibiga kiritildi.", "Qoʻqon xonligi protektorat maqomini saqlab qoldi va cheklangan ichki mustaqillikka ega bo'lgan.", "Qoʻqon xonligi to'liq mustaqilligini tiklab, Rossiya ta'siridan butunlay ozod bo'lishga erishdi.", "Qoʻqon xonligi Buxoro amirligi bilan birlashib, yangi yirik davlat tuzilmasini yaratgan edi."], ["Sovet davridagi sanoatlashtirish jarayonida Turkiston hududida qanday oʻzgarishlar yuz berdi?", "Yangi zavodlar qurildi, temir yo'llar tarmog'i kengaydi, energetika va konchilik rivojlandi.", "Dehqonchilik to'liq erkinlashtirildi va xususiy mulkchilikka asoslangan qishloq xo'jaligi tizimi yaratildi.", "Faqatgina an'anaviy hunarmandchilik turlari qo'llab-quvvatlandi va zamonaviy sanoat to'liq cheklandi.", "Yevropa davlatlari bilan to'g'ridan-to'g'ri savdo aloqalari o'rnatildi va xorijiy sarmoyalar jalb etildi."], ["1917-yilgi Rossiya inqiloblari Turkistondagi siyosiy jarayonlarga qanday ta'sir koʻrsatdi?", "Jadidlar siyosiy maydonda faolroq ishtirok etib, mustaqillik g'oyalarini ilgari surdilar.", "Rossiya imperiyasining hukmronligi mustahkamlandi va Turkistonning ichki avtonomiyasi cheklandi.", "Mahalliy xonliklar va amirliklar to'liq mustaqillikka erishib, o'z suverenitetlarini tikladilar.", "Germaniya va Usmoniylar imperiyasining ta'siri kuchaydi, mintaqada yangi harbiy ittifoqlar tuzildi."], ["Turkiya Respublikasi qaysi imperiyaning tugashi natijasida tashkil topdi va qaysi yilda?", "Usmoniylar imperiyasi 1922-yilda tugatilib, uning o'rnida Turkiya Respublikasi tashkil topdi.", "Rossiya imperiyasi 1917-yilda parchalanib, Turkiya Respublikasining tashkil topishiga olib keldi.", "Britaniya imperiyasi 1947-yilda tugatilib, Turkiya Respublikasi mustaqil davlatga aylangan edi.", "Eron Safaviylar imperiyasi 1722-yilda tugatilib, uning o'rnida zamonaviy Turkiya davlati paydo bo'ldi."], ["Sovet davrida amalga oshirilgan \"kollektivlashtirish\" qanday salbiy oqibatlarga olib keldi?", "Qishloq xo'jaligini majburiy qayta tashkil etish, ocharchilik va aholining noroziligiga sabab bo'ldi.", "Qishloq xo'jaligi mahsulotlari eksportini keskin oshirib, mamlakat iqtisodiyotini mustahkamladi.", "Dehqonlarning erkinligini oshirib, ularga o'z yerlariga egalik qilish huquqini to'liq berdi.", "Mexanizatsiyaning joriy etilishi bilan qishloq xo'jaligi ishlab chiqarish samaradorligini keskin oshirdi."], ["Mustaqillikka erishgandan so'ng yangi turkiy davlatlar oldida turgan umumiy vazifalardan biri nima edi?", "Milliy davlat institutlarini yaratish, mustaqil tashqi siyosat va bozor iqtisodiyotiga oʻtish.", "So'nggi imperiyalarning hududlarini tiklash va eski siyosiy chegaralarni to'liq qayta tiklash.", "Birlashgan harbiy kuch tuzish va boshqa davlatlar bilan har qanday hamkorlikdan butunlay voz kechish.", "An'anaviy qishloq xo'jaligi tizimiga qaytish va zamonaviy sanoatni to'liq rivojlantirishdan chekinish."], ["Xiva xonligi Rossiya imperiyasining harbiy-siyosiy bosimi ostida qanday maqomga ega bo'ldi?", "1873-yilda Gandimiyon shartnomasi orqali Rossiya protektoratiga aylantirildi.", "1876-yilda to'liq tugatilib, uning hududlari Turkiston general-gubernatorligiga qo'shildi.", "To'liq mustaqilligini saqlab qoldi va Rossiya bilan teng huquqli harbiy ittifoq tuzdi.", "Britaniya imperiyasining ta'siri ostiga o'tib, Rossiyaning mintaqadagi mavqeini chekladi."], ["\"Jadid\" atamasi arab tilidan olingan \"usul-i jadid\" tushunchasi bilan bog'liq bo'lib, uning ma'nosi nima?", "\"Yangi usul\" degan ma'noni anglatadi va modernizatsiya g'oyalarini ifodalaydi.", "\"Eski urf-odatlar\" degan ma'noni beradi va an'anaviy qadriyatlarni himoya qilishni anglatadi.", "\"Harbiy kuch\" degan ma'noni bildiradi va qurolli kurashga chaqirishni nazarda tutadi.", "\"Diniy ilm\" degan ma'noni aks ettiradi va faqat islomiy bilimlarni targ'ib qilishni anglatadi."], ["SSSRda 1980-yillarning ikkinchi yarmida boshlangan \"qayta qurish\" (perestroika) va \"oshkoralik\" (glasnost) siyosatlari qanday oqibatlarga olib keldi?", "Iqtisodiy muammolar, markaz va respublikalar munosabatlarining murakkablashuvi va milliy ongning kuchayishi.", "SSSR iqtisodiyotining tez rivojlanishi va turli respublikalar o'rtasidagi munosabatlarning mustahkamlanishi.", "Demokratik islohotlarning to'liq muvaffaqiyati va sovet tizimining yanada barqarorlashuviga erishildi.", "Markaziy hokimiyatning mustahkamlanishi va barcha milliy respublikalarning avtonomiyasining cheklanishi."], ["XX asr turkiy xalqlar tarixini faqat siyosiy mustaqillik uchun kurash tarixi sifatida tushunish nimaga olib keladi?", "Tarixiy jarayonning murakkabligini kamaytiradi, chunki boshqa jarayonlar ham birga kechgan.", "Ushbu davrning barcha jihatlarini to'liq tushunishga imkon beradi va har bir jihatni chuqur tahlil qiladi.", "Faqatgina harbiy to'qnashuvlarga e'tibor qaratib, madaniy va ijtimoiy o'zgarishlarni to'liq aks ettiradi.", "Imperiyalarning to'liq hukmronligini mutlaq yaxshilik sifatida ko'rsatib, milliy harakatlarning ahamiyatini oshiradi."], ["“Turkiy davlatlar tarixi” fanining predmeti sifatida matnda qaysi jihatlar sanab oʻtilgan?", "Etnik va siyosiy shakllanish jarayonlari, davlatchilikning vujudga kelishi, siyosiy institutlar, harbiy-siyosiy tizim.", "Turkiy xalqlarning kelajakdagi kosmik sayohatlari va boshqa sayyoralarni tadqiq qilish rejalari haqidagi maʼlumotlar.", "Faqat zamonaviy turkiy davlatlarning iqtisodiy rivojlanishi va ularning global bozordagi oʻrni va mavqei.", "Qadimgi jamiyatlarning faqat maishiy turmush tarzi va odamlarning shaxsiy muammolarini izohlovchi jihatlari."], ["“Turkiy davlatlar tarixi” fanining asosiy maqsadi bakalavr talabalari uchun nimalarni oʻz ichiga oladi?", "Turkiy xalqlar va davlatlar taraqqiyoti haqida ilmiy, tizimli, xolis bilim berish va manbalarni tahlil qilish koʻnikmasini shakllantirish.", "Faqat turkiy xalqlarning harbiy gʻalabalari va imperiyalarining cheksiz qudrati haqidagi maʼlumotlarni yodlatish.", "Talabalarni faqat yozma manbalarni yodlab olishga majburlash va boshqa arxeologik dalillarni butunlay inkor etish.", "Turkiy davlatlar tarixini Gʻarbiy Yevropa davlatlari tarixi bilan har doim toʻliq oʻxshash deb taʼkidlashga intilish."], ["Qadimgi turkiy davlatchilikning shakllanishidagi birinchi muhim omil matnda qanday taʼriflangan?", "Turli qabila va urugʻlarning umumiy siyosiy manfaatlar asosida birlashuvi natijasida yirik tuzilmalarning paydo boʻlishi.", "Yirik savdo markazlarining tasodifiy paydo boʻlishi va rivojlanishi hamda ularning oʻzaro raqobatbardoshligi.", "Faqat ko'chmanchi turmush tarziga ega bo'lgan qabilalarning tashqi bosqinlari va ularning istilochilik siyosati.", "Chetdan olib kelingan harbiy texnologiyalarning tezkor tarqalishi natijasi va ularni oʻzlashtirishga qaratilgan harakatlar."], ["Dasht hududlaridagi siyosiy tuzilmalarda harbiy tashkilotchilikning ahamiyati matnda qanday izohlangan?", "Harbiy kuch nafaqat tashqi siyosat vositasi, balki siyosiy markazlashuvning ham muhim omillaridan biri boʻlgan.", "Faqat qoʻshni davlatlarga hujum qilish va ularning yerlarini bosib olish vositasi boʻlgan, ammo ichki ahamiyati boʻlmagan.", "Jamiyatda faqat harbiy elitaning mutlaq hokimiyatini taʼminlashga xizmat qilgan, ammo ijtimoiy rol oʻynamagan.", "Alohida harbiy guruhlarning faqat iqtisodiy mustaqilligini taʼminlashga yo'naltirilgan, siyosiy ta'siri kam boʻlgan."], ["Turk xoqonligi qachon va kimning boshchiligida tashkil topganligi matnda qayd etilgan?", "552-yilda Bumin xoqon boshchiligida Ashina sulolasi tomonidan Turk xoqonligi tashkil topgan.", "VIII asrda Bilga xoqon tomonidan Orxon-Yenisey bitiklari yaratilganidan soʻng, ularning hukmronligi mustahkamlangan.", "IV asrda Istemi yabgʻu boshchiligida Gʻarbiy Turk xoqonligi nomi ostida, uzoq davom etgan bosqinchiliklar bilan.", "VII asrda Tonyukuk tomonidan Buyuk Ipak yoʻli boʻylab savdo markazlarida yangi davlat tuzilmasi barpo etilgan."], ["Gʻarbiy Turk xoqonligi qaysi geografik hududlarni qamrab olganligi matnda koʻrsatilgan?", "Movarounnahr va Yettisuvning katta qismini oʻz ichiga olgan.", "Faqat Sharqiy Osiyodagi Gobi choʻli hududlarini oʻzlashtirgan va uning asosiy qismini tashkil etgan.", "Janubiy Sibirdagi Tayga oʻrmonlari va Shimoliy Yevropa tekisliklari boʻylab kengaygan imperiya.", "Volga daryosi havzasi va Kaspiy dengizining gʻarbiy sohillari, shuningdek Uralsortoqlarining markaziy qismlari."], ["Tarixiy tadqiqotlarda anaxronizm deganda nima tushunilishi matnda taʼriflangan?", "Tarixiy hodisa yoki tushunchani oʻz davriga mos kelmaydigan keyingi davr tushunchalari bilan izohlash.", "Oʻtmishdagi jarayonlarni faqat yozma manbalar asosida baholash va arxeologik dalillarni inkor etish usuli.", "Tarixiy voqealarni faqat ularning geografik joylashuvi va iqlimiy sharoitlari nuqtai nazaridan oʻrganish.", "Zamonaviy tushunchalarni tarixiy kontekstda mutlaqo qoʻllashdan voz kechish va ularni ilmiy asosda izohlamaslik."], ["Tarixiy tadqiqotlarda modernizatsiya muammosi nima bilan bogʻliq holda matnda tushuntirilgan?", "Oʻtmishdagi jarayonlarni bugungi taraqqiyot mezonlariga yaqinlashtirish yoki zamonaviy model asosida izohlash.", "Qadimgi davlatlarning mavjud boʻlgan savdo, diplomatiya tizimlarini butunlay inkor etish va ularni ahamiyatsiz deb bilish.", "Tarixiy terminologiyani doimiy ravishda yangi zamonaviy soʻzlar bilan almashtirish zarurati, eski atamalarni tashlab.", "Oʻtmishdagi jamiyatlarni faqat ularning iqtisodiy ahvoliga qarab baholash va ularning madaniy jihatlarini e'tibordan chetda qoldirish."], ["Nima sababdan “millat” tushunchasining zamonaviy siyosiy mazmunini VI-VIII asrlar jamiyatiga koʻchirish notoʻgʻri?", "Chunki “millat” tushunchasining zamonaviy siyosiy mazmuni oʻsha davrning ijtimoiy-siyosiy sharoitlariga mos kelmaydi.", "Oʻsha davrda faqat etnik guruhlar mavjud boʻlgan va milliy birlik tamoyili umuman mavjud boʻlmaganligi sababli.", "“Millat” atamasi faqat koʻchmanchi xalqlarga tegishli boʻlib, oʻtroq jamiyatlarga umuman taalluqli boʻlmagan.", "Bu tushuncha faqat Gʻarbiy Yevropada paydo boʻlgan va Sharqiy jamiyatlarga tarixan umuman aloqasi yoʻq edi."], ["Tarixiy haqiqatni aniqlashda tizimli yondashuv nimani anglatishi matnda izohlangan?", "Tarixiy voqeani boshqa jarayonlardan ajratib emas, balki oʻzaro bogʻlangan elementlar tizimi sifatida oʻrganish.", "Faqat bitta asosiy sababga eʼtibor berib, boshqa omillarni butunlay eʼtibordan chetda qoldirish va ularni inkor etish.", "Tarixiy hodisalarni faqat bir davlatning ichki siyosiy qarorlari doirasida tahlil qilish va tashqi taʼsirlarni inkor etish.", "Voqealarni xronologik tartibda sanab oʻtish bilan cheklanib qolish va ularni chuqur tahlil qilmasdan bayon etish."], ["Turkiy xalqlarning etnogenezi masalasida qanday yondashuv zarurligi matnda taʼkidlangan?", "Etnogenez masalasida yozma manbalar, arxeologiya, tarixiy antropologiya va tilshunoslik ma'lumotlarini qiyoslash.", "Faqat afsonaviy rivoyatlar va xalq ogʻzaki ijodi asosida ularning kelib chiqishini tushuntirishga harakat qilish.", "Bir qabilaning nomini asos qilib, barcha turkiy xalqlarning yagona kelib chiqishini ilmiy asosda dalillash.", "Turkiy xalqlar etnogenezini faqat ularning geografik joylashuvi bilan bogʻlab oʻrganish va boshqa omillarni inkor etish."], ["Markaziy Osiyoda koʻchmanchi va oʻtroq jamiyat munosabatlari qanday koʻrinishga ega boʻlgan?", "Koʻchmanchi chorvachilik, voha dehqonchiligi, shahar madaniyati va savdoning oʻzaro aloqada boʻlishi.", "Asosan koʻchmanchilarning oʻtroq aholi ustidan mutlaq siyosiy hukmronligi va iqtisodiy ekspluatatsiyasi.", "Faqat madaniy almashinuvlar bilan cheklangan, iqtisodiy aloqalarsiz mustaqil ravishda rivojlanish.", "Ikki jamiyat turining bir-biriga raqobatli munosabatlari va doimiy harbiy toʻqnashuvlari bilan ajralib turgan."], ["Turkiy davlatlar tarixi fanining tadqiqot obyekti nimalardan iborat ekanligi matnda ta'kidlanadi?", "Turkiy xalqlar yashagan hududlarda qadimdan shakllangan siyosiy tuzilmalar, davlatlar, jamiyatlar, ijtimoiy-iqtisodiy munosabatlar, madaniy jarayonlar majmuasi.", "Faqat bugungi mustaqil turkiy davlatlarning tashkil topishi va rivojlanishi hamda zamonaviy boshqaruv tizimlarining ta'siri va izlanishlari.", "Qadimgi turkiy davlatlarning harbiy yurishlari, ularning g'alabalari va mag'lubiyatlari, shuningdek, keyingi davrlardagi aloqalari.", "Asosan, Yevrosiyo materigining G'arbiy qismida yashagan qabilalarning ijtimoiy tuzilishlari va ularning madaniyati."], ["Fanning asosiy vazifalaridan biri bo'lgan \"Manbashunoslik koʻnikmasini shakllantirish\" talabalarga nimani oʻrgatadi?", "Talabalarni yozma, arxeologik, epigrafik, numizmatik va boshqa manbalar bilan ishlashga, ularni tahlil qilishga hamda tanqidiy baholashga oʻrgatadi.", "Asosan, qadimgi turkiy davlatlarning davlat boshqaruvi tizimlarini, xoqonliklar tuzilishini va ularning ichki siyosiy jarayonlarini tushuntirishga qaratilgan.", "Turkiy xalqlarning etnik kelib chiqishini, ularning turlicha qabilaviy tuzilishini hamda zamonaviy etnik guruhlar bilan bogʻliqliklarini tadqiq qilishga.", "Voqea va hodisalarni sabab-oqibat, xronologik va hududiy jihatdan chuqur tahlil qilish qobiliyatlarini rivojlantirishga yordam beradi."], ["Matnga koʻra, \"turkiy davlatlar\" tushunchasini faqat bugungi mustaqil turkiy davlatlar bilan cheklash nega notoʻgʻri hisoblanadi?", "Chunki tarixiy jihatdan bu tushuncha turli davrlarda mavjud boʻlgan turkiy siyosiy tuzilmalarni ham qamrab oladi, shuning uchun uning doirasi kengdir.", "Sababi, qadimgi turkiy davlatlarning hududi zamonaviy davlatlar chegaralaridan ancha tor boʻlganligi sababli, ularni solishtirish qiyin amaldir.", "Negaki, bugungi mustaqil davlatlarning aksariyati turkiy xalqlar tomonidan tashkil etilmagan, balki boshqa etnik guruhlarga tegishli hisoblanadi.", "Chunki faqat bugungi davlatlar bilan cheklash qadimgi turkiy madaniyat va iqtisodiyotining oʻziga xos jihatlarini e'tibordan chetda qoldiradi."], ["Turkiy tarixni oʻrganishda Orxon-Yenisey bitiklari qanday alohida ahamiyatga ega ekanligi ta'kidlangan?", "Ular turkiy siyosiy tafakkur, davlat boshqaruvi, harbiy siyosat va jamiyat haqida bevosita tarixiy ma'lumotlarni oʻz ichiga olgan epigrafik manbalardir.", "Bitiklar asosan qadimgi turkiy xalqlarning kundalik hayoti, marosimlari va diniy e'tiqodlari haqidagi badiiy tasvirlarni oʻzida mujassam etgan.", "Ushbu yozuvlar asosan Xitoy manbalaridan olingan ma'lumotlarni tasdiqlovchi yoki ularga zid boʻlgan boshqa tashqi kuzatuvchilarning fikrlarini ifodalaydi.", "Orxon-Yenisey bitiklari turkiy qabilalarning faqat etnik kelib chiqishini, ularning yashash hududlarini va qabila ittifoqlarining tuzilishini ochib beradi."], ["Turkiy tarixni toʻliq anglash uchun qaysi turdagi manbalar oʻzaro bogʻliq holda tahlil qilinishi kerakligi koʻrsatilgan?", "Yozma manbalar, arxeologik dalillar, epigrafik materiallar va numizmatik ma'lumotlar birgalikda, ya'ni tizimli ravishda tahlil qilinishi shart.", "Faqatgina yozma manbalar, xususan, Xitoy yilnomalari va fors-tojik asarlari, turkiy xalqlarning tarixiy oʻrnini toʻliq ifodalash uchun yetarli.", "Asosan arxeologik qazishmalar orqali topilgan madaniy yodgorliklar va tangalar, chunki ular hech qanday subyektiv fikrlarni oʻz ichiga olmaydi.", "Epigrafik bitiklar va turli davrlarga oid numizmatik materiallar, chunki ular davlat boshqaruvi tizimini va iqtisodiy aloqalarni aniq koʻrsatadi."], ["Qadimgi turkiy davlatchilikning shakllanishiga ta'sir etgan omillardan biri bo'lgan \"siyosiy birlashuv\" nimani anglatadi?", "Turli qabila va urugʻlarning umumiy siyosiy manfaatlar asosida birlashuvi, yirik siyosiy tuzilmalarning vujudga kelishiga zamin yaratgan jarayon.", "Faqatgina bir nechta yirik xoqonlarning harbiy yurishlari orqali boshqa qabilalarni majburlab birlashtirishi, ularning ittifoqlarini zoʻrlik bilan tuzishi.", "Asosan, turkiy xalqlarning qoʻshni davlatlar bilan boʻlgan diplomatik aloqalari, ularning savdo-sotiq munosabatlari va madaniy almashinuvlari rivojlanishi.", "Koʻchmanchi chorvachilikdan oʻtroq dehqonchilikka oʻtish natijasida aholi punktlarining shakllanishi va yangi qishloq xoʻjaligi texnologiyalarining tarqalishi."], ["Qadimgi turkiy davlatchilikning shakllanishida omil bo'lgan \"harbiy tashkilotchilik\" qanday rol oʻynagan?", "Otliq qoʻshin va harbiy tashkilotchilik dasht hududlaridagi siyosiy tuzilmalarda muhim oʻrin egallab, siyosiy markazlashuvning omili boʻlgan.", "Harbiy kuchlar faqatgina tashqi dushmanlardan himoyalanish uchun foydalanilgan, siyosiy birlashuv jarayonlariga hech qanday aloqasi boʻlmagan.", "Asosan, savdo yoʻllarini himoya qilish, karvonlarning xavfsizligini ta'minlash va boshqa xalqlardan olinadigan soliqlar tizimini joriy etishga qaratilgan.", "Harbiy tashkilotchilik asosan qabila ichidagi nizolarni hal qilish, shuningdek, boshqa turkiy urugʻlar oʻrtasidagi raqobatni bartaraf etish uchun xizmat qilgan."], ["\"Buyuk Ipak yoʻli\" omili qadimgi turkiy siyosiy tuzilmalarning shakllanishida qanday ahamiyatga ega edi?", "Turkiy siyosiy tuzilmalar Buyuk Ipak yoʻlining ayrim yoʻnalishlari ustidan nazorat qilish va xalqaro savdoda faol ishtirok etish imkoniyatiga ega boʻlganlar.", "Buyuk Ipak yoʻli faqatgina diplomatik aloqalarni rivojlantirishga xizmat qilgan, siyosiy yoki iqtisodiy jihatdan turkiy davlatlarga hech qanday ta'sir koʻrsatmagan.", "Bu yoʻl asosan diniy gʻoyalarning tarqalishi va turli madaniyatlar oʻrtasidagi almashinuv uchun xizmat qilgan, iqtisodiy manfaatlari cheklangan edi.", "Buyuk Ipak yoʻli turkiy qabilalar oʻrtasidagi ichki nizolarni kuchaytirgan, chunki har bir qabila savdo yoʻllarini toʻliq oʻz nazoratiga olishni xohlagan edi."], ["Turk xoqonligi qachon va kimning boshchiligida tashkil topganligi matnda keltirilgan?", "Turk xoqonligi 552-yilda Bumin xoqon boshchiligida tashkil topgan boʻlib, Markaziy Osiyo siyosatida muhim oʻrin egallagan.", "Bu davlat VI asr oxirlarida Istemi yabgʻu boshchiligida, Gʻarbiy yoʻnalishdagi harbiy yurishlar natijasida tuzilgan edi.", "Turk xoqonligi V asr oʻrtalarida Ashina sulolasi boshchiligida, ammo uning asoschisi noma'lum boʻlgan holda shakllangan edi.", "Turk xoqonligi VII asr boshlarida, turli qabilalar ittifoqi natijasida, ma'lum bir yetakchisiz, asta-sekin rivojlanib tashkil topgan."], ["\"Millat\" tushunchasining zamonaviy siyosiy mazmunini VI-VIII asrlar jamiyatiga bevosita koʻchirish nega notoʻgʻri hisoblanadi?", "Chunki \"millat\" tushunchasining tarixiy mazmuni va institut sifatidagi shakli turli davrlarda rivojlangan, shuning uchun ularni tenglashtirish anaxronizmga olib keladi.", "Sababi, VI-VIII asrlarda turkiy xalqlar hali yagona millat sifatida shakllanmagan, ular faqatgina qabilaviy yoki urugʻchilik asosida birlashgan edi.", "Negaki, \"millat\" atamasi asosan Gʻarbiy Yevropada yuzaga kelgan tushuncha boʻlib, turkiy jamiyatlarga umuman mos kelmaydi, shu sababli.", "Chunki oʻsha davrlarda \"millat\" soʻzi faqatgina siyosiy elitani, ya'ni boshqaruvchi qatlamni ifodalagan, oddiy xalqni esa umuman qamrab olmagan."], ["Bugungi tarixshunoslikda voqealarni \"vaqt + makon + siyosiy sharoit + iqtisodiy omil + ijtimoiy munosabat + madaniy muhit\" birligida oʻrganish nimani anglatadi?", "Bu \"tarixiy kontekst\" deb nomlanuvchi yangi yondashuv boʻlib, voqealarni ularning murakkab bogʻliqliklari asosida tahlil qilish muhimligini koʻrsatadi.", "Bu faqatgina bir davrdagi voqealarni alohida-alohida oʻrganishni, ya'ni har bir omilni mustaqil holda tahlil qilishni talab qiladi, bir-biriga bogʻlamasdan.", "Bu yondashuv tarixiy voqealarni faqatgina eng kuchli omil, masalan, iqtisodiy omil yoki siyosiy sharoit ta'siri bilan izohlashga, boshqalarini e'tiborsiz qoldirishga asoslanadi.", "Bu asosan tarixiy shaxslarning faoliyatini, ularning shaxsiy sifatlarini va ularning qarorlarini yuqorida sanab oʻtilgan omillarga bogʻliq holda oʻrganishga qaratilgan."], ["Tizimli yondashuvning asosiy bosqichlaridan birinchisi bo'lgan \"Voqeaning vaqtini aniqlash\" nimani bildiradi?", "Tarixiy hodisaning aynan qachon sodir boʻlganligini aniqlash, ya'ni uning xronologik oʻrnini belgilash ushbu bosqichning asosiy maqsadi hisoblanadi.", "Bu hodisaning kelajakda qanday oqibatlarga olib kelishini taxmin qilish, uning tarixiy jarayonlarga ta'sirini oldindan bashorat qilishni anglatadi.", "Bu tarixiy voqeaning qaysi hududda yuz berganligini, uning geografik joylashuvini aniqlash, bu bilan uning makonini belgilashga xizmat qiladi.", "Bu bosqichda hodisada ishtirok etgan barcha siyosiy kuchlarni, qabilalarni va sulolalarni aniqlash, ularning oʻrnini belgilashga e'tibor qaratiladi."], ["Turkiy xalqlarning etnogenezi masalasida matnda qanday yondashuv tavsiya etiladi?", "Turkiy xalqlarning shakllanishi uzoq davom etgan murakkab tarixiy jarayon boʻlib, uni bitta qabila yoki bitta tarixiy voqea bilan izohlash mumkin emasligi aytiladi.", "Asosan, turkiy xalqlarning etnogenezi bitta yirik qabilaning migratsiyasi va boshqa xalqlarni assimilyatsiya qilishi natijasida yuzaga kelganligi ta'kidlanadi.", "Turkiy xalqlarning etnik kelib chiqishini faqatgina arxeologik qazishmalar va ularning natijalarini tahlil qilish orqali toʻliq aniqlash mumkinligi qayd etiladi.", "Etnogenez masalasida tilshunoslik ma'lumotlari eng asosiy manba hisoblanib, yozma va boshqa manbalarning ahamiyati ikkinchi darajali ekanligi aytiladi."], ["Nima sababdan Turkiy davlatlar tarixini Xitoy, Eron, Vizantiya va Arab xalifaliklaridan ajratib oʻrganish mumkin emas?", "Chunki turkiy davlatlarning rivojlanishi xalqaro siyosiy va iqtisodiy jarayonlar bilan chambarchas bogʻliq boʻlgan, ular oʻzaro ta'sirda boʻlgan.", "Ushbu davlatlar turkiy hududlarga hech qanday ta'sir koʻrsatmagan, shuning uchun ularni birga oʻrganish keraksiz ma'lumotlarni keltirib chiqaradi.", "Faqatgina harbiy toʻqnashuvlar orqali bu sivilizatsiyalar oʻrtasida aloqalar boʻlgan, boshqa sohalarda esa ular butunlay mustaqil rivojlangan edilar.", "Bu sivilizatsiyalarning har biri oʻzining alohida rivojlanish yoʻliga ega boʻlgan, shuning uchun ularni birlashtirib oʻrganish tarixiy haqiqatni buzishga olib keladi."], ["Turkiy davlatlar tarixi fanining tadqiqot obyekti deganda matnda qaysi majmua tushuniladi?", "Turkiy xalqlar yashagan hududlarda shakllangan siyosiy tuzilmalar, davlatlar, jamiyatlar, ijtimoiy-iqtisodiy munosabatlar va madaniy jarayonlar bilan bogʻliq tarixiy hodisalar.", "Faqat bugungi mustaqil turkiy davlatlarning tashkil topishi va rivojlanish bosqichlari hamda ularning zamonaviy siyosiy tizimlari.", "Antik davrda yashagan barcha ko'chmanchi qabilalarning ijtimoiy tuzilishi, harbiy yurishlari va urugʻlar oʻrtasidagi munosabatlar.", "Yevropa materigidagi qadimiy tsivilizatsiyalarning turkiy xalqlar bilan savdo aloqalari va diplomatik munosabatlarining tahlili."], ["Turkiy davlatchilik tarixini o'rganishda quyidagi omillardan qaysi biri alohida ahamiyatga ega epigrafik manba sifatida e'tirof etiladi?", "Turkiy siyosiy muhitning oʻzida yaratilgan Orxon-Yenisey bitiklari siyosiy tafakkur, davlat boshqaruvi va harbiy tizim haqida.", "Uzoq sharq mamlakatlarida saqlanib qolgan yozma xitoy yilnomalari turkiy qabilalar haqidagi ma'lumotlarni berganligi uchun.", "Fors-tojik va arab mualliflarining Markaziy Osiyo hududidagi turkiy sulolalar va ularning davlatlari haqidagi tarixiy asarlari.", "Turkiy xalqlarga tegishli boʻlgan qabristonlar, turar joylari, qurol-aslahalar va kulolchilik buyumlaridan olingan dalillar."], ["Qadimgi turkiy davlatchilikning shakllanishidagi eng muhim tarixiy omillardan biri sifatida matnda nima ko'rsatilgan?", "Turli qabila va urugʻlarning umumiy siyosiy manfaatlar asosida birlashuvi, bu yirik siyosiy tuzilmalarning vujudga kelishiga zamin yaratgan.", "Yevropa va Osiyo oʻrtasidagi madaniy almashinuv, diniy g'oyalarning tarqalishi va yozuv tizimlarining rivojlanishi.", "Qoʻshni sivilizatsiyalar bilan harbiy toʻqnashuvlar natijasida yagona harbiy bloklarning tashkil topishi va ularning kuchayishi.", "Voha dehqonchiligi va shahar madaniyatining rivojlanishi, bu esa aholi turmush tarzini tubdan oʻzgartirganligi sababli."], ["Qadimgi turkiy davlatchilikning shakllanishiga ta'sir etuvchi ikkinchi muhim omil matnda qanday ta'riflangan?", "Dasht hududlarida otliq qoʻshin va harbiy tashkilotchilikning muhim o'rin egallashi, u siyosiy markazlashuv omillaridan biri boʻlgan.", "Diniy g'oyalarning keng tarqalishi va missionerlik faoliyatining kuchayishi, bu xalqlarni yagona gʻoya ostida birlashtirgan.", "Oʻtroq dehqonchilik iqtisodiyotining rivojlanishi va qishloq xoʻjaligi mahsulotlarining ortib borishi, bu bilan aholi sonining o'sishi.", "Buyuk Ipak yo'lining toʻliq nazoratini qoʻlga kiritish va barcha savdo operatsiyalarini davlat nazoratiga olish natijasi."], ["Qadimgi turkiy davlatchilikning shakllanishidagi to'rtinchi omil — Buyuk Ipak yo'li qanday rol oʻynagan?", "Turkiy siyosiy tuzilmalar Buyuk Ipak yo'lining ayrim yoʻnalishlari ustidan nazorat qilish va xalqaro savdoda ishtirok etish imkoniyatiga ega boʻlgan.", "Buyuk Ipak yo'li faqatgina qoʻshni davlatlar bilan madaniy almashinuvni ta'minlagan, iqtisodiy jihatdan unchalik ahamiyatli boʻlmagan.", "Bu yoʻl turkiy davlatlarni tashqi dunyodan butunlay ajratib turgan, ichki iqtisodiyotni rivojlantirishga qaratilgan siyosat yuritishga majbur qilgan.", "Faol harbiy yurishlar uchun qoʻshinlarni tashish yoʻli boʻlib xizmat qilgan, ammo savdo aloqalariga ta'siri juda kam boʻlgan."], ["Tarixiy tadqiqotlarda 'modernizatsiya' deganda ko'pincha nima tushuniladi?", "Tarixiy jamiyatlarni zamonaviy taraqqiyot modeli asosida izohlash yoki o'tmishdagi jarayonlarni bugungi taraqqiyot mezonlariga yaqinlashtirish.", "Qadimgi davr tushunchalarini zamonaviy siyosiy mazmun bilan toʻliq tenglashtirish va bu orqali tarixiy haqiqatni aniqlash.", "Tarixiy terminologiyani aynan oʻz davri kontekstida tushunish va keyingi davr tushunchalarini mexanik ravishda koʻchirmaslik talabi.", "Voqea va hodisalarni sabab-oqibat, xronologik va hududiy jihatdan tahlil qilish qobiliyatini rivojlantirish orqali tarixiy tafakkurni shakllantirish."], ["Turkiy davlatlar tarixini oʻrganishda tizimli yondashuv nimani nazarda tutadi?", "Tarixiy voqeani boshqa jarayonlardan ajratib emas, balki oʻzaro bogʻlangan elementlar tizimi sifatida oʻrganishni, turli omillarni birgalikda tahlil qilishni.", "Har bir tarixiy hodisani faqatgina uning siyosiy sabablari va oqibatlari nuqtai nazaridan yagona davlat yoki sulola faoliyati doirasida koʻrib chiqishni.", "Qadimgi jamiyatlardagi tushunchalarni zamonaviy modellar bilan toʻliq tenglashtirib, anaxronizm va modernizatsiyadan foydalanishni afzal bilishni.", "Faqat yozma manbalarga tayanish va arxeologik, epigrafik, numizmatik ma'lumotlarni e'tibordan chetda qoldirib, turkiy tarixni anglashni."], ["Turkiy davlatlar tarixini oʻrganishda tarixiy haqiqatni tiklash uchun tizimli yondashuvning asosiy bosqichlaridan biri qaysi?", "Voqeaning vaqtini, hududini aniqlash, subyektlarini, sabablarini tahlil qilish, jarayonni baholash va natijalarini aniqlash.", "Faqatgina hukmdor faoliyatini, davlatning tashkil topishini oʻrganish hamda uning harbiy yurishlarining asosiy sabablarini oydinlashtirish.", "Qadimgi davlatlarning zamonaviy davlatlarga qanchalik o'xshashligini aniqlash, ularning funksional tuzilmalarini solishtirish.", "Turkiy xalqlarning etnogenezini faqatgina bitta qabila yoki bitta tarixiy voqea bilan izohlashga harakat qilish va asoslash."], ["Markaziy Osiyoda koʻchmanchi chorvachilik, voha dehqonchiligi va shahar madaniyatining oʻzaro aloqalari qanday ahamiyatga ega boʻlgan?", "Bu aloqalar iqtisodiy va madaniy taraqqiyotga sezilarli ta'sir ko'rsatgan, turli ijtimoiy-iqtisodiy tuzilmalarning uygʻunlashuviga sabab bo'lgan.", "Bu har uchala madaniyat turlari oʻrtasida doimiy qarama-qarshiliklar yuzaga kelib, ularning rivojlanishiga salbiy ta'sir koʻrsatgan.", "Faqatgina ko'chmanchi chorvachilik iqtisodiy jihatdan ustunlikka ega boʻlib, voha va shahar madaniyatining rivojlanishini sekinlashtirgan.", "Ular orasidagi aloqalar asosan harbiy toʻqnashuvlar orqali amalga oshirilgan, iqtisodiy va madaniy almashinuvlar kam boʻlgan."], ["Qadimgi turkiy davlatchilikning shakllanishi qanday jarayonlarning natijasi boʻlgan?", "Uzoq davom etgan siyosiy, harbiy, iqtisodiy va ijtimoiy jarayonlarning murakkab natijasi hisoblanib, birgina omil bilan izohlab bo'lmaydi.", "Faqatgina buyuk hukmdorlarning shaxsiy faoliyati va harbiy yurishlari orqali yuzaga kelgan, boshqa omillar ahamiyatsiz boʻlgan.", "Faqatgina qoʻshni davlatlar bilan savdo aloqalarining rivojlanishi va madaniy almashinuvlar natijasida tezkorlik bilan vujudga kelgan.", "Birgina qabilaning kuchayishi va uning boshqa qabilalarni harbiy jihatdan magʻlub etishi natijasida sodir boʻlgan yagona hodisa."], ["Turkiy xalqlarning etnogenezi masalasida yozma manbalardan tashqari yana qaysi fanlarning ma'lumotlarini qiyoslash zarur?", "Arxeologiya, tarixiy antropologiya, tilshunoslik va boshqa fanlarning ma'lumotlarini qiyoslash orqali to'liqroq tasavvur hosil qilish.", "Faqatgina tilshunoslik ma'lumotlariga tayanish va turkiy tillarning rivojlanish bosqichlarini chuqur oʻrganish bilan cheklanish.", "Geografiya va ekologiya fanlarining ma'lumotlarini taqqoslash orqali qadimgi turkiy xalqlarning yashash sharoitlarini tahlil qilish.", "Sotsiologiya va psixologiya fanlarining ma'lumotlaridan foydalanish orqali qadimgi turkiy jamiyatlarning ijtimoiy psixologiyasini oʻrganish."], ["Qadimgi turkiy jamiyatga 'millat' tushunchasining zamonaviy siyosiy mazmunini bevosita koʻchirish nima uchun noto'g'ri hisoblanadi?", "Chunki 'millat' tushunchasining tarixiy mazmuni va institut sifatidagi shakli keyingi davrlarda, masalan, VI-VIII asrlardan so'ng rivojlangan.", "Qadimgi turkiy jamiyatda 'millat' tushunchasi mavjud boʻlgan, ammo u zamonaviy tushunchadan faqatgina etimologik jihatdan farq qilgan.", "Turkiy siyosiy birliklar faqatgina etnik birlik sifatida mavjud boʻlgan va hech qachon zamonaviy 'millat' darajasiga koʻtarila olmaganligi sababli.", "Hozirgi 'millat' tushunchasi oʻzida etnik, siyosiy va iqtisodiy jihatlarni mujassam etadi, bu esa qadimgi davrga toʻliq mos keladi."], ["Turkiy davlatlar tarixini Xitoy, Eron, Vizantiya va Arab xalifaligi kabi boshqa siyosiy markazlardan ajratib oʻrganish nima uchun mumkin emas?", "Chunki turkiy davlatlarning rivojlanishi xalqaro siyosiy va iqtisodiy jarayonlar bilan chambarchas bog'liq boʻlgan, ular oʻzaro ta'sirda rivojlangan.", "Faqatgina harbiy to'qnashuvlar doirasida aloqalar mavjud boʻlgan, madaniy va iqtisodiy almashinuvlar esa juda kam ahamiyatga ega boʻlgan.", "Turkiy davlatlar oʻz-oʻzini izolyatsiya qilish siyosatini olib borgan va faqat oʻz ichki resurslariga tayanib rivojlanganligi uchun.", "Bu davlatlar orasida hech qanday diplomatik munosabatlar mavjud boʻlmagan, faqatgina bevosita savdo aloqalarini hisobga olish kerak."], ["Talabada voqea va hodisalarni sabab-oqibat, xronologik va hududiy jihatdan tahlil qilish qobiliyatini rivojlantirish fanning qaysi vazifasiga kiradi?", "Tarixiy tafakkurni rivojlantirish vazifasiga kiradi, bu tarixiy jarayonlarni chuqur anglash uchun zaruriy ko'nikmadir.", "Manbashunoslik koʻnikmasini shakllantirish vazifasining bir qismi boʻlib, manbalar bilan ishlashning amaliy jihatini oʻrgatadi.", "Davlatchilik jarayonlarini tushuntirish vazifasiga tegishli boʻlib, siyosiy tuzilmalarning rivojlanish bosqichlarini oydinlashtiradi.", "Tarixiy bilim berish vazifasining asosiy yoʻnalishi boʻlib, turkiy xalqlarning siyosiy va madaniy taraqqiyoti haqida ma'lumot yetkazishdir."], ["Qoraxoniylar qaysi yilda Buxoroni egallashi bilan Movarounnahrdagi siyosiy vaziyatni tubdan oʻzgartirgan?", "999-yilda Qoraxoniylar Buxoroni egallashi bilan tubdan oʻzgartirgan.", "985-yilda Qoraxoniylar Samarqandni egallashi bilan tubdan oʻzgartirgan.", "1001-yilda Qoraxoniylar Xoʻjandni egallashi bilan tubdan oʻzgartirgan.", "1010-yilda Qoraxoniylar Toshkentni egallashi bilan tubdan oʻzgartirgan."], ["Qoraxoniylar davlat boshqaruvining asosiy muammolaridan biri sifatida matnda nima koʻrsatilgan?", "Markaziy hokimiyat bilan sulolaviy-hududiy hokimiyat oʻrtasidagi munosabatlar.", "Xoqonning mutlaq hokimiyati bilan amirlar oʻrtasidagi doimiy siyosiy kurashlar.", "Diniy ulamolar va harbiy qoʻmondonlar oʻrtasidagi taʼsir doirasini boʻlishish.", "Iqto tizimi tufayli mahalliy hokimlarning mustaqil siyosat olib borishi holatlari."], ["Qoraxoniylar davrida turkiy yozma madaniyatning muhim asarlaridan biri sifatida “Devonu lugʻotit turk”ni kim yaratgan?", "Mahmud Koshgʻariy tomonidan “Devonu lugʻotit turk” asari yaratilgan.", "Yusuf Xos Hojib tomonidan “Qutadgʻu bilig” asari yozib tugatilgan edi.", "Abu Rayhon Beruniyning “Qonuni Maʼsudiy” asari katta shuhrat qozongan.", "Firdavsiyning “Shohnoma”si turkiy muhitda mashhur boʻlgan kitob edi."], ["Yusuf Xos Hojibning “Qutadgʻu bilig” asarida qaysi mavzular yoritilgan?", "Davlat boshqaruvi, axloq, adolat, hukmdor va jamiyat munosabatlari yoritilgan.", "Turkiy tillar, qabilalar, geografiya va madaniyatni oʻrganish masalalari aks etgan.", "Harbiy yurishlar strategiyalari va soliq yigʻish tizimlari atroflicha tahlil etilgan.", "Iqtisodiy yuksalish sirlari, savdo yoʻllari va hunarmandchilik rivoji bayon etilgan."], ["Gʻaznaviylar davlati qaysi hukmdor davrida katta siyosiy va harbiy kuchga aylangan?", "Mahmud Gʻaznaviy davrida Gʻaznaviylar katta kuchga aylanganlar.", "Alptigin davrida Gʻaznaviylar davlati eng yuksalish davriga kirgan edi.", "Sobuktigin davrida Gʻaznaviylar davlati tashkil topib, kuchayishni boshlagan.", "Malikshoh davrida Gʻaznaviylar davlati eng qudratli imperiyaga aylangan."], ["Gʻaznaviylar saroyida faoliyat yuritgan eng mashhur ilmiy namoyandalardan biri kim boʻlgan?", "Abu Rayhon Beruniy Gʻaznaviylar saroyida muhim ilmiy faoliyat olib borgan.", "Mahmud Koshgʻariy turkiy tillar boʻyicha oʻz izlanishlarini davom ettirgan edi.", "Yusuf Xos Hojib falsafiy va siyosiy asarlari bilan mashhur boʻlgan olim edi.", "Nizomulmulk oʻzining davlat boshqaruvi boʻyicha asarlari bilan tanilgan edi."], ["Saljuqiylarning Xurosondagi mavqeini mustahkamlagan va ularning siyosiy yuksalishiga sabab boʻlgan jang qaysi yilda sodir boʻlgan?", "1040-yildagi Dandanakon jangi Saljuqiylarning mavqeini mustahkamlagan.", "1025-yildagi Bagʻdod jangi Saljuqiylarning markaziy hokimiyatini mustahkamlagan.", "1071-yildagi Manzikert jangi Saljuqiylarning Anadoludagi taʼsirini kuchaytirgan.", "1055-yildagi Isfahon jangi Saljuqiylarning poytaxtini belgilab bergan edi."], ["Saljuqiylar tarixida davlat boshqaruvi va siyosiy nazariya masalalarini \"Siyosatnoma\" asarida bayon qilgan shaxs kim?", "Nizomulmulk Saljuqiylar davlatida \"Siyosatnoma\" asarini yozgan edi.", "Alp Arslon davlatni boshqarishda \"Siyosatnoma\"ga tayangan hukmdor edi.", "Malikshoh \"Siyosatnoma\"dagi gʻoyalarni amalda tatbiq etgan hukmdor boʻlgan.", "Sanjar davrida \"Siyosatnoma\" asari keng tarqalib, qadrlangan kitob edi."], ["Saljuqiylar davridagi iqto tizimining asosiy tamoyili qanday edi?", "Iqtodorlar ma'lum hududdan daromad olish evaziga harbiy xizmatni bajarishi.", "Hukmdorlarning shaxsiy mulkini bevosita davlatga xizmat qilish uchun berishi.", "Dehqonlarning oʻz yerlariga egalik huquqi evaziga soliq toʻlash majburiyati.", "Maʼmuriy hududlarni sulola vakillariga boʻlib berish va ulardan yordam olish."], ["Saljuqiylar davrida ilm-fan va ta'limning muhim markazlariga aylangan madrasalar tizimi qanday nomlangan?", "Nizomiya madrasalari Saljuqiylar davrining asosiy ilm-fan maskani edi.", "Sultoniya madrasalari hukmdorlar homiyligida rivojlangan taʼlim dargohi edi.", "Buyuk Saljuq madrasalari davlatning eng muhim taʼlim muassasalari boʻlgan.", "Xoqoniya madrasalari turkiy bilimlar rivojiga katta hissa qoʻshgan maskan edi."], ["Xorazmshohlar davlatining hududini sezilarli darajada kengaytirgan hukmdorlar kimlar edi?", "Alauddin Takash va Muhammad Xorazmshoh davrida davlat hududi kengaygan.", "Anushtegin va Qutbuddin Muhammad davrida davlat hududi kengaygan edi.", "El Arslon va Sultonshoh davrida Xorazmshohlar qudrati mustahkamlangan edi.", "Tekesh va Jaloliddin Manguberdi davrida davlat gullab-yashnagan edi."], ["Chigʻatoy ulusi tarixini tushuntiruvchi va turkiy hamda islomiy muhitning kuchayishi bilan bogʻliq murakkab tarixiy-madaniy jarayon qanday atalgan?", "Bu jarayon \"chigʻatoylashuv\" deb nomlangan muhim tarixiy hodisa edi.", "Bu jarayon \"temuriylashuv\" deb atalgan, chuqur madaniy oʻzgarishlarni anglatgan.", "Bu jarayon \"islomlashuv\" deb atalib, diniy taʼsirning ustuvorligini bildirgan.", "Bu jarayon \"moʻgʻullashuv\" deb nomlanib, siyosiy hukmronlikni ifodalagan edi."], ["Amir Temur Movarounnahrda hokimiyatni qaysi yilda qoʻlga kiritib, yangi siyosiy markazga asos solgan?", "Amir Temur 1370-yilda Movarounnahrda hokimiyatni qoʻlga kiritgan edi.", "Amir Temur 1360-yilda oʻz hukmronligini Samarqandda boshlagan edi.", "Amir Temur 1380-yilda Xorazmda hokimiyatni mustahkamlab olgan edi.", "Amir Temur 1390-yilda Chingiziy anʼanalarni toʻliq tiklagan hukmdor edi."], ["Temuriylar davrida Samarqandning ilm-fan markaziga aylanishiga ayniqsa kimning faoliyati katta hissa qoʻshgan?", "Mirzo Ulugʻbekning astronomiya va matematika sohasidagi faoliyati muhimdir.", "Alisher Navoiyning adabiy merosi madaniy yuksalishda hal qiluvchi rol oʻynagan.", "Abdurahmon Jomiyning sheʼriy asarlari butun mintaqada keng tarqalgan edi.", "Boburning \"Boburnoma\" asari tarixshunoslikka yangi yoʻnalish ochgan edi."], ["UNESCO ma'lumotlariga koʻra, Temuriylar davridagi qaysi me'moriy inshootlar mintaqa islom me'morchiligi rivojiga ta'sir ko'rsatgan?", "Registon majmuasi, Bibixonim masjidi, Shohi Zinda kabi yodgorliklar taʼsir koʻrsatgan.", "Ahmad Yassaviy majmuasi, Koʻk Gumbaz masjidi, Islom Xoʻja minorasi taʼsir koʻrsatgan.", "Somoniy maqbarasi, Kalon minorasi, Poi Kalon majmuasi kabi inshootlar taʼsir koʻrsatgan.", "Oʻqchi madrasasi, Mir Arab madrasasi, Nodir Devonbegi madrasasi kabi inshootlar taʼsir koʻrsatgan."], ["Muhammad Shayboniyxon boshchiligidagi oʻzbek qabilalari qaysi davlat hukmronligiga barham bergan?", "Muhammad Shayboniyxon Temuriylar siyosiy hukmronligiga barham bergan.", "Muhammad Shayboniyxon Qoraxoniylar davlatiga yakun yasagan edi.", "Muhammad Shayboniyxon Saljuqiylar davlatini zabt etgan edi Markaziy Osiyoda.", "Muhammad Shayboniyxon Xorazmshohlar davlatining taʼsirini yoʻqqa chiqargan edi."], ["Usmoniylar davlatiga taxminan qaysi yillar atrofida va qaysi shaxs tomonidan asos solingan?", "Usmon I tomonidan taxminan 1300-yillar atrofida asos solingan edi.", "Usmon II tomonidan taxminan 1400-yillar atrofida Kichik Osiyoda asos solingan.", "Orxan Gʻozi tomonidan taxminan 1250-yillar atrofida davlat shakllangan edi.", "Sulaymon Qonuniy tomonidan taxminan 1520-yillar atrofida imperiya mustahkamlangan."], ["Usmoniylar davlat boshqaruvining markazida qaysi hukmdor unvoni turgan?", "Usmoniylar siyosiy tizimining markazida oliy hukmdor sifatida sulton turgan.", "Usmoniylar siyosiy tizimining markazida harbiy rahbar sifatida bek turgan.", "Usmoniylar siyosiy tizimining markazida maʼmuriy boshqaruvchi sifatida vazir turgan.", "Usmoniylar siyosiy tizimining markazida diniy arbob sifatida shayxulislom turgan."], ["Oʻrta asrlardagi turkiy davlatlar iqtisodiyotini tushuntiruvchi uch asosiy tizim nimalardan iborat edi?", "Ular koʻchmanchi chorvachilik, oʻtroq dehqonchilik, shahar hunarmandchiligi va savdo tizimlari edi.", "Ular yerga egalik qilish, harbiy xizmat majburiyati va soliq yigʻish tizimlaridan iborat edi.", "Ular qabilalar ittifoqi, markaziy byurokratiya va diniy institutlar tizimlaridan iborat edi.", "Ular sugʻorish tizimi, savdo yoʻllari nazorati va qul mehnati foydalanishidan iborat edi."], ["Mavzu boʻyicha taqdim etilgan materialga koʻra, XX asr turkiy xalqlar tarixini qaysi jarayonlar xarakterlaydi?", "Keskin siyosiy oʻzgarishlar, imperiyalarning parchalanishi va milliy davlatlarning shakllanishi.", "Barqaror siyosiy rivojlanish, imperiyalarning kuchayishi va madaniy uygʻonishning doimiy jarayonlari.", "Faqat iqtisodiy islohotlar, imperiyalarning kengayishi va hududiy chegaralarning oʻzgarishlari.", "Tashqi ta'sirlarsiz, faqat ichki siyosiy qarorlar va davlatlararo ittifoqlarning mustahkamlanishi."], ["Usmoniylar imperiyasining XIX asr oxiri – XX asr boshlaridagi asosiy muammolariga qaysilar kiradi?", "Hududiy yo'qotishlar, milliy harakatlarning kuchayishi va moliyaviy qaramlik.", "Barqaror siyosiy tizim, iqtisodiy oʻsish va Yevropa davlatlari bilan mustahkam ittifoqlar.", "Ichki tinchlik, markazlashgan boshqaruv va harbiy qudratning doimiy oʻsishi.", "Ta'lim tizimining rivojlanishi, ijtimoiy adolatning mustahkamlanishi va ilm-fan yutuqlari."], ["Qaysi yilda Qoʻqon xonligi Rossiya imperiyasi tomonidan toʻliq tugatilib, uning hududlari Fargʻona viloyati tarkibiga kiritilgan?", "1876-yilda Qoʻqon xonligi tugatilib, Fargʻona viloyatiga qoʻshib yuborilgan edi.", "1868-yilda Buxoro amirligi Rossiya protektoratiga aylantirilgandan soʻng.", "1873-yilda Xiva xonligi Rossiya imperiyasiga boʻysundirilganidan keyin.", "1917-yilda Turkiston Muxtoriyati tashkil topishi bilan uning hududlarida."], ["\"Jadid\" atamasi arabchadan olingan boʻlib, dastlab qaysi tushuncha bilan bogʻliq edi?", "\"Usul-i jadid\" – \"yangi usul\" tushunchasi bilan bogʻliq boʻlgan harakat.", "\"Milliy mustaqillik\" – mustaqil davlat qurish gʻoyasini ifodalash uchun.", "\"Siyosiy inqilob\" – mavjud tizimni agʻdarishga qaratilgan harakat.", "\"Iqtisodiy modernizatsiya\" – sanoatni rivojlantirish dasturlarini anglatgan."], ["Jadidlarning dastlabki maqsadi ta'lim sohasida nimalarga qaratilgan edi?", "Yangi usul maktablarini tashkil etish, savodxonlikni oshirish va zamonaviy fanlarni oʻqitish.", "Faqat diniy ta'limni chuqurlashtirish va an'anaviy madrasalarni mustahkamlash.", "Siyosiy hokimiyatni egallash va milliy davlatni shakllantirish uchun kadrlar tayyorlash.", "Rossiya imperiyasining ta'lim tizimini toʻliq qabul qilish va uni keng yoyish."], ["Keyinchalik jadidlarning ayrim vakillari siyosiy sohada qanday masalalarni koʻtara boshladilar?", "Muxtoriyat, siyosiy vakillik, milliy boshqaruv va davlat islohoti kabi masalalar.", "Faqat madaniy merosni saqlash va ta'lim sohasidagi islohotlarni davom ettirish.", "Rossiya imperiyasiga sodiqlikni ta'minlash va imperiya doirasida avtonomiyaga erishish.", "Eski boshqaruv usullarini tiklash va an'anaviy institutlarning rolini kuchaytirish."], ["1917-yilda Turkiston Muxtoriyatining tashkil topishi qaysi gʻoyalarning namoyon boʻlishi edi?", "Milliy-siyosiy oʻzini oʻzi boshqarish gʻoyalarining namoyon boʻlishi edi.", "Bolsheviklar hukumati gʻoyalarini qabul qilish va ularni mintaqada tatbiq etish.", "Rossiya imperiyasi ichida mustahkamlanish va uning siyosatiga qoʻshilish gʻoyalari.", "Usmoniylar imperiyasining madaniy ta'sirini kuchaytirish va umumiy turkiy birlik."], ["1920-yilda Buxoro amirligi va Xiva xonligi tugatilganidan soʻng ularning oʻrnida qaysi davlat tuzilmalari tashkil topdi?", "Buxoro Xalq Sovet Respublikasi va Xorazm Xalq Sovet Respublikasi tashkil etildi.", "Ular Turkiston Avtonom Sovet Sotsialistik Respublikasi tarkibiga kiritilgan edi.", "Fargʻona viloyati va Samarqand viloyati Rossiya tarkibida yangidan mustahkamlandi.", "Markaziy Osiyo Respublika Ittifoqi deb atalgan yangi unitar davlat barpo etildi."], ["1924-yilgi milliy-hududiy chegaralanish natijasida Markaziy Osiyoning siyosiy xaritasida qanday oʻzgarishlar yuz berdi?", "Turkiston, Buxoro va Xorazm tuzilmalari tugatilib, milliy nomli sovet respublikalari shakllantirildi.", "Mahalliy xonliklar qayta tiklanib, oʻz mustaqil davlatlarini e'lon qilishga muvaffaq boʻldi.", "Markaziy Osiyo hududlari yagona, markazlashgan Turkiston Respublikasiga birlashtirildi.", "Rossiya imperiyasining eski ma'muriy boʻlinishlari oʻzgarishsiz qolib, mustahkamlandi."], ["Sovet davrida turkiy xalqlarning siyosiy boshqaruvi tizimi qaysi tamoyillarga asoslangan edi?", "Kommunistik partiya, sovetlar va davlat ma'muriyati tizimiga asoslangan edi.", "Mahalliy xalq kengashlari, diniy rahbarlar va an'anaviy qonunlar hukmron edi.", "Mustaqil parlamentarizm, prezidentlik boshqaruvi va erkin saylovlar tamoyillari.", "Usmoniylar imperiyasining islohotlari va jadidchilik gʻoyalarining ta'siriga tayanar edi."], ["Qozogʻiston Respublikasi qachon davlat mustaqilligini e'lon qildi va Markaziy Osiyodagi oʻrni qanday edi?", "Qozogʻiston 1991-yil 16-dekabrda mustaqilligini e'lon qildi, hududi jihatidan eng katta davlat hisoblanadi.", "Qozogʻiston 1991-yil 31-avgustda mustaqilligini e'lon qildi, mintaqadagi ikkinchi yirik davlat edi.", "Qozogʻiston 1990-yil 25-oktabrda suverenitet deklaratsiyasini qabul qildi, lekin rasman keyin mustaqil boʻldi.", "Qozogʻiston 1991-yil 27-oktabrda mustaqilligini e'lon qildi, neft va gaz resurslariga boy mamlakat sifatida tanildi."], ["Yangi mustaqil turkiy davlatlar oldida mustaqillikdan keyingi bosqichda qanday umumiy vazifalar paydo boʻldi?", "Milliy davlat institutlarini yaratish, mustaqil tashqi siyosat yuritish va bozor iqtisodiyotiga oʻtish.", "Sovet davridagi siyosiy va iqtisodiy tiziml
