berilishi tufayli.", "Madaniy meros obyektlarining himoya qilinishi hamda ilmiy tadqiqotlarning ragʻbatlantirilishi natijasida.", "Chegaralarning oʻzgarishsiz qolishi va davlatlararo savdo munosabatlarining rivojlanishi sababli."], ["Vashington tizimining asosiy maqsadlari dengiz qurollanishini cheklash va Tinch okean mintaqasida barqarorlikni ta'minlash edi. Bu jarayon qachon va qaysi konferensiya asosida shakllangan?", "1921–1922 yillarda oʻtkazilgan Vashington konferensiyasi qarorlari asosida shakllangan.", "1920 yilgi Jeneva sammitining yakuniy natijalari boʻyicha qabul qilingan kelishuvlar bilan.", "1923 yilgi Lozanna konvensiyasining shartlari boʻyicha amalga oshirilgan chora-tadbirlar bilan.", "1919 yilgi Parij Tinchlik konferensiyasida ilgari surilgan gʻoyalar doirasida taʼsis etilgan."], ["Vashington konferensiyasida dengiz flotlari sonini va tonnajini cheklashga kelishib olgan asosiy ishtirokchi davlatlar qaysilar edi?", "AQSh, Buyuk Britaniya, Yaponiya, Fransiya va Italiya davlatlari faol ishtirok etishgan.", "Germaniya, Rossiya, Avstriya-Vengriya va Usmonli imperiyasi davlatlari tashrif buyurishgan.", "Xitoy, Hindiston, Kanada va Avstraliya vakillari asosiy muzokaralarda qatnashishgan.", "Shvetsiya, Shveytsariya, Niderlandiya va Belgiya kabi neytral davlatlar ham qatnashgan."], ["Birinchi jahon urushidan soʻng, butunlay parchalanib, oʻrniga yangi mustaqil davlatlar paydo boʻlgan imperiyalar qaysilar edi?", "Avstriya-Vengriya va Usmonli imperiyalari toʻliq parchalanishga uchragan edi.", "Germaniya imperiyasi va Rossiya imperiyasi sezilarli hududiy oʻzgarishlarga duch kelgan edi.", "Buyuk Britaniya imperiyasi va Fransiya mustamlakachilik tizimlari kuchsizlangan edi.", "Yaponiya imperiyasi va Italiya Qirolligi oʻz hududlarini sezilarli kengaytirgan edi."], ["Versal shartnomasi doirasida Germaniyaga qilingan hududiy oʻzgarishlar nimadan iborat edi?", "Elzas-Lotaringiya Fransiyaga qaytarildi, Polsha mustaqilligi tiklandi va ayrim yerlar unga berildi.", "Shlezvig-Golshteyn Daniyaga oʻtdi, Sharqiy Prussiya Rossiya nazoratiga berildi.", "Bavariya mustaqil davlatga aylandi, Reynlandiya esa Fransiya tarkibiga kiritildi.", "Germaniya barcha dengiz portlaridan mahrum etildi va savdo yoʻllari yopib qoʻyildi."], ["Millatlar Ligasi oʻz faoliyati davomida qaysi sohalarda muayyan muvaffaqiyatlarga erishgan edi?", "Xalqaro mehnat tashkilotini tuzishda, qochqinlar muammosini hal qilishda va ayrim hududiy nizolarni muzokara qilishda.", "Global iqtisodiy inqirozlarni oldini olishda, yirik davlatlar oʻrtasidagi harbiy ittifoqlarni taqiqlashda.", "Terrorizmga qarshi kurashda, madaniy merosni himoya qilishda va ilmiy tadqiqotlar oʻtkazishda.", "Xalqaro sport musobaqalarini tashkil etishda, atrof-muhitni muhofaza qilish dasturlarini amalga oshirishda."], ["Millatlar Ligasining asosiy vazifasi – urushlarning oldini olishda samarasiz boʻlib chiqishiga qaysi omillar asosiy sabab boʻlgan edi?", "AQShning Ligaga qoʻshilmasligi va agressiv davlatlarga qarshi choralar koʻra olmasligi, passiv siyosatlar.", "Harbiy texnologiyalarning tez rivojlanishi hamda aʼzo davlatlar oʻrtasidagi oʻzaro tushunmovchiliklar.", "Global iqtisodiy turgʻunlikning kuchayishi va madaniy diplomatiya imkoniyatlarining cheklanishi.", "Xalqaro huquq normalarining eskirishi hamda tashkilot byudjetining yetarli darajada moliyalanmasligi."], ["Buyuk Britaniya va Fransiya tomonidan Germaniyaga nisbatan olib borilgan \"tinchlantirish siyosati\" qanday oqibatlarga olib keldi?", "Gitlerning yanada jasurlashishiga sabab boʻldi va uning agressiv siyosatini kuchaytirdi.", "Germaniyaning iqtisodiyoti tez tiklanishiga yordam berdi va harbiy qudratini pasaytirdi.", "Xalqaro hamjamiyatda barqarorlikni taʼminlashga xizmat qildi va yangi nizolarni bartaraf etdi.", "SSSR va AQSh oʻrtasidagi munosabatlarning yaxshilanishiga zamin yaratdi va hamkorlikni oshirdi."], ["Vashington tizimining inqiroziga olib kelgan asosiy omillardan biri sifatida matnda qaysi hodisa keltirilgan?", "Yaponiya Manjuriyani bosib olishi va Xitoyda ekspansiya siyosatini boshlashi tizimni buzdi.", "AQSh va Buyuk Britaniya oʻrtasida harbiy-texnik hamkorlikning keskin kamayishi.", "Germaniyaning harbiy kuchini sezilarli darajada pasaytirishi va boshqa davlatlar bilan ittifoq tuzmasligi.", "Xalqaro savdo hajmining keskin oshishi va Jahon Bankining moliyaviy yordam dasturlari."], ["Germaniya iqtisodiyotini izdan chiqargan va siyosiy beqarorlikni kuchaytirgan \"Versal qatlomi\" deb atalgan holat nima edi?", "Urush tovon toʻlovlari va hududiy yoʻqotishlar Germaniya iqtisodiyotiga ogʻir yuk boʻlishi.", "Yangi mustaqil davlatlarning iqtisodiy jihatdan rivojlanishi va mintaqaviy raqobatning kuchayishi.", "Sanoat ishlab chiqarishining keskin oʻsishi va ichki siyosiy barqarorlikning toʻliq taʼminlanishi.", "Xalqaro investitsiyalarning Germaniyaga keng miqyosda kirib kelishi va yangi bozorlarning ochilishi."], ["Birinchi jahon urushi yakunida Avstriya-Vengriya imperiyasi parchalanib, Sharqiy va Markaziy Yevropada qanday yangi siyosiy birliklar shakllangan edi?", "Chexoslovakiya va Yugoslaviya kabi mustaqil davlatlar paydo boʻlgan, Polsha ham tiklangan edi.", "Sobiq Usmonli imperiyasi hududida yangi arab davlatlari tuzilgan, jumladan Iroq va Suriya.", "Boltiqboʻyi davlatlari (Estoniya, Latviya, Litva) mustaqillikka erishgan va Finlyandiya ham mustaqil boʻlgan.", "Germaniya Federativ Respublikasi va Polsha Xalq Respublikasi kabi yirik davlatlar barpo etilgan."], ["Rossiya Birinchi jahon urushi oldidan ham, keyin ham inqilob va fuqarolar urushi tufayli qanday hududiy yoʻqotishlarga duch kelgan edi?", "Boltiqboʻyi davlatlari (Estoniya, Latviya, Litva) va Finlyandiya mustaqillikka erishgan edi.", "Qrim yarimoroli va Kavkazorti hududlari butunlay boshqa davlatlar nazoratiga oʻtgan edi.", "Sibirning sharqiy qismlari Yaponiya tomonidan bosib olingan va Sharqiy Yevropa hududlari yoʻqotilgan edi.", "Ural mintaqasi va Qozogʻiston Respublikasi hududlari mustaqillikka erishib, Rossiya tarkibidan chiqqan edi."], ["Usmonli imperiyasining Birinchi jahon urushidan keyingi hududiy yoʻqotishlari natijasida qanday siyosiy oʻzgarishlar yuz bergan edi?", "Turkiya mustaqil davlat sifatida qoldi, ammo arab mamlakatlari Britaniya va Fransiya mandati ostiga oʻtdi.", "Armaniston va Gurjiston kabi davlatlar butunlay Usmonli imperiyasi tarkibida qolib, avtonomiya huquqini saqlagan.", "Gretsiya va Bolgariya Usmonli imperiyasining asosiy hududlarini egallab, yangi yirik imperiyalar tashkil etgan.", "Falastin va Iroq kabi hududlar toʻliq mustaqillikka erishib, oʻz hududlarida yagona islomiy davlat yaratgan."], ["Versal tizimining inqirozi va Ikkinchi jahon urushining boshlanishiga olib kelgan muhim sabablar qatoriga qaysilar kiradi?", "Germaniya, Italiya, Yaponiyaning agressiv siyosati, Millatlar Ligasining kuchsizligi va iqtisodiy inqirozlar.", "Davlatlararo savdo aloqalarining keskin rivojlanishi, iqtisodiy oʻsishning barqarorlashishi.", "Xalqaro tashkilotlarning samarali faoliyati va davlatlar oʻrtasidagi harbiy ittifoqlarning mustahkamlanishi.", "Koloniyalarning toʻliq mustaqillikka erishishi va global miqyosda demokratik jarayonlarning kengayishi."], ["1929 yilgi Buyuk Depressiya qanday qilib xalqaro muvozanatni buzdi va siyosiy barqarorlikka salbiy ta'sir ko'rsatdi?", "Iqtisodiy inqiroz totalitar rejimlar kuchayishiga turtki boʻldi va agressiv siyosatlarni ragʻbatlantirdi.", "Xalqaro savdo munosabatlarini mustahkamladi va davlatlararo moliyaviy yordam dasturlarini kengaytirdi.", "Global miqyosda demokratik boshqaruv shakllarini qoʻllab-quvvatladi va ijtimoiy tenglikni oshirdi.", "Harbiy xarajatlarning keskin qisqarishiga olib keldi va xalqaro tinchlikni mustahkamlashga yordam berdi."], ["Millatlar Ligasi qachon oʻz faoliyatini boshlagan va uning zaifligiga qaysi muhim davlatning ishtirok etmaganligi sabab boʻlgan edi?", "1920 yilda faoliyatini boshlagan va AQShning ishtirok etmasligi uni sezilarli darajada zaiflashtirgan.", "1919 yilda tashkil topgan va Germaniyaning boshida aʼzolikka qabul qilinmagani unga salbiy taʼsir koʻrsatgan.", "1922 yilda faoliyatga kirishgan va Rossiyaning fuqarolar urushi sababli ishtirok eta olmagani uni kuchsizlantirgan.", "1925 yilda ishga tushgan va Yaponiyaning Osiyodagi tajovuzkor siyosati sababli tashkilot zaiflashgan."], ["Ikkinchi jahon urushining boshlanishiga zamin yaratgan omillar qatorida Versal va Vashington tizimlarining umumiy bahosi qanday edi?", "Ikkala tizim ham oʻz vazifalarini toʻliq bajara olmadi va xalqaro tartibni sezilarli darajada zaiflashtirdi.", "Ikkala tizim ham tinchlikni mustahkamlashda juda muvaffaqiyatli boʻlib, yangi urushlarning oldini olishga qaratilgan edi.", "Versal tizimi Yevropada, Vashington tizimi esa Osiyoda barqarorlikni toʻliq taʼminlashga muvaffaq boʻlgan edi.", "Ular global iqtisodiy oʻsishni taʼminlashga va davlatlararo madaniy almashuvni kuchaytirishga katta hissa qoʻshgan edi."], ["Versal tizimining dastlabki asosiy maqsadi Germaniyani zaiflashtirish bilan birga, qanday muhim vazifalarni o'z ichiga olgan edi?", "Germaniyani zaiflashtirish, yangi chegaralar belgilash va tinchlikni ta'minlash.", "Yevropa iqtisodiyotini mustahkamlash, savdo aloqalarini kengaytirish.", "Kolonial imperiyalarni qayta tiklash, dengiz yo'llarini himoya qilish.", "Sharqiy Yevropada davlatlararo ittifoqlarni yaratish va harbiy bloklar tuzish."], ["Versal shartnomasiga koʻra, Germaniya qanday asosiy majburiyatlarni oʻz zimmasiga olgan edi, bu uning keyingi ahvolini belgiladi?", "Katta miqdorda tovon toʻlashi, harbiy kuchini kamaytirishi va hududlardan voz kechishi.", "Millatlar Ligasiga qoʻshilishi, iqtisodiy islohotlar o'tkazishi va neytrallikni saqlashi.", "Yangi hududlar bosib olishi, sanoatini rivojlantirishi va yirik davlatlar bilan ittifoq tuzishi.", "Muntazam ravishda armiyani modernizatsiya qilishi, siyosiy tizimni oʻzgartirishi lozimligi."], ["Birinchi jahon urushidan soʻng Avstriya-Vengriya imperiyasi parchalanib ketishi natijasida Yevropada qanday o'zgarishlar yuz berdi?", "Avstriya va Vengriya mustaqil davlatlarga aylandi, Chexoslovakiya va Yugoslaviya kabi yangi davlatlar paydo boʻldi.", "Ushbu imperiya oʻz hududining katta qismini saqlab qoldi, ayrim viloyatlar faqatgina cheklangan avtonomiya oldi.", "Avstriya-Vengriya butunlay Germaniya tarkibiga kirdi, yagona markazlashgan siyosiy ittifoqni tashkil etdi.", "U oʻz nomini rasman oʻzgartirdi, ammo chegaralari sezilarli darajada oʻzgarishsiz qolib, bir butun holda faoliyat yuritdi."], ["Millatlar Ligasi Birinchi jahon urushidan keyin qanday asosiy maqsad bilan tashkil etilgan boʻlib, xalqaro tartibni saqlashni koʻzlagan?", "Xalqaro xavfsizlikni ta'minlash va kelajakda urushlarning oldini olish asosiy vazifa edi.", "Barcha davlatlar oʻrtasida savdo cheklovlarini joriy etish va iqtisodiy blokada qilish maqsad qilingan.", "Faol a'zo davlatlarning harbiy kuchini oshirish va hududiy da'volarni qoʻllab-quvvatlash.", "Mustamlakalarning mustaqilligini cheklash, imperiyalarning ta'sirini kuchaytirishni koʻzlagan edi."], ["Versal tizimining zaif tomonlari qanday edi, bu esa keyinchalik uning samarasiz boʻlib chiqishiga olib keldi?", "Germaniya xalqida \"Versal qatlomi\" noroziligi, iqtisodiy beqarorlik va etnik nizolar.", "Millatlar Ligasining qudratli faoliyati, xalqaro hamkorlikning yuksak darajada rivojlanishi.", "Yirik davlatlarning tashkilotga to'liq ishtiroki, tinchlikni saqlashdagi faol harakatlari.", "Iqtisodiy o'sish, siyosiy barqarorlik va hududiy nizolarning samarali yechimlari."], ["1929 yilgi Buyuk Depressiya xalqaro muvozanatga qanday salbiy ta'sir koʻrsatdi va vaziyatni yomonlashtirdi?", "Xalqaro muvozanatni sezilarli darajada buzdi, totalitar rejimlar kuchayishiga zamin yaratdi.", "Yirik davlatlar oʻrtasidagi iqtisodiy hamkorlikni mustahkamladi va xalqaro savdo aloqalarini yaxshiladi.", "Siyosiy barqarorlikni ta'minladi, davlatlararo nizolarni samarali hal qilishga yordam berdi.", "Harbiy xarajatlarning kamayishiga olib keldi, qurolsizlanish jarayonining tezlashishiga sabab boʻldi."], ["Buyuk Britaniya va Fransiya Germaniyaga nisbatan qanday siyosatni olib bordilar, bu esa Gitlerning jasurlashishiga sabab boʻldi?", "Ular \"tinchlantirish siyosati\"ni olib bordilar, bu Gitlerni yanada jasurlashtirdi.", "Ular Germaniyaga qarshi keskin choralarni qoʻlladilar, uning hududiy da'volarini rad etdilar.", "Ular Germaniya bilan harbiy ittifoq tuzdilar va uning siyosatini to'liq qoʻllab-quvvatladilar.", "Ular Germaniya iqtisodiyotini kuchaytirishga, unga moliyaviy yordam berishga urindilar."], ["Versal tizimining inqiroziga qanday asosiy omillar sabab boʻldi, bu Ikkinchi jahon urushiga olib keldi?", "Germaniya, Italiya, Yaponiyaning agressiv siyosati, Millatlar Ligasining kuchsizligi.", "Yirik davlatlarning faol hamkorligi va iqtisodiy oʻsishning barqarorlashuvi natijasida.", "Tinchlikparvar siyosatlarning muvaffaqiyati, hududiy nizolarning samarali yechimi.", "Xalqaro tashkilotlarning samaradorligi, davlatlararo munosabatlarning mustahkamlanishi."], ["Birinchi jahon urushi yakunida 1919 yilgi Versal shartnomasi asosida Yevropada roʻy bergan katta oʻzgarishlar qanday ataldi?", "Bu jarayon \"hududlarning taqsimlanishi\" deb ataladi.", "Bu \"xalqaro chegaralarni mustahkamlash\" deb nomlandi.", "Bu \"davlatlarning avtonomiyasini kengaytirish\" deb belgilandi.", "Bu \"umumiy Yevropa bozorini yaratish\" deb izohlandi."], ["Birinchi jahon urushidan soʻng Usmonli imperiyasi qanday hududiy oʻzgarishlarga duch keldi va uning oqibatlari qanday boʻldi?", "Katta hududiy yo'qotishlarga duch keldi, Turkiya mustaqil davlatga aylandi, arab mamlakatlari mandat ostiga oʻtdi.", "Usmonli imperiyasi oʻz hududini saqlab qoldi, faqat ba'zi hududlar cheklangan mustaqillikni qoʻlga kiritdi.", "Imperiya hududlari sezilarli darajada kengaydi, yangi mustamlakalarni oʻziga qoʻshib oldi, qudratini oshirdi.", "U Yevropaning eng qudratli davlatiga aylandi, yangi siyosiy bloklar tuzishga faol kirishdi."], ["Birinchi jahon urushi va fuqarolar urushi natijasida Rossiya qanday hududiy yoʻqotishlarga uchradi va buning oqibatlari qanday boʻldi?", "Boltiqboʻyi davlatlari mustaqillikka erishdi, Finlyandiya ham mustaqil boʻldi.", "Rossiya oʻz hududlarini saqlab qoldi, faqatgina ayrim hududlar avtonomiya maqomini oldi.", "Rossiya yangi hududlarni qoʻshib oldi, uning siyosiy va iqtisodiy ta'siri sezilarli oshdi.", "Rossiya Yevropadagi eng yirik davlatlardan biriga aylandi, harbiy qudratini oshirdi."], ["Hududlarning qayta taqsimlanishi Yevropada qanday yangi etnik va siyosiy muammolarni keltirib chiqardi?", "Yangi chegaralar milliy tarkibni hisobga olmasligi tufayli etnik nizolar va siyosiy qarama-qarshiliklar.", "Yangi chegaralarning etnik tarkibni to'liq aks ettirishi, davlatlararo hamkorlikni sezilarli mustahkamlashi.", "Etnik nizolarning bartaraf etilishi, siyosiy barqarorlikning umumiy ravishda mustahkamlanishi natijasi.", "Hududiy da'volarning to'liq hal etilishi, davlatlararo munosabatlarning keskin yaxshilanishi."], ["Vashington tizimi qanday asosiy maqsadlar bilan tashkil etilgan boʻlib, xalqaro tartibni mustahkamlashni koʻzlagan?", "Dengiz qurollanishini cheklash, Tinch okeanida muvozanatni saqlash hamda kelajakdagi urushlarning oldini olish.", "Hududiy da'volarni qoʻllab-quvvatlash, harbiy ittifoqlarni mustahkamlash va agressiv siyosatlarni faol qoʻllash.", "Yangi koloniyalar yaratish, savdo cheklovlarini joriy etish va iqtisodiy blokadalarni amalga oshirish.", "Barcha davlatlarning harbiy salohiyatini oshirish, ichki siyosatga aralashish va chegaralarni oʻzgartirish."], ["1921–1922 yillardagi Vashington konferensiyasida qaysi davlatlar ishtirok etib, dengiz flotlari boʻyicha kelishuvlarga erishdilar?", "AQSh, Buyuk Britaniya, Yaponiya, Fransiya va Italiya asosiy ishtirokchi davlatlar boʻlgan.", "Germaniya, Avstriya, Vengriya, Rossiya va Usmonli imperiyasi ushbu konferensiyada qatnashmagan.", "Xitoy, Hindiston, Misr, Turkiya va Saudiya Arabistoni vakillari kuzatuvchi sifatida ishtirok etishgan.", "Polsha, Chexoslovakiya, Yugoslaviya va Gretsiya delegatsiyalari rasman konferensiyada mavjud boʻlgan."], ["Vashington tizimining inqiroziga olib kelgan asosiy omillar qaysilar boʻldi, bu uning samaradorligini pasaytirdi?", "Yaponiya Manjuriyani bosib olishi, Buyuk Depressiya va Millatlar Ligasining samarasizligi.", "Konferensiya ishtirokchilarining kelishuvlarga to'liq amal qilishi, iqtisodiy o'sishning tezlashishi.", "Xalqaro hamkorlikning kuchayishi, siyosiy barqarorlikning umumiy mustahkamlanishi.", "Hududiy nizolarning samarali yechimi, harbiy cheklovlarining to'liq bajarilishi."], ["Millatlar Ligasining bosh qarorgohi qaysi shaharda joylashgan boʻlib, uning faoliyatiga asos boʻlgan edi?", "Shveytsariyaning Jeneva shahrida joylashgan.", "Fransiyaning Parij shahrida oʻrnashgan edi.", "Buyuk Britaniyaning London shahrida joylashgan.", "AQShning Vashington shahrida joylashgan."], ["Millatlar Ligasining dastlabki tashkil etilishida uning kuchsizligiga nima sabab boʻlgan edi, uning ta'sirini cheklagan?", "Muhim davlatlardan biri boʻlgan AQShning unga qo'shilmaganligi sabab boʻlgan.", "Tashkilotga a'zo davlatlar sonining haddan tashqari koʻpligi asosiy muammo edi.", "Ichki nizolarning yechilishi, iqtisodiy hamkorlikning rivojlanishi mustahkamladi.", "Harbiy ittifoqlarning kuchayishi, xalqaro xavfsizlikning ta'minlanishi natijasi."], ["Millatlar Ligasi ayrim sohalarda muvaffaqiyatlarga erishgan boʻlsa-da, uning asosiy vazifasi boʻlgan urushlarning oldini olishda qanday natija koʻrsatdi?", "Urushlarning oldini olishda u samarasiz boʻlib chiqdi va asosiy vazifasini bajara olmadi.", "U urushlarning oldini olishda juda samarali faoliyat olib bordi va tinchlikni mustahkamladi.", "U faqat kichik hajmdagi nizolarni hal qila oldi, ammo yirik urushlarga to'liq aralashmadi.", "U faqat ma'lum hududiy mojarolarni muvaffaqiyatli bartaraf eta oldi va xalqaro muvozanatni tikladi."], ["Millatlar Ligasi qanday sabablarga koʻra oʻz vazifasini toʻliq bajara olmadi va Ikkinchi jahon urushi boshlanishini toʻxtata olmadi?", "Kuchsizligi va muhim davlatlarning ishtirok etmaganligi kabi asosiy omillar sababli.", "Uning harbiy qudratining haddan tashqari yuqoriligi va tajovuzkor agressiv siyosati tufayli.", "Barcha a'zo davlatlarning faol hamkorligi va siyosiy mustahkamligi natijasida.", "Iqtisodiy inqirozdan soʻng yangi davlatlarning tashkil topishi va mustahkamlanishi tufayli."], ["Yaponiyaning 1930-1940-yillardagi Osiyo-Tinch okeani mintaqasidagi agressiv tashqi siyosatining asosiy geosiyosiy va iqtisodiy sababi nimada edi?", "Mamlakatning tabiiy resurslarga kambag'alligi, yangi bozorlar va xomashyo manbalarini egallash istagi.", "Xalqaro savdo yo'llarini nazorat qilish va yirik dengiz kuchiga aylanish maqsadlari mavjudligi.", "Yevropa davlatlarining mustamlakachilik siyosatiga qarshi turish va mintaqaviy barqarorlikni ta'minlash.", "G'arb mamlakatlarining siyosiy ta'sirini kamaytirish va madaniy o'ziga xoslikni himoya qilish."], ["1931-yilda Yaponiya tomonidan Manjuriyaning bosib olinishi va \"Manchukuo\" qo'g'irchoq davlatining tashkil etilishi xalqaro huquq nuqtai nazaridan qanday baholandi?", "Bu xalqaro tartibni buzdi, ammo Millatlar Ligasi qat'iy choralar ko'rmadi.", "Bu harakat xalqaro huquq doirasida amalga oshirilgan, Millatlar Ligasi tomonidan qo'llab-quvvatlandi.", "Yaponiyaning hududiy yaxlitligini ta'minlashga qaratilgan harakat sifatida tan olindi.", "Xalqaro hamjamiyat tomonidan zudlik bilan harbiy intervensiya bilan javob berildi."], ["Ikkinchi Xitoy-Yaponiya urushi boshlanganida (1937-yil) Yaponiya tomonidan Xitoyning qaysi strategik shaharlari egallandi va bu hodisalarning xalqaro munosabatlarga ta'siri qanday bo'ldi?", "Pekin, Shanxay va Nankin egallandi, bu voqealar xalqaro miqyosda keskin norozilik tug'dirdi.", "Uxan va Guanchjou shaharlari qo'lga kiritildi, bu esa Yevropa davlatlari tomonidan cheklovlarga olib keldi.", "Chunsin va Sian shaharlari bosib olindi, bu hududlarda mustaqil hukumatlar tuzildi.", "Hong Kong va Makao hududlari nazoratga olindi, bu mintaqaviy savdo yo'llarini o'zgartirdi."], ["1940-yilda Yaponiya Germaniya va Italiya bilan imzolagan \"Uch tomonlama pakt\" qanday siyosiy natijalarga olib keldi va Yaponiyaning keyingi harakatlariga ta'siri qanday bo'ldi?", "Bu ittifoq Yaponiyaning tashqi siyosatini yanada agressiv qildi va resurslarga boy hududlarni egallashga olib keldi.", "Pakt Yaponiyaga xalqaro savdoni kengaytirish uchun yangi imkoniyatlar yaratdi va iqtisodiy o'sishga turtki berdi.", "U Yaponiyaning Osiyodagi ta'sirini cheklashga qaratilgan edi va G'arb davlatlari bilan diplomatik aloqalarni kuchaytirdi.", "Pakt Yaponiyani tinchlik siyosatini yuritishga majbur qildi va harbiy kuchini kamaytirishga olib keldi."], ["AQSh va boshqa G'arb davlatlari tomonidan Yaponiyaga qarshi joriy qilingan iqtisodiy sanksiyalar, xususan, neft va po'lat yetkazib berilishining to'xtatilishi Yaponiyaning qaysi harbiy harakatiga sabab bo'ldi?", "Yaponiya 1941-yil 7-dekabrda AQShning Perl-Harbor harbiy bazasiga hujum qildi.", "Yaponiya Sharqiy Sibir hududlariga qo'shin yuborib, resurs manbalarini nazorat qilishga urindi.", "Yaponiya Buyuk Britaniya va Fransiya mustamlakalariga diplomatik bosimni kuchaytirdi.", "Yaponiya o'zining ichki iqtisodiyotini qayta qurishga va resurslarni tejashga e'tibor qaratdi."], ["Prezident Trumenning atom bombasi qo'llash qarorini qo'llab-quvvatlagan tarixchi Antoni Bivorning asosiy dalili nimadan iborat edi, deb ta'kidlanadi matnda?", "Yaponiyaga bostirib kirishda kutilayotgan Ittifoqchi qurbonlar sonini kamaytirish ehtiyoji.", "Yaponiya harbiy qudratini to'liq yo'q qilish va uning imperiya ambitsiyalarini to'xtatish.", "Yaponiyaning harbiy-sanoat kompleksini butunlay falaj qilish va uni qayta tiklashning oldini olish.", "Sovet Ittifoqining Osiyodagi ta'sirini cheklash va mintaqaviy hokimiyat balansini saqlash."], ["Manhattan loyihasining asosiy maqsadi nima edi va uning dastlabki atom bombasi sinovi qachon va qayerda amalga oshirildi?", "Gitler Germaniyasidan oldin atom qurolini yaratish, sinov 1945-yil 16-iyulda Nyu-Meksikoda bo'ldi.", "Yaponiya ustidan to'liq harbiy ustunlikni ta'minlash, sinov 1944-yil avgustda Nevada shtatida bo'ldi.", "Sovet Ittifoqining yadro dasturidan o'zib ketish, sinov 1943-yil sentyabrda Kolorado shtatida bo'ldi.", "Urushdan keyingi davrda energiya manbasini topish, sinov 1946-yil aprelda Tennessi shtatida bo'ldi."], ["Manhattan loyihasi rahbariyati atom bombasining radiatsion ta'siri haqida dastlab qanday pozitsiyani egallagan va bu haqda jamoatchilikka qanday ma'lumot bergan?", "Radiatsiya oqibatlarini inkor etgan va ularni \"noaniq targ'ibot\" deb atagan edi.", "Radiatsiya xavfini to'liq oshkor etgan va uni kamaytirish choralarini ko'rgan.", "Radiatsiyaning inson salomatligiga ta'sirini o'rganish uchun keng miqyosli tadqiqotlar o'tkazgan.", "Radiatsiya ta'sirini juda kamaytirib ko'rsatgan, ammo tibbiy yordamni ta'minlagan."], ["Xirosimaga tashlangan \"Little Boy\" atom bombasining asosiy tarkibiy elementi va uning taxminiy portlash kuchi qancha kilotonnani tashkil etgan?", "Uran-235 asosida, kuchi taxminan 15 kilotonna trotil ekvivalentiga teng edi.", "Plutoniy-239 asosida, kuchi taxminan 20 kilotonna trotil ekvivalentiga teng edi.", "Toriy-232 asosida, kuchi taxminan 10 kilotonna trotil ekvivalentiga teng edi.", "Deyteriy-tritiy asosida, kuchi taxminan 25 kilotonna trotil ekvivalentiga teng edi."], ["Nagasakiga atom bombasi tashlanganida (1945-yil 9-avgust) asl rejalashtirilgan nishon shahar qaysi edi va uni o'zgartirishga nima sabab bo'ldi?", "Asl nishon Kokura shahri edi, ammo bulutli ob-havo tufayli Nagasaki tanlandi.", "Asl nishon Fukuoka shahri edi, ammo kuchli shamol tufayli reja o'zgartirildi.", "Asl nishon Kitakyushu shahri edi, ammo texnik nosozliklar tufayli Nagasaki tanlandi.", "Asl nishon Kumamoto shahri edi, ammo razvedka ma'lumotlari o'zgargani uchun Nagasaki tanlandi."], ["Yaponiyada atom bombasining portlashidan omon qolgan shaxslar \"hibakusha\" deb atalgan. Bu atama qaysi ma'noni anglatadi va ularga tegishli kasalliklar qaysilar?", "\"Portlash ta'siriga uchragan odam\" ma'nosini bildiradi; leykemiya va saraton kasalliklari oshishi.", "\"Tinchlik elchisi\" ma'nosini bildiradi; ruhiy tushkunlik va xotira yo'qolishi kuzatilgan.", "\"Urush qahramoni\" ma'nosini bildiradi; jarohatlar va oyoq-qo'l amputatsiyalari bilan bog'liq muammolar.", "\"Yangi boshlanish\" ma'nosini bildiradi; immun tizimi zaiflashishi va ichki organlar shikastlanishi."], ["Birinchi jahon urushidan keyingi Germaniyaning siyosiy va iqtisodiy ahvoli Adolf Gitlerning hokimiyat tepasiga kelishiga qanday ta'sir ko'rsatdi?", "Versal shartnomasi va Buyuk Depressiya tufayli yuzaga kelgan inqiroz millatchilikni kuchaytirdi.", "Siyosiy barqarorlik va iqtisodiy o'sish unga jamoatchilik ishonchini qozonishiga imkon berdi.", "Xalqaro hamjamiyat bilan yaqin hamkorlik Gitlerga siyosiy kuch berdi.", "Nemislar orasida demokratik g'oyalarning keng tarqalishi uning siyosatiga yordam berdi."], ["1919-yilgi Versal shartnomasining Germaniya uchun salbiy oqibatlari Milliy sotsialistik nemis ishchilar partiyasi (NSDAP) uchun qanday siyosiy platforma yaratdi?", "\"Versal qatlomi\"ni bekor qilish va milliy g'ururni tiklash va'dalarini ilgari surdi.", "Xalqaro hamkorlikni mustahkamlash va mintaqaviy tinchlikni saqlashga chaqirdi.", "Iqtisodiy islohotlar o'tkazish va kambag'allikni bartaraf etishga ustuvor ahamiyat berdi.", "Demokratik institutlarni rivojlantirish va fuqarolik erkinliklarini kengaytirishga intildi."], ["Natsizm mafkurasining asosiy g'oyalari nimalardan iborat edi va bu g'oyalar Germaniyaning ichki va tashqi siyosatini qanday shakllantirdi?", "Millatchilik, irqiy ustunlik, yahudiylarga qarshi siyosat, totalitar boshqaruv va agressiv tashqi siyosat.", "Demokratik qadriyatlar, fuqarolar erkinligi, iqtisodiy liberalizm va tinchlikparvar tashqi siyosat.", "Sotsial adolat, proletariat diktaturasi, sinfiy kurash va xalqaro proyektlar hamkorligi.", "Milliylashish, kasaba uyushmalari, mintaqaviy avtonomiya va neytral tashqi siyosat tamoyillari."], ["Adolf Gitlerning \"Lebensraum\" siyosati nimani nazarda tutgan va u Germaniyaning qaysi geografik mintaqalarga nisbatan ekspansiyani asoslagan?", "Nemis xalqi uchun \"hayot uchun hudud\" yaratish va Sharqiy Yevropada yangi yerlarni egallash.", "Germaniyaning dengiz orti hududlarini kengaytirish va Afrika koloniyalarini nazorat qilish.", "G'arbiy Yevropadagi sanoatlashgan mintaqalarni birlashtirish va iqtisodiy integratsiyani chuqurlashtirish.", "Skandinaviya davlatlari bilan yaqin ittifoq tuzish va Shimoliy dengiz yo'llarini ta'minlash."], ["Adolf Gitlerning hokimiyat tepasiga kelganidan keyin Germaniyaning tashqi siyosatidagi asosiy maqsadlari qaysilar edi?", "Germaniyani qudratli davlatga aylantirish, Versal shartnomasini bekor qilish va yangi hududlarni egallash.", "Yevropada tinchlikni saqlash, xalqaro hamkorlikni kuchaytirish va qurolsizlanishni ta'minlash.", "Iqtisodiy diplomatik aloqalarni rivojlantirish va savdo shartnomalarini kengaytirishni maqsad qildi.", "Demokratik qadriyatlarni targ'ib qilish va qo'shni davlatlar bilan madaniy almashuvlarni rag'batlantirish."], ["Gitlerning tashqi siyosatida diplomatik munosabatlarga yondashuvi qanday bo'lgan va u boshqa davlatlar bilan murosaga intildimi yoki kuch ishlatishga tayandi?", "Gitler boshqa davlatlar bilan murosaga intilmadi, balki kuch ishlatish orqali o'z maqsadiga erishdi.", "Diplomatik muzokaralar va xalqaro kelishuvlar orqali tinchlik yo'lini afzal ko'rgan edi.", "U xalqaro tashkilotlar orqali Germaniyaning ta'sirini oshirishga intilgan edi.", "Gitler faqatgina iqtisodiy yordam va savdo shartnomalari orqali ta'sir o'tkazishni maqsad qilgan."], ["1941-yil 22-iyunda Germaniya boshchiligidagi Axis kuchlarining SSSRga qarshi boshlagan hujumida qaysi Yevropa davlatlari Germaniya bilan birga ishtirok etdilar?", "Italiya, Ruminiya, Vengriya, Finlyandiya va Slovakiya ham SSSRga qarshi urush boshladilar.", "Fransiya, Buyuk Britaniya, Polsha va Daniya Axis kuchlari tarkibida ishtirok etishgan.", "Ispaniya, Shvetsiya, Shveytsariya va Portugaliya Germaniyani to'liq qo'llab-quvvatlashgan.", "Turkiya, Gretsiya, Bolgariya va Norvegiya SSSRga qarshi harbiy harakatlarni olib borgan."], ["1941-yilgi fojianing sababi sifatida ko'pincha Sovet armiyasining to'la qurollantirish uchun vaqt yetishmaganligi haqidagi umumiy tushuncha matnda qanday baholanadi?", "Matnda bu g'oya to'g'ri emas deb baholanadi, chunki SSSR qurollanishda ustun bo'lgan.", "Bu tushuncha asosli deb qabul qilinadi, chunki Sovetlar zamonaviy qurol ishlab chiqarishga ulgurmagan.", "Matnda bu fikr qisman to'g'ri deb aytiladi, lekin boshqa omillar muhimroq bo'lgan.", "Bu qarash mutlaqo rad etiladi, chunki SSSR harbiy tayyorgarligi bo'yicha kuchli edi."], ["Ikkinchi jahon urushida 1941-yil 22-iyunda boshlangan SSSRga qarshi hujumda Germaniya qo'shinlari dastlabki 15 kun ichida Sovet hududining qancha kilometr ichkarisiga kirib borgan?", "Dushman qo'shinlari dastlabki 15 kun ichida 400 km ichkariga kirib borgan.", "Dushman qo'shinlari dastlabki 15 kun ichida 150 km ichkariga kirib borgan.", "Dushman qo'shinlari dastlabki 15 kun ichida 700 km ichkariga kirib borgan.", "Dushman qo'shinlari dastlabki 15 kun ichida 250 km ichkariga kirib borgan."], ["Yaponiya imperiyasi 1945-yil yoziga kelib harbiy jihatdan qanday holatga tushgan edi va bu holatga qaysi jang katta ta'sir ko'rsatgan?", "Imperiya harbiy tanazzulga yuz tutgan edi, ayniqsa Okinava jangida katta yo'qotishlar bo'lgan.", "Imperiya o'z harbiy qudratini saqlab qolgan edi, Ivodzima jangi bilan qarshilikni ko'rsatgan.", "Imperiya yangi harbiy strategiyalarni ishlab chiqqan, Leyte ko'rfazi jangida ustunlikka erishgan.", "Imperiya chekinish taktikalarini qo'llagan, Tinch okeani bo'ylab yangi mudofaa chiziqlarini yaratgan."]]}, {"name": "Ma’naviyatshunoslik", "q": [["Matnga koʻra, inson tafakkurida vujudga keladigan, ijtimoiy xarakterga ega boʻlgan, ruhiyatga ta'sir etib, harakatga chorlaydigan kuchli fikr nima deb ta'riflangan?", "Ushbu holatda «G'oya» insonni maqsad-muddaolar sari yetaklovchi, teran fikr sifatida belgilanadi.", "Bu «Ma'rifat» deb atalib, faqat bilim olish va dunyoqarashni kengaytirish jarayonini aks ettiradi.", "Bunday tushuncha «E'tiqod» bo'lib, muayyan g'oyaga ichki ishonchning ifodasini bildiradi.", "Bu jarayon «Madaniyat» tushunchasiga kiradi, insoniyat yaratgan moddiy va ma'naviy qiymatlardir."], ["Mafkura ta'rifi qaysi guruh, qatlam, millat, davlat, xalq va jamiyatning ehtiyojlari, maqsad-muddaolari, manfaatlari va orzularini oʻzida mujassam etadi?", "Mafkura ularning intilishlari hamda amalga oshirish tamoyillarini o'zida mujassam etgan g'oyalar tizimidir.", "Mafkura faqat shaxsning ichki dunyosi va ruhiy kechinmalarini ifodalovchi tushuncha hisoblanadi.", "Mafkura o'quvchining xulq-atvori va xatti-harakatlarini boshqarish tizimi bilan bog'liqdir.", "Mafkura asosiy bilimlar, malaka va ko'nikmalar yordamida shakllangan axloqiy odatlardir."], ["«Ma'naviyat» soʻzi arab tilidan olingan boʻlib, dastlab qaysi fe'ldan kelib chiqqan va uning ma'nosi nimani anglatadi?", "«Ma'naviyat» «ma'no» fe'lidan olingan bo'lib, ruh, aql, ong, idrok kabi bir necha ma'nolarni anglatadi.", "«Ma'naviyat» «navo» fe'lidan olingan bo'lib, insonning estetik didi va san'atga moyilligini ifodalaydi.", "«Ma'naviyat» «manba» fe'lidan kelib chiqqan bo'lib, bilim va axloqning asl manbalarini tushuntiradi.", "«Ma'naviyat» «amal» fe'lidan kelib chiqqan bo'lib, ezgu ishlar va amallarni bajarishga urg'u beradi."], ["Birinchi Prezidentimiz I.A. Karimovning \"Yuksak ma'naviyat – yengilmas kuch\" asarida ma'naviyatga qanday ta'rif berilgan?", "Ma'naviyat insonni ruhan poklashga, qalban ulg'aytirishga chorlovchi, vijdonini uyg'otuvchi kuchdir.", "Ma'naviyat jamiyatning iqtisodiy asoslarini mustahkamlovchi va siyosiy barqarorlikni ta'minlovchi omildir.", "Ma'naviyat faqatgina madaniy merosni asrash va avlodlarga yetkazish bilan chegaralanuvchi tushunchadir.", "Ma'naviyat asosan fan va texnologiya rivojlanishiga qaratilgan ilmiy-texnik bilimlarni o'z ichiga oladi."], ["Matnda sanab oʻtilgan ma'naviyatning tarkibiy qismlaridan biri nima?", "Madaniy-ma'rifiy yuksaklik insonning bilim va dunyoqarashi rivoji bilan bevosita bog'liqdir.", "Iqtisodiy-texnik innovatsiyalar mamlakatning umumiy taraqqiyotini ta'minlovchi asosiy kuchdir.", "Siyosiy-ijtimoiy barqarorlik hukumatning samarali faoliyati va boshqaruv tizimiga bog'liqdir.", "Moliya-kredit tizimining mustahkamligi davlatning barqaror rivojlanishiga xizmat qiladi."], ["Matnda keltirilgan ma'naviyatning tarkibiy qismlaridan yana biri qaysi variantda toʻgʻri koʻrsatilgan?", "Vatan va xalq mustaqilligini doimiy himoya qilish hamda unga sidqidildan xizmat qilishdir.", "Chet tillarni mukammal o'zlashtirish va xalqaro hamkorlik aloqalarini mustahkamlashdir.", "Sport va jismoniy tarbiya orqali sog'lom turmush tarzini keng targ'ib qilish va qo'llab-quvvatlashdir.", "Zamonaviy IT texnologiyalarini o'zlashtirish hamda raqamli iqtisodiyotni rivojlantirishdir."], ["SHAXS tushunchasi ijtimoiy-gumanitar fanlarda qanday predmet nuqtai nazaridan ishlatiladi va uning mohiyati nimadan iborat?", "SHAXS alohida kishi bo'lib, ijtimoiy-axloqiy mohiyatni oʻzida mujassamlashtirgan individ hisoblanadi.", "SHAXS asosan biologik nasl va genetik xususiyatlar bilan cheklangan bir jonzotdir, deb qaraladi.", "SHAXS jamiyatdagi iqtisodiy munosabatlar tizimining sub'ekti sifatida tahlil etiladi, xolos.", "SHAXS faqatgina huquqiy normalarga bo'ysunuvchi, qonuniy javobgarlikka ega fuqarodir, deb ta'riflanadi."], ["Shaxsning shakllanishida matnda qaysi omillar muhim ahamiyatga ega ekanligi ko'rsatilgan?", "Ta'lim, tarbiya, ijtimoiy muhit, madaniyat va o'z-o'zini anglash shaxs shakllanishida muhim omillar hisoblanadi.", "Faqat irsiyat, nasl va tug'ma qobiliyatlar shaxs rivojlanishining yagona asosini tashkil etadi.", "Iqtisodiy ahvol, moddiy farovonlik va boylik shaxsning ma'naviy kamolotini belgilovchi asosiy omillardir.", "Media vositalari, internet va zamonaviy texnologiyalar shaxsning shakllanishida mutlaq hal qiluvchi rol o'ynaydi."], ["«Axloq» tushunchasi matnda qanday izoh berilgan va uning asosiy vazifasi nimadan iborat?", "Axloq inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar majmuasi sifatida ta'riflanadi.", "Axloq bu moddiy boyliklar to'plami bo'lib, insonning iqtisodiy farovonligini belgilovchi mezonidir.", "Axloq faqatgina ijodiy qobiliyatlar va san'atga bo'lgan moyillikni o'z ichiga oluvchi tushunchadir.", "Axloq jamiyatda ilm-fan va texnologiya taraqqiyotini ta'minlashga xizmat qiluvchi qoidalardir."], ["Matnga koʻra, «Qadriyat» nimani anglatadi va uning ahamiyati qanday belgilangan?", "Qadriyat inson va jamiyat uchun muhim ahamiyatga ega boʻlgan moddiy yoki ma'naviy hodisa, tamoyil va mezonlardir.", "Qadriyat faqatgina o'tmishda yaratilgan buyuk asarlar va tarixiy obidalarni anglatadi.", "Qadriyat individual shaxsning shaxsiy manfaatlarini himoya qiluvchi ichki kechinmalardir.", "Qadriyat zamonaviy texnologiyalarni o'zlashtirish va iqtisodiy o'sishga erishish usullaridir."], ["«E'tiqod» tushunchasi matnda qanday izoh berilgan va uning asosiy xususiyati nimada?", "E'tiqod muayyan g'oya, qarash yoki tamoyilga bo'lgan ichki ishonchning ifodasidir.", "E'tiqod faqat diniy marosimlar va urf-odatlarni bajarishga qaratilgan amaliy faoliyatdir.", "E'tiqod insonning ijtimoiy maqomini belgilovchi va jamiyatdagi mavqeini ta'minlovchi omildir.", "E'tiqod shaxsning intellektual salohiyati va mantiqiy fikrlash qobiliyatini aks ettiradi."], ["Matnda \"Ma'rifat\" qanday jarayon sifatida ta'riflangan va uning asosiy maqsadi nimadan iborat?", "Ma'rifat bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayonini anglatadi.", "Ma'rifat faqat san'at va adabiyotga bo'lgan qiziqishni rivojlantirish bilan cheklangan holatdir.", "Ma'rifat asosan jismoniy tarbiya va sport orqali inson salomatligini mustahkamlashdir.", "Ma'rifat shaxsning boylik to'plashga va moddiy farovonlikka erishishga intilishidir."], ["«Madaniyat» tushunchasi matnda qanday mazmunda tushuntirilgan va uning tarkibiga nimalar kirishi aytilgan?", "Madaniyat insoniyat yaratgan moddiy va ma'naviy qadriyatlarning barchasi majmui hisoblanadi.", "Madaniyat faqatgina rasmiy qonunlar va huquqiy normalar yig'indisi bo'lib, ijtimoiy tartibni o'rnatadi.", "Madaniyat asosan tabiat resurslaridan samarali foydalanish va ekologik muvozanatni saqlashga qaratilgan.", "Madaniyat faqat milliy o'yinlar, raqslar va an'anaviy marosimlarni o'z ichiga oluvchi hodisadir."], ["Ma'naviyatning tarbiyaviy funksiyasi qaysi asosiy vazifani bajarishga qaratilgan?", "Ma'naviyatning tarbiyaviy funksiyasi insonda axloqiy fazilatlarni shakllantirishga xizmat qiladi.", "Ma'naviyatning tarbiyaviy funksiyasi iqtisodiy o'sishni rag'batlantirish va investitsiyalarni jalb etishga qaratilgan.", "Ma'naviyatning tarbiyaviy funksiyasi ilmiy-texnik bilimlarni o'zlashtirish va innovatsiyalarni rivojlantirishdir.", "Ma'naviyatning tarbiyaviy funksiyasi siyosiy barqarorlikni ta'minlash va davlat boshqaruvini mustahkamlashdir."], ["Ma'naviyatning regulyativ funksiyasi nima bilan bog'liq holda inson xulq-atvorini tartibga soladi?", "Regulyativ funksiya inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga solishni ta'minlaydi.", "Regulyativ funksiya jismoniy sog'likni nazorat qilish va inson tanasining optimal ishini ta'minlashga qaratilgan.", "Regulyativ funksiya moddiy resurslarni taqsimlash va iqtisodiy jarayonlarni samarali boshqarish bilan shug'ullanadi.", "Regulyativ funksiya ma'lumotlarni qayta ishlash va texnik tizimlarning uzluksiz ishlashini nazorat qilishdan iborat."], ["Ma'naviyatning integrativ funksiyasi jamiyat a'zolarini qaysi asosda birlashtirishga xizmat qiladi?", "Integrativ funksiya jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirishni ta'minlaydi.", "Integrativ funksiya jamiyat a'zolarini siyosiy partiyalarga a'zo qilish va ularning faolligini oshirishga yo'naltirilgan.", "Integrativ funksiya jamiyat a'zolarining individual xususiyatlarini ajratish va ularni alohida guruhlarga bo'lishdir.", "Integrativ funksiya jamiyat a'zolarining moliyaviy ahvolini yaxshilash va ularning moddiy farovonligini oshirishdir."], ["Ma'naviyatning aksiologik funksiyasi nima bilan chambarchas bog'liq ekanligi matnda ta'kidlangan?", "Aksiologik funksiya qadriyatlarni anglash va ularni baholash bilan bevosita bog'liqdir.", "Aksiologik funksiya insonning jismoniy rivojlanishi va sportdagi yutuqlarini hisobga olish bilan bog'liq.", "Aksiologik funksiya insonning intellektual qobiliyatlarini o'lchash va uning bilim darajasini baholashdir.", "Aksiologik funksiya jamiyatda iqtisodiy samaradorlikni oshirish va moddiy boyliklarni yaratishga bog'liq."], ["Milliy g'oyaning umumiy tamoyillaridan biri sifatida “Zamonaviylik” nimani nazarda tutadi?", "Zamonaviylik tamoyili milliy g'oyaning doimiy ravishda rivojlanib borishini va bugungi kun talablariga mos kelishini bildiradi.", "Zamonaviylik tamoyili faqat o'tmishdagi an'analarga qat'iy rioya qilishni va ularni o'zgartirmaslikni talab qiladi.", "Zamonaviylik tamoyili faqat chet el madaniyatlarini ko'r-ko'rona qabul qilish va milliy qadriyatlardan voz kechishni anglatadi.", "Zamonaviylik tamoyili ilm-fan va texnik taraqqiyotni butunlay inkor etishni, faqat ma'naviy rivojlanishga e'tibor berishni anglatadi."], ["“Umuminsoniy qadriyatlar” matnda qanday ta'riflangan va ularning ahamiyati qanday belgilangan?", "Umuminsoniy qadriyatlar butun insoniyat uchun umumiy ahamiyatga ega bo'lgan qadriyatlardir.", "Umuminsoniy qadriyatlar faqatgina bir millatning tarixiy-madaniy tajribasi bilan bog'liq qadriyatlardir.", "Umuminsoniy qadriyatlar faqatgina moddiy boyliklar va iqtisodiy resurslar yig'indisini anglatadi.", "Umuminsoniy qadriyatlar faqatgina shaxsiy manfaatlarni himoya qiluvchi ichki ruhiy holatlardir."], ["“Ma'naviy meros” tushunchasi matnda qanday elementlar majmui sifatida izohlangan?", "Ma'naviy meros avlodlardan avlodlarga o'tib kelayotgan ma'naviy, madaniy, ilmiy, axloqiy va tarixiy qadriyatlar majmuidir.", "Ma'naviy meros faqat insoniyat tomonidan yaratilgan jismoniy obidalar va arxitektura durdonalaridir, xolos.", "Ma'naviy meros faqatgina siyosiy tizimlar va davlat boshqaruvining shakllanishi bilan bog'liq bo'lgan tajribalardir.", "Ma'naviy meros faqat zamonaviy texnologik yutuqlar va ilm-fan sohasidagi yangiliklarni o'z ichiga oladi."], ["Inson tafakkurida vujudga keladigan, ijtimoiy xarakterga ega boʻlgan, ruhiyatga taʼsir oʻtkazib, jamiyat va odamlarni harakatga chorlaydigan, maqsad-muddao sari etaklaydigan kuchli, teran fikr nima deb ataladi?", "Bu tushuncha \"g'oya\" deb nomlanadi va shaxslar uchun asosiy kuchdir.", "Bu tushuncha \"mafkura\" deb nomlanadi va jamiyatning harakatlantiruvchi omilidir.", "Bu tushuncha \"qadriyat\" deb nomlanadi va insoniyatning yuksakligini belgilaydi.", "Bu tushuncha \"e'tiqod\" deb nomlanadi va insonning ichki ishonchiga bog'liq."], ["Muayyan ijtimoiy guruh, ijtimoiy qatlam, millat, davlat, xalq va jamiyatning ehtiyojlari, maqsad-muddaolari, manfaatlari, orzu intilishlari hamda ularni amalga oshirish tamoyillarini oʻzida mujassam etadigan g'oyalar tizimi qanday ataladi?", "Bu tizim \"mafkura\" deb ataladi, u ijtimoiy yoʻnalishni belgilaydi.", "Bu tizim \"ma'naviyat\" deb ataladi, u insonning ichki dunyosini aks ettiradi.", "Bu tizim \"e'tiqod\" deb ataladi, u shaxsiy qarashlarga asoslangan ishonchdir.", "Bu tizim \"axloq\" deb ataladi, u xulq-atvor me'yorlarini oʻz ichiga oladi."], ["\"Ma'naviyat\" soʻzi arab tilidan olingan boʻlib, u qaysi fe'ldan kelib chiqqan va qanday ma'nolarni anglatadi?", "\"Ma'no\" fe'lidan olingan: ruh, aql, idrok, ruhiy holat, qayg'urish kabi ma'nolar.", "\"Ma'rifat\" fe'lidan olingan: bilim, ilm, dunyoqarashni kengaytirish tushunchalari.", "\"Munosabat\" fe'lidan olingan: odamlararo aloqalar, ijtimoiy oʻzaro ta'sir.", "\"Madaniyat\" fe'lidan olingan: moddiy va ma'naviy qadriyatlar majmuasining yig'indisi."], ["Birinchi Prezidentimiz I.A. Karimovning \"Yuksak ma'naviyat yengilmas kuch\" asarida ma'naviyatga berilgan ta'rifga ko'ra, u insonni qanday fazilatlarga chorlaydigan kuchdir?", "Ruhan poklanish, qalban ulg'ayishga, irodasini baquvvat qilishga chorlaydigan kuch.", "Ijtimoiy taraqqiyotga, falsafiy o'sishga, madaniy yuksaklikka undaydigan kuch.", "Moddiy farovonlikka, iqtisodiy rivojlanishga va texnik innovatsiyalarga turtki beruvchi.", "Siyosiy barqarorlikka, huquqiy tartibga, demokratik tamoyillarga asoslangan kuch."], ["Oʻzbekiston Respublikasi Prezidentining 2017 yil 7 fevraldagi PF-4947-son Farmoni qaysi sohadagi Harakatlar strategiyasi toʻgʻrisida qabul qilingan?", "Oʻzbekiston Respublikasini yanada rivojlantirish bo'yicha Harakatlar strategiyasi to'g'risida.", "Ma'naviy-ma'rifiy ishlar samaradorligini oshirish va sohani rivojlantirish to'g'risida.", "Yoshlarga oid davlat siyosati samaradorligini oshirish va yoshlar ittifoqi faoliyatini qo'llash.", "Ma'naviy-ma'rifiy ishlar tizimini tubdan takomillashtirish chora-tadbirlari."], ["\"Avesto\" asarida zardushtiylik axloqining asosiy qoidasi sifatida qaysi uchta tushuncha qayd etilgan?", "\"Ezgu fikr, ezgu soʻz, ezgu amal\" zardushtiylik axloqining asosiy qoidasidir.", "\"Halollik, poklik, mardlik\" insoniyat uchun eng muhim va zaruriy tamoyillardir.", "\"Ilm, ma'rifat, e'tiqod\" madaniy-ma'rifiy taraqqiyotning uchta tayanch ustunidir.", "\"Sevgi, adolat, birdamlik\" jamiyatda ijtimoiy barqarorlikni ta'minlovchi asoslardir."], ["Islom Karimov ilgari surgan \"Milliy istiqlol g'oyasi: asosiy tushuncha va tamoyillar\" fanida ma'naviyatning tarkibiy qismlari qatoriga qaysilar kiradi?", "Madaniy-ma'rifiy yuksaklik, Ijtimoiy-didaktik taraqqiyot, Falsafiy-pedagogik o'sish.", "Iqtisodiy rivojlanish, texnologik innovatsiyalar, tabiiy resurslardan oqilona foydalanish.", "Harbiy qudratni mustahkamlash, milliy chegaralarni himoya qilish, xavfsizlikni ta'minlash.", "Siyosiy partiyalar faoliyatini rivojlantirish, saylov tizimini takomillashtirish, qonun ustuvorligi."], ["Quyidagi javoblardan qaysilari \"Milliy istiqlol g'oyasi\" doirasida ma'naviyatning tarkibiy qismlariga tegishli?", "Iymon-e'tiqodning butunligi, Milliy axloq-odob meyorlariga toʻla rioya qilish, Ilm-ma'rifatli bo'lish.", "Global iqtisodiy integratsiya, xalqaro hamkorlikni kengaytirish, xorijiy investitsiyalarni jalb qilish.", "Infratuzilmani rivojlantirish, urbanizatsiya jarayonlari, ekologik muammolarni hal etish.", "Qishloq xoʻjaligi modernizatsiyasi, sanoatni rivojlantirish, energetika sohasini takomillashtirish."], ["Ma'naviy qadriyatlarning tarkibiy asoslaridan biri boʻlgan \"Axloqiy qadriyatlar\" nimani o'z ichiga oladi?", "Axloqiy bilimlar, malaka va koʻnikmalar, o'quvchining xulq-atvorini boshqarish tizimi.", "Xalq og'zaki ijodi, badiiy estetik san'at namunalari, teatr va musiqa san'ati.", "Moddiy boyliklar, iqtisodiy resurslar, infratuzilma va texnologik yutuqlar.", "Tarixiy obidalar, muzey eksponatlari, qadimiy qo'lyozmalar va arxeologik topilmalar."], ["Axloqiy qadriyatlarning koʻrinishlari qatoriga matnda keltirilgan qaysi fazilatlar kiradi?", "Insonparvarlik, halollik, tashabbuskorlik, mehnatsevarlik, erksevarlik, sahiylik.", "Tashqi ko'rinish, boylik, mavqe, shaxsiy manfaat, tanbellik, dangasalik.", "Madaniyatsizlik, qo'pol muomala, riyokorlik, soxtalik, qalbakiylik.", "Aqlsizlik, johillik, ma'rifatsizlik, xurofotga ishonish, bilimga intilmaslik."], ["\"Badiiy qadriyatlar\" matn bo'yicha qaysi ikki asosiy tarkibiy qismdan iborat?", "Xalq ogʻzaki ijodi (ertak, doston, maqol) va xalq tasviriy san'ati (teatr, musiqa).", "Tarixiy hujjatlar, arxitektura yodgorliklari va qadimiy madaniyat obidalari.", "Ilmiy kashfiyotlar, texnologik ishlanmalar va zamonaviy informatika yutuqlari.", "Iqtisodiy islohotlar, bozor munosabatlari va moliyaviy barqarorlikni ta'minlash."], ["Ibn Sino \"Ash-Shifo\" asarida do'stlik haqida qanday ta'rif beradi?", "Boshqa birovga yaxshilik istaladi, bunda inson o'zi uchun emas, boshqa uchungina istaydi.", "Inson o'z manfaati yo'lida boshqalar bilan hamkorlik qilishi, o'zaro yordamga asoslanishi.", "Do'stlik insonning shaxsiy hissiy bog'liqligi, o'zaro ishonch va sadoqatga tayanishidir.", "Do'stlik moddiy boyliklarni birgalikda to'plash, iqtisodiy foyda olishga qaratilgan harakatdir."], ["Matnda keltirilgan \"Milliy g'oyamizning umumiy tamoyillari\" qatoriga qaysilar kiradi?", "Tarixiylik, zamonaviylik, umumbashariylik - mintaqaviylik kabi tamoyillar.", "Iqtisodiy rivojlanish, siyosiy barqarorlik, global integratsiya tamoyillari.", "Harbiy qudrat, texnologik ustunlik, demografik o'sish kabi tamoyillar.", "Madaniy izolyatsiya, o'tmishga yopishib qolish, cheklangan dunyoqarash."], ["\"Shaxs\" tushunchasi matn boʻyicha qanday izohlanadi va uning asosiy mohiyati nimada?", "Alohida kishi, ijtimoiy-axloqiy mohiyatni o'zida mujassam etgan individ, fazilatlarning yaxlit butunligi.", "Faqat biologik nasl va tabiiy muhit ta'sirida shakllanadigan, ijtimoiy aloqalardan holi mavjudot.", "Jamiyatning barcha a'zolari uchun umumiy bo'lgan, shaxsiy xususiyatlardan butunlay mahrum sub'ekt.", "Faqaat moddiy ehtiyojlarni qondirishga yo'naltirilgan, ma'naviy jihatlari ahamiyatsiz individ."], ["\"Axloq\" tushunchasining matndagi ta'rifiga ko'ra, u nimani ifodalaydi?", "Inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar majmuasi.", "Jamiyatdagi iqtisodiy munosabatlarni belgilovchi qonunlar tizimi.", "Madaniy boyliklar va moddiy qadriyatlarning umumiy yig'indisi.", "Ilmiy bilimlarni egallash va dunyoqarashni kengaytirish jarayoni."], ["\"Ma'rifat\" tushunchasining matndagi ta'rifiga ko'ra, u nimani anglatadi?", "Bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayoni.", "Insonning ichki hissiy holati va ruhiy kechinmalarining majmuasi.", "Jamiyat a'zolari o'rtasidagi ijtimoiy birdamlik va hamjihatlik tamoyili.", "Moddiy va ma'naviy qadriyatlarni yaratish va ulardan foydalanish tizimi."], ["Matnga koʻra, ma'naviyatning \"tarbiyaviy funksiyasi\" nimada namoyon bo'ladi?", "Insonda axloqiy fazilatlarni shakllantirish, uning ichki dunyosini boyitish.", "Jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirish va jipslashtirish.", "Qadriyatlarni anglash va ularga baho berish orqali ijtimoiy tartibni ta'minlash.", "Inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga solish."], ["Ma'naviyatning \"integrativ funksiyasi\" jamiyat hayotidagi qaysi jihatni aks ettiradi?", "Jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirish va hamjihatlikni kuchaytirish.", "Insonda axloqiy fazilatlarni shakllantirish, uning shaxsiy kamolotiga hissa qo'shish.", "Inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga solish mexanizmi.", "Qadriyatlarni anglash, baholash va ular asosida ijtimoiy rivojlanishga erishish."], ["\"Ma'naviy meros\" tushunchasi matnda qanday izohlangan?", "Avlodlardan avlodlarga o'tib kelayotgan ma'naviy, madaniy, ilmiy, axloqiy va tarixiy qadriyatlar majmui.", "Faqat moddiy boyliklar, bino-inshootlar va ulardan foydalanish usullarini o'z ichiga oladi.", "Zamonaviy ilm-fan yutuqlari, texnologik kashfiyotlar va innovatsion loyihalar tizimi.", "Kelajak avlodlar uchun yaratilishi rejalashtirilgan, hozirda mavjud bo'lmagan qadriyatlar."], ["Shaxs ma'naviyatining shakllanishida matnda keltirilgan muhim omillarga qaysilar kiradi?", "Ta'lim, tarbiya, ijtimoiy muhit, madaniyat va oʻz-oʻzini anglash kabi omillar.", "Faqat biologik nasl va genetik kod, boshqa tashqi ta'sirlardan mutlaqo holi bo'lgan omillar.", "Iqtisodiy boylik, shaxsiy moliyaviy barqarorlik, moddiy farovonlikni ta'minlovchi omillar.", "Texnologik taraqqiyot, siyosiy partiyalarga a'zolik va faol ijtimoiy-siyosiy ishtirok."], ["Matn boʻyicha “G'oya” tushunchasining aniq ta'rifi qaysi javobda keltirilgan?", "Inson tafakkurida vujudga keladigan, ijtimoiy xarakterga ega, ruhiyatga ta'sir o'tkazib, jamiyatni harakatga chorlaydigan kuchli fikr.", "Muayyan ijtimoiy guruh, millatning ehtiyojlari va maqsad-muddaolarini o'zida mujassam etuvchi g'oyalar tizimi.", "Arabcha “ma'no” fe'lidan olingan bo'lib, ruh, aql, ong, idrok kabi bir necha ma'nolarni anglatadigan tushuncha.", "Insonni ruhan poklanish, qalban ulg'ayishga chorlaydigan, irodasini baquvvat, iymon e'tiqodini butun qiladigan kuch."], ["Matnda keltirilgan “Mafkura” tushunchasi nimani anglatadi?", "Muayyan ijtimoiy guruh, qatlam, millatning ehtiyojlari va maqsad-muddaolarini o'zida mujassam etadigan g'oyalar tizimi.", "Insonning ichki dunyosi, ruhiy kechinmalari, aqliy qobiliyati va idrokini mujassamlashtiruvchi, baquvvat tushuncha.", "Insonda axloqiy fazilatlarni shakllantirishga qaratilgan va faoliyatni boshqarish tizimi bilan bog'liqdir.", "Bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayoni bo'lib, ijtimoiy-axloqiy me'yorlarga asoslangan."], ["“Ma'naviyat” soʻzi arab tilidagi qaysi fe'ldan olingan bo'lib, asosan qanday ma'nolarni anglatadi?", "“Ma'no” fe'lidan olingan bo'lib, ruh, aql, ong, idrok, ruhiy holat kabi bir necha ma'nolarni anglatadi.", "“Niyat” fe'lidan olingan bo'lib, insonning maqsadlarini, intilishlarini va orzu-umidlarini ifodalaydi.", "“Vujud” fe'lidan olingan bo'lib, shaxsning shakllanishi, uning ichki va tashqi olamining uyg'unligini bildiradi.", "“Tarbiya” fe'lidan olingan bo'lib, bilim olish, malaka va ko'nikmalarni egallash jarayonini ifodalaydi."], ["Birinchi Prezident I.A. Karimovning “Yuksak ma'naviyat – yengilmas kuch” asarida ma'naviyatga berilgan ta'rifga ko'ra, u nimani anglatadi?", "Insonni ruhan poklanish, qalban ulg'ayishga chorlaydigan, irodasini baquvvat, iymon e'tiqodini butun qiladigan kuch.", "Jamiyatning, millatning ichki hayoti, ruhiy kechinmalari, aqliy qobiliyati va idrokini mujassamlashtiruvchi tushuncha.", "Muayyan ijtimoiy guruhning ehtiyojlari va maqsad-muddaolarini o'zida mujassam etadigan g'oyalar tizimi.", "Shaxs va jamiyatning bilim, tafakkur, axloq, qadriyat, madaniyat jihatidan rivojlanishi hamda taraqqiyoti."], ["Matnga ko'ra, “SHAXS” tushunchasi qanday mohiyatni o'zida mujassamlashtirgan individ sifatida ta'riflanadi?", "Alohida kishi bo'lib, ijtimoiy-axloqiy mohiyatni oʻzida mujassamlashtirgan hamda biofiziologik, ijtimoiy, ma'naviy, axloqiy va estetik fazilatlarning yaxlit butunligi.", "Inson tafakkurida vujudga keladigan, ijtimoiy xarakterga ega boʻlgan, ruhiyatga ta'sir o'tkazadigan kuchli va teran fikrlar majmui.", "Insonning xulq-atvorini tartibga soluvchi, uning madaniy va ma'naviy me'yorlarini belgilovchi qoidalar tizimi.", "Muayyan g'oya, qarash yoki tamoyilga boʻlgan ichki ishonch, bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayoni."], ["Matn asosida “Axloq” tushunchasining eng to'g'ri ta'rifini toping.", "Inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar majmuasidir.", "Inson va jamiyat uchun muhim ahamiyatga ega boʻlgan moddiy yoki ma'naviy hodisa, tamoyil va mezonlar.", "Muayyan g'oya, qarash yoki tamoyilga boʻlgan ichki ishonch tushunchasidir.", "Bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayoni."], ["Matnda “Qadriyat” nima deb ta'riflangan?", "Inson va jamiyat uchun muhim ahamiyatga ega boʻlgan moddiy yoki ma'naviy hodisa, tamoyil va mezonlar.", "Inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar majmuasi.", "Muayyan g'oya, qarash yoki tamoyilga boʻlgan ichki ishonch.", "Insoniyat yaratgan moddiy va ma'naviy yutuqlarining yig'indisi."], ["Matnga ko'ra, “E'tiqod” nima?", "Muayyan g'oya, qarash yoki tamoyilga boʻlgan ichki ishonchdir.", "Inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar majmuasi.", "Bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayoni.", "Insoniyat yaratgan moddiy va ma'naviy qadriyatlar majmui."], ["“Ma'rifat” tushunchasining matndagi ta'rifini toping.", "Bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayonidir.", "Inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar majmuasi.", "Muayyan g'oya, qarash yoki tamoyilga boʻlgan ichki ishonch.", "Insoniyat yaratgan moddiy va ma'naviy qadriyatlar majmui."], ["Matnda “Madaniyat” qanday ta'riflangan?", "Insoniyat yaratgan moddiy va ma'naviy qadriyatlar majmuidir.", "Inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar majmuasi.", "Bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayoni.", "Muayyan g'oya, qarash yoki tamoyilga boʻlgan ichki ishonch."], ["Matn bo'yicha “Ma'naviy meros” nimani anglatadi?", "Avlodlardan avlodlarga o'tib kelayotgan ma'naviy, madaniy, ilmiy, axloqiy va tarixiy qadriyatlar majmui.", "Muayyan xalqning tarixiy-madaniy tajribasi bilan bog'liq bo'lgan va asrlardan asrlarga o'tgan qadriyatlar.", "Butun insoniyat uchun umumiy ahamiyatga ega bo'lgan va global madaniyatlarni birlashtiradigan qadriyatlar.", "Shaxs va jamiyatning bilim, tafakkur, axloq, qadriyat, madaniyat hamda dunyoqarash jihatidan rivojlanishi."], ["Matnda “Ma'naviy taraqqiyot” qanday tushuncha sifatida yoritilgan?", "Shaxs va jamiyatning bilim, tafakkur, axloq, qadriyat, madaniyat va dunyoqarash jihatidan rivojlanishi.", "Avlodlardan avlodlarga o'tib kelayotgan ma'naviy, madaniy, ilmiy, axloqiy va tarixiy qadriyatlar majmui.", "Muayyan xalqning tarixiy-madaniy tajribasi bilan bog'liq bo'lgan, doimiy o'zgarib turuvchi qadriyatlar.", "Butun insoniyat uchun umumiy ahamiyatga ega bo'lgan, madaniyatlarni birlashtiruvchi universal qadriyatlar."], ["“Ma'naviyatning tarbiyaviy funksiyasi” nimani oʻz ichiga oladi?", "Insonda axloqiy fazilatlarni shakllantirish, uning ichki dunyosini boyitishni ta'minlashga yo'naltirilgan.", "Inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga solish, jamiyatda barqarorlikni saqlash.", "Jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirish, ijtimoiy birdamlikni mustahkamlash.", "Qadriyatlarni anglash va baholash bilan bog'liq bo'lib, insonning hayotiy qarashlarini belgilash."], ["“Ma'naviyatning regulyativ funksiyasi”ning asosiy maqsadi nimadan iborat?", "Inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga solish va ijtimoiy qoidalarga rioya etish.", "Insonda axloqiy fazilatlarni shakllantirish, uning shaxsiy rivojlanishiga ijobiy ta'sir ko'rsatish.", "Jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirish, fuqarolik mas'uliyatini oshirish.", "Qadriyatlarni anglash va baholash bilan bog'liq bo'lib, insonning dunyoqarashini boyitish."], ["Matnga ko'ra, “Ma'naviyatning integrativ funksiyasi” nimani anglatadi?", "Jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirish, ijtimoiy birdamlikni mustahkamlashga qaratilgan.", "Insonda axloqiy fazilatlarni shakllantirish, uning shaxsiy kamolotiga erishishda muhim rol o'ynaydi.", "Inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga solish, madaniy qoidalarga rioya etish.", "Qadriyatlarni anglash va baholash bilan bog'liq bo'lib, insonning hayotiy prinsiplarini shakllantirish."], ["“Ma'naviyatning aksiologik funksiyasi”ning asosiy mazmuni qanday ifodalangan?", "Qadriyatlarni anglash va baholash bilan bog'liq bo'lib, insonning e'tiqod va tamoyillarini belgilash.", "Insonda axloqiy fazilatlarni shakllantirish, uning shaxsiy madaniy-ma'rifiy darajasini oshirish.", "Inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga solish, jamiyatda ahillikni ta'minlash.", "Jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirish, ijtimoiy madaniyatni rivojlantirish."], ["Oʻzbekiston Respublikasi Prezidentining 2017 yil 7 fevraldagi PF-4947-son Farmonining asosiy maqsadi nimada?", "Oʻzbekiston Respublikasini yanada rivojlantirish bo'yicha Harakatlar strategiyasini tasdiqlash va amalga oshirishdir.", "Yoshlarga oid davlat siyosati samaradorligini oshirish va yoshlar ittifoqi faoliyatini qo'llab-quvvatlash.", "Ma'naviy-ma'rifiy ishlar samaradorligini oshirish va sohani yangi bosqichga ko'tarishga qaratilgan.", "Ma'naviy-ma'rifiy ishlar tizimini tubdan takomillashtirish chora-tadbirlarini belgilash."], ["Shaxs ma'naviyatining shakllanishida qaysi omillar muhim ahamiyatga ega ekanligi matnda ta'kidlangan?", "Ta'lim, tarbiya, ijtimoiy muhit, madaniyat va o'z-o'zini anglash kabi omillar muhim hisoblanadi.", "Faqat biologik (nasl) omillar va shaxsning tabiiy muhitdagi o'ziga xosligi hal qiluvchi ahamiyatga ega.", "Asosan ijtimoiy tajriba va odamlar bilan munosabatlar shaxsning shakllanishida yagona omil bo'lib xizmat qiladi.", "Moddiy boylik, iqtisodiy barqarorlik va milliy axloqiy me'yorlarga to'la rioya qilish eng asosiy omillardir."], ["Matnda “Milliy g'oya”ning umumiy tamoyillari qatorida nimalar keltirilgan?", "Tarixiylik, zamonaviylik, umumbashariylik - mintaqaviylik, milliylik, ilmiylik tamoyillari.", "Faqat madaniy-ma'rifiy yuksaklik, ijtimoiy-didaktik taraqqiyot va falsafiy-pedagogik o'sish tamoyillari.", "Iymon-e'tiqodning butunligi, milliy axloq-odob meyorlariga to'la rioya qilish va ilm-ma'rifatli bo'lish.", "Insonparvarlik, vatanparvarlik, xalqparvarlik, adolatparvarlik, fidoyilik, mardlik va jasurlik tamoyillari."], ["Axloqiy qadriyatlarning asosiy ko'rinishlariga matnda keltirilganlardan qaysilari misol bo'la oladi?", "Insonparvarlik, halollik, tashabbuskorlik, mehnatsevarlik, erksevarlik, ijodkorlik va kamtarlik.", "Xalq og'zaki ijodi (asotir, afsona), xalq tasviriy va amaliy san'ati, xalq teatri va musiqiy san'ati.", "Islom diniga e'tiqod qilish, Vatan va xalq mustaqilligini himoya qilish, ajdodlar merosiga hurmat.", "Madaniy-ma'rifiy yuksaklik, ijtimoiy-didaktik taraqqiyot, falsafiy-pedagogik o'sish va poklanish."], ["Oʻzbek xalqi ma'naviyatini tarixiy bosqichlarga ajratishda qaysi mezon asosiy hisoblanadi?", "Jamiyatning ijtimoiy-siyosiy tuzumi, diniy va falsafiy qarashlar ham muhimdir.", "Faqatgina ilm-fan va madaniyatning taraqqiyot darajasi bu jarayonni belgilaydi.", "Asosiy mezon faqat axloqiy qadriyatlar va milliy oʻzlik shakllanishiga bog'liqdir.", "Ma'naviy merosning avlodlarga yetib kelishi bu jarayonda yagona omildir."], ["Zardushtiylik ta'limotiga koʻra, insonning asosiy mas'uliyati nimadan iborat?", "Inson ezgulik va yovuzlik oʻrtasida ongli ravishda tanlov qilish zaruriyatidir.", "Uning vazifasi faqatgina tabiatni asrash va poklikni saqlashdan iboratdir.", "Mehnatsevarlik va rostgoʻylikni birinchi oʻringa qoʻyish eng muhim jihatidir.", "Diniy marosimlarni bajarish va adolat tamoyillariga rioya qilish asosiy o'rinda turadi."], ["“Avesto” asarini oʻrganish oʻzbek xalqi ma'naviyati tarixida qanday ahamiyatga ega?", "Oʻzbek xalqi ma'naviyatining qadimgi ildizlarini anglashda muhim rol oʻynaydi.", "Asosan diniy e'tiqodlarning rivojlanish bosqichlarini tushuntirishga xizmat qiladi.", "Unda faqatgina Markaziy Osiyo qadimgi xalqlarining urf-odatlari tasvirlangan.", "U ma'naviy merosning faqat falsafiy jihatlarini oʻrganish uchun yaratilgandir."], ["Markaziy Osiyoda islom dinining tarqalishi bilan birga qaysi sohalar rivojlandi?", "Ilm-fan, ta'lim, falsafa, adabiyot va axloqiy tafakkur ham yuksalgan.", "Asosan hunarmandchilik va savdo-sotiq sohalari faol rivojlangan edi.", "Faqatgina siyosiy tuzumlar va davlatlilik an'analari mustahkamlangan.", "Yangi yozuv tizimlari joriy etilgan va faqat madaniy mezonlar oʻzgargan."], ["Forobiyning “Fozil odamlar shahri” asarida qaysi masalalar yoritilgan?", "Fozil jamiyat va insonning ma'naviy-axloqiy kamoloti masalalari yoritiladi.", "Asarda faqatgina falsafiy qarashlar va ilmiy bilimlarning ahamiyati berilgan.", "Unda asosan davlat boshqaruvi va ijtimoiy-siyosiy tizimlar haqida fikrlar bor.", "Insonning tabiiy muhitga ta'siri va uning ekologik muammolari ko'rsatilgan."], ["Ibn Sino ilmni inson hayotini yaxshilashda qanday vosita deb bilgan?", "U ilmni inson hayotini yaxshilashga xizmat qiluvchi muhim vosita deb bilgan.", "Ilm faqat shaxsiy kamolotga erishish uchun asosiy vosita hisoblangan.", "Uning fikricha, ilm diniy marosimlarni tushunish uchun zarur boʻlgan.", "Bilim insonning faqat axloqiy tarbiyasiga ta'sir ko'rsatadigan omildir."], ["Abu Rayhon Beruniyning “Hindiston” asari nimani oʻrganishda muhim manba hisoblanadi?", "Hindiston xalqi madaniyati, dini, urf-odatlari va ilmiy qarashlarini oʻrganishda.", "Markaziy Osiyo davlatlarining siyosiy tizimlarini chuqur tahlil qilishda.", "Sharq falsafasining taraqqiyot bosqichlarini tasvirlashda yagona manbadir.", "Tabiiy fanlar rivojlanishi va matematik formulalarni tushuntirishda xizmat qiladi."], ["Yusuf Xos Hojibning “Qutadgʻu bilig” asarida qaysi gʻoyalar ilgari surilgan?", "Adolat, aql, bilim, axloq, davlat boshqaruvi va insoniy fazilatlar haqida.", "Asosan tabiatni asrash va ekologik muammolarni hal qilish usullari haqida.", "Undagi asosiy gʻoya faqatgina diniy e'tiqodlarning ustunligini koʻrsatishdir.", "Jamiyatning ijtimoiy-iqtisodiy rivojlanishini ta'minlash yo'llari tasvirlangan."], ["Mahmud Koshg'ariyning “Devonu lugʻotit turk” asarining asosiy ahamiyati nimada?", "Turkiy xalqlarning qadimgi madaniy va ma'naviy hayotini oʻrganishda.", "Unda faqatgina Turkiston xalqlarining siyosiy tuzumlari tahlil qilingan.", "Asosan oʻsha davrning yozuv usullari va til grammatikasi tasvirlangan.", "Faqatgina turkiy tillarning leksik tarkibini oʻrganishga bagʻishlangan."], ["Amir Temur va Temuriylar davrida Movarounnahrda qaysi sohalar rivojlandi?", "Ilm-fan, adabiyot, san'at, me'morchilik va madaniyat rivojlanishi kuzatilgan.", "Bu davrda faqatgina harbiy san'at va strategik bilimlar yuksalgan edi.", "Asosan qishloq xoʻjaligi va irrigatsiya tizimlari kengaytirildi, e'tibor berildi.", "Siyosiy hokimiyatni mustahkamlash va faqat diniy ilm-fan taraqqiy etdi."], ["Alisher Navoiy ijodining asosiy gʻoyalari nimalardan iborat?", "Insonparvarlik, adolat, saxovat, mehr-oqibat, ilm, ma'rifat va komil inson.", "Uning asarlarida faqatgina tarixiy voqealar va janglar tasvirlangan edi.", "Navoiy ijodi asosan diniy e'tiqodlarni tarqatishga qaratilgan edi.", "Tabiat goʻzalliklari va geografik kashfiyotlar haqida yozgan edi u."], ["XIX asr oxiri – XX asr boshlaridagi jadidchilik harakatining maqsadi nima edi?", "Jamiyat taraqqiyotini ta'lim, ilm-fan va ma'rifat bilan bog'lash edi.", "Asosan siyosiy hokimiyatni oʻzgartirish va yangi davlat tuzish asosiy maqsad edi.", "Ular faqatgina diniy ta'limni kengaytirish va eski urf-odatlarni saqlab qolishdi.", "Iqtisodiy islohotlarni amalga oshirish va savdo-sotiqni rivojlantirish uchun."], ["Ma'naviyat tushunchasi oʻz ichiga nimalarni qamrab oladi?", "Kishilarning falsafiy, huquqiy, ilmiy, badiiy, axloqiy, diniy tasavvurlarini.", "Faqatgina insonning jismoniy va ruhiy rivojlanishini ifodalaydi.", "Asosan moddiy boyliklar yaratish va ulardan foydalanish jarayonlarini.", "Madaniyat va san'atning rivojlanish darajasini yorituvchi tushunchadir."], ["Erkin Yusupov ta'rifiga koʻra, ma'naviyatning asosiy xususiyati qanday?", "Insonning faqat ijobiy xislatlarinigina o'z ichiga oluvchi mushtarak tizimdir.", "Faqat insonning bilim darajasi va aql-idrokini ifodalovchi tushuncha hisoblanadi.", "U jamiyatdagi ijtimoiy-siyosiy qarashlar va mafkuralarni aks ettiruvchi omildir.", "Ma'naviyat insonning diniy e'tiqodlari va urf-odatlari majmuasini anglatadi."], ["Kaykovusning “Qobusnoma” asarida bilimning foydasi qanday tushuntirilgan?", "Aqlli boʻlish boy boʻlishdan afzal, chunki aql molni topadi, mol aqlni emas.", "Asarda boylikning inson hayotidagi ahamiyati va uni saqlash yo'llari berilgan.", "Faqatgina ma'naviy boyliklar moddiy boyliklardan ustun ekanligi ta'kidlangan.", "Bilim insonni yovuzlikdan himoya qiluvchi asosiy omil sifatida ko'rsatilgan."], ["1996 yil 9 sentabrda qabul qilingan Farmon qaysi markaz faoliyatini takomillashtirishga qaratilgan?", "Oʻzbekiston Respublikasi Prezidentining “Ma'naviyat va ma'rifat” jamoatchilik markazi.", "Oliy ta'lim tizimini isloh qilish va yangi dasturlar yaratish boʻyicha markaz.", "Madaniyat va sport ishlari vazirligi qoshidagi madaniyat markazi rivojlantirishga.", "Xalq ta'limi vazirligi huzuridagi ta'lim-tarbiya jarayonlarini boshqarish markazi."], ["2021 yil 26 martdagi PQ-5040-son Qarorining asosiy maqsadi nimadan iborat?", "Ma'naviy-ma'rifiy ishlarni tubdan takomillashtirish va “Milliy tiklanishdan – milliy yuksalish sari” g'oyasini targ'ib etish.", "Sogʻliqni saqlash tizimini isloh qilish va aholi salomatligini mustahkamlashga qaratilgan chora-tadbirlar ishlab chiqish.", "Iqtisodiyotning raqobatbardoshligini oshirish va investitsiya muhitini yaxshilash boʻyicha kompleks dasturlarni amalga oshirish.", "Qishloq xoʻjaligi sohasini modernizatsiya qilish va oziq-ovqat xavfsizligini ta'minlash boʻyicha strategiyalarni joriy etish."], ["Forobiyning fikricha, insonlararo munosabatlarda nima asosiy birlashtiruvchi asosdir?", "Odamlarni birlashtiruvchi boshlang'ich asos insoniylik boʻlib, tinchlikda yashash kerak.", "Ularning umumiy madaniy merosi va tarixiy qadriyatlari asosiy birlashtiruvchi omildir.", "Siyosiy tuzum va davlat boshqaruvi tizimlari insonlararo birdamlikni ta'minlaydi.", "Diniy e'tiqodlar va bir xil falsafiy qarashlar insonlararo munosabatlarni mustahkamlaydi."], ["Ibn Sinoning “Ash-Shifo” asarida do'stlik qanday ta'riflangan?", "Bunda inson boshqa birovga yaxshilik istaydi, oʻzi uchun emas, balki boshqa uchundir.", "Do'stlik faqat bir xil manfaatlar yo'lida birlashgan ikki kishining munosabatidir.", "U faqatgina bilimdon va aqlli insonlar o'rtasidagi o'zaro hurmatga asoslanadi.", "Do'stlik ijtimoiy maqomni oshiruvchi va amaliy masalalarda yordam beruvchi holatdir."], ["Madaniy mezon Oʻzbek xalqi ma'naviyati rivojlanishini davrlashtirishda nimani oʻz ichiga oladi?", "Yozuv, adabiyot, san'at, me'morchilik va urf-odatlarning rivojlanishi.", "Asosan ijtimoiy-siyosiy tuzum oʻzgarishlari va davlat boshqaruvi tizimlari.", "Faqatgina diniy e'tiqodlar va dunyoqarashlarning shakllanish jarayoni.", "Ilm-fan, ta'lim va tafakkurning umumiy taraqqiyot darajasi va holati."], ["Oʻzbek xalqi ma'naviyatini tarixiy bosqichlarga ajratishda asosiy mezonlar sifatida qaysilar olinadi?", "Jamiyatning ijtimoiy-siyosiy tuzumi, diniy falsafiy qarashlar va milliy oʻzlikning shakllanishi,", "Faqatgina iqtisodiy rivojlanish darajasi, tabiiy resurslar va geografik joylashuvlar,", "Asosan boshqa davlatlar madaniyati ta'siri, harbiy qudrat va siyosiy hukmronlik,", "Geografik joylashuvning oʻzgarishi, tashqi savdo hajmi va aholi sonining oʻsishi,"], ["Oʻzbek xalqi ma'naviyatini davrlashtirishdagi \"Ijtimoiy-siyosiy mezon\" nimani anglatadi?", "Davlatlar va siyosiy tuzumlarning oʻzgarishi orqali ma'naviyat taraqqiyotini oʻrganishni,", "Faqatgina madaniyat sohasidagi oʻzgarishlar va san'at turlarining rivojlanishini,", "Asosan milliy urf-odatlar va an'analarning shakllanish jarayonlarini ta'riflashni,", "Ilm-fan va ta'lim sohasidagi yutuqlar hamda tafakkur taraqqiyotini,"], ["Oʻzbek xalqi ma'naviyatini davrlashtirishdagi \"Axloqiy mezon\" nimani ifodalaydi?", "Ezgulik, adolat, halollik va insonparvarlik kabi qadriyatlarning rivojlanishi,", "Diniy e'tiqodlar tizimi va dunyoqarashlarning evolyutsion taraqqiyotini,", "Asosan yozuv, adabiyot, san'at va me'morchilikdagi yutuqlarning oʻsishini,", "Xalqning oʻz tili, tarixi, madaniyati va milliy qadriyatlarini anglashni,"], ["\"Milliy oʻzlik mezoni\" deganda nima tushuniladi?", "Xalqning oʻz tili, tarixi, madaniyati va qadriyatlarini anglash jarayoni,", "Jamiyatdagi ijtimoiy-siyosiy tuzilmalarning doimiy oʻzgarishi holati,", "Ilm-fan, ta'lim-tarbiya va tafakkurning rivojlanish sur'atlari darajasi,", "Diniy e'tiqodlar va turli mafkuraviy qarashlarning toʻplami,"], ["Oʻzbek xalqi ma'naviyatining dastlabki ildizlari qaysi qadimgi manba bilan bogʻliq?", "\"Avesto\" va Zardushtiylik ta'limotining axloqiy qarashlari bilan,", "Qadimgi Yunoniston falsafasi va Rim imperiyasi madaniyati bilan,", "Misr piramidalari qurilishi va Mesopotamiya sivilizatsiyalari bilan,", "Xitoyning Konfutsiy ta'limoti va Buddizm diniy qarashlari bilan,"], ["Zardushtiylik ta'limotida qanday qadriyatlar ulug'lanadi?", "Rostgoʻylik, adolat, mehnatsevarlik, poklik, ezgulik va tabiatni asrash,", "Harbiy mahorat, istilochilik, boylik toʻplash va hukmronlikka intilish,", "Individualizm, shaxsiy manfaat, boshqalardan ustun boʻlish gʻoyalari,", "Faqatgina diniy marosimlarni bajarish va jamoaviy ibodat qilish,"], ["IX-XII asrlarda Movarounnahr va Xurosonda yashagan buyuk mutafakkirlar qatoriga kimlar kiradi?", "Muhammad al-Xorazmiy, Abu Nasr Forobiy, Abu Ali ibn Sino va Abu Rayhon Beruniy,", "Imom Buxoriy, Imom Termiziy, Ahmad Yassaviy va Alisher Navoiy kabi allomalar,", "Beruniy, Ibn Rushd, Ibn Xaldun va Avloniy kabi yirik islom faylasuflari,", "Yusuf Xos Hojib, Mahmud Koshg'ariy, Axmad Yassaviy va Lutfiy kabi mutafakkirlar,"], ["Abu Nasr Forobiyning \"Fozil odamlar shahri\" asarida qaysi masalalar yoritilgan?", "Fozil jamiyat va insonning ma'naviy-axloqiy kamoloti masalalari,", "Davlatlar oʻrtasidagi siyosiy munosabatlar va harbiy strategiyalar,", "Geografik kashfiyotlar va turli xalqlarning yashash tarzlari ta'rifi,", "Asosan astronomik kuzatishlar va matematika fanining nazariy asoslari,"], ["Abu Ali ibn Sino ilmning inson hayotidagi ahamiyati haqida qanday fikr bildirgan?", "Ilmni inson hayotini yaxshilashga xizmat qiluvchi muhim vosita deb bilgan,", "Ilm faqatgina diniy aqidalarni tushunish uchun zarur deb hisoblagan,", "Ilmni faqat boylik toʻplash va hokimiyatga erishish vositasi deb bilgan,", "Ilm-fan taraqqiyotini shaxsiy izlanishlarning yagona natijasi deb bilgan,"], ["Abu Rayhon Beruniyning \"Hindiston\" asarining asosiy ahamiyati nimada?", "Hindiston xalqi madaniyati, dini, urf-odatlari va ilmiy qarashlarini oʻrganishda,", "Markaziy Osiyo davlatlarining harbiy-siyosiy ahvolini tahlil qilishda,", "Geografik xaritalar tuzish va yangi savdo yoʻllarini kashf etishda,", "Tibbiyot va farmakologiya sohasidagi yangi dorilarni aniqlashda,"], ["XI asrda yaratilgan Yusuf Xos Hojibning \"Qutadg'u bilig\" asari nimani targʻib qiladi?", "Adolat, aql, bilim, axloq, davlat boshqaruvi va insoniy fazilatlarni,", "Faqatgina harbiy kuch va siyosiy hukmronlikning ustuvorligini,", "Shaxsiy boylik orttirish va shaxsiy manfaatni birinchi oʻringa qoʻyishni,", "Diniy aqidalarni soʻzsiz qabul qilish va ibodatning muhimligini,"], ["Mahmud Koshg'ariyning \"Devonu lugʻotit turk\" asarining oʻzbek xalqi ma'naviyatidagi oʻrni nimada?", "Turkiy xalqlarning qadimgi madaniy va ma'naviy hayotini oʻrganish uchun muhim manba,", "Faqatgina turkiy tillarning grammatik qoidalarini aniqlashga xizmat qilgan ensiklopediya,", "Arab falsafasi va yunon ilmining tarjimasi boʻlgan fundamental ilmiy tadqiqot,", "Samarqanddagi astronomik kuzatuvlar natijalarini jamlagan asar sifatida,"], ["XIV-XV asrlarda Temuriylar davrida Mirzo Ulugʻbek asosan qaysi sohalarda yirik ilmiy ishlar olib borganligi bilan tanilgan?", "Astronomiya va matematika sohalarida chuqur ilmiy tadqiqotlar oʻtkazganligi bilan,", "Tilshunoslik va adabiyotshunoslik nazariyalarini rivojlantirganligi bilan,", "Tibbiyot va farmakologiya boʻyicha yangi kashfiyotlar qilganligi bilan,", "Ijtimoiy-siyosiy falsafa va davlat boshqaruvi prinsiplarini asoslaganligi bilan,"], ["Alisher Navoiy ijodidagi asosiy gʻoyalar qaysilar va uning \"Xamsa\" asarining ahamiyati nimada?", "Insonparvarlik, adolat, saxovatni targʻib etgan, \"Xamsa\" turkiy adabiyotning yirik yodgorligidir", "Diniy aqidalarni himoya qilish va tasavvufiy yoʻnalishlarni rivojlantirishga bagʻishlangan,", "Davlat boshqaruvi tizimini isloh qilish boʻyicha siyosiy risolalarni taqdim etgan,", "Harbiy san'at va strategiyalarni oʻrganishga qaratilgan asarlarini yaratgan,"], ["XIX asr oxiri – XX asr boshlarida jadidchilik harakatining asosiy maqsadi nimadan iborat edi?", "Jamiyat taraqqiyotini ta'lim, ilm-fan va ma'rifat bilan bogʻlash, milliy ongni yuksaltirish,", "Qadimgi diniy aqidalarni qat'iy himoya qilish va oʻzgarmasligini ta'minlash,", "Mahalliy madaniyatni tashqi ta'sirlardan butunlay ajratish va izolyatsiya qilish,", "Faqatgina siyosiy mustaqillikka erishish va harbiy qudratni oshirishga intilish,"], ["Matnda berilgan ta'rifga koʻra, \"ma'rifat\" tushunchasi nimani anglatadi?", "Kishilarning ongini, bilimini, madaniyatini oshirishga qaratilgan ta'lim-tarbiya,", "Muayyan ijtimoiy guruhning siyosiy-iqtisodiy manfaatlari tizimi hisoblanadi,", "Xalqning oʻz tili, tarixi va urf-odatlarini chuqur anglash jarayoni sifatida,", "Insonning ruhiy va aqliy olamini ifodalovchi falsafiy qarashlar majmuasi,"], ["Matnda berilgan ta'rifga koʻra, \"ma'naviyat\" tushunchasi asosan nimani ifodalaydi?", "Inson ruhiy va aqliy olamini ifodalovchi falsafiy, huquqiy, ilmiy, badiiy tasavvurlar,", "Muayyan millat hayotiga mazmun baxsh etadigan va uni ezgu maqsad sari yetaklaydigan fikrlar,", "Shaxsda muayyan jismoniy, ruhiy, axloqiy sifatlarni shakllantirishga qaratilgan amaliy jarayon,", "Bilim berish, malaka va koʻnikmalar hosil qilishga yoʻnaltirilgan ta'lim jarayoni,"], ["Erkin Yusupovning ta'rifiga koʻra, \"Ma'naviyat\" tushunchasining mohiyati nimada?", "Insonning axloqi, odobi, bilimlari va qadriyatlarining jamiyat taraqqiyotiga ijobiy ta'siri,", "Faqatgina diniy e'tiqodlar va urf-odatlar yigʻindisi boʻlib, shaxsiy vijdonga asoslangan,", "Ijtimoiy guruhlarning faqat iqtisodiy manfaatlari va siyosiy maqsadlarini ifodalash,", "Ilm-fan va texnologiyalar rivojlanishining yagona omili boʻlib xizmat qilishi,"], ["Kaykovusning \"Qobusnoma\" asarida aqlning qadriga oid qanday asosiy fikr ilgari surilgan?", "Aql mol-dunyo bilan jamlanishi mumkin, ammo mol-dunyo bilan aql oʻrganib boʻlmaydi,", "Mol-dunyo insonning asosiy qadriyati boʻlib, u hamma narsadan ustun turadi,", "Aql va bilim faqatgina zodagonlarga xos boʻlib, oddiy xalq uchun emasdir,", "Insonning baxt-saodati faqatgina moddiy boyliklarga erishish orqali ta'minlanadi,"], ["Ibn Sinoning \"Ash-Shifo\" asaridagi \"Do'stlik\" ta'rifiga koʻra, doʻstlikning mohiyati nimadan iborat?", "Do'stlikda inson yaxshilikni oʻzi uchun emas, balki boshqa birov uchun istaydi,", "Do'stlik faqatgina shaxsiy manfaatlarga erishish vositasi boʻlib xizmat qiladi,", "Do'stlikning asosiy maqsadi iqtisodiy yordam va siyosiy ittifoqlarni shakllantirish,", "Do'stlik insonlar oʻrtasidagi raqobatni kuchaytiruvchi omil hisoblanadi,"], ["Inson tafakkurida vujudga keladigan, ijtimoiy xarakterga ega boʻlgan, ruhiyatga ta'sir oʻtkazib, jamiyat va odamlarni harakatga chorlaydigan, maqsad-muddao sari etaklaydigan kuchli va teran fikr nima deb ataladi?", "Bu insonning ongi va tafakkurida shakllanadigan, chuqur ijtimoiy ma'noga ega boʻlgan kuchli va teran fikr G'oya deb nomlanadi.", "Bu insonning ichki kechinmalarini aks ettiradigan, shaxsiy istaklarni ifodalaydigan, sub'ektiv tuyg'u tuyg'u Mafkura deb nomlanadi.", "Bu insonning aql-idroki va ongida paydo boʻladigan, moddiy boyliklarga intilishni aks ettiradigan fikr Erkinlik deb nomlanadi.", "Bu insonning xayolot dunyosida mavjud boʻladigan, real hayotga aloqasi boʻlmagan tushuncha Madaniyat deb nomlanadi."], ["Muayyan ijtimoiy guruh, qatlam, millat, davlat, xalq va jamiyatning ehtiyojlari, maqsad-muddaolari, manfaatlari, orzu intilishlari hamda ularni amalga oshirish tamoyillarini oʻzida mujassam etadigan g'oyalar tizimi nima deb ataladi?", "Bu ijtimoiy birliklarning istak va intilishlarini jamlagan g'oyalar tizimi Mafkura deyiladi, shubhasiz va toʻgʻri javobdir.", "Bu ijtimoiy birliklarning xatti-harakatlarini boshqaradigan shaxsiy tuyg'ular yig'indisi Millat deyiladi, aniqroq javob talab qiladi.", "Bu ijtimoiy birliklarning madaniy merosini aks ettiruvchi qadriyatlar majmui San'at deyiladi, bu ham notoʻgʻri variant hisoblanadi.", "Bu ijtimoiy birliklarning maishiy ehtiyojlarini qondirishga qaratilgan harakatlar majmui G'oya deyiladi, biroz xato javob variantidir."], ["Qaysi arabcha so'zdan olinganligi hamda ruh, aql, ong, idrok, ruhiy holat, ichki kayfiyat, dadillik, jasorat, xususiyat, mohiyat, g'amxo'rlik kabi ma'nolarni anglatuvchi tushuncha Ma'naviyatdir?", "Ma'naviyat soʻzi arab tilidagi \"ma'no\" fe'lidan kelib chiqqan bo'lib, keng ma'noga ega tushunchadir.", "Ma'naviyat soʻzi turkiy tildagi \"maqsad\" fe'lidan olingan bo'lib, chuqur falsafiy ma'no kasb etuvchi iboradir.", "Ma'naviyat soʻzi forsiy tildagi \"aqil\" fe'lidan hosil boʻlgan bo'lib, ilmiy bilimlarni ifodalaydi.", "Ma'naviyat soʻzi rus tilidagi \"dux\" fe'lidan kelib chiqqan bo'lib, diniy qarashlarni mujassam etadi."], ["Oʻzbekiston Respublikasining Birinchi Prezidenti I.A. Karimovning “Yuksak ma'naviyat – yengilmas kuch” asarida ma'naviyatga qanday ta'rif berilgan?", "Ma'naviyat insonni ruhan poklanishga, qalban ulg'ayishga chorlaydigan beqiyos kuchdir.", "Ma'naviyat insonning moddiy ehtiyojlarini qondirishga qaratilgan harakatlar majmuasidir.", "Ma'naviyat insonning jismoniy rivojlanishini ta'minlaydigan sport faoliyatidir.", "Ma'naviyat insonning intellektual salohiyatini oshiradigan bilimlar yig'indisidir."], ["Zardushtiylik axloqining asosiy qoidasi boʻlgan va \"Avesto\"da keltirilgan ezgu tamoyillar nimalardan iborat?", "Zardushtiylik axloqining asosiy qoidasi \"ezgu fikr, ezgu soʻz, ezgu amal\" tamoyilidir.", "Zardushtiylik axloqining asosiy qoidasi \"ezgu tuyg'u, ezgu maqsad, ezgu orzu\" tamoyilidir.", "Zardushtiylik axloqining asosiy qoidasi \"ezgu ish, ezgu harakat, ezgu mehnat\" tamoyilidir.", "Zardushtiylik axloqining asosiy qoidasi \"ezgu hayot, ezgu turmush, ezgu orom\" tamoyilidir."], ["Quyidagilardan qaysi biri Islom Karimov ilgari surgan g'oyalar natijasi oʻlaroq aniqlangan ma'naviyatning tarkibiy qismlariga KIRMADI?", "Iqtisodiy barqarorlik va moddiy farovonlik – ma'naviyatning tarkibiy qismi emas.", "Madaniy-ma'rifiy yuksaklik hamda ijtimoiy-didaktik taraqqiyot – ma'naviyatning muhim tarkibiy qismidir.", "Milliy axloq-odob me'yorlariga rioya qilish va ilm-ma'rifatli bo'lish – ma'naviyat tarkibiga kiradi.", "Vatanparvarlik, xalqparvarlik, fidoyilik va ajdodlarga hurmat – ma'naviyatning ajralmas bo'lagidir."], ["Islom Karimov ilgari surgan g'oyalar natijasi oʻlaroq aniqlangan ma'naviyatning tarkibiy qismlaridan biri sifatida quyidagilardan qaysi biri koʻrsatilgan?", "Ajdodlar va ularning merosiga chuqur hurmat – ma'naviyatning asosiy tarkibiy qismlaridan biridir.", "Texnologik innovatsiyalar va zamonaviy ishlab chiqarish – ma'naviyatning tarkibiy qismiga kirmaydi.", "Xalqaro siyosatdagi yetakchilik va harbiy qudratni oshirish – ma'naviyat bilan bog'liq emas.", "Atrof-muhitni muhofaza qilish va ekologik tozalik – ma'
