<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#5f6b7a;--line:#d9dee5;--accent:#2563eb;
--ok-bg:#dcfce7;--ok-line:#16a34a;--ok-text:#14532d;--bad-bg:#fee2e2;--bad-line:#dc2626;--bad-text:#7f1d1d;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--card:#1c2027;--text:#e8ebef;--muted:#9aa5b4;--line:#323945;--accent:#60a5fa;
--ok-bg:#12351f;--ok-line:#22c55e;--ok-text:#bbf7d0;--bad-bg:#3b1618;--bad-line:#f87171;--bad-text:#fecaca;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--card:#1c2027;--text:#e8ebef;--muted:#9aa5b4;--line:#323945;--accent:#60a5fa;
--ok-bg:#12351f;--ok-line:#22c55e;--ok-text:#bbf7d0;--bad-bg:#3b1618;--bad-line:#f87171;--bad-text:#fecaca;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.muted{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.q{font-size:1.1rem;font-weight:600;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-text)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-text)}
.btn{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
.btn.sec{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.score{font-size:2.4rem;font-weight:700;margin:6px 0}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev b{display:block;margin-bottom:4px}
.rev .a{border-radius:6px;padding:4px 8px;margin:3px 0;font-size:.95rem}
.hidden{display:none}
.sub{display:flex;justify-content:space-between;gap:10px}
.sub.sel{border-color:var(--accent);background:var(--ok-bg);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.sub small{color:var(--muted)}
input[type=number]{font:inherit;width:90px;padding:8px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--text)}

<script>
const SUBJ=[{"name": "II jahon urushi tarixining dolzarb muammolari", "q": [["Germaniyada Adolf Gitler boshchiligidagi natsional-sotsialistik ishchi partiyasi qaysi yilda hokimiyatga keldi?", "Natsional-sotsialistik ishchi partiyasi Germaniyada 1933-yil yanvar oyida hokimiyat tepasiga kelgan edi.", "Natsional-sotsialistik ishchi partiyasi Germaniyada 1938-yil sentabr oyida hokimiyatga keldi.", "Natsional-sotsialistik ishchi partiyasi Germaniyada 1929-yil aprel oyida hokimiyatga kelgan edi.", "Natsional-sotsialistik ishchi partiyasi Germaniyada 1941-yil iyun oyida hokimiyatga kelgan edi."], ["1938-yilgi Myunxen kelishuvi doirasida Germaniyaning Chexoslovakiyani bosib olishga tayyorlanishiga nima turtki bo'ldi?", "Avstriya anshlyus qilingandan so'ng Germaniya Chexoslovakiyaga hujum qilishga tayyorlana boshladi.", "Avstriya hududida xalq referendumi o'tkazilgandan so'ng Chexoslovakiyaga bosim o'tkazildi.", "Germaniya Polsha bilan harbiy ittifoq tuzganidan keyin Chexoslovakiyaga yaqinlashdi.", "Fransiyaning Chexoslovakiyaga harbiy yordam berishidan so'ng Germaniya tayyorlandi."], ["Anshlyusning asosiy sabablaridan biri sifatida matnda qaysi g'oya keltirilgan?", "Adolf Gitlerning \"Main Kampf\" asarida bayon etilgan Pangermanizm g'oyasi muhim ahamiyatga ega edi.", "Germaniyaning iqtisodiy inqirozini bartaraf etish uchun yangi bozorlarni topish zarurati edi.", "Buyuk Britaniya va Fransiya tomonidan qo'llab-quvvatlash istagi Germaniyani harakatga undadi.", "Shveysariya bilan hududiy kelishmovchiliklarni hal qilish ehtiyoji asosiy sabab bo'lgan."], ["1938-yil 10-aprelda o'tkazilgan Avstriya anshlyusi referendumining tabiati qanday baholangan?", "Referendum 99,7% ovoz bilan birlashishni yoqlagan, ammo \"soxta\" deb ta'riflangan holda qonuniylashtirilgan.", "Referendum xalqaro kuzatuvchilar tomonidan to'liq adolatli va haqqoniy deb tan olingan.", "Referendum BMT tomonidan tashkillashtirilgan bo'lib, xalqning chinakam xohishini ifodalagan.", "Referendumda Avstriya xalqi Germaniya bilan birlashishga qarshi ovoz berishni afzal ko'rgan."], ["Myunxen bitimi natijasida Chexoslovakiyaga nisbatan qanday qaror qabul qilindi?", "Buyuk Britaniya va Fransiya bosimi ostida Chexoslovakiyani bo'lib tashlash talabi rasmiylashtirildi.", "Chexoslovakiya Germaniyaga to'liq suverenitetini saqlab qolish sharti bilan qo'shildi.", "Chexoslovakiya mudofaa ittifoqiga kirdi va hududiy yaxlitligini mustahkamladi.", "Chexoslovakiyaga Yevropa davlatlari tomonidan harbiy kafolatlar berildi."], ["Nega Germaniya aynan Chexoslovakiyani nishonga oldi?", "Chexoslovakiyaning Sudet viloyati strategik joylashuvi va harbiy istehkomlari sababli edi.", "Chexoslovakiyaning yirik dengizga chiqish imkoniyatlaridan foydalanish maqsadida tanlandi.", "Chexoslovakiya hududida katta miqdorda oltin zaxiralari borligi Germaniyani qiziqtirgan.", "Chexoslovakiya hukumati Germaniyaga ittifoq tuzishni taklif qilgani uchun nishon bo'ldi."], ["Chexoslovakiyaning Germaniya tahdidiga nisbatan pozitsiyasi qanday edi?", "Mamlakat o'z suverenitetini himoya qilishga tayyor bo'lib, yaxshi qurollangan armiyaga ega edi.", "Mamlakat Germaniya bilan muzokaralar olib borishga intilib, harbiy qarshilik ko'rsatishdan voz kechdi.", "Mamlakat BMTning tinchlikparvar kuchlariga yordam so'rab murojaat qilishni rejalashtirgan.", "Mamlakatning harbiy resurslari Germaniyanikidan sezilarli darajada ustunlik qilardi."], ["Anshlyus atamasi siyosiy tarixda qanday ma'noni anglatadi?", "Bu atama bir davlatning boshqa davlat tomonidan bosim yoki kuch ishlatish orqali o'z tarkibiga qo'shib olinishini anglatadi.", "Bu atama xalqaro shartnomalar orqali ikki davlatning ixtiyoriy birlashishi jarayonini anglatadi.", "Bu atama harbiy mojarolarni oldini olish uchun tuzilgan mudofaa ittifoqini bildiradi.", "Bu atama o'zaro manfaatlar asosida tuzilgan iqtisodiy va siyosiy hamkorlikni ifodalaydi."], ["Uinston Cherchill Myunxen kelishuvi haqida qanday baho bergan?", "Cherchill Myunxen bitimini \"nomus yoki urush o'rtasida tanlov berildi, siz nomusni yo'qotdingiz\" deb baholadi.", "Cherchill Myunxen bitimini Yevropada tinchlikni ta'minlashning muhim qadami deb hisoblagan edi.", "Cherchill Myunxen bitimini Germaniyaning agressiv siyosatini to'xtatishning muvaffaqiyatli yo'li deb atagan.", "Cherchill Myunxen bitimi orqali Buyuk Britaniyaning xalqaro obro'si yanada oshganini ta'kidladi."], ["Molotov-Ribbentrop pakti qaysi sanada imzolangan edi?", "Sovet-German paktining imzolanishi 1939-yil 23-avgust kuni amalga oshirilgan edi.", "Sovet-German paktining imzolanishi 1938-yil 29-sentabr kuni amalga oshirilgan edi.", "Sovet-German paktining imzolanishi 1940-yil 10-aprel kuni amalga oshirilgan edi.", "Sovet-German paktining imzolanishi 1941-yil 22-iyun kuni amalga oshirilgan edi."], ["Molotov-Ribbentrop paktining imzolanishiga SSSR tomonidan asosiy sabablardan biri nima edi?", "Stalin G'arb davlatlarining Gitler tajovuzkorligini SSSRga qarshi yo'naltirishidan xavotirlangan.", "Stalin Polshaning Germaniyaga qarshi ittifoqiga qo'shilishdan manfaatdor bo'lganligi uchun.", "Stalin Germaniya bilan iqtisodiy hamkorlikni kengaytirishni asosiy maqsad qilib qo'ygan edi.", "Stalin Yaponiya bilan Uzoq Sharqdagi ziddiyatlarni tinch yo'l bilan hal qilishni xohlagan."], ["Ikkinchi jahon urushi qaysi voqea bilan boshlangan?", "Ikkinchi jahon urushi 1939-yil 1-sentabr kuni Germaniyaning Polshaga bostirib kirishi bilan boshlangan.", "Ikkinchi jahon urushi 1938-yil 29-sentabr kuni Myunxen kelishuvi imzolanishi bilan boshlangan.", "Ikkinchi jahon urushi 1940-yil 10-aprel kuni Avstriya anshlyus qilinishi bilan boshlangan.", "Ikkinchi jahon urushi 1941-yil 22-iyun kuni Germaniyaning SSSRga hujumi bilan boshlangan."], ["Germaniyaning Polshaga hujum qilish uchun \"feyk sabab\" sifatida qaysi voqea ishlatilgan?", "Gleyvitsdagi radiostansiyaga polyaklar hujum qildi degan uydirma voqea ishlatilgan.", "Polshaning Germaniya chegarasida harbiy mashqlar o'tkazishi bahona qilib ko'rsatilgan.", "Polsha davlatining Germaniyaga nisbatan diplomatik e'tirozlari asosiy sabab bo'lgan.", "Buyuk Britaniya tomonidan Polshani qo'llab-quvvatlash to'g'risidagi bayonotlar ishlatilgan."], ["\"G'alati urush\" (Phoney War) atamasi nimani anglatadi?", "Urush e'lon qilingan, lekin amalda yirik janglar ketmagan davrni anglatadi.", "Yashin tezligidagi hujum taktikasi qo'llanilib, qisqa muddatda g'alaba qozonishni anglatadi.", "Ikki davlat o'rtasida harbiy mojarosiz, diplomatik muzokaralar davrini anglatadi.", "Yolg'on sabablar bilan boshlangan va keyin tezda tugagan harbiy harakatlarni anglatadi."], ["1939-yil 17-sentabrda SSSR Polshaga qo'shin kiritish uchun qanday bahona ishlatgan?", "\"Ukrain va belorus qardoshlarni himoya qilish\" shiori ostida qo'shin kiritilgan.", "Polsha hukumati Sovet hududiga harbiy hujum uyushtirgani sabab qilib ko'rsatilgan.", "Polshada kommunistik rejim o'rnatish uchun harbiy intervensiya amalga oshirilgan.", "Germaniya bilan birgalikda Polshani bo'lib tashlash haqidagi shartnoma oshkor qilingan."], ["Ikkinchi jahon urushining dastlabki oylarida Polshada ro'y bergan Katyn qirg'inining sababi nima edi?", "NKVD tomonidan 22 mingga yaqin polshalik armiya ofitserlari va ziyolilari otib tashlandi.", "Nemis qo'shinlari tomonidan Polsha aholisini qirish uchun uyushtirilgan genotsid edi.", "Polsha armiyasining sovet qo'shinlariga qarshi uyushtirgan hujumi natijasida yuz bergan edi.", "Ukrain va Belorus millatiga mansub aholining o'z-o'zini himoya qilish harakatlari edi."], ["1939-1940-yillardagi Sovet-Fin urushining yakuniy natijasi qanday bo'ldi?", "Finlyandiya o'z hududining bir qismini SSSRga berishga majbur bo'lsa-da, mustaqilligini saqlab qoldi.", "Finlyandiya SSSR tarkibiga to'liq qo'shildi va mustaqil davlat sifatida mavjudligini yo'qotdi.", "Finlyandiya SSSRning hujumini butunlay qaytardi va hududiy yaxlitligini to'liq saqladi.", "Finlyandiya xalqaro hamjamiyat tomonidan faol harbiy yordam olib, g'alaba qozondi."], ["\"Barbarossa\" rejasining asosiy maqsadi nima edi?", "Blitskrig taktikasi orqali sovet armiyasini 2-3 oy ichida butunlay mag'lub etish edi.", "Sharqiy Yevropa davlatlari bilan uzoq muddatli tinchlik shartnomasini imzolash edi.", "Sovet Ittifoqi bilan iqtisodiy hamkorlikni kengaytirish va savdo aloqalarini mustahkamlash edi.", "G'arbiy Yevropadagi harbiy kuchlarni Sharqiy frontga yo'naltirishni ta'minlash edi."], ["\"Barbarossa\" rejasining barbod bo'lishiga Rossiyaning \"rasputitsa\" (yomon yo'llar) omili qanday ta'sir ko'rsatdi?", "\"Rasputitsa\" nemis texnikasining tezligini keskin pasaytirdi va ta'minot zanjirini uzib qo'ydi.", "\"Rasputitsa\" nemis qo'shinlarining tezlik bilan harakatlanishiga yordam berib, logistikani osonlashtirdi.", "\"Rasputitsa\" nemis armiyasini qishki sovuqdan himoya qilishga yordam beradigan tabiiy to'siq bo'ldi.", "\"Rasputitsa\" nemis qo'shinlariga Sovet ittifoqi ichkarisida yangi yo'llar qurishga imkon berdi."], ["Germaniyaning SSSRga hujum boshlashi bilan Antigitler koalitsiyasining tuzilishida qanday voqea muhim ahamiyat kasb etdi?", "Buyuk Britaniya va AQSH sovetlar bilan birdamligini e'lon qilib, Atlantika xartiyasini imzoladi.", "Italiya va Yaponiya tomonidan Germaniyaga qarshi yangi harbiy ittifoq tuzilishi boshlandi.", "Finlyandiya va Polsha Germaniyaga qarshi birgalikda harbiy operatsiyalarni boshladi.", "Chexoslovakiya va Avstriya o'z mustaqilligini tiklab, Germaniyaga qarshi chiqdi."], ["1930-yillarning oxiriga kelib dunyodagi vaziyat qanday edi va xalqaro xavfsizlik tizimi qanday holatda edi?", "Iqtisodiy inqirozdan toʻliq qutulmagan, kuchlar nisbati oʻzgargan va xavfsizlik tizimi barbod boʻlgan edi.", "Jahon iqtisodiyoti barqarorlashgan, yangi ittifoqlar tuzilgan va tinchlik siyosati ustuvor edi.", "Global miqyosda siyosiy beqarorlik avj olgan, ammo iqtisodiy vaziyat sezilarli darajada yaxshilangan edi.", "Katta davlatlar oʻrtasida hamkorlik kuchaygan, xalqaro tashkilotlar oʻz vazifalarini toʻliq bajargan."], ["Millatlar Ligasi faoliyati va Buyuk Britaniya hamda Fransiya siyosati haqida matnda nimalar qayd etilgan?", "Millatlar Ligasi vazifasini bajara olmagan, bu davlatlar tinchlantirish siyosatini olib borgan.", "Millatlar Ligasi samarali faoliyat koʻrsatgan, bu davlatlar agressiyaga qarshi keskin choralar koʻrgan.", "Millatlar Ligasi mustaqilligini yoʻqotgan, bu davlatlar harbiy ittifoqlar tuzishga harakat qilgan.", "Millatlar Ligasi islohotlar qilingan, bu davlatlar iqtisodiy sanksiyalar joriy etgan va diplomatik yechim izlagan."], ["Adolf Gitler qachon va qayerda tugʻilgan, shuningdek, qachon va qayerda vafot etgan?", "1889-yil 20-aprelda Braunau shahrida tugʻilgan, 1945-yil 29-aprelda Berlinda vafot etgan.", "1889-yil 20-martda Vena shahrida tugʻilgan, 1945-yil 30-aprelda Myunxenda vafot etgan.", "1890-yil 20-aprelda Zalsburg shahrida tugʻilgan, 1945-yil 28-aprelda Gamburgda vafot etgan.", "1888-yil 20-mayda Lins shahrida tugʻilgan, 1945-yil 1-mayda Potsdamda vafot etgan."], ["Gitler qachon va qanday sharoitda harbiy xizmatga chaqirilgan va uning dastlabki ahvoli qanday baholangan?", "1914-yil fevral oyida chaqirilgan va tibbiy koʻrikda \"juda zaifligi\" sababli xizmatdan ozod qilingan.", "1913-yil mart oyida chaqirilgan va yuqori darajadagi jismoniy tayyorgarligi tufayli armiyaga qabul qilingan.", "1915-yil yanvar oyida chaqirilgan va harbiy xizmatga mutlaqo yaroqsiz deb topilganligi sababli rad etilgan.", "1914-yil avgust oyida chaqirilgan va tezkor tibbiy tekshiruvdan oʻtib, zudlik bilan frontga yuborilgan."], ["1939-yil 22-mayda imzolangan \"Poʻlat pakt\" qaysi davlatlar oʻrtasidagi shartnoma edi va uning asosiy maqsadi nima edi?", "Fashistik Germaniya va fashistik Italiya oʻrtasidagi harbiy-siyosiy ittifoq, Polshaga hujum qilish maqsadi.", "Germaniya va Yaponiya oʻrtasidagi ittifoq, Kommunistik Internatsionalga qarshi kurashish maqsadi.", "Italiya va Yaponiya oʻrtasidagi hamkorlik shartnomasi, Tinch okeanidagi hududlarni himoya qilish maqsadi.", "Germaniya va Sovet Ittifoqi oʻrtasidagi bitim, ikki davlat oʻrtasida oʻzaro tajovuz qilmaslikni taʼminlash."], ["\"Antikomintern pakti\" qaysi davlatlar tomonidan imzolangan va uning asosiy maqsadi nimadan iborat edi?", "Germaniya va Yaponiya tomonidan, keyinchalik Italiya qoʻshilgan, kommunizmga qarshi kurashish maqsadi.", "Italiya va SSSR oʻrtasida, gʻarb davlatlarining taʼsirini kamaytirishga qaratilgan ittifoq edi.", "Yaponiya va Xitoy oʻrtasida, Osiyoda barqarorlikni saqlash va mintaqaviy tinchlikni taʼminlash uchun.", "Germaniya va Italiya oʻrtasida, iqtisodiy hamkorlikni kengaytirish hamda savdo aloqalarini rivojlantirish."], ["Mussolini Italiya armiyasining harbiy tayyorgarligi haqida qanday bilimga ega edi va \"Poʻlat pakt\"dan nimalarni kutgan?", "1942–1943-yillardan oldin tayyor boʻla olmasligini bilgan, Germaniyani nazoratda ushlab turishni kutgan.", "Tez orada urushga kirishga tayyorligini bilgan, Yevropada Italiya taʼsirini kuchaytirishni rejalashtirgan.", "Qurollanishda Germaniyadan ustun ekanligiga ishongan, mintaqaviy barqarorlikni taʼminlashga umid qilgan.", "Armiya zaifligini bilmagan, Italiyaning hududiy kengayishini taʼminlash uchun paktga kiritilgan edi."], ["Gitler \"Poʻlat pakt\" shartlarini qanday buzdi va Mussolini bunga qanday munosabat bildirdi?", "Mussolini bilan maslahatlashmasdan Molotov-Ribbentrop paktini imzoladi, Italiyani \"urushayotgan davlat emas\" deb eʼlon qildi.", "Mussolinini ogohlantirmasdan Angliyaga hujum qildi, Italiyani darhol urushga qoʻshilishga chaqirdi.", "Fransiyaga qarshi harbiy harakatlar boshladi, Mussolini Germaniyani qoralab, ittifoqdan chiqib ketishini eʼlon qildi.", "SSSRga qarshi ittifoq tuzdi, Mussolini esa paktni mustahkamlashga chaqirib, Germaniyani qoʻllab-quvvatladi."], ["Italiya qachon Ikkinchi jahon urushiga rasman qoʻshilgan?", "1940-yil iyun oyida, Fransiya Germaniya tomonidan deyarli magʻlub etilganidan keyin qoʻshilgan.", "1939-yil sentyabr oyida, Polshaga hujum boshlanganidan soʻng darhol urushga kirgan.", "1938-yil mart oyida, Avstriyaning Anschlussidan soʻng Germaniya bilan harbiy ittifoqni kuchaytirgan.", "1941-yil dekabr oyida, AQSh urushga kirganidan soʻng Yaponiyani qoʻllab-quvvatlab qoʻshilgan."], ["Galeatso Chanoning kundaliklariga koʻra, Gitler va Ribbentrop qachondan oldin urush boshlamaslikka vaʼda berishgan?", "Yaqin 3 yildan oldin keng koʻlamli urush boshlamaslikka vaʼda berishgan edi.", "Yaqin 1 yildan oldin harbiy harakatlarni boshlamaslikka qasam ichishgan edi.", "Yaqin 5 yildan oldin hech qanday harbiy tajovuzkorlik qilmaslikka vaʼda berishgan edi.", "2 yil davomida harbiy mojarolarga aralashmaslikka qatʼiy vaʼda berishgan edi."], ["Germaniyaning \"Toʻrt yillik reja\"si (1936–1939) qaysi shaxs rahbarligida qabul qilingan va uning asosiy maqsadi nima edi?", "Hermann Gering rahbarligida, Germaniya armiyasi va iqtisodiyotini urushga tayyorlash.", "Yaltmar Shaxt rahbarligida, Germaniya valyutasini barqarorlashtirish va eksportni oshirish.", "Adolf Gitler rahbarligida, Sharqiy Yevropada yangi hududlarni egallash va Lebensraum yaratish.", "Heinrich Himmler rahbarligida, irqiy tozalashni amalga oshirish va aholi sonini koʻpaytirish."], ["Germaniya \"Mefo\" veksellari tizimini nimaga erishish uchun ishlatgan va bu qanday natija bergan?", "Versal sulhi cheklovlarini aylanib oʻtish uchun ishlatgan va inflyatsiyaning oldini olgan.", "Tashqi savdoni rivojlantirish uchun ishlatgan va valyuta zaxiralarini koʻpaytirishga yordam bergan.", "Aholini iqtisodiy jihatdan qoʻllab-quvvatlash uchun ishlatgan va ishsizlikni kamaytirishga xizmat qilgan.", "Harbiy sanoatni rasman moliyalashtirish uchun ishlatgan va byudjet taqchilligini yashirgan."], ["Natsistlar iqtisodiyotining bosh shiori boʻlgan \"Moy oʻrniga pushklar\" (\"Butter statt Kanonen\") nimani anglatgan va uning oqibatlari qanday boʻlgan?", "Oziq-ovqat va kiyim-kechakdan koʻra qurolga ustunlik, aholi turmush darajasining pasayishi.", "Qishloq xoʻjaligini rivojlantirishga eʼtibor, sanoat ishlab chiqarishining ortishi va aholi farovonligi.", "Ogʻir sanoatni toʻliq yoʻqotib, yengil sanoatni ustuvor qilish, isteʼmol tovarlari ishlab chiqarishni koʻpaytirish.", "Harbiy sanoatni toʻxtatish, tinchlikni saqlashga yoʻnaltirish, iqtisodiy barqarorlikni taʼminlash."], ["Urush arafasida (1939-yil) Germaniyada harbiy xarajatlar davlat byudjetining qancha foizini tashkil qilgan?", "Davlat byudjetining 50 foizidan ortigʻini va YIMning qariyb 17–23 foizini tashkil qilgan.", "Davlat byudjetining 20 foizini va YIMning atigi 5–7 foizini tashkil qilgan edi, bu normal koʻrsatkich.", "Davlat byudjetining 30 foizidan oshmasligini, YIMning 10 foizini tashkil qilgan edi.", "Davlat byudjetining 70 foizidan ortigʻini va YIMning qariyb 30–35 foizini tashkil qilgan edi."], ["Benito Mussolini 1922-yilda hokimiyatga kelgach, Italiya uchun qanday asosiy maqsadlarni belgilab bergan?", "Italiyani buyuk imperiyaga aylantirish va iqtisodiy mustaqillikka (Avtarkiya) erishishni maqsad qilgan.", "Italiyani demokratik davlatga aylantirish va xalqaro hamkorlikni kengaytirishga yoʻnaltirilgan.", "Italiyaning qishloq xoʻjaligini modernizatsiya qilish va sanoat ishlab chiqarishini cheklashni maqsad qilgan.", "Italiyani sotsialistik davlatga aylantirish va ishchilar sinfini mustahkamlashni asosiy maqsad qilgan."], ["Ikkinchi jahon urushi arafasida Italiya iqtisodiyotining asosiy muammolari nimadan iborat edi?", "Kambagʻal xomashyo bazasi, notoʻgʻri strategik qarorlar va importga oʻta bogʻliqlik.", "Yuqori darajadagi ishsizlik, malakali ishchi kuchining yetishmasligi va valyuta kursining beqarorligi.", "Hadadan tashqari sanoatlashganlik, atrof-muhit muammolari va ichki isteʼmolning pastligi.", "Investitsiyalarning kamligi, bank tizimining zaifligi va xalqaro savdo cheklovlari mavjudligi."], ["Urush arafasida AQShning asosiy muammosi nima edi?", "\"Betaraflik\" siyosati: aholi va hukumat Yevropadagi urushga aralashishni xohlamagan edi.", "Harbiy sanoatning sust rivojlanganligi va texnologik qoloqlik, bu mudofaa qobiliyatiga taʼsir qilgan.", "Iqtisodiy inqirozdan toʻliq chiqa olmaganligi, bu esa harbiy xarajatlarni cheklab qoʻygan edi.", "Diplomatik aloqalarning murakkabligi, xalqaro ittifoqchilar bilan kelishmovchiliklar mavjud edi."], ["Urush arafasida SSSRning harbiy-sanoat bazalari qanday qurilgan va asosiy muammosi nima edi?", "Besh yillik rejalar orqali sharqda ulkan bazalar qurilgan, asosiy muammosi kadrlar inqirozi edi.", "Gʻarbiy hududlarda harbiy bazalar qurilgan, asosiy muammosi qishloq xoʻjaligining sust rivojlanganligi edi.", "Markaziy hududlarda texnologik yangiliklar joriy etilgan, asosiy muammosi sanoat quvvatining yetishmasligi edi.", "Sibirda yirik harbiy komplekslar barpo etilgan, asosiy muammosi transport infratuzilmasining sustligi edi."], ["Buyuk Britaniyaning urush arafasidagi asosiy muammosi nimadan iborat edi?", "Quruqlikdagi armiyaning kichikligi va iqtisodiyotining import mahsulotlariga oʻta qaramligi.", "Harbiy-dengiz flotining eskirganligi va havo kuchlarining sust rivojlanganligi asosiy muammo edi.", "Kolonial imperiyaning barqaror emasligi va Hindistondagi ichki ziddiyatlar asosiy muammo edi.", "Xalqaro diplomatiyadagi zaif pozitsiyasi va ittifoqchilarning ishonchsizligi asosiy muammo edi."], ["Fransiyaning urush arafasidagi asosiy muammosi nima edi va uning mudofaa tizimi qanday nomlangan?", "Ichki siyosiy beqarorlik va eskirgan harbiy doktrina; \"Majino liniyasi\" mudofaa chizigʻi.", "Iqtisodiy turgʻunlik va kichik armiya; \"Alp liniyasi\" nomli mudofaa tizimi mavjud edi.", "Kolonial isyonlar va moliyaviy qarzlar; \"Atlantik devori\" deb atalgan harbiy inshootlar tizimi.", "Qurollanish poygasida orqada qolish va yetarli xomashyo yoʻqligi; \"Pyreney mudofaa chizigʻi\"."], ["Urush arafasida Germaniyaning asosiy muammosi nima edi va u qanday harbiy taktikani ishlab chiqqan?", "Xomashyo taqchilligi; \"Blitskrig\" (chaqmoqvor urush) taktikasi ishlab chiqilgan edi.", "Kadrlar yetishmovchiligi; \"Okop urushi\" (transheya urushi) taktikasi strategik ahamiyat kasb etgan.", "Iqtisodiy defolt; \"Partizan urushi\" taktikasi bilan dushman kuchlarini zaiflashtirishga harakat qilingan.", "Valyuta inqirozi; \"Sust mudofaa\" (passiv mudofaa) taktikasi asosiy harbiy strategiya boʻlgan."], ["Yaponiya XX asrning 1930-1940-yillarida agressiv siyosat yuritishining asosiy sababi nima edi?", "Mamlakatning tabiiy resurslarga kambag'alligi hamda yangi bozorlar va xomashyo manbalarini egallash istagi.", "Dunyoda eng qudratli davlat maqomiga erishish va barcha savdo yo'llarini nazorat qilishga intilishi.", "Sharqiy Yevropada \"hayot uchun hudud\" g'oyasini amalga oshirish va qishloq xo'jaligini rivojlantirish zarurati.", "G'arb davlatlarining iqtisodiy sanksiyalariga javob berish va harbiy qudratini namoyish etish istagi."], ["1931 yilda Yaponiya Manjuriyani bosib olgandan so'ng qanday voqea sodir bo'ldi va unga xalqaro hamjamiyat qanday munosabat bildirdi?", "Yaponiya Manjuriyada \"Manchukuo\" qo'g'irchoq davlatini tashkil etdi, ammo Millatlar Ligasi qat'iy choralar ko'rmadi.", "Hudud to'g'ridan-to'g'ri Yaponiya imperiyasiga qo'shib olindi va BMT bu harakatni darhol qoraladi.", "Xitoy Milliy Respublikasi Manjuriyani qayta egallash uchun harbiy qarshi hujum uyushtirdi.", "Manjuriyada mustaqil hukumat tuzildi, uni Yaponiya va boshqa Osiyo davlatlari tan oldi."], ["1937 yilda boshlangan Ikkinchi Xitoy-Yaponiya urushi davomida Yaponiya qaysi yirik Xitoy shaharlarini egalladi?", "Pekin, Shanxay va Nankin shaharlarini egallab, tinch aholiga nisbatan qirg'inlar sodir etdi.", "Chungking, Chengdu va Wuhan kabi strategik ahamiyatga ega bo'lgan shaharlarni o'z nazoratiga oldi.", "Kanton, Fuzhou va Xiamen shaharlarini bosib olib, ularda harbiy bazalarini tashkil qildi.", "Harbin, Shenyang va Changchun kabi shimoliy Xitoy shaharlarini butunlay vayron qildi."], ["1940 yilda Yaponiya qaysi davlatlar bilan \"Uch tomonlama paktni\" imzoladi va bu uning siyosatiga qanday ta'sir ko'rsatdi?", "Germaniya va Italiya bilan imzolandi, bu ittifoq Yaponiya tashqi siyosatini yanada agressiv qildi.", "Buyuk Britaniya va Fransiya bilan imzolandi, bu Tinch okeanidagi hamkorlikni kuchaytirishga xizmat qildi.", "Sovet Ittifoqi va Xitoy bilan imzolandi, bu mintaqadagi xavfsizlikni ta'minlashga qaratildi.", "AQSh va Avstraliya bilan imzolandi, bu iqtisodiy blokadaga javob bo'ldi."], ["Yaponiya AQShning Perl-Harbor harbiy bazasiga qachon hujum qildi va bu voqea Ikkinchi jahon urushiga qanday ta'sir ko'rsatdi?", "1941 yil 7 dekabrda hujum qildi, bu AQShni urushga jalb qildi va urushni global miqyosda kengaytirdi.", "1940 yil 1 sentabrda hujum qildi, bu Gitlerning Polshaga hujumi bilan birga sodir bo'lgan edi.", "1942 yil 12 martda hujum qildi, bu Tinch okeanidagi harbiy harakatlarni to'xtatishga olib keldi.", "1943 yil 5 iyunda hujum qildi, bu Ittifoqchi kuchlarning qarshi hujumiga turtki bo'ldi."], ["Manhattan loyihasining asosiy maqsadi nima edi va u qaysi mamlakatga qarshi yo'naltirilgan edi?", "Gitler Germaniyasidan oldin atom qurolini yaratish va uning harbiy salohiyatini yo'q qilish.", "Yaponiya imperializmining rivojlanishiga qarshi turish va mintaqadagi ta'sirini cheklash.", "Sovet Ittifoqi bilan bo'lajak qarama-qarshilik uchun strategik qurol tizimini ishlab chiqish.", "Italiya va uning ittifoqchilarining harbiy harakatlariga qarshi mudofaa tizimini yaratish."], ["Birinchi atom bombasining muvaffaqiyatli sinovi \"Gadget\" kod nomi bilan qayerda va qachon o'tkazildi?", "1945 yil 16 iyulda Nyu-Meksiko shtatining Alamogordo cho'lida muvaffaqiyatli sinovdan o'tkazildi.", "1944 yil 8 avgustda Nevadaning sinov poligonida yashirincha portlatish amalga oshirildi.", "1946 yil 22 aprelda Kaliforniya shtatining uzoq cho'l hududida yadroviy sinov o'tkazildi.", "1943 yil 3 martda Tennessi shtatidagi maxfiy laboratoriyada dastlabki sinov o'tkazildi."], ["Xirosimaga tashlangan \"Little Boy\" bombasi qanday material asosida yasalgan edi va uning kuchi qancha edi?", "Uran-235 asosida yasalgan bo'lib, uning kuchi taxminan 15 kilotonna trotilga teng edi.", "Plutoniy-239 asosida yasalgan bo'lib, uning kuchi taxminan 20 kilotonna trotilga teng edi.", "Deyteriy va tritiy izotoplari asosida yasalgan bo'lib, uning kuchi 25 kilotonna trotilga teng edi.", "Har xil og'ir elementlar aralashmasi asosida yasalgan bo'lib, uning kuchi 10 kilotonna trotilga teng edi."], ["Nagasakiga tashlangan \"Fat Man\" bombasi qanday material asosida yasalgan edi va uning dastlabki nishoni qayer edi?", "Plutoniy-239 asosida yasalgan bo'lib, dastlabki nishon Kokura shahri edi, ammo ob-havo tufayli o'zgartirildi.", "Uran-235 asosida yasalgan bo'lib, dastlabki nishon Xirosima edi, keyinchalik Nagasakiga yo'naltirildi.", "Termoyadroviy materiallar asosida yasalgan bo'lib, dastlabki nishon Tokio edi, ammo masofa sababli o'zgartirildi.", "Neoklassik materiallar asosida yasalgan bo'lib, dastlabki nishon Yaponiya imperator saroyi edi."], ["Yaponiyada atom bombasidan omon qolganlar \"hibakusha\" deb ataladi, bu so'zning ma'nosi nima?", "\"Portlash ta'siriga uchragan odam\" degan ma'noni anglatadi va ularda uzoq muddatli salbiy oqibatlar kuzatilgan.", "\"Urush qurbonlari\" degan ma'noni anglatadi, ularga xalqaro tashkilotlar tomonidan gumanitar yordam ko'rsatilgan.", "\"Jasur askarlar\" degan ma'noni anglatadi, ular urushdan keyin milliy qahramonlar sifatida e'zozlangan.", "\"Tinchlik elchilari\" degan ma'noni anglatadi, ular tinchlik harakatlarida faol ishtirok etgan."], ["AQSh hukumati \"hibakusha\"larning tajribasiga qanday munosabatda bo'lgan va ularga tibbiy yordam ko'rsatish borasida qanday yo'l tutgan?", "Ularning tajribasini \"ma'lumot\" sifatida qaragan va tibbiy yordam berishdan bosh tortib, tekshiruvlar o'tkazgan.", "Ularga darhol keng ko'lamli tibbiy yordam ko'rsatgan va uzoq muddatli tiklanish dasturlarini amalga oshirgan.", "Ularni harbiy rejimga olib, harbiy tadqiqotlar uchun majburiy xizmatga jalb qilgan.", "Ularning ahvolini yashirishga harakat qilgan va ularni jamoatchilikdan ajratib qo'ygan."], ["Tarixchi Antoni Bivorning fikriga ko'ra, Prezident Trumenning atom bombasi qo'llash qaroriga qanday sabab bo'lgan?", "Yaponiyaga bostirib kirishda kutilayotgan Ittifoqchi qurbonlar sonini kamaytirish istagi asosiy sabab bo'lgan.", "Sovet Ittifoqiga qarshi harbiy ustunlikni namoyish etish va sovuq urush strategiyasini boshlash maqsadi edi.", "Yaponiya iqtisodiyotini butunlay yo'q qilish va uning harbiy qudratini abadiy tugatishni ta'minlash edi.", "Yaponiya imperatorini taxtdan ag'darish va demokratik hukumatni o'rnatish uchun zarur chora bo'lgan."], ["Adolf Gitlerning hokimiyatga kelishi Germaniyaning Birinchi jahon urushidan keyingi qaysi inqiroz bilan bog'liq edi?", "Siyosiy va iqtisodiy inqiroz bilan chambarchas bog'liq bo'lib, Versal shartnomasi norozilikni keltirgan.", "Xalqaro savdo blokadasi va kolonial imperiyasining qulashi natijasidagi inqiroz bilan bog'liq.", "G'arb davlatlari bilan harbiy mojarolar va resurs taqchilligi tufayli yuzaga kelgan inqiroz bilan.", "Kommunistik qo'zg'olonlar va ichki fuqarolar urushining kuchayishi natijasidagi inqiroz bilan."], ["1919 yilgi Versal shartnomasining Germaniya uchun asosiy oqibatlari nimalardan iborat edi?", "Germaniya zaiflashib, katta miqdorda tovon to'lashga majburlandi, harbiy kuchi cheklandi va hududiy yo'qotishlarga uchradi.", "Germaniya xalqaro hamjamiyat tomonidan tan olinib, uning hududiy yaxlitligi ta'minlandi va harbiy kuchlari mustahkamlandi.", "Germaniya iqtisodiy jihatdan gullab-yashnash imkoniyatiga ega bo'ldi va yangi mustamlaka yerlarini egalladi.", "Germaniya boshqa davlatlar bilan ittifoq tuzishga majbur bo'ldi va unga moliyaviy yordam berildi."], ["Natsizm mafkurasining asosiy g'oyalari nimalardan iborat edi?", "Millatchilik, irqiy ustunlik, yahudiylarga qarshi siyosat, totalitar boshqaruv va agressiv tashqi siyosat.", "Liberallik, individual erkinlik, iqtisodiy erkinlik va diplomatik hamkorlikni ilgari surish.", "Sotsial adolat, barcha irqlarning tengligi, demokratik boshqaruv va pasifistik tashqi siyosat.", "Diniy fundamentalizm, monarxiyani tiklash, feodalizm va an'anaviy qadriyatlarni himoya qilish."], ["Natsizm Germaniya xalqiga va'da qilgan \"Lebensraum\" (\"hayot uchun hudud\") g'oyasining mohiyati nimada edi?", "Sharqiy Yevropada yangi yerlarni bosib olish va nemis xalqiga keng hudud yaratish siyosatini anglatardi.", "Germaniya hududida qishloq xo'jaligini rivojlantirish va aholining yashash sharoitini yaxshilash.", "Industrializatsiyani kuchaytirish va texnologik taraqqiyot orqali Germaniya iqtisodiyotini kengaytirish.", "Dunyo bo'ylab savdo yo'llarini nazorat qilish va global iqtisodiy hegemoniyaga erishish."], ["Gitler tashqi siyosatida amalga oshirgan \"Hududiy ekspansiya\" siyosatining dastlabki yirik harakatlari qaysilar edi?", "1938 yilda Avstriyani Germaniyaga qo'shib olish (Anschluss) va Sudet viloyatini egallash.", "1937 yilda Fransiya va Buyuk Britaniyaga hujum qilish va ularning koloniyalarini bosib olish.", "1939 yilda Polshaga hujum qilish va keyinchalik Sovet Ittifoqini bosib olish.", "1936 yilda Reynxeniya hududiga harbiy qo'shin kiritish va Ispaniya fuqarolar urushiga aralashish."], ["Gitler Germaniyasining qaysi harakati Ikkinchi jahon urushining Yevropadagi boshlanishiga sabab bo'ldi?", "1939 yil 1 sentabrda Germaniyaning Polshaga hujum qilishi Ikkinchi jahon urushining boshlanishiga olib keldi.", "1938 yilda Avstriyani qo'shib olish va Chexoslovakiyani bosib olish.", "1936 yilda Reynxeniya hududiga harbiy qo'shin kiritish va Versal shartnomasini bekor qilish.", "1941 yil 22 iyunda Sovet Ittifoqiga hujum qilish va Sharqiy Yevropada keng ko'lamli harbiy operatsiyalarni boshlash."], ["Matnda 1941 yilgi fojia Sovet armiyasini to'liq qurollantirishga vaqt yetishmaganligi bilan izohlash haqidagi fikrga nisbatan qanday munosabat bildirilgan?", "Bu fikr noto'g'ri deb ta'kidlangan, chunki 1941 yilga kelib SSSR tanklar va samolyotlar bo'yicha Germaniya va uning ittifoqchilaridan ustun turgan.", "Bu fikr qisman to'g'ri deb topilgan, chunki Sovet Ittifoqi harbiy ishlab chiqarishda sezilarli kechikishlarga ega edi.", "Bu fikr to'liq tasdiqlangan, chunki Sovet Ittifoqining harbiy sanoati G'arb davlatlariga nisbatan ancha orqada edi.", "Bu fikrga befarqlik bildirilgan, chunki urushning asosiy sababi harbiy rahbariyatning strategik xatolari edi."], ["Yaponiya XX asrning 1930-1940-yillarida Osiyo-Tinch okeani mintaqasida agressiv siyosat yuritishining asosiy sababi nima edi?", "Mamlakatning tabiiy resurslarga kambag'alligi, yangi bozorlar va xomashyo manbalarini egallash istagi edi.", "Siyosiy hokimiyatni mustahkamlash va mintaqadagi boshqa davlatlar bilan iqtisodiy raqobatni kuchaytirish edi.", "Yaponiya madaniyatini yoyish va qo'shni davlatlarga o'z ta'sirini o'tkazish uchun zarurat mavjud edi.", "Harbiy texnologiyalarni sinash va qo'shni davlatlar bilan chegaraviy mojarolarni hal etish majburiyati bor edi."], ["1931 yilda Yaponiya tomonidan Manjuriyani bosib olinishi va u yerda “Manchukuo” qoʻgʻirchoq davlatining tashkil etilishi qanday oqibatlarga olib keldi?", "Bu xalqaro tartibni buzdi, ammo Millatlar Ligasi Yaponiya agressiyasiga qarshi qat'iy choralar koʻrmadi.", "Bu harakat Yaponiya va Xitoy oʻrtasida uzoq muddatli tinchlik bitimiga olib keldi va hududiy muammolarni hal qildi.", "Xalqaro hamjamiyat tomonidan Yaponiya tezda tan olindi va uning mintaqadagi mavqei mustahkamlandi.", "Millatlar Ligasi Yaponiya agressiyasiga nisbatan keskin sanksiyalar joriy etib, uning iqtisodiyotini zaiflashtirdi."], ["1940 yilda Yaponiya qaysi davlatlar bilan “Uch tomonlama paktni” imzolab, oʻzining tashqi siyosatini yanada agressiv qildi?", "Germaniya va Italiya bilan imzolangan ushbu pakt Yaponiya tashqi siyosatini yanada keskinlashtirdi.", "Buyuk Britaniya va Fransiya bilan imzolangan ushbu pakt Yaponiya tashqi siyosatini yumshatdi.", "Amerika Qoʻshma Shtatlari va Sovet Ittifoqi bilan imzolangan pakt mintaqaviy xavfsizlikni ta'minladi.", "Xitoy va Koreya bilan imzolangan pakt Yaponiya savdo aloqalarini mustahkamlashga qaratilgan edi."], ["AQSh va boshqa Gʻarb davlatlari Yaponiyaning Janubi-Sharqiy Osiyodagi harakatlariga javoban qanday iqtisodiy sanksiyalar joriy qildi?", "Neft, po'lat va boshqa muhim resurslar yetkazib berilishini to'xtatib qo'ydi, bu Yaponiya uchun muhim zarba bo'ldi.", "Yaponiyaga qarshi savdo embargosi o'rnatildi, ammo asosiy resurslar yetkazib berish davom etdi.", "Yaponiyaning xorijiy investitsiyalari muzlatildi, ammo energiya manbalari yetkazib berilishi ta'sirlanmadi.", "Yaponiyaning dengiz yoʻllari blokirovka qilindi, ammo quruqlik orqali savdo aloqalari saqlanib qoldi."], ["Yaponiya tomonidan AQShning Perl-Harbor harbiy bazasiga qilingan hujum qachon sodir boʻlgan va uning asosiy oqibati nima edi?", "1941 yil 7 dekabrda sodir boʻlgan bu hujum AQShni urushga jalb qildi va Ikkinchi jahon urushini kengaytirdi.", "1940 yil 23 noyabrda sodir boʻlgan bu hujum AQShning Yaponiyaga qarshi sanksiyalarini yanada kuchaytirdi.", "1942 yil 15 yanvarda sodir boʻlgan bu hujum Tinch okeanida harbiy mojarolarni vaqtincha to'xtatdi.", "1939 yil 1 sentabrda sodir boʻlgan bu hujum Yaponiyaning mintaqaviy gegemonligini mustahkamladi."], ["Ittifoqchi davlatlar (AQSh, Buyuk Britaniya va Xitoy) 1945 yil 26 iyulda e'lon qilgan Potsdam deklaratsiyasining Yaponiyaga qoʻygan asosiy talabi nima edi?", "Yaponiyaning soʻzsiz taslim bo'lishini talab qilib, aks holda tez va to'liq vayronagarchilik bilan tahdid qilindi.", "Yaponiya barcha egallagan hududlarini qaytarishni, ammo imperatorlik tuzumini saqlab qolishni so'radi.", "Yaponiyaning hududiy yaxlitligini kafolatlashni va harbiy kuchlarini sezilarli darajada qisqartirishni talab qildi.", "Yaponiya harbiy hukumatini iste'foga chiqarishni va demokratik islohotlarni amalga oshirishni so'radi."], ["Yaponiya harbiy rahbariyati ittifoqchi kuchlarning bosqinchiligiga qarshi qanday mudofaa rejasini ishlab chiqqan edi?", "\"Ketsu-Go\" operatsiyasi rejasini ishlab chiqqan bo'lib, umumxalq mudofaasi nazarda tutilgan edi.", "\"Kamikadze\" operatsiyasi rejasini ishlab chiqqan bo'lib, cheklangan havo hujumlarini amalga oshirish edi.", "\"Banzai\" operatsiyasi rejasini ishlab chiqqan bo'lib, yashirin partizanlik urushini nazarda tutgan edi.", "\"Bushido\" operatsiyasi rejasini ishlab chiqqan bo'lib, diplomatik muzokaralar orqali taslim bo'lishni rejalashtirgan edi."], ["Xirosima shahriga tashlangan birinchi atom bombasining nomi va asosiy komponenti nima edi?", "\"Little Boy\" nomli uran-235 asosidagi bomba boʻlib, 15 kilotonna kuchga ega edi.", "\"Fat Man\" nomli plutoniy-239 asosidagi bomba boʻlib, 21 kilotonna kuchga ega edi.", "\"Big Bertha\" nomli vodorod asosidagi bomba boʻlib, juda katta vayronkor kuchga ega edi.", "\"Trinity\" nomli toriy asosidagi bomba boʻlib, nisbatan kichikroq portlash quvvatiga ega edi."], ["Nagasaki shahriga tashlangan ikkinchi atom bombasining nomi va asosiy komponenti nima edi?", "\"Fat Man\" nomli plutoniy-239 asosidagi bomba boʻlib, 21 kilotonna kuchga ega edi.", "\"Little Boy\" nomli uran-235 asosidagi bomba boʻlib, 15 kilotonna kuchga ega edi.", "\"Gadget\" nomli toriy asosidagi bomba boʻlib, sinov maqsadida qo'llanilgan edi.", "\"Destroyer\" nomli vodorod asosidagi bomba boʻlib, o'zgaruvchan portlash quvvatiga ega edi."], ["Nagasakining asl nishoni Kokura shahri boʻlganiga qaramay, bomba nega Nagasakiga tashlangan edi?", "9-avgust kuni ertalab Kokura ustida kuchli bulut boʻlganligi sababli zaxira nishon Nagasakiga yo'naltirilgan.", "Kokura shahri allaqachon katta vayronagarchilikka uchragan edi, shuning uchun boshqa shahar tanlandi.", "Nagasaki shahri harbiy strategik ahamiyatga ega boʻlgani uchun ustuvor nishon sifatida belgilangan edi.", "Amerikalik uchuvchilar xatoga yo'l qo'yib, Kokura o'rniga Nagasakiga bombani tashlab yuborganlar."], ["Yaponiyada atom bombasidan omon qolgan shaxslar qanday nom bilan ataladi?", "\"Hibakusha\" deb ataladi, bu soʻz \"portlash ta'siriga uchragan odam\" ma'nosini bildiradi.", "\"Kamikadze\" deb ataladi, bu soʻz \"ilohiy shamol\" ma'nosini bildiruvchi atama hisoblanadi.", "\"Samuray\" deb ataladi, bu soʻz yapon harbiy zodagonlariga nisbatan ishlatiladi.", "\"Ronin\" deb ataladi, bu soʻz xo'jayinsiz qolgan samuraylarni anglatadi va taalluqli emas."], ["Atom bombardimonining inson salomatligiga uzoq muddatli ta'sirlaridan matnda qaysilari qayd etilgan?", "Leysemiya va boshqa saraton kasalliklari darajasining keskin oshishi, irsiy nuqsonlar va psixologik travmalar.", "O'tkir nafas yetishmovchiligi, yurak-qon tomir kasalliklari va asab tizimi faoliyatining buzilishi.", "Immunitet tizimining mustahkamlanishi, ba'zi surunkali kasalliklarning kamayishi va koʻrish qobiliyatining yaxshilanishi.", "Mushak-skelet tizimi kasalliklari, eshitish qobiliyatining yo'qolishi va endokrin bezlar faoliyatining o'zgarishi."], ["AQSh hukumati atom bombasidan omon qolgan \"hibakusha\"larga nisbatan qanday munosabatda boʻlgan?", "Ularning tajribasini \"ma'lumot\" sifatida qarab, tibbiy yordam ko'rsatishdan bosh tortgan.", "Ularga darhol keng ko'lamli tibbiy yordam ko'rsatib, ularning reabilitatsiyasini moliyalashtirgan.", "Ularning ruhiy salomatligini qo'llab-quvvatlash uchun maxsus dasturlar yaratgan va amalda yordam bergan.", "Ularning huquqlarini himoya qilish uchun xalqaro tashkilotlar bilan hamkorlik qilib, adolatni ta'minlashga intilgan."], ["Tarixchi Antoni Bivorning fikricha, Prezident Trumenning atom bombasi qoʻllash haqidagi qarori qaysi omilga asoslangan edi?", "Yaponiyaga bostirib kirishda kutilayotgan Ittifoqchi qurbonlar sonini kamaytirishga asoslangan edi.", "Yaponiyaning harbiy-iqtisodiy salohiyatini toʻliq yo'q qilish va uning hududlarini egallab olish istagi tufayli.", "Sovet Ittifoqining Osiyodagi ta'sirini cheklash va mintaqada Amerika gegemonligini o'rnatish uchun mo'ljallangan edi.", "Xalqaro hamjamiyatning talablariga javoban, urushni tezda tugatish va tinchlikni tiklash uchun qabul qilingan."], ["Adolf Gitlerning hokimiyatga kelishi qaysi tarixiy voqealar va ularning oqibatlari bilan chambarchas bog'liq edi?", "Birinchi jahon urushidan keyingi Germaniyaning siyosiy va iqtisodiy inqirozi, ayniqsa Versal shartnomasi.", "Germaniyaning mustamlakachilik imperiyasining rivojlanishi va boshqa yirik davlatlar bilan savdo mojarolari.", "Renessans davrining yakunlanishi va sanoat inqilobining kengayishi sababli ijtimoiy oʻzgarishlar.", "Fransiya inqilobining Germaniya jamiyatiga ta'siri va respublikachilik g'oyalarining keng tarqalishi."], ["Adolf Gitler hokimiyatga kelgach, Germaniyaning tashqi siyosati natsizm mafkurasi asosida qanday shakllandi?", "Germaniyani qudratli davlatga aylantirish, \"Versal qatlomi\"ni bekor qilish va yangi hududlarni bosib olishni maqsad qildi.", "Germaniyaning xalqaro munosabatlarda tinchlikparvarlik siyosatini yuritish, diplomatik kelishuvlar orqali ta'sirni oshirish.", "Germaniyaning madaniy ta'sirini kengaytirish, xalqaro hamjamiyatda iqtisodiy liderlikni qo'lga kiritishni maqsad qildi.", "Germaniyaning harbiy xarajatlarini qisqartirish va boshqa davlatlar bilan do'stona munosabatlarni mustahkamlashni istadi."], ["Natsizm mafkurasining tashqi siyosatdagi \"Lebensraum\" (\"hayot uchun hudud\") g'oyasi nimani anglatardi?", "Sharqiy Yevropada yangi yerlarni bosib olish va nemis xalqiga keng hudud yaratishni maqsad qildi.", "Germaniya hududini himoya qilish va boshqa davlatlar bilan tinch-totuv yashashni nazarda tutgan edi.", "Germaniya sanoatining o'sishini ta'minlash va yangi savdo bozorlarini topishni anglatgan edi.", "Germaniya madaniyatini boshqa xalqlarga yoyish va ularning turmush darajasini yaxshilashni maqsad qildi."], ["Natsizm Germaniyasining ichki siyosatida qanday totalitar tuzum shakllandi?", "Barcha siyosiy partiyalar taqiqlanib, davlat hayoti Gitler va natsistlar nazorati ostiga oʻtdi.", "Koʻp partiyaviy tizim saqlanib qoldi, ammo barcha partiyalar natsistlar hukumatini qo'llab-quvvatladi.", "Saylovlar muntazam o'tkazildi, ammo faqatgina ma'lum guruhlar siyosiy jarayonlarda ishtirok eta oldi.", "Fuqarolik erkinliklari kengaytirildi va jamoatchilik nazorati davlat hokimiyatini cheklab qo'ydi."], ["1941 yil 22 iyunda erta tongda Germaniya boshchiligidagi kuchlarning SSSRga hujumi qanday nom bilan mashhur?", "Bu hujum \"Barbarossa\" operatsiyasi deb nomlanib, Ikkinchi jahon urushining Sharqiy frontini ochdi.", "Bu hujum \"Sealion\" operatsiyasi deb nomlanib, Buyuk Britaniyani bosib olishga qaratilgan edi.", "Bu hujum \"Fall Gelb\" operatsiyasi deb nomlanib, Fransiyani tezkorlik bilan egallashga olib kelgan edi.", "Bu hujum \"Weserübung\" operatsiyasi deb nomlanib, Daniya va Norvegiyaning bosib olinishini anglatar edi."], ["1941 yilgi harbiy fojianing sababi haqidagi keng tarqalgan notoʻgʻri tushuncha matnda qanday izohlanadi?", "Sovet armiyasini to'la qurollantirish va yangi texnikalar ishlab chiqarish uchun vaqt yetishmaganligi noto'g'ri edi.", "Sovet Ittifoqining harbiy sanoati Germaniya texnologiyalaridan sezilarli darajada orqada qolganligi asosiy sabab edi.", "Sovet qo'mondonligining xatolari va strategik noto'g'ri qarorlari mag'lubiyatga sabab bo'lgan edi.", "Xalqaro sanksiyalar va resurslarning cheklanishi Sovet armiyasining qurollanishiga salbiy ta'sir ko'rsatgan edi."], ["Yaponiya XX asrning 1930-1940-yillarida Osiyo va Tinch okeani mintaqasida agressiv siyosat yuritishining asosiy sababi nima edi?", "Mamlakatning tabiiy resurslarga kambag'alligi, yangi bozorlar va xomashyo manbalarini egallash istagi.", "Global miqyosdagi savdo aloqalarini kengaytirish hamda mintaqaviy madaniy ta'sirni oshirish istagi.", "Boshqa qudratli davlatlarning iqtisodiy va siyosiy bosimiga qarshi javob choralari ko'rish zaruriyati.", "Ichki siyosiy keskinlik va iqtisodiy beqarorlikni harbiy yurishlar orqali bartaraf etish zaruriyati."], ["Yaponiya 1931 yilda Manjuriyani bosib olgach, u yerda qanday qo'g'irchoq davlat tashkil etdi?", "Manchukuo davlatini tashkil etdi, ammo Millatlar Ligasi qat'iy choralar ko'rmadi.", "Buyuk Sharqiy Osiyo farovonligi hududini e'lon qildi, ammo bu hudud rasmiy tan olinmadi.", "Avtonom Manchuriya provinsiyasini tuzdi, bu esa xalqaro jamoatchilik tomonidan qoralandi.", "Yaponiya vassali imperatorlik davlatini shakllantirdi, keyinroq mustaqillikka erishish imkonini berdi."], ["1940 yilda Yaponiya o'z tashqi siyosatini yanada agressiv qilish maqsadida qaysi davlatlar bilan \"Uch tomonlama pakt\"ni imzoladi?", "Germaniya va Italiya bilan imzoladi, bu ittifoq Yaponiya siyosatini yanada agressiv qildi.", "AQSh va Buyuk Britaniya bilan imzoladi, bu esa mintaqaviy xavfsizlik va barqarorlikni ta'minlashga qaratilgan.", "Sovet Ittifoqi va Xitoy bilan imzoladi, bu qaror Osiyo mintaqasida xavfsizlikni mustahkamlashga qaratilgan.", "Fransiya va Niderlandiya bilan imzoladi, bu esa ularning koloniyalaridagi ta'sirini kuchaytirishga xizmat qildi."], ["AQSh va boshqa G'arb davlatlari Yaponiyaga qarshi qanday iqtisodiy sanksiyalar joriy qildi?", "Neft, po'lat va boshqa muhim resurslar yetkazib berilishini to'xtatdi, bu qaror keskinlikni oshirdi.", "Paxta va guruch eksportini chekladi, bu Yaponiya xalqining kundalik hayotiga salbiy ta'sir ko'rsatdi.", "Moliyaviy yordamni to'xtatdi, bu Yaponiya uchun investitsiya imkoniyatlarini sezilarli darajada pasaytirdi.", "Harbiy texnologiyalar transferini to'xtatdi, bu Yaponiya mudofaa qobiliyatini zaiflashtirishga qaratilgan edi."], ["Ikkinchi jahon urushini Osiyo-Tinch okeani mintaqasida kengaytirgan va AQShni urushga jalb qilgan voqea qaysi edi?", "1941 yil 7 dekabrda AQShning Perl-Harbor harbiy bazasiga qilingan hujum ushbu urushni kengaytirdi.", "1937 yilda Yaponiya tomonidan Xitoyga qarshi boshlangan keng ko'lamli harbiy hujum sabab bo'lgan edi.", "1931 yilda Yaponiya qo'g'irchoq davlat Manchukuo tashkil etishi mintaqaviy mojaroni kuchaytirgan.", "1940 yilda Yaponiya, Germaniya va Italiya o'rtasida imzolangan \"Uch tomonlama pakt\" sabab bo'lgan."], ["Manhattan loyihasi qachon va qaysi davlatda boshlangan yashirin dastur edi, uning asosiy maqsadi nima edi?", "1942 yilda AQSh hukumatining Gitler Germaniyasidan oldin atom qurolini yaratish maqsadida boshlangan.", "1939 yilda Buyuk Britaniya tomonidan Germaniyaning yadroviy tahdidiga javoban boshlangan loyiha edi.", "1943 yilda Sovet Ittifoqida AQShning yadroviy dasturiga qarshi o'laroq boshlangan yashirin tadqiqot.", "1940 yilda Germaniyada Yevropada ustunlikka erishish uchun yangi turdagi qurolni yaratish maqsadida boshlangan."], ["Xirosimaga 1945 yil 6 avgustda tashlangan \"Little Boy\" bombasi qaysi kimyoviy element asosida edi va taxminan qanday kuchga ega edi?", "Uran-235 asosida bo'lib, taxminan 15 kilotonna trotilga teng kuchga ega edi.", "Plutoniy-239 asosida bo'lib, taxminan 21 kilotonna trotilga teng kuchga ega edi.", "Toriy-232 asosida bo'lib, taxminan 10 kilotonna trotilga teng kuchga ega edi.", "Deyteriy asosida bo'lib, taxminan 30 kilotonna trotilga teng kuchga ega edi."], ["Nagasaki shahriga atom bombasi tashlanishining asl sababi nima bo'lgan, ya'ni bu shahar qanday tanlangan edi?", "Asl nishon Kokura shahri ustida kuchli bulut bo'lganligi sababli, Nagasaki zaxira nishon sifatida tanlandi.", "Nagasaki shahri Yaponiya harbiy-sanoat markazi bo'lganligi sababli, u strategik jihatdan muhim edi.", "Amerikaliklar Yaponiya hukumati taslim bo'lishdan bosh tortgani uchun qo'shimcha bosim o'tkazishni maqsad qilgan.", "Xirosima bombardimonidan keyin Yaponiya taslim bo'lmagani uchun, ikkinchi bomba strategik ahamiyat kasb etdi."], ["Yaponiyada atom bombasidan omon qolgan odamlar qanday atalgan va ularga xos qanday tibbiy muammolar kuzatilgan?", "\"Hibakusha\" deb atalgan va ular orasida leykemiya, saraton, irsiy nuqsonlar keskin oshgan.", "\"Genshi\" deb atalgan va ular jamiyat tomonidan ijtimoiy qabul qilinishda qiyinchiliklarga duch kelishgan.", "\"Kagayaki\" deb atalgan va ular tez-tez psixologik travmalar hamda xotira yo'qotishidan aziyat chekishgan.", "\"Tsunagi\" deb atalgan va ular tez-tez nafas olish muammolari hamda terining kuyish izlaridan aziyat chekishgan."], ["AQSh hukumati atom bombasi qurbonlari bo'yicha qanday pozitsiyani egallagan va ularga qanday yordam ko'rsatgan?", "Ular \"hibakusha\" tajribasini \"ma'lumot\" sifatida qarab, ularga tibbiy yordam ko'rsatishdan bosh tortgan.", "Ular Yaponiya hukumati bilan birgalikda jabrlanganlarga keng qamrovli tibbiy va moliyaviy yordam ko'rsatgan.", "Ular radiatsiya ta'sirining inson salomatligiga jiddiy zarar yetkazmasligini isbotlashga uringanlar.", "Ular jabrlanganlarga maxfiy tibbiy tadqiqotlar o'tkazishni taklif etgan, ammo natijalarni e'lon qilmagan."], ["Tarixchi Antoni Bivorning fikricha, Prezident Trumenning atom bombasini qo'llash haqidagi qarori asosan nimaga asoslangan edi?", "Yaponiya bostirib kirishda Ittifoqchi kuchlar uchun kutilayotgan qurbonlar sonini kamaytirishga asoslangan.", "Yaponiya harbiy salohiyatini to'liq yo'q qilish va uning hududiy yaxlitligini saqlashga qaratilgan edi.", "Sovet Ittifoqining Osiyodagi ta'sirini cheklash hamda urushdan keyingi dunyo tartibini shakllantirishga.", "Yadro qurolining harbiy samaradorligini sinovdan o'tkazish va dunyoga o'z kuchini namoyish etishga."], ["Adolf Gitlerning hokimiyatga kelishi Germaniyaning XX asr boshlaridagi qaysi muammolari bilan chambarchas bog'liq edi?", "Birinchi jahon urushidan keyingi siyosiy va iqtisodiy inqiroz, ishsizlik va qashshoqlik bilan bog'liq edi.", "Sanoatlashishning sekinligi va xalqaro savdodagi raqobatbardoshlikning pastligi tufayli yuzaga kelgan inqiroz.", "Monarxiya rejimining beqarorligi va sotsialistik harakatlarning kuchayishi natijasida yuzaga kelgan g'alayonlar.", "Tashqi siyosatdagi muvaffaqiyatsizliklar va mustamlaka hududlarining yo'qotilishi bilan bog'liq muammolar."], ["1919 yilgi Versal shartnomasi Germaniya uchun qanday asosiy oqibatlarga olib keldi?", "Germaniyani zaiflashtirib, katta tovonlar to'lash, harbiy cheklovlar va hududiy yo'qotishlarga majbur etdi.", "Germaniyaga iqtisodiy tiklanish uchun imkoniyatlar yaratib, sanoatning tezkor rivojlanishiga qulay sharoit yaratdi.", "Germaniya hududini kengaytirib, xalqaro maydondagi ta'sirini oshirishga imkon berdi, bu esa tinchlikni buzdi.", "Germaniyaga to'liq suverenitet berib, barcha xalqaro cheklovlarni bekor qildi va kuchli davlatga aylantirdi."], ["Natsizm mafkurasining asosiy g'oyalari va tamoyillari nimalardan iborat edi?", "Millatchilik, irqiy ustunlik, yahudiylarga qarshi siyosat, totalitar boshqaruv va agressiv tashqi siyosat.", "Demokratiya, fuqarolik erkinligi, ijtimoiy tenglik va inson huquqlarini hurmat qilishga asoslangan g'oyalar.", "Xalqaro hamkorlik, tinchlikni saqlash va boshqa davlatlar bilan o'zaro manfaatli munosabatlar.", "Iqtisodiy liberalizm, erkin bozor va fuqarolik jamiyatini rivojlantirishga qaratilgan g'oyalar."], ["Natsistlar Germaniyasi tashqi siyosatida \"Lebensraum\" (\"hayot uchun hudud\") siyosati nimani nazarda tutgan?", "Sharqiy Yevropada yangi yerlarni bosib olish va nemis xalqiga keng hudud yaratish maqsadini nazarda tutgan.", "Yevropada barcha xalqlarning tengligi va o'zaro hurmatga asoslangan tinch-totuv yashashini nazarda tutgan.", "Germaniya iqtisodiyotini mustahkamlash uchun xalqaro savdoni rivojlantirish va yangi bozorlarni topishni nazarda tutgan.", "Madaniy almashinuvlarni rag'batlantirish va Germaniya ta'sirini tinch yo'llar bilan kengaytirishni nazarda tutgan."], ["Adolf Gitler davrida Germaniyaning hududiy ekspansiya siyosati doirasida qaysi voqealar sodir bo'lgan?", "1938 yilda Avstriya Germaniyaga qo'shib olindi (Anschluss), Sudet viloyati va butun Chexoslovakiya bosib olindi.", "1939 yilda Fransiya va Buyuk Britaniya bilan ittifoq tuzilib, Yevropada umumiy xavfsizlikni mustahkamlashga qaratildi.", "1937 yilda Sovet Ittifoqi bilan hududiy kelishuvlarga erishilib, Germaniya chegaralarini sezilarli kengaytirdi.", "1940 yilda Polsha bilan tinchlik shartnomasi imzolandi va chegaradagi barcha mojarolar to'liq hal qilindi."], ["1939 yil 1 sentabrda Germaniyaning Polshaga hujum qilishi qanday global natijaga olib keldi?", "Bu voqea Ikkinchi jahon urushining boshlanishiga sabab bo'ldi va Yevropada kuchlar muvozanatini izdan chiqardi.", "Bu Germaniya va Polsha o'rtasidagi chegara nizolarini hal qilib, mintaqadagi xavfsizlik va tinchlikni ta'minlashga yordam berdi.", "Bu hujum Yevropa davlatlari tomonidan qoralanib, Germaniyaga nisbatan iqtisodiy sanksiyalar joriy etildi.", "Bu hujum Sovet Ittifoqi va Germaniya o'rtasidagi harbiy ittifoqni mustahkamlab, ularning ta'sirini oshirdi."], ["1941 yil 22 iyunda erta tongda Germaniya bilan birga SSSRga qarshi urush boshlagan davlatlar qaysilar edi?", "Italiya, Ruminiya, Vengriya, Finlandiya va Slovakiya ham SSSRga qarshi urush boshlagan edi.", "Yaponiya, Ispaniya, Turkiya va Portugaliya ham SSSRga qarshi harbiy harakatlarda faol ishtirok etgan.", "Fransiya, Buyuk Britaniya, Polsha va Chexoslovakiya ittifoq tuzib, SSSRni faol qo'llab-quvvatlagan.", "Shvetsiya, Shveytsariya va Gollandiya betaraf qolganiga qaramay, harbiy yordam ko'rsatgan."], ["1941 yilgi fojiani izohlashda Sovet armiyasining qurollanish holati bo'yicha qanday noto'g'ri tushuncha mavjud edi?", "Sovet armiyasini to'la qurollantirishga vaqt yetishmaganligi noto'g'ri tushuncha bo'lib, aslida SSSR ustun edi.", "Sovet armiyasida yuqori malakali ofitserlarning yetishmasligi asosiy muammo deb hisoblangan edi, ammo bu aniq emas.", "Sovet armiyasining texnik bazasi eskirganligi va zamonaviy qurollarga ega emasligi noto'g'ri taxmin edi.", "Sovet rahbariyati harbiy tayyorgarlikka yetarli e'tibor bermaganligi sabab bo'lgan degan tushuncha noto'g'ri edi."], ["A. Gitler boshchiligidagi natsional-sotsialistik ishchi partiyasi Germaniyada qaysi yilda hokimiyatga kelgan va asosiy maqsadi nima edi?", "1933-yil, Birinchi jahon urushidagi mag'lubiyat uchun o'ch olishni maqsad qilgan edi.", "1929-yil, Versal shartnomasini bekor qilish va yangi iqtisodiy siyosat olib borishni rejalashtirgan.", "1935-yil, Sovet Ittifoqi bilan ittifoq tuzish va harbiy qudratni oshirishni maqsad qilgan.", "1928-yil, Buyuk Depressiyaning oqibatlarini bartaraf etish va milliy birlikni mustahkamlash."], ["1938-yilgi Myunxen kelishuvi nima bilan bog'liq bo'lgan va unda qaysi hudud asosiy bahs mavzusi edi?", "Germaniyaning Chexoslovakiyani bosib olishga tayyorlanishi bilan bog'liq bo'lib, Sudet viloyati asosiy bahs mavzusi edi.", "Avstriyaning Germaniyaga qo'shilishi masalasi bilan bog'liq bo'lib, ushbu kelishuvda Avstriya mustaqilligi saqlab qolingan.", "Polsha va Germaniya o'rtasidagi chegara nizolarini hal qilishga qaratilgan bo'lib, Danzig masalasi ko'tarilgan.", "SSSR va Germaniya o'rtasida hujum qilmaslik paktini imzolashni nazarda tutgan, uning sirli protokollari mavjud edi."], ["Adolf Gitlerning \"Main Kampf\" asarida bayon etilgan va Anshlyusning asosiy sabablaridan biri hisoblangan g'oya nima edi?", "Pangermanizm g'oyasi, ya'ni barcha nemiszabon xalqlarni yagona \"Buyuk Germaniya\" imperiyasiga birlashtirish.", "\"Lebensraum\" tushunchasi, Sharqiy Yevropa hududlarida nemis xalqi uchun yangi yashash joylarini yaratish.", "Fashizmning g'alabasi, demokratiya va liberalizm qadriyatlarini butunlay yo'q qilish va avtoritar tuzumni o'rnatish.", "\"Blitskrig\" doktrinasi, dushmanga qarshi qisqa muddatli, yashin tezligidagi harbiy operatsiyalarni amalga oshirish."], ["Avstriyaning Germaniyaga qo'shib olinishidan Germaniya qanday geosiyosiy va iqtisodiy foydalar kutgan edi?", "Markaziy va Janubi-Sharqiy Yevropaga to'g'ridan-to'g'ri yo'l ochish, strategik xomashyo va inson resurslarini ko'paytirish.", "O'rta Yer dengiziga chiqish imkoniyatini qo'lga kiritish, yangi dengiz savdo yo'llarini ochish va flotni kuchaytirish.", "Fransiya va Buyuk Britaniya bilan harbiy ittifoq tuzish, global siyosiy ta'sirini sezilarli darajada oshirish.", "Italiya va Ispaniya bilan iqtisodiy aloqalarni mustahkamlash, ulkan xalqaro savdo blokini yaratish."], ["Anshlyusga turtki bo'lgan Avstriyadagi ichki siyosiy holat qanday tasniflangan edi?", "Germaniya bilan birlashishni xohlovchi natsistlar partiyasining Avstriyada kuchli yashirin faoliyati mavjud edi.", "Sotsialistik partiyaning mamlakatda ochiqdan-ochiq hukmronligi va mustaqillik g'oyalarini qo'llab-quvvatlashi.", "Qirollik oilasining mamlakatdagi ta'siri kuchli bo'lib, ular nemis ta'siriga qarshi kurash olib borishgan edi.", "Demokratik hukumatning keng ko'lamli islohotlari natijasida aholining Germaniyaga intilishi butunlay yo'q qilingan."], ["Nima uchun Germaniya aynan Chexoslovakiyaning Sudet viloyatiga alohida e'tibor qaratgan edi?", "Bu viloyat aholisining ko'pchiligini nemis millatiga mansub kishilar tashkil qilganligi sababli.", "Sudet viloyati juda boy ko'mir konlariga ega bo'lib, Germaniyaning sanoatiga juda zarur edi.", "Viloyatda Fransiya va Buyuk Britaniya tomonidan qurilgan zamonaviy harbiy bazalar joylashgan edi.", "Sudet hududi to'g'ridan-to'g'ri Boltiq dengiziga chiqish imkoniyatini beruvchi strategik portga ega edi."], ["Chexoslovakiyaning Sudet viloyatining Germaniya uchun strategik ahamiyati nimada edi?", "Hududda Chexoslovakiyaning kuchli harbiy istehkomlari va rivojlangan \"Shkoda\" qurol-aslaha zavodlari joylashgan edi.", "U yerda G'arbiy Yevropadagi eng yirik neft zahiralari mavjud bo'lib, Germaniyaning energiya xavfsizligini ta'minlar edi.", "Viloyat xalqaro savdo yo'llarining chorrahasida joylashgan bo'lib, Germaniya uchun muhim tranzit hududi vazifasini o'tar edi.", "Sudet viloyati G'arbiy frontda Germaniya mudofaasi uchun ajralmas strategik qal'a bo'lib xizmat qilar edi."], ["\"Anshlyus\" atamasi siyosiy tarixda qanday ma'noni anglatadi va uning mohiyati nimada?", "\"Qo'shilish, birlashish\" ma'nosini anglatadi va bir davlatning boshqa davlat tomonidan kuch ishlatib tarkibiga qo'shib olinishi.", "\"O'zaro yordam\" ma'nosini anglatadi va ikki davlat o'rtasida harbiy ittifoq tuzish va hamkorlikni chuqurlashtirish.", "\"Betaraflik\" ma'nosini anglatadi va davlatning harbiy mojarolardan uzoqda turish, siyosiy bloklarga qo'shilmasligi.", "\"Demokratik saylov\" ma'nosini anglatadi va xalqning o'z taqdirini erkin ovoz berish yo'li bilan hal qilish jarayoni."], ["\"Kapitulyatsiya\" atamasi qanday ma'noni ifodalaydi va siyosiy kontekstda nimani anglatadi?", "Bir davlat yoki qo'shinlarning dushman oldida qarshilikni to'xtatib, uning shartlarini qabul qilishi jarayonidir.", "Biror hududning xalqaro sud qarori bilan boshqa davlat tarkibiga o'tishi natijasida yuzaga keladigan holat.", "Urushayotgan tomonlar o'rtasida tinchlik muzokaralarini boshlash, ziddiyatlarni diplomatik yo'l bilan hal etish usuli.", "Davlatning iqtisodiy sanksiyalar ostida qolib, xalqaro hamjamiyat tomonidan qo'yilgan talablarga bo'ysunishi."], ["Uinston Cherchill Myunxen kelishuviga qanday baho bergan va tarixiy voqealar uning so'zlarini qanchalik tasdiqlagan?", "\"Nomus yoki urush o'rtasida tanlov berildi, siz nomusni boy berishni tanladingiz va baribir urushga ega bo'lasiz\" degan.", "\"Bu tinchlik uchun qilingan eng to'g'ri qadam, urushni oldini olishning yagona yo'li edi\" deb ijobiy baholagan.", "\"Kelishuv Britaniyaning Yevropadagi ta'sirini kuchaytirdi va tinchlikni uzoq muddatga ta'minladi\" deb ta'kidlagan.", "\"Chexoslovakiyaning suverenitetini himoya qilish uchun hal qiluvchi g'alaba\" deb, uni diplomatik yutuq sifatida ko'rgan."], ["Molotov-Ribbentrop pakti imzolanishiga SSSR rahbariyatini undagan asosiy sabablar nimalardan iborat edi?", "Myunxen kelishuvidan so'ng G'arb davlatlariga ishonchsizlik va Yaponiya bilan ikki frontli urushdan qochish istagi.", "Germaniya bilan uzoq muddatli harbiy ittifoq tuzish va Yevropada kommunizm g'oyalarini keng yoyishni maqsad qilish.", "Buyuk Britaniya va Fransiya bilan harbiy hamkorlikni mustahkamlash, birgalikda fashizmga qarshi kurashishni rejalashtirish.", "AQSHning Sharqiy Yevropadagi ta'sirini cheklash va mintaqaviy barqarorlikni ta'minlash uchun siyosiy choralarni qo'llash."], ["Polshaga bostirib kirishdan oldin Gitlerning Sovet Ittifoqi bilan Molotov-Ribbentrop paktini imzolashdan asosiy maqsadi nima edi?", "Polshaga hujum qilishdan oldin o'zining Sharqiy chegarasini (SSSR tomonini) xavfsiz holatga keltirish.", "Sovet Ittifoqi bilan uzoq muddatli iqtisodiy hamkorlikni yo'lga qo'yish, xomashyo yetkazib berish shartnomalarini imzolash.", "G'arbiy Yevropadagi dushmanlariga qarshi birlashgan front yaratish va ularning kuchini parchalash.", "Yangi harbiy texnologiyalarni ishlab chiqishda Sovet Ittifoqi bilan tajriba almashish va birgalikda rivojlanish."], ["Ikkinchi jahon urushi qaysi sanada boshlangan va qaysi voqea uni rasman boshlab bergan edi?", "1939-yil 1-sentabrda Germaniyaning Polshaga bostirib kirishi bilan.", "1938-yil 29-sentabrda Myunxen kelishuvi imzolanishi va Chexoslovakiyaning taslim bo'lishi bilan.", "1940-yil 10-mayda Germaniyaning Fransiyaga yurish boshlashi va \"G'alati urush\"ning tugashi bilan.", "1941-yil 22-iyunda Germaniyaning Sovet Ittifoqiga hujum qilishi va \"Barbarossa\" rejasini ishga tushurishi bilan."], ["Germaniya Polshaga bostirib kirish uchun qanday soxta sabab (feyk) ko'rsatgan edi?", "Gleyvitsdagi radiostansiyaga polyaklar hujum qildi degan uydirma sabab ko'rsatilgan edi.", "Polsha qo'shinlari Germaniya hududiga kutilmaganda bostirib kirib, chegara postlariga hujum uyushtirgan edi.", "Polsha hukumati Germaniyadagi nemis ozchilikka nisbatan ommaviy repressiyalar o'tkazganini da'vo qilgan.", "Polsha Sovet Ittifoqi bilan harbiy ittifoq tuzib, Germaniya chegaralariga bevosita tahdid solganini e'lon qilgan."], ["Ikkinchi jahon urushining dastlabki bosqichlaridagi \"G'alati urush\" (Phoney War) deb atalgan davrning o'ziga xos xususiyati nima edi?", "Urush e'lon qilingan bo'lsa-da, Buyuk Britaniya va Fransiya tomonidan Polshaga yordam berish uchun amalda faol harbiy harakatlar amalga oshirilmaganligi.", "Germaniya va Sovet Ittifoqi o'rtasidagi harbiy mojarolar shiddatli tus olgan, ammo G'arb davlatlari bu mojaroga aralashmaganligi.", "Yevropaning barcha davlatlari o'zaro ittifoqlar tuzib, bir-birlariga qarshi doimiy ravishda hujumlar uyushtirganligi.", "Havo va dengiz kuchlarining doimiy jangovar harakatlariga qaramay, quruqlikdagi qo'shinlar o'rtasida katta to'qnashuvlar bo'lmaganligi."], ["Sovet Ittifoqi Polshaga qachon bostirib kirgan va bu harakatini qanday shior ostida oqlagan edi?", "1939-yil 17-sentabrda, \"Ukrain va belorus qardoshlarni himoya qilish\" shiori ostida.", "1939-yil 1-sentabrda, \"Polshaning neytralligini ta'minlash\" bahonasi bilan Germaniya bilan bir vaqtda.", "1940-yil martida, \"Finlyandiya bilan do'stlik shartnomasini ta'minlash\" maqsadida, harbiy kuchlarini joylashtirgan.", "1941-yil 22-iyunda, \"Kapitalistik tahdidga qarshi kurashish\" shiori ostida, butun Yevropaga qo'shin kiritish uchun."], ["Katyn qirg'ini qachon sodir bo'lgan va u nima bilan mashhur bo'lgan edi?", "1940-yil bahorida sodir bo'lgan va NKVD tomonidan 22 mingga yaqin Polsha armiyasi ofitserlari hamda ziyolilari yashirincha otib tashlangan.", "1939-yil sentabrida sodir bo'lgan va Germaniya armiyasi tomonidan Polsha aholisiga qarshi ommaviy repressiyalar uyushtirilgan.", "1941-yil qishida sodir bo'lgan va sovet harbiy asirlariga qarshi nemis qo'shinlari tomonidan ommaviy qatl amalga oshirilgan.", "1945-yil bahorida sodir bo'lgan va urush tugaganidan so'ng, xalqaro tribunal tomonidan harbiy jinoyatchilar jazolangan voqea."], ["\"Barbarossa\" rejasining asosiy harbiy maqsadi nima edi va nemis qo'shinlari qaysi chiziqqa chiqishni rejalashtirgan edi?", "Sovet armiyasini 2–3 oy ichida mag'lub etish va \"Arxangelsk – Astraxan\" (A-A) chizig'iga chiqish.", "SSSRni diplomatik muzokaralar stoliga o'tirishga majbur qilish va tinchlik shartnomasini imzolash.", "G'arbiy Yevropadagi kuchlarini to'liq Sharqiy frontga o'tkazish va Buyuk Britaniyaga qarshi kurashish.", "Ural ortidagi hududlarda harbiy baza yaratish va Osiyo qit'asidagi ta'sir doirasini kengaytirish."], ["\"Barbarossa\" rejasining barbod bo'lishiga olib kelgan asosiy omillar qatoriga nimalar kiradi?", "Sovet xalqining qat'iyatli qarshiligi, cheksiz hududlar, \"rasputitsa\", qattiq \"General Qish\" sovuqlari va Moskva ostonasidagi mag'lubiyat.", "Germaniya qo'shinlarining juda tez harakatlanishi tufayli ta'minot zanjirlarining qisqarishi va ichki ziddiyatlar.", "AQSH va Buyuk Britaniyaning Sovet Ittifoqiga keng ko'lamli harbiy yordam berishi, texnologik ustunlik.", "Sharqiy frontda harbiy strategiyaning noto'g'ri tanlanishi, havo kuchlarining samarali ishlatilmasligi va dengiz blokadasi."], ["Antigitler koalitsiyasining shakllanishi qaysi voqeadan so'ng boshlandi va qaysi muhim hujjat imzolandi?", "Germaniyaning SSSRga hujumidan so'ng boshlandi va Atlantika xartiyasi imzolandi.", "Myunxen kelishuvidan keyin boshlandi va Versal tinchlik shartnomasining yangi tahriri tasdiqlandi.", "Polshaning bo'lib olinishi ortidan boshlandi va Buyuk Britaniya hamda Fransiya o'rtasida yangi harbiy shartnoma tuzildi.", "Sovet-Fin urushidan keyin shakllandi va Birlashgan Millatlar Tashkilotining birinchi qadamlari qo'yildi."], ["1940-yil sentabrda imzolangan \"Uchlar pakti\" (Axis Pact) tarkibiga dastlab qaysi davlatlar kirgan edi?", "Germaniya, Yaponiya va Italiya davlatlari o'rtasida harbiy hamkorlik to'g'risida kelishuv imzolanib boshlandi.", "Buyuk Britaniya, Fransiya va AQSH davlatlari o'rtasida tinchlikni saqlashga qaratilgan ittifoq edi.", "Sovet Ittifoqi, Polsha va Chexoslovakiya davlatlari o'rtasida himoya ittifoqi imzolangan edi.", "Vengriya, Ruminiya va Slovakiya davlatlari o'rtasida mintaqaviy iqtisodiy hamkorlik shartnomasi edi."], ["1919 yilgi Versal shartnomasi va unga bog'liq kelishuvlar asosida shakllangan xalqaro tartib qanday nomlandi?", "Ushbu xalqaro tartibshunoslik Versal tizimi deb ataldi va tinchlikni ta'minlashga qaratilgan edi.", "Ushbu xalqaro tartibshunoslik Gʻarbiy Yevropa ittifoqi deb ataldi va savdo aloqalarini rivojlantirdi.", "Ushbu xalqaro tartibshunoslik Berlin konferensiyasi tizimi deb ataldi va koloniyalarni boshqardi.", "Ushbu xalqaro tartibshunoslik Dunyo xavfsizligi pakti deb ataldi va qurolsizlanishni qo'llab-quvvatladi."], ["Versal tizimining asosiy maqsadlari qatoriga quyidagilardan qaysi biri kirmaydi?", "Global iqtisodiy hamkorlikni chuqurlashtirish va yangi savdo bloklarini shakllantirish.", "Germaniyani harbiy jihatdan zaiflashtirish va uning agressiv salohiyatini keskin kamaytirish.", "Yangi davlat chegaralarini belgilash orqali mintaqaviy barqarorlikni mustahkamlash.", "Millatlar Ligasi orqali xalqaro miqyosda barqaror tinchlikni ta'minlash."], ["Versal shartnomasiga koʻra Germaniyaga qanday asosiy majburiyatlar yuklatilgan edi?", "Katta miqdorda tovon toʻlash, harbiy kuchini cheklash va ba'zi hududlardan voz kechish.", "Yangi koloniyalarni tashkil etish, savdo cheklovlarini joriy qilish va diplomatik munosabatlarni mustahkamlash.", "Iqtisodiyotini qayta tiklash uchun xorijiy investitsiyalarni jalb qilish va sanoatni rivojlantirish.", "Yangi demokratiya tamoyillarini qabul qilish, harbiy ta'limni isloh qilish va xalqaro hamkorlikka kirish."], ["Birinchi jahon urushidan keyin Elzas-Lotaringiya qaysi davlatga qaytarildi va Polsha mustaqilligi ta'minlandi?", "Elzas-Lotaringiya Fransiyaga qaytarildi, Polsha esa Germaniyadan olingan hududlar hisobiga tiklandi.", "Elzas-Lotaringiya Italiyaga berildi, Polsha esa Avstriya-Vengriya imperiyasidan ajralib chiqdi.", "Elzas-Lotaringiya Belgiya nazoratiga o'tdi, Polsha esa Rossiyadan ajralib chiqib mustaqil bo'ldi.", "Elzas-Lotaringiya Buyuk Britaniyaga o'tdi, Polsha esa Usmonli imperiyasi tarkibida qoldi."], ["Millatlar Ligasi qanday asosiy maqsadda tashkil etilgan bo'lib, keyinchalik nima sababdan samarali ishlay olmadi?", "Xalqaro xavfsizlikni ta'minlash maqsadida tashkil etilgan, ammo AQSh qo'shilmagani va boshqa davlatlarning passivligi tufayli samarasiz bo'ldi.", "Global savdo aloqalarini rivojlantirish maqsadida tashkil etilgan, ammo iqtisodiy inqirozlar sababli o'z vazifasini bajara olmadi.", "Madaniy almashinuvlarni rag'batlantirish maqsadida tashkil etilgan, ammo siyosiy kelishmovchiliklar bunga to'sqinlik qildi.", "Kolonial yerlarni boshqarish maqsadida tashkil etilgan, ammo buyuk davlatlarning raqobati unga pand berdi."], ["Versal tizimining zaif tomonlaridan biri sifatida Germaniya xalqida qanday norozilik holati kuzatildi?", "Tovon toʻlovlari va hududiy yo'qotishlar sababli kuchli 'Versal qatlomi' deb atalgan norozilik tug'ildi.", "Yangi hukumatga nisbatan ishonchsizlik va iqtisodiy islohotlarning sustligi sababli norozilik paydo bo'ldi.", "Siyosiy partiyalar o'rtasidagi kelishmovchiliklar va ichki nizolar sababli umumiy norozilik avj oldi.", "Harbiy xarajatlarning ortishi va armiyaning ta'siri kamayishi sababli aholi o'rtasida norozilik kuchaydi."], ["1929 yilgi Buyuk Depressiya xalqaro munosabatlarga qanday ta'sir ko'rsatdi?", "U xalqaro muvozanatni buzdi, Germaniya, Italiya va Yaponiyada totalitar rejimlar kuchayishiga turtki bo'ldi.", "U yangi xalqaro tashkilotlarning tuzilishiga zamin yaratdi va davlatlararo hamkorlikni kuchaytirdi.", "U global savdo tizimini mustahkamladi va davlatlar o'rtasidagi iqtisodiy bog'liqlikni kuchaytirdi.", "U siyosiy barqarorlikni oshirdi, chunki davlatlar iqtisodiy muammolarga e'tibor qaratdi."], ["Buyuk Britaniya va Fransiya Germaniyaga nisbatan qanday siyosat olib bordi, bu Gitlerning jasurlashishiga sabab boʻldi?", "Ular Germaniyaga qarshi qat'iy choralar ko'rmay, 'tinchlantirish siyosati'ni olib bordi.", "Ular Germaniya iqtisodiyotini qo'llab-quvvatladi va uni xalqaro savdo tizimiga faol jalb etdi.", "Ular Germaniyaga harbiy yordam ko'rsatdi va uning hududiy da'volarini qo'llab-quvvatladi.", "Ular Germaniyaga nisbatan qattiq sanktsiyalar qo'lladi va uning ichki ishlariga aralashdi."], ["Birinchi jahon urushidan keyin 'hududlarning taqsimlanishi' jarayoni natijasida Germaniya qanday hududlardan mahrum bo'ldi?", "Elzas-Lotaringiyani Fransiyaga qaytardi, ayrim yerlar Polshaga berildi va koloniyalaridan mahrum qilindi.", "Avstriya-Vengriya hududlarining bir qismini qo'shib oldi va Boltiqbo'yi davlatlariga da'vo qildi.", "Saar havzasini to'liq nazorati ostida saqlab qoldi va Sharqiy Prussiyadagi yerlarini kengaytirdi.", "Italiya va Yugoslaviya bilan chegara hududlarini o'zgartirdi va yangi dengiz portlarini oldi."], ["Birinchi jahon urushidan keyin Avstriya-Vengriya imperiyasi qanday oʻzgarishlarga uchradi?", "Imperiya butunlay parchalandi, Avstriya, Vengriya, Chexoslovakiya va Yugoslaviya kabi yangi davlatlar paydo boʻldi.", "Imperiya Boltiqbo'yi davlatlarini o'z tarkibiga qo'shib oldi va o'z hududini sezilarli darajada kengaytirdi.", "Imperiya Usmonli imperiyasi bilan ittifoq tuzib, o'z ta'sir doirasini Yaqin Sharqqa kengaytirdi.", "Imperiya markaziy Yevropada yagona yirik davlat sifatida saqlanib qoldi, ammo konstitutsiyaviy islohotlar o'tkazdi."], ["Birinchi jahon urushidan soʻng Usmonli imperiyasi qanday hududiy yo'qotishlarga duch keldi?", "U katta hududiy yo'qotishlarga uchradi, Turkiya mustaqil bo'ldi, arab mamlakatlari Britaniya va Fransiya mandati ostiga o'tdi.", "U Boltiqbo'yi davlatlarini o'z tarkibiga qo'shib oldi va Yevropadagi ta'sirini sezilarli darajada oshirdi.", "U Markaziy Yevropada yangi chegaralar belgiladi va Chexoslovakiya hamda Yugoslaviya hududlarini egalladi.", "U faqatgina kichik hududiy o'zgarishlarga duch keldi, biroq iqtisodiy jihatdan sezilarli darajada mustahkamlandi."], ["Birinchi jahon urushi yakunlangach, Rossiya imperiyasi qanday o'zgarishlar va hududiy yo'qotishlarga duch keldi?", "Inqilob va fuqarolar urushi tufayli hududiy yo'qotishlarga duch keldi, Boltiqbo'yi davlatlari va Finlyandiya mustaqil bo'ldi.", "U Germaniya hududlarining bir qismini o'z tarkibiga qo'shib oldi va G'arbiy Yevropadagi ta'sirini oshirdi.", "U Avstriya-Vengriya imperiyasining parchalanishi natijasida katta hududiy qo'lga kiritishlarga erishdi.", "U Yaponiya bilan ittifoq tuzib, Tinch okeani mintaqasidagi harbiy-siyosiy mavqeini mustahkamladi."], ["Versal tizimi doirasidagi hududlarning taqsimlanishi qanday salbiy oqibatlarni keltirib chiqardi?", "Ko'plab etnik va siyosiy muammolar, nizolar hamda qarama-qarshiliklarni keltirib chiqardi.", "Mintaqaviy iqtisodiyotning tez rivojlanishiga sabab bo'ldi va savdo aloqalarini mustahkamladi.", "Madaniy almashinuvlarni faollashtirdi va davlatlar o'rtasidagi hamkorlikni chuqurlashtirdi.", "Tinchlik va barqarorlikni ta'minladi, shuningdek, xalqaro huquqni mustahkamladi."], ["Vashington tizimi qachon shakllandi va uning asosiy maqsadi nima edi?", "1921–1922 yillarda shakllandi, dengiz qurollanishini cheklash va Tinch okeanida muvozanatni saqlash edi.", "1918–1919 yillarda shakllandi, Germaniyani iqtisodiy jihatdan zaiflashtirish va koloniyalarni boshqarish edi.", "1923–1924 yillarda shakllandi, Yevropada yangi chegaralarni belgilash va etnik nizolarni hal qilish edi.", "1925–1926 yillarda shakllandi, xalqaro savdo shartnomalarini tuzish va global bozorlarni kengaytirish edi."], ["Vashington konferensiyasida qanday muhim kelishuvlarga erishilgan edi?", "Dengiz flotlari sonini va tonnajini cheklash, shuningdek, Xitoyning hududiy yaxlitligini tan olish.", "Yevropadagi chegaralarni qayta ko'rib chiqish va Germaniyadan olingan hududlarni qaytarish to'g'risidagi kelishuvlar.", "Yangi mustaqil davlatlarga iqtisodiy yordam ko'rsatish va ularning harbiy salohiyatini oshirish.", "Millatlar Ligasini kuchaytirish va unga yangi vazifalarni yuklash bo'yicha kelishuvlar qabul qilingan."], ["Vashington tizimining inqiroziga olib kelgan asosiy omillar qaysilar edi?", "Yaponiya Manjuriyani bosib olishi, Buyuk Depressiya va Millatlar Ligasining samarasizligi.", "AQShning xalqaro masalalarda faollashishi, Buyuk Britaniyaning harbiy xarajatlari ortishi va Germaniyaning tinchliksevar siyosati.", "Rossiyadagi ichki islohotlar, Fransiya va Italiyaning diplomatik aloqalarni mustahkamlashi va Yevropadagi iqtisodiy o'sish.", "Yangi davlatlarning mustaqillikka erishishi, Usmonli imperiyasining parchalanishi va dengiz savdosining rivojlanishi."], ["Millatlar Ligasi faoliyatini qachon boshlagan va uning bosh qarorgohi qayerda joylashgan edi?", "1920 yilda faoliyatini boshlagan, bosh qarorgohi Shveytsariyaning Jeneva shahrida joylashgan edi.", "1919 yilda faoliyatini boshlagan, bosh qarorgohi Buyuk Britaniyaning London shahrida joylashgan edi.", "1922 yilda faoliyatini boshlagan, bosh qarorgohi Fransiyaning Parij shahrida joylashgan edi.", "1921 yilda faoliyatini boshlagan, bosh qarorgohi AQShning Vashington shahrida joylashgan edi."], ["Millatlar Ligasining dastlabki tarkibida qancha davlat bor edi va uning kuchsizligiga nima sabab boʻldi?", "Dastlab 42 ta davlat bor edi, AQShning qo'shilmagani tashkilotning kuchsizligiga sabab bo'ldi.", "Dastlab 50 ta davlat bor edi, SSSRning qarshiligi tashkilotning ta'sirini cheklab qo'ydi.", "Dastlab 35 ta davlat bor edi, Yaponiya va Italiyaning agressiv siyosati uning samarasizligiga olib keldi.", "Dastlab 60 ta davlat bor edi, Germaniyaning qayta qurollanishi uning faoliyatiga to'sqinlik qildi."], ["Millatlar Ligasi ayrim sohalarda muvaffaqiyatlarga erishgan bo'lsada, asosiy vazifasi bo'yicha qanday natija ko'rsatdi?", "Xalqaro mehnat tashkilotini tuzish va qochqinlar muammosini hal etishda muvaffaqiyat qozongan bo'lsa-da, urushlarning oldini olishda samarasiz bo'lib chiqdi.", "Global iqtisodiy hamkorlikni kuchaytirishda va savdo shartnomalarini tuzishda muvaffaqiyat qozongan bo'lsa-da, chegara nizolarini hal etishda samarasiz bo'ldi.", "Madaniy almashinuvlarni rivojlantirishda va ilmiy hamkorlikni yo'lga qo'yishda muvaffaqiyat qozongan bo'lsa-da, qurollanishni cheklashda samarasiz bo'ldi.", "Kolonial yerlarni boshqarishda va mahalliy nizolarni bartaraf etishda muvaffaqiyat qozongan bo'lsa-da, yirik davlatlararo diplomatik munosabatlarni yaxshilashda samarasiz bo'ldi."], ["1930-yillarda Germaniya, Italiya va Yaponiya agressiv siyosat olib borganida Millatlar Ligasi qanday munosabat bildirdi?", "Ular agressiv davlatlarga qarshi qat'iy choralar koʻra olmadi va bu xalqaro tartibni zaiflashtirdi.", "Ular agressiv davlatlarga nisbatan iqtisodiy sanksiyalar qo'lladi va ularning harbiy harakatlarini chekladi.", "Ular agressiv davlatlar bilan diplomatik muzokaralar o'tkazdi va tinchlik shartnomalarini imzoladi.", "Ular agressiv davlatlarga harbiy yordam ko'rsatdi va ularning hududiy da'volarini qo'llab-quvvatladi."], ["Versal tizimining asosiy maqsadi Germaniyani zaiflashtirish, yangi chegaralarni belgilash va tinchlikni ta'minlash edi. Ushbu tinchlik qaysi tashkilot orqali barqarorlashtirilishi nazarda tutilgan edi?", "Millatlar Ligasi orqali xalqaro xavfsizlik va davlatlararo hamkorlikni rivojlantirish orqali.", "Yevropa Kengashi doirasida davlatlararo savdo munosabatlarini mustahkamlash orqali.", "Xalqaro Valyuta Fondi koʻmagida moliyaviy barqarorlikni taʼminlash mexanizmlari bilan.", "Doimiy Arbitraj Sudining faoliyatini kengaytirish va huquqiy normalar bilan."], ["Germaniya Birinchi jahon urushida aybdor deb topilganidan soʻng, Versal shartnomasiga koʻra qanday majburiyatlarni oʻz zimmasiga olgan edi?", "Katta miqdorda tovon toʻlashi, harbiy kuchini keskin kamaytirishi va ayrim hududlardan voz kechishi.", "Barcha koloniyalarini qaytarib berishi, dengiz flotini kuchaytirmasligi va yangi ittifoqlar tuzmasligi.", "Siyosiy partiyalarning faoliyatini cheklashi, iqtisodiy islohotlarni amalga oshirmasligi.", "Barcha qoʻshni davlatlarga moliyaviy yordam koʻrsatishi, madaniy almashuvni rivojlantirmasligi."], ["Millatlar Ligasi qachon va qaysi asosiy hujjatga binoan tashkil etilgan hamda uning bosh qarorgohi qayerda joylashgan edi?", "1919 yilgi Versal shartnomasi asosida tashkil etilgan, bosh qarorgohi Jenevada edi.", "1921 yilgi Vashington kelishuvlariga binoan tuzilgan, markazi Parijda boʻlgan edi.", "1918 yilgi Brest-Litovsk shartnomasi asosida tashkil topgan, bosh shahri Berlin edi.", "1925 yilgi Lokarno bitimiga koʻra shakllantirilgan, qarorgohi Londonda joylashgan edi."], ["Versal tizimining zaif tomonlari orasida qaysi omil Germaniya xalqida \"Versal qatlomi\" deb atalgan kuchli norozilikni keltirib chiqargan edi?", "Tovon toʻlovlari va hududiy yoʻqotishlar iqtisodiyotni izdan chiqarishi va siyosiy beqarorlikni keltirib chiqarishi.", "Harbiy kuchini saqlashga ruxsat berilishi va boshqa davlatlar tomonidan yordam
