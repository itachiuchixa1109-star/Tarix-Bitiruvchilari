arni toʻliq saqlab qolish va ularni yanada mustahkamlash.", "Faqat madaniy merosni tiklash va milliy tillarni rivojlantirishga e'tibor qaratish, siyosatni cheklash.", "Boshqa davlatlarga qaramlikni qayta tiklash va xalqaro aloqalarni minimal darajada ushlab turish."], ["XX asr turkiy xalqlar tarixini faqat siyosiy mustaqillik uchun kurash tarixi sifatida tushunish nima uchun yetarli emas?", "Bu davrda imperiyalarning parchalanishi, milliy ongning shakllanishi va modernizatsiya kabi bir nechta jarayon kechganligi sababli.", "Bu davrda faqat birgina siyosiy oʻzgarishlar yuz berganligi va boshqa sohalarda rivojlanish boʻlmaganligi uchun.", "Bu tarixiy davr faqat iqtisodiy islohotlar va savdo aloqalarining kuchayishi bilan izohlanganligi sababli.", "Bu davrda turkiy xalqlar oʻzliklarini butunlay yoʻqotib, boshqa madaniyatlarga singib ketganligi sababli."], ["Matnga koʻra, XX asr turkiy xalqlar tarixini qanday jarayonlar xarakterlaydi?", "Keskin siyosiy oʻzgarishlar, imperiyalarning parchalanishi va milliy davlatlarning shakllanishi bilan.", "Faqatgina bir imperiyaning doimiy hukmronligi va siyosiy tizimlarning barqarorligi bilan.", "Asosan iqtisodiy integratsiya va mintaqaviy ittifoqlarning shakllanishi bilan bog'liq.", "Uzoq muddatli tinchlik va imperiyalararo hamkorlikning kuchayishi bilan izohlanadi."], ["Qaysi tarixiy voqea Rossiya imperiyasining Turkiston mintaqasidagi ma'muriy nazoratini mustahkamlagan?", "1867-yilda Turkiston general-gubernatorligining tashkil etilishi bilan mustahkamlangan.", "1860-yillardagi Toshkent va Samarqandning nazoratga oʻtishi jarayoni bilan mustahkamlangan.", "1873-yilgi Gandimiyon shartnomasi imzolanishi natijasida mintaqa nazorati mustahkamlangan.", "XIX asr oxirida Britaniya imperiyasi bilan \"Buyuk oʻyin\" tugatilishi bilan mustahkamlangan."], ["Matnga koʻra, Rossiya imperiyasining Turkistondagi asosiy iqtisodiy maqsadlari nimalardan iborat edi?", "Xomashyo manbalarini nazorat qilish, paxta yetishtirishni kengaytirish va sanoat uchun bozor yaratish.", "Turkiston madaniyatini rivojlantirish hamda aholi savodxonligini keskin ravishda oshirish.", "Britaniya imperiyasi bilan hamkorlikni kuchaytirish, yagona umumiy bozor shakllantirish.", "Mintaqada harbiy bazalar qurish va yangi siyosiy ittifoqlarni mustahkamlashni maqsad qilgan."], ["Qoʻqon xonligining siyosiy taqdiri Rossiya imperiyasi hukmronligi ostida Buxoro va Xiva xonliklaridan nimasi bilan farq qildi?", "Qoʻqon xonligi Rossiya imperiyasi tomonidan to'liq tugatilgan va hududlari Farg'ona viloyati tarkibiga qo'shilgan edi.", "Qoʻqon xonligi ham Buxoro va Xiva kabi faqat protektorat maqomini saqlab qolishga muvaffaq bo'lgan edi.", "Qoʻqon xonligi oʻzining ichki boshqaruvini saqlab, tashqi siyosatda toʻliq mustaqil qolishga intilgan edi.", "Qoʻqon xonligi Britaniya imperiyasi bilan yangi harbiy ittifoq tuzib, mustaqilligini mustahkamlagan edi."], ["XIX asr oxiri va XX asr boshlarida Usmoniylar imperiyasi duch kelgan asosiy ichki muammolar qaysilar edi?", "Hududiy yo'qotishlar, milliy harakatlarning kuchayishi va moliyaviy qaramliklar.", "Boshqa davlatlar bilan faol iqtisodiy hamkorlik va savdo hajmining keskin o'sishi.", "Imperiya ichida davlat boshqaruvining soddalashtirilishi va markazlashuvi.", "Siyosiy inqirozning yo'qligi va harbiy qudratning barqaror ravishda o'sishi."], ["Usmoniylar imperiyasining siyosiy tugashini sezilarli darajada tezlashtirgan asosiy voqea nima bo'ldi?", "Birinchi jahon urushidagi mag'lubiyat imperiyaning siyosiy tugashini tezlashtirgan asosiy omil bo'ldi.", "Yosh turklar inqilobining muvaffaqiyatli amalga oshirilishi imperiyaning barqarorligini ta'minlagan.", "Tanzimat islohotlarining keng ko'lamli tatbiq etilishi imperiyani yangi rivojlanish bosqichiga olib chiqqan.", "Yevropa davlatlari bilan harbiy ittifoqlarning tuzilishi imperiyaning kuchini oshirishga xizmat qilgan."], ["Berilgan matnga koʻra, \"Jadid\" atamasi birinchi navbatda nimani anglatadi?", "\"Usul-i jadid\" ya'ni \"yangi usul\" tushunchasi bilan bevosita bog'liq atama.", "\"Eski usul\" tarafdorlarini anglatuvchi diniy-konservativ harakatning nomi.", "\"Milliy ozodlik\" deb ataluvchi yashirin siyosiy tashkilotning maxfiy shifri.", "\"Yevropa usuli\" degan ma'noni anglatuvchi madaniy inqilobiy guruhning nomi."], ["Jadidchilik harakatining dastlabki bosqichlarida Turkistondagi asosiy e'tibor qaratilgan yo'nalishlar qaysilar edi?", "Ta'limni isloh qilish, yangi usul maktablarini tashkil etish va savodxonlikni oshirish.", "Qurolli qo'zg'olonlar tashkil etish va Rossiya imperiyasiga qarshi harbiy kurash olib borish.", "Buxoro va Xiva xonliklarida protektorat tuzumini mustahkamlashga qaratilgan islohotlar.", "Yevropa davlatlari bilan diplomatik aloqalarni oʻrnatish va madaniy integratsiyani chuqurlashtirish."], ["Sovet hokimiyati davrida 1920-yilda Buxoro amirligi va Xiva xonligiga nima bo'ldi?", "Buxoro amirligi va Xiva xonligi tugatilib, ularning oʻrnida Xalq Sovet Respublikalari tashkil etilgan edi.", "Buxoro amirligi va Xiva xonligi Rossiya imperiyasining protektorati maqomini saqlab qolishga muvaffaq bo'lgan edi.", "Buxoro amirligi va Xiva xonligi mustaqil davlatlar sifatida xalqaro maydonda toʻliq tan olindi.", "Buxoro amirligi va Xiva xonligi bolsheviklar hokimiyatiga qarshi yirik harbiy ittifoq tuzgan edi."], ["XX asr Markaziy Osiyo tarixidagi eng muhim siyosiy jarayonlardan biri sifatida qaysi voqea ta'kidlangan?", "1924-yilgi milliy-hududiy chegaralanish Markaziy Osiyo siyosiy xaritasini tubdan oʻzgartirdi.", "1917-yilgi Turkiston Muxtoriyatining tashkil topishi mintaqaning siyosiy holatini barqarorlashtirdi.", "1991-yilgi Sovet Ittifoqining parchalanishi mintaqada eski chegaralarni saqlab qolgan.", "1867-yilda Turkiston general-gubernatorligining tuzilishi mintaqaning ma'muriy holatini o'zgartirdi."], ["Sovet davrida turkiy xalqlar yashagan hududlardagi ijtimoiy-iqtisodiy o'zgarishlarga nimalar kirdi?", "Sanoatlashtirish, urbanizatsiya, ta'lim va tibbiyotning rivojlanishi hamda siyosiy repressiyalar.", "Siyosiy erkinlikning kengayishi, bozor iqtisodiyotining shakllanishi va chet el investitsiyalarining jalb etilishi.", "Qishloq xo'jaligining to'liq mustaqilligi, hunarmandchilikning qayta tiklanishi va madaniy muxtoriyat.", "Diniy tashkilotlarning kengayishi, milliy urf-odatlarning cheklanmasdan rivojlanishi va xususiy mulkchilik."], ["Sovet davrida milliy respublikalar doirasida turkiy xalqlarning madaniyati qanday rivojlandi?", "Milliy maktablar, teatrlar, ilmiy institutlar, adabiyot, tarixshunoslik va matbuot rivojlandi.", "Madaniy sohada toʻliq mustaqillik va mahalliy an'analarning cheklanmagan rivojlanishi.", "Markaziy Osiyo xalqlari oʻrtasida yagona madaniy makon yaratilib, milliy oʻziga xosliklar yoʻqoldi.", "Chet el madaniyatining keng tarqalishi va milliy san'atning inqirozga yuz tutishi."], ["1991-yildan keyin yangi mustaqil turkiy davlatlar oldida qanday umumiy vazifalar paydo boʻldi?", "Milliy davlat institutlarini yaratish, mustaqil tashqi siyosat yuritish va bozor iqtisodiyotiga oʻtish.", "Sovet davridagi siyosiy va iqtisodiy tizimni toʻliq saqlab qolish va mustahkamlash.", "Birgalikda yagona ittifoq davlatini tashkil etish va markazlashgan boshqaruvni kuchaytirish.", "Mintaqaviy harbiy bloklarga qoʻshilish va milliy oʻzlikni anglash jarayonlarini cheklash."], ["Matn XX asr turkiy xalqlar tarixini qanday umumiy ilmiy xulosa orqali tushunishni taklif etadi?", "Imperiyaviy siyosiy tizimlardan milliy davlatlar tizimiga oʻtishning murakkab va koʻp bosqichli jarayoni sifatida.", "Faqatgina siyosiy mustaqillik uchun olib borilgan kurashning oddiy va bir qatorli hikoyasi sifatida.", "Asosan tashqi kuchlarning aralashuvi natijasida yuzaga kelgan barqaror siyosiy rivojlanish davri sifatida.", "Madaniy uyg'onish harakatining siyosiy oqibatlarsiz, sof ma'rifatparvarlik davri sifatida."], ["XIX asrning ikkinchi yarmida Rossiya imperiyasi qaysi hududlarni nazoratiga olib, Markaziy Osiyodagi bosqinchilik jarayonini jadallashtirdi?", "Toshkent, Samarqand, Jizzax va Kattaqo'rg'on kabi strategik hududlarni nazoratiga oldi.", "Faqat Buxoro amirligi va Xiva xonligini to'g'ridan-to'g'ri o'z tarkibiga qo'shib olish bilan cheklandi.", "Janubiy Qozog'iston dashtlari va Farg'ona vodiysining g'arbiy qismlarini nazoratga olishni amalga oshirdi.", "Xorazm va Qo'qon xonliklarining iqtisodiy resurslaridan foydalanishga qaratilgan siyosat yuritdi."], ["1867-yilda Turkiston general-gubernatorligining tashkil etilishi Rossiya imperiyasining mintaqadagi ma'muriy boshqaruvida qanday asosiy maqsadga xizmat qildi?", "Rossiya imperiyasining mintaqadagi ma'muriy boshqaruv tizimini to'liq mustahkamlashga qaratilgan edi.", "Mahalliy hokimiyatlarga keng avtonomiya berish orqali boshqaruv samaradorligini oshirishni ko'zlagan edi.", "Britaniya imperiyasi bilan mintaqaviy raqobatni bartaraf etish uchun harbiy bufer zona yaratishga asoslangan.", "Markaziy Osiyo aholisini Rossiya imperiyasining asosiy qonunlariga bo'ysundirishni ta'minlashni maqsad qilgan."], ["1868-yildagi Rossiya-Buxoro urushidan so'ng Buxoro amirligining Rossiya imperiyasi bilan munosabatlaridagi siyosiy holati qanday edi?", "Amirlik tashqi siyosatda qaram, ammo ichki boshqaruvda cheklangan mustaqillikka ega protektorat edi.", "Buxoro amirligi Rossiya imperiyasining to'laqonli tarkibiy qismiga aylangan viloyat sifatida faoliyat yuritardi.", "Amirlik Rossiya bilan teng huquqli shartnoma asosida mustaqil davlat maqomini saqlab qolgan edi.", "Buxoro Rossiya imperiyasining to'g'ridan-to'g'ri harbiy nazorati ostida bo'lgan harbiy gubernatorlikka aylandi."], ["Usmoniylar imperiyasining XX asr boshidagi siyosiy inqiroziga olib kelgan eng muhim tashqi omillardan biri nima edi?", "Birinchi jahon urushidagi mag'lubiyat natijasida imperiyaning siyosiy tugashini tezlashtirish.", "Yevropa davlatlari bilan savdo munosabatlarining keskin yomonlashuvi va iqtisodiy qaramlikning kuchayishi.", "Ichki milliy harakatlarning kuchayishi va ularning imperiya hududlarini egallab olishga intilishi.", "Yangi turkiy davlatlarning tashkil topishi va ularning Usmoniylar imperiyasiga qarshi birlashishi."], ["Usmoniylar imperiyasi rasman tugatilgan va Turkiya Respublikasi tashkil etilgan yil qaysi?", "Usmoniylar imperiyasi 1922-yilda tugatilib, o'rniga Turkiya Respublikasi tashkil topgan.", "Usmoniylar imperiyasi 1908-yilda Yosh turklar inqilobi natijasida yangi tuzumga o'tgan.", "Usmoniylar imperiyasi 1918-yilda Mudros sulhi imzolangandan so'ng mavjudligini to'xtatgan.", "Usmoniylar imperiyasi 1920-yilda Sevr shartnomasi bilan hududiy jihatdan keskin o'zgargan."], ["Matnda jadidchilikning rivojlanish jarayoni qanday ketma-ketlikda tasvirlangan, ya'ni uning ma'rifatparvarlikdan siyosiy faollikka o'tishi?", "Ma'rifat → milliy ong → ijtimoiy islohot → siyosiy faollikning shakllanishiga katta ta'sir koʻrsatgan.", "Ta'lim islohoti → madaniy uyg'onish → iqtisodiy rivojlanish → harbiy-strategik mustahkamlanish.", "Milliy o'zlikni anglash → diniy islohotlar → hududiy mustaqillik → tashqi siyosatda faollashuv.", "Ijtimoiy adolat → savodxonlikni oshirish → davlat boshqaruvini modernizatsiya qilish → xalqaro hamkorlik."], ["Sovet hokimiyati o'rnatilgach, 1920-yilda Buxoro amirligi va Xiva xonligi taqdiri qanday hal etilgan?", "Ular tugatilib, oʻrnida Buxoro Xalq Sovet Respublikasi va Xorazm Xalq Sovet Respublikasi tashkil topgan.", "Ular Rossiya protektorati sifatida mavjudligini davom ettirgan, ammo ichki boshqaruvi cheklangan edi.", "Ular Sovet Ittifoqi tarkibiga avtonom respublikalar sifatida kirgan holda, mahalliy hukumat tuzumini saqlab qolgan.", "Bolsheviklar tomonidan to'g'ridan-to'g'ri markaziy boshqaruvga bo'ysundirilgan harbiy viloyatlarga aylantirilgan."], ["XX asr Markaziy Osiyo tarixidagi eng muhim siyosiy jarayonlardan biri bo'lgan 1924-yilgi milliy-hududiy chegaralanishning asosiy natijasi nima edi?", "Turkiston, Buxoro va Xorazm siyosiy tuzilmalari tugatilib, milliy nomlar asosidagi sovet respublikalari shakllantirilgan.", "Markaziy Osiyodagi barcha milliy guruhlarga keng muxtoriyat berilgan va ularning mustaqilligi to'liq e'tirof etilgan.", "Mintaqada yagona va markazlashgan boshqaruv tizimi yaratilib, barcha hududlar bir respublika tarkibiga kiritilgan.", "Sovet Rossiyasining Markaziy Osiyodagi ta'siri to'liq bartaraf etilib, mahalliy xalqlar tomonidan boshqaruv tiklangan."], ["1924-yilgi milliy-hududiy chegaralanish jarayonida Moskva tashabbusi bilan bir qatorda yana qaysi omil muhim rol o'ynagan?", "Markaziy Osiyodagi mahalliy siyosiy kadrlar, ziyolilar va milliy guruhlarning manfaatlari ham faol ishtirok etgan.", "Britaniya va boshqa G'arb davlatlarining mintaqadagi geosiyosiy ta'sirini kuchaytirishga bo'lgan urinishlari.", "Mintaqadagi ko'plab qurolli guruhlarning harbiy harakatlari natijasida yuzaga kelgan bosimlar.", "Qo'shni Eron va Afg'oniston davlatlarining hududiy da'volari va diplomatik aralashuvlari muhim ahamiyatga ega bo'lgan."], ["Sovet davridagi modernizatsiya jarayonlarining qaysi salbiy jihatlari matnda alohida ta'kidlangan?", "Kollektivlashtirish, siyosiy repressiyalar, diniy institutlarning cheklanishi va milliy elitalarning ta'qib qilinishi.", "Yangi zavodlar qurilishi, temir yo'llar tarmog'ining kengayishi va energetika sohasidagi yutuqlar.", "Savodxonlik darajasining oshishi, oliy ta'lim muassasalarining tashkil etilishi va tibbiyot tizimining kengayishi.", "Milliy madaniyatning rivojlanishi, milliy maktablar, teatrlar va ilmiy institutlarning barpo etilishi."], ["1980-yillarning ikkinchi yarmida SSSRda boshlangan “qayta qurish” (perestroika) va “oshkoralik” (glasnost) siyosati qanday oqibatlarga olib keldi?", "Iqtisodiy muammolar, markaz va respublikalar munosabatlarining murakkablashuvi va milliy ongning kuchayishi bilan kechdi.", "SSSRning iqtisodiy barqarorligini to'liq tikladi va sotsialistik tizimni yangi bosqichga olib chiqdi.", "Respublikalar o'rtasidagi munosabatlarni mustahkamladi va yagona Sovet xalqi g'oyasini kuchaytirdi.", "G'arb davlatlari bilan diplomatik aloqalarni uzdi va mustaqil tashqi siyosat yuritishga imkon yaratdi."], ["Oʻzbekiston davlat mustaqilligini qaysi sanada e'lon qildi va qaysi sana Mustaqillik kuni sifatida belgilandi?", "Oʻzbekiston 1991-yil 31-avgustda mustaqilligini e'lon qildi, 1-sentabr Mustaqillik kuni sifatida belgilangan.", "Oʻzbekiston 1990-yil 20-iyunda mustaqillik deklaratsiyasini qabul qildi, 1-avgust esa milliy bayram deb e'lon qilindi.", "Oʻzbekiston 1991-yil 27-oktabrda mustaqil deb e'lon qilindi, 27-oktabr Mustaqillik kuni etib belgilandi.", "Oʻzbekiston 1991-yil 16-dekabrda mustaqillikka erishdi, 16-dekabr Mustaqillik kuni sifatida nishonlanadi."], ["Turkmaniston mustaqillikka erishgandan so'ng xalqaro maydonda qanday o'ziga xos siyosiy modelni shakllantirishga e'tibor qaratdi?", "Turkmaniston oʻziga xos siyosiy modelni shakllantirib, xalqaro maydonda betaraflik siyosatiga katta e'tibor berdi.", "Turkmaniston yirik harbiy ittifoqlarga qo'shilish orqali mintaqaviy xavfsizlikni ta'minlashga intildi.", "Turkmaniston iqtisodiy integratsiyani ustuvor vazifa deb bilib, qo'shni davlatlar bilan faol iqtisodiy bloklar tuzdi.", "Turkmaniston geosiyosiy mavqeini kuchaytirish maqsadida barcha kuchli davlatlar bilan teng darajada hamkorlik qildi."], ["Yangi mustaqil turkiy davlatlar oldida paydo bo'lgan umumiy vazifalar orasida qaysi biri sanab o'tilmagan?", "Yagona harbiy blok yaratish va kollektiv mudofaa tizimini joriy etish.", "Milliy davlat institutlarini yaratish, jumladan parlament, prezidentlik va sud tizimlarini shakllantirish.", "Mustaqil tashqi siyosatni olib borish, BMT va xalqaro moliyaviy tashkilotlar bilan munosabatlarni rivojlantirish.", "Sovet rejali iqtisodiyotidan bozor iqtisodiyotiga o'tish hamda milliy o'zlikni qayta anglash, davlat tillarini rivojlantirish."]]}];
const $=id=>document.getElementById(id);
let cur=0;
function drawSubs(){const b=$('subs');b.innerHTML='';SUBJ.forEach((s,k)=>{const x=document.createElement('button');x.className='opt sub'+(k===cur?' sel':'');
  const a=document.createElement('span');a.textContent=s.name;const c=document.createElement('small');c.textContent=s.q.length+' ta savol';x.append(a,c);
  x.onclick=()=>{cur=k;drawSubs()};b.appendChild(x)});
  $('avail').textContent='(mavjud: '+SUBJ[cur].q.length+')'}
drawSubs();
let list=[],i=0,score=0,wrong=[],locked=false;
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function show(id){['start','quiz','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function begin(items){list=items.map(r=>({q:r[0],c:r[1],o:shuffle(r.slice(1))}));i=0;score=0;wrong=[];show('quiz');render()}
function render(){
  const it=list[i];locked=false;
  $('pos').textContent='Savol '+(i+1)+' / '+list.length;
  $('sc').textContent='To’g’ri: '+score;
  $('pb').style.width=(i/list.length*100)+'%';
  $('qt').textContent=it.q;
  const box=$('opts');box.innerHTML='';
  it.o.forEach(t=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>pick(b,t);box.appendChild(b)});
  $('next').classList.add('hidden');
}
function pick(btn,t){
  if(locked)return;locked=true;const it=list[i];
  const ok=t===it.c;
  [...$('opts').children].forEach(b=>{b.disabled=true;if(b.textContent===it.c)b.classList.add('ok')});
  if(ok)score++;else{btn.classList.add('bad');wrong.push({q:it.q,mine:t,c:it.c,raw:[it.q,...it.o.filter(x=>x!==it.c).concat([])]})}
  $('sc').textContent='To’g’ri: '+score;
  $('next').textContent=i===list.length-1?'Natijani ko’rish':'Keyingi savol';
  $('next').classList.remove('hidden');$('next').focus();
}
function finish(){
  show('end');$('fin').textContent=score+' / '+list.length;
  $('pct').textContent=Math.round(score/list.length*100)+'% to’g’ri javob';
  $('retry').classList.toggle('hidden',!wrong.length);
  const r=$('rev');r.innerHTML=wrong.length?'<h3>Xato javoblar</h3>':'<p>Barcha javoblar to’g’ri. Ajoyib!</p>';
  wrong.forEach(w=>{const d=document.createElement('div');d.className='rev';
    const q=document.createElement('b');q.textContent=w.q;
    const a=document.createElement('div');a.className='a';a.style.background='var(--bad-bg)';a.style.color='var(--bad-text)';a.textContent='Sizning javobingiz: '+w.mine;
    const c=document.createElement('div');c.className='a';c.style.background='var(--ok-bg)';c.style.color='var(--ok-text)';c.textContent='To’g’ri javob: '+w.c;
    d.append(q,a,c);r.appendChild(d)});
}
$('next').onclick=()=>{if(i<list.length-1){i++;render()}else{$('pb').style.width='100%';finish()}};
$('go').onclick=()=>{let n=parseInt($('cnt').value)||25;const D=SUBJ[cur].q;n=Math.max(1,Math.min(D.length,n));begin(shuffle(D).slice(0,n))};
$('again').onclick=()=>show('start');
$('retry').onclick=()=>{const ids=new Set(wrong.map(w=>w.q));begin(shuffle(SUBJ[cur].q.filter(r=>ids.has(r[0]))))};
</script></body></html>
