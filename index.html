naviyatning bilvosita ta'siridir."], ["Ma'naviy qadriyatlarning tarkibiy asoslari qatorida sanalgan Axloqiy qadriyatlarga quyidagilardan qaysilari misol boʻla oladi?", "Insonparvarlik, halollik, tashabbuskorlik, mehnatsevarlik axloqiy qadriyatlarga kiradi.", "Xalq og'zaki ijodi, tasviriy san'at, musiqiy asarlar badiiy qadriyatlar guruhiga mansubdir.", "Madaniy merosni saqlash, moddiy boyliklarni koʻpaytirish iqtisodiy qadriyatlarni tashkil etadi.", "Ilmiy kashfiyotlar, texnik yangiliklar va innovatsiyalar intellektual qadriyatlardir."], ["Ma'naviy qadriyatlarning tarkibiy asoslari qatorida sanalgan Badiiy qadriyatlarga quyidagilardan qaysilari misol boʻla oladi?", "Xalq og'zaki ijodi (asotir, afsona, ertak) va xalq tasviriy san'ati badiiy qadriyatlarga kiradi.", "Sahiylik, kamtarlik, poklik va adolatparvarlik axloqiy qadriyatlar guruhini tashkil etadi.", "Tarixiy obidalar, muzey eksponatlari va arxeologik topilmalar moddiy qadriyatlardir.", "Ijtimoiy taraqqiyot, siyosiy barqarorlik va fuqarolik mas'uliyati siyosiy qadriyatlardir."], ["Ibn Sino oʻzining “Ash-Shifo” asarida \"Do'stlik insonning shunday bir holatidirki, bunda boshqa birovga yaxshilik istaladi, bunda inson yaxshilikni oʻzi uchun istamaydi, balki oʻsha boshqa uchungina istaydi\" deya qaysi tushunchani ta'riflagan?", "Ibn Sino bu soʻzlari bilan \"Do'stlik\" tushunchasining asl mohiyatini chuqur izohlab bergan.", "Ibn Sino bu soʻzlari bilan \"Saxovat\" tushunchasining insoniy fazilatlarini atroflicha tahlil etgan.", "Ibn Sino bu soʻzlari bilan \"Adolat\" tushunchasining ijtimoiy me'yorlarini batafsil tushuntirgan.", "Ibn Sino bu soʻzlari bilan \"Muhabbat\" tushunchasining ruhiy kechinmalarini to'liq ifodalagan."], ["Milliy g'oyamizning umumiy tamoyillari orasida quyidagilardan qaysi biri KELTIRILMAGAN?", "Harbiy ustunlik va agressiv siyosat – milliy g'oyaning tamoyili sifatida keltirilmagan.", "Tarixiylik, zamonaviylik va umumbashariylik – milliy g'oyaning muhim tamoyillaridir.", "Milliylik va ilmiylik (dunyoviy bilimlarga asoslanganlik) – g'oyaning asosiy prinsiplaridir.", "Mintaqaviylik va jahon hamjamiyatidagi o'rin – milliy g'oyaning bir qismi hisoblanadi."], ["Alohida kishi, ijtimoiy-axloqiy mohiyatni oʻzida mujassamlashtirgan individ, shaxs – biofiziologik, ijtimoiy, ma'naviy, axloqiy va estetik fazilat va xislatlarning yaxlit bir butunlikka aylanishi hamda munosabatlar tizimi bilan qamrab olinishi sifatida ta'riflangan tushuncha nima?", "Ushbu keng qamrovli ta'rif \"Shaxs\" tushunchasining mohiyatini ochib beradi.", "Ushbu ta'rif \"Jamiyat\" tushunchasining tuzilishi va uning funksiyalarini ifodalaydi.", "Ushbu ta'rif \"Madaniyat\" tushunchasining shakllanishi va rivojlanishini tushuntiradi.", "Ushbu ta'rif \"Mafkura\" tushunchasining g'oyaviy asoslari va prinsiplarini yoritadi."], ["Shaxsning shakllanishida quyidagi omillardan qaysi biri asosiy o'rin tutmaydi?", "Kosmik radiatsiya va sayyoralar harakati – shaxs shakllanishiga bevosita ta'sir etmaydi.", "Biologik (nasl) omillar va tabiiy muhit – shaxs shakllanishidagi muhim omillardan biridir.", "Madaniy muhit va ijtimoiy tajriba – shaxs kamolotiga katta ta'sir ko'rsatuvchi omillardir.", "Odamlar bilan munosabatlar va shaxsiy intilishlar – shaxs rivojlanishida hal qiluvchi ahamiyatga ega."], ["Abdulla Avloniy bobomizning \"Tarbiya biz uchun yo hayot-yo mamot, yo najot-yo halokat, yo saodat-yo falokat masalasidir\" degan fikri qaysi tushunchaning ahamiyatini koʻrsatadi?", "Ushbu fikr \"Tarbiya\"ning jamiyat va inson hayotidagi hal qiluvchi rolini ta'kidlaydi.", "Ushbu fikr \"Iqtisodiyot\"ning davlat rivojlanishidagi oʻrnini muhim deb biladi.", "Ushbu fikr \"San'at\"ning inson ruhiyatiga ta'sirini yuqori baholaydi va qadrlaydi.", "Ushbu fikr \"Falsafa\"ning dunyoqarashni kengaytirishdagi ahamiyatini yoritadi."], ["Inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar majmuasi nima deb ataladi?", "Inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar \"Axloq\" deyiladi, shubhasiz.", "Inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar \"Ma'rifat\" deb ataladi, aniqrog'i bilimdir.", "Inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar \"E'tiqod\" deb ataladi, aslida ichki ishonchdir.", "Inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar \"Madaniyat\" deb ataladi, bu kengroq tushunchadir."], ["Inson va jamiyat uchun muhim ahamiyatga ega boʻlgan moddiy yoki ma'naviy hodisa, tamoyil va mezonlar nima deb ataladi?", "Bu moddiy va ma'naviy ahamiyatga ega hodisalar \"Qadriyat\" deb nomlanadi, bu toʻgʻri javobdir.", "Bu moddiy va ma'naviy ahamiyatga ega hodisalar \"Mafkura\" deb nomlanadi, bu esa g'oyalar tizimidir.", "Bu moddiy va ma'naviy ahamiyatga ega hodisalar \"Axloq\" deb nomlanadi, bu xulq me'yorlaridir.", "Bu moddiy va ma'naviy ahamiyatga ega hodisalar \"An'ana\" deb nomlanadi, bu esa urf-odatdir."], ["Bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayoni qanday nomlanadi?", "Bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayoni \"Ma'rifat\" deb nomlanadi.", "Bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayoni \"E'tiqod\" deb ataladi, bu esa ichki ishonchdir.", "Bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayoni \"Tarbiya\" deb ataladi, bu esa ta'lim berishdir.", "Bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayoni \"San'at\" deb ataladi, bu esa ijodkorlikdir."], ["Ma'naviyatning qaysi funksiyasi insonda axloqiy fazilatlarni shakllantirishga xizmat qiladi?", "Ma'naviyatning \"tarbiyaviy funksiyasi\" insonda axloqiy fazilatlarni shakllantiradi.", "Ma'naviyatning \"regulyativ funksiyasi\" inson xulq-atvorini tartibga solishni anglatadi.", "Ma'naviyatning \"integrativ funksiyasi\" jamiyat a'zolarini birlashtirishga qaratilgandir.", "Ma'naviyatning \"aksiologik funksiyasi\" qadriyatlarni anglash va baholashni bildiradi."], ["Ma'naviyatning qaysi funksiyasi inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga solishni anglatadi?", "Ma'naviyatning \"regulyativ funksiyasi\" inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga soladi.", "Ma'naviyatning \"tarbiyaviy funksiyasi\" insonda axloqiy fazilatlarni shakllantirishga xizmat qiladi.", "Ma'naviyatning \"integrativ funksiyasi\" jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirishdir.", "Ma'naviyatning \"aksiologik funksiyasi\" qadriyatlarni anglash va baholash bilan bog'liqligi belgilaydi."], ["Avlodlardan avlodlarga o'tib kelayotgan ma'naviy, madaniy, ilmiy, axloqiy va tarixiy qadriyatlar majmui nima deb ataladi?", "Bu avlodlardan avlodlarga oʻtuvchi qadriyatlar majmui \"Ma'naviy meros\" deyiladi.", "Bu avlodlardan avlodlarga oʻtuvchi qadriyatlar majmui \"Milliy mafkura\" deb ataladi.", "Bu avlodlardan avlodlarga oʻtuvchi qadriyatlar majmui \"Ijtimoiy taraqqiyot\" deb ataladi.", "Bu avlodlardan avlodlarga oʻtuvchi qadriyatlar majmui \"Madaniy inqilob\" deb ataladi."], ["Jamiyatning barqaror rivojlanishi qaysi omillarning oʻzaro uyg'unligi bilan bog'liq deb ta'kidlanadi?", "Jamiyatning barqaror rivojlanishi moddiy va ma'naviy omillarning oʻzaro uyg'unligi bilan bog'liq.", "Jamiyatning barqaror rivojlanishi faqat iqtisodiy oʻsish va texnologik yutuqlar bilan belgilanadi.", "Jamiyatning barqaror rivojlanishi siyosiy hukmronlik va harbiy kuchning mavjudligi bilan ta'minlanadi.", "Jamiyatning barqaror rivojlanishi faqat diniy e'tiqod va urf-odatlarga qattiq rioya qilish bilan amalga oshadi."], ["Inson tafakkurida vujudga keladigan, ijtimoiy xarakterga ega boʻlgan, ruhiyatga ta'sir oʻtkazib, maqsad-muddao sari etaklaydigan kuchli, teran fikr nima deb ataladi?", "Bu insonning g'oyasi boʻlib, harakatga chorlaydigan, teran fikr hisoblanadi.", "Bu shaxsning ma'naviyatidir, u ruhiy kechinmalarni mujassamlashtiradi, ongini oshiradi.", "Bu jamiyatning mafkurasidir, u umumiy maqsad-muddaolarni oʻzida mujassamlaydi.", "Bu odamning e'tiqodidir, u uning ichki dunyosini, irodasini baquvvat qiladi."], ["Muayyan ijtimoiy guruh, ijtimoiy qatlam, millat, davlat, xalq va jamiyatning ehtiyojlari, maqsad-muddaolari, manfaatlari, orzu-intilishlarini oʻzida mujassam etadigan gʻoyalar tizimi nima?", "Bu ta'rif jamiyatning asosiy g'oyalari tizimi boʻlgan mafkurani ifodalaydi.", "Bu shaxsning ma'naviyatini belgilaydigan ichki ruhiy holatlar majmuasidir.", "Bu umuminsoniy qadriyatlarning muhim ahamiyatga ega boʻlgan yigʻindisidir.", "Bu milliy istiqlol g'oyasining asosiy tushunchalarini oʻz ichiga oladi."], ["“Ma'naviyat” soʻzi arab tilidan qaysi fe'ldan olingan va u qanday ma'nolarni anglatadi?", "“Ma'no” fe'lidan olingan boʻlib, ruh, aql, ong, idrok, ruhiy holat kabi ma'nolarni bildiradi.", "“Manzar” fe'lidan olingan boʻlib, odob, qadriyat, ijodkorlik kabi ma'nolarni beradi.", "“Ma'rifat” fe'lidan olingan boʻlib, bilim, dunyoqarash, madaniyat kabi ma'nolarni anglatadi.", "“Miyya” fe'lidan olingan boʻlib, poklanish, vijdon, iymon kabi ma'nolarni ifodalaydi."], ["Oʻzbekistonning Birinchi Prezidenti I.A. Karimov “Yuksak ma'naviyat – yengilmas kuch” asarida ma'naviyatga qanday ta'rif bergan?", "U insonni ruhan poklash, qalban ulg'ayishga chorlaydigan, vijdon uyg'otadigan kuchdir.", "U jamiyatda ijtimoiy birdamlikni mustahkamlaydigan, madaniy qadriyatlarni oʻzida mujassamlagan kuchdir.", "U shaxsning tafakkurini, bilimini va dunyoqarashini rivojlantiradigan umumiy omilidir.", "U milliy axloq-odob meyorlariga toʻla rioya qilishni ta'minlaydigan asosiy gʻoyadir."], ["Islom Karimov ilgari surgan fikr va g'oyalarning ilmiy tavsifi natijasida ma'naviyatning tarkibiy qismlari aniqlangan. Quyidagilardan qaysi biri ushbu tarkibiy qism hisoblanmaydi?", "Iqtisodiy barqarorlik va moddiy farovonlikni ta'minlashga qaratilgan harakat.", "Ilm-ma'rifatli bo'lish va dunyoviy bilimlarni egallashga boʻlgan intilish.", "Madaniy-ma'rifiy yuksaklik hamda falsafiy-pedagogik o'sish jarayonlari.", "Milliy axloq-odob meyorlariga toʻla rioya qilish va e'tiqodning butunligi."], ["Ma'naviy qadriyatlarning tarkibiy asoslaridan biri boʻlgan axloqiy qadriyatlar deganda nimani tushuniladi?", "Axloqiy bilimlar, malakalar va koʻnikmalar hamda xulq-atvorni boshqarish tizimi.", "Xalq og'zaki ijodi, afsonalar, rivoyatlar va dostonlar kabi san'at turlari.", "Vatan va xalq mustaqilligini doimiy himoya qilish va unga xizmat qilish.", "Insoniyat yaratgan moddiy va ma'naviy qadriyatlarning umumiy majmui."], ["Quyidagilardan qaysi biri badiiy qadriyatlarga misol boʻla oladi?", "Xalq og'zaki ijodi (asotir, afsona, ertak) va xalq tasviriy san'ati (xalq musiqasi).", "Halollik, tashabbuskorlik, mehnatsevarlik kabi insoniy fazilatlar majmuasi.", "Islom diniga e'tiqod qilish va poklanishga bo'lgan intilishning ifodasi.", "Tarixiylik, zamonaviylik va umumbashariylik kabi tamoyillarning tizimi."], ["Ijtimoiy-axloqiy mohiyatni oʻzida mujassamlashtirgan alohida kishi yoki individ nimani anglatadi?", "Bu tushuncha Shaxsni, ya'ni insonni, o'zining butun fazilatlari bilan ifodalaydi.", "Bu tushuncha G'oyani, inson tafakkurida vujudga keladigan teran fikrni anglatadi.", "Bu tushuncha Ma'rifatni, bilim va ilmni egallash jarayonini ifodalaydi.", "Bu tushuncha E'tiqodni, muayyan qarashga boʻlgan ichki ishonchni anglatadi."], ["Inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar majmuasi nima deb nomlanadi?", "Bu me'yorlar majmuasi Axloq degan tushuncha orqali aniq ifodalanadi.", "Bu me'yorlar majmuasi Madaniyat deb atalib, qadriyatlarni yaratadi.", "Bu me'yorlar majmuasi Qadriyat deb nomlanib, ahamiyatga ega hodisadir.", "Bu me'yorlar majmuasi E'tiqod degan tushuncha bilan bog'liq ishonchdir."], ["Muayyan g'oya, qarash yoki tamoyilga boʻlgan ichki ishonch qanday nomlanadi?", "Bu tushuncha E'tiqod deb atalib, insonning chuqur ichki ishonchidir.", "Bu tushuncha Axloq deb nomlanib, xulq-atvor me'yorlari majmuasidir.", "Bu tushuncha Ma'rifat deb atalib, bilim va ilmni egallash jarayonidir.", "Bu tushuncha G'oya deb nomlanib, inson tafakkuridagi teran fikrdir."], ["Bilim va ilmni egallash hamda dunyoqarashni kengaytirish jarayoni nima deyiladi?", "Bu jarayon Ma'rifat deb atalib, bilim olish va dunyoqarashni kengaytirishdir.", "Bu jarayon Madaniyat deb atalib, moddiy va ma'naviy qadriyatlar majmuidir.", "Bu jarayon Ta'lim deb atalib, uzluksiz o'qitish va o'rganish tizimidir.", "Bu jarayon E'tiqod deb atalib, ichki ishonchni mustahkamlashga qaratilgan."], ["Insoniyat yaratgan moddiy va ma'naviy qadriyatlar majmui nima deb nomlanadi?", "Ushbu majmua Madaniyat deb ataladi, insoniyat erishgan yutuqlarni oʻz ichiga oladi.", "Ushbu majmua Ma'naviyat deb ataladi, ichki ruhiy kechinmalarni mujassamlashtiradi.", "Ushbu majmua Qadriyat deb ataladi, inson va jamiyat uchun ahamiyatga ega hodisadir.", "Ushbu majmua Meros deb ataladi, avloddan avlodga oʻtuvchi boyliklar tizimidir."], ["Abdulla Avloniy bobomizning tarbiya haqidagi mashhur fikri qanday?", "“Tarbiya biz uchun yo hayot-yo mamot, yo najot-yo halokat, yo saodat-yo falokat masalasidir.”", "“Ma'naviyat insonni ruhan poklanishga chorlaydigan, qalban ulg'ayishga undaydigan kuchdir.”", "“Ma'rifat – bilim va ilmni egallash hamda dunyoqarashni kengaytirishning jarayonidir.”", "“Axloq – inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar majmuasidir.”"], ["Milliy g'oyamizning umumiy tamoyillari qatoriga quyidagilardan qaysi biri kiritilmagan?", "Globalizm, umumiy iqtisodiy integratsiya va mintaqaviy ustunlikka erishish.", "Tarixiylik, zamonaviylik va umumbashariylik – mintaqaviylikning uyg'unligi.", "Ilmiylik, ya'ni dunyoviy bilimlar va qarashlarga asoslanganligi tamoyili.", "Milliylik tamoyili, milliy oʻzlikni anglash va rivojlantirishning ahamiyati."], ["Ma'naviyatning tarbiyaviy funksiyasi nimada namoyon boʻladi?", "U insonda axloqiy fazilatlarni shakllantirish va rivojlantirish vazifasini bajaradi.", "U jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirishga yordam beradi.", "U qadriyatlarni anglash va baholash bilan bog'liq boʻlgan jarayonni belgilaydi.", "U inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga soladi."], ["Ma'naviyatning regulyativ funksiyasi deganda nimani tushuniladi?", "Inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga solishni anglatadi.", "Jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirishni o'z ichiga oladi.", "Qadriyatlarni anglash va ularga baho berish bilan bog'liq boʻlgan vazifalardir.", "Insonda axloqiy fazilatlarni shakllantirish va kamol toptirishni nazarda tutadi."], ["Ma'naviyatning integrativ funksiyasi qanday vazifani bajaradi?", "Jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirish vazifasini bajaradi.", "Inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga solishga xizmat qiladi.", "Qadriyatlarni anglash va ularga baho berishga qaratilgan faoliyatni ifodalaydi.", "Insonda axloqiy fazilatlarni shakllantirish va rivojlantirishga yordam beradi."], ["Ma'naviyatning aksiologik funksiyasi nimani nazarda tutadi?", "U qadriyatlarni anglash va ularga baho berish bilan bevosita bog'liqdir.", "U inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga solishdir.", "U jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirishni ta'minlaydi.", "U insonda axloqiy fazilatlarni shakllantirish va rivojlantirishga qaratilgandir."], ["Shaxs ma'naviyatining shakllanishida qaysi omillar muhim ahamiyatga ega?", "Ta'lim, tarbiya, ijtimoiy muhit, madaniyat va o'z-o'zini anglash kabilar.", "Moddiy boylik, siyosiy barqarorlik va boshqa davlatlarning yordami.", "Global iqtisodiyotga integratsiya va texnologik yutuqlarni egallash.", "Tabiiy resurslar, geografik joylashuv va xalqaro munosabatlar dinamikasi."], ["Inson tafakkurida vujudga keladigan, ijtimoiy xarakterga ega boʻlgan, ruhiyatga ta'sir oʻtkazib, jamiyat va odamlarni harakatga chorlaydigan, maqsad-muddao sari etaklaydigan kuchli, teran fikr nima deb ataladi?", "G'oya, bu inson tafakkurida paydo boʻluvchi, ijtimoiy jihatdan faol fikrdir.", "Mafkura, bu ijtimoiy guruhlarning umumiy maqsadlarini aks ettiruvchi tizimdir.", "Ma'naviyat, bu insonning ichki dunyosini ifodalovchi, ruhiy holatidir.", "E'tiqod, bu muayyan g'oyalarga boʻlgan shaxsiy ishonch tuyg'usidir."], ["Muayyan ijtimoiy guruh, qatlam, millat, davlat, xalq va jamiyatning ehtiyojlari, maqsad-muddaolari, manfaatlari, orzu intilishlari hamda ularni amalga oshirish tamoyillarini oʻzida mujassam etadigan g'oyalar tizimi qanday nomlanadi?", "Mafkura, u guruhlarning maqsadlarini birlashtiruvchi g'oyalar tizimidir.", "Ma'naviyat, u insonning ruhiy va axloqiy sifatlarini belgilovchi holatdir.", "Qadriyat, u jamiyat uchun muhim boʻlgan moddiy va ma'naviy hodisadir.", "Falsafa, u dunyoqarashni kengaytirishga xizmat qiluvchi bilimlar tizimidir."], ["“Ma'naviyat” so'zi qaysi tildan olingan va \"ma'no\" fe'lidan kelib chiqqanligi matnda qanday izohlangan?", "Arabcha so'z boʻlib, ruh, aql, ong, idrok kabi ma'nolarni anglatadi.", "Forscha so'z boʻlib, xulq, odob, axloq kabi ma'nolarni ifodalaydi.", "Turkcha so'z boʻlib, ilm, bilim, ma'rifat kabi ma'nolarni bildiradi.", "Inglizcha so'z boʻlib, madaniyat, taraqqiyot kabi ma'nolarni anglatadi."], ["Birinchi Prezidentimiz I.A. Karimovning “Yuksak ma'naviyat – yengilmas kuch” asarida ma'naviyatga berilgan ta'rifini aniqlang.", "Insonni ruhan poklash, qalban ulg'ayishga chorlovchi beqiyos kuchdir.", "Jamiyatning ijtimoiy va madaniy taraqqiyotini belgilovchi asosiy omildir.", "Millatning o'ziga xos an'ana va urf-odatlarini saqlovchi qadriyatlar majmuidir.", "Har bir kishining aqliy qobiliyati va idrokini mujassamlashtiruvchi tushunchadir."], ["Zardushtiylik axloqining asosiy qoidasi sifatida “Avesto”da qanday tamoyil belgilangan?", "“Ezgu fikr, ezgu soʻz, ezgu amal” bu zardushtiylikning tamoyilidir.", "“Yaxshi niyat, yaxshi munosabat, yaxshi xulq” bu axloqiy mezonidir.", "“Adolat, halollik, to'g'rilik” bu jamiyatning asosiy ustunlaridir.", "“Poklik, mehnatsevarlik, tadbirkorlik” bu shaxsiy sifatlar majmuidir."], ["Islom Karimov ilgari surgan g'oyalar natijasida aniqlangan ma'naviyatning tarkibiy qismlaridan biri nima?", "Madaniy-ma'rifiy yuksaklik shaxs va jamiyatning taraqqiyotidir.", "Moddiy-iqtisodiy farovonlik bu hayotiy ehtiyojlarni ta'minlashdir.", "Texnologik innovatsiya bu ilm-fan yutuqlarining qoʻllanishidir.", "Sport va jismoniy tarbiya bu sog'lom turmush tarzining asosidir."], ["Islom Karimov ilgari surgan g'oyalar natijasida aniqlangan ma'naviyatning tarkibiy qismlaridan yana biri qaysi javobda toʻgʻri koʻrsatilgan?", "Insonparvarlik, vatanparvarlik, xalqparvarlik va adolatparvarlikdir.", "Iqtisodiy barqarorlik, siyosiy mustaqillik va ijtimoiy adolatdir.", "San'atga muhabbat, sportga ishtiyoq va sayohatga qiziqishdir.", "Diniy fanlarga qiziqish, chet tillarini oʻrganish va kasb tanlashdir."], ["Axloqiy qadriyatlar sirasiga kiritilgan 'Insonparvarlik, halollik, tashabbuskorlik, mehnatsevarlik' kabi sifatlar qadriyatning qaysi turiga mansub?", "Axloqiy qadriyatlar, ular xulq-atvor me'yorlari bilan bog'liqdir.", "Badiiy qadriyatlar, ular san'at va ijod bilan bog'liq tushunchalardir.", "Milliy qadriyatlar, ular xalqning o'ziga xos an'analari bilan bog'liqdir.", "Umuminsoniy qadriyatlar, ular barcha insoniyatga tegishli mezonlardir."], ["Matnda badiiy qadriyatlar sifatida nimalar keltirilgan?", "Xalq og'zaki ijodi, tasviriy va amaliy san'at namunalari, xalq teatri.", "Milliy musiqa, raqs san'ati va madaniy merosga chuqur hurmat hisoblanadi.", "Tarixiy obidalar, muzey eksponatlari va arxiv hujjatlari majmuidir.", "Ilmiy kashfiyotlar, texnologik yutuqlar va adabiy asarlar tizimidir."], ["Ibn Sino “Ash-Shifo” asarida 'Do'stlik' tushunchasiga qanday ta'rif bergan?", "Boshqaga yaxshilik istalib, uni o'zi uchun emas, o'sha boshqa uchun istashdir.", "Ikki inson o'rtasidagi samimiy munosabatlar va o'zaro ishonchdir.", "Odamlarning bir-biriga yordam berishga intilishi va qo'llab-quvvatlashidir.", "O'zaro hurmat va tushunishga asoslangan ijtimoiy aloqalar tizimidir."], ["Milliy g'oyamizning umumiy tamoyillari qatorida ilmiylik qanday izohlangan?", "Dunyoviy bilimlar va qarashlarga asoslanganligi ilmiylikning mohiyatidir.", "An'anaviy qadriyatlar va diniy e'tiqodlarga tayanilganligi tushuniladi.", "Tarixiy merosni asrab-avaylash va uni kelajak avlodlarga yetkazishdir.", "Mintaqaviy xususiyatlarni inobatga olgan holda taraqqiyotni ta'minlashdir."], ["Matnda berilgan ta'rifga koʻra, 'SHAXS' tushunchasi nimani anglatadi?", "Alohida kishi, ijtimoiy-axloqiy mohiyatni oʻzida mujassamlashtirgan individ.", "Jamiyatda muayyan ijtimoiy rol o'ynaydigan shaxsning funksional roli.", "Faqat biologik xususiyatlarga ega boʻlgan tirik organizmning mavjudligi.", "O'z fikrlari va qarashlariga ega boʻlgan intellektual salohiyatli kishi."], ["Shaxsning shakllanishida qaysi omillar asosiy rol oʻynashi matnda sanab oʻtilgan?", "Biologik (nasl), tabiiy muhit, madaniy muhit, ijtimoiy tajriba va odamlar bilan munosabat.", "Iqtisodiy sharoitlar, siyosiy tizim, diniy qarashlar, kasbiy faoliyat va hordiq.", "Geografik joylashuv, iqlim sharoitlari, oziq-ovqat ratsioni va uyqu tartibi.", "Media ta'siri, ta'lim tizimidagi oʻzgarishlar, internet va ijtimoiy tarmoqlar."], ["Abdulla Avloniyning tarbiya haqidagi mashhur fikri qanday ifodalangan?", "“Tarbiya biz uchun yo hayot-yo mamot, yo najot-yo halokat, yo saodat-yo falokat masalasidir.”", "“Tarbiya insonni kamolotga yetkazuvchi asosiy vosita, millatning kelajagidir.”", "“Tarbiya ilm olish bilan birga, axloqiy qadriyatlarni singdirishdir.”", "“Tarbiya – bu shaxsning ichki dunyosini boyituvchi va uni ruhlantiruvchi kuchdir.”"], ["Umumiy o'rta ta'lim muassasalarida “Tarbiya” fanining 1-9-sinflarga joriy etilish muddati qaysi o'quv yilidan boshlab belgilangan?", "2020/2021-o'quv yilidan, keyinchalik 10-11-sinflarga 2021/2022-yilidan.", "2019/2020-o'quv yilidan, keyinchalik 10-11-sinflarga 2020/2021-yilidan.", "2021/2022-o'quv yilidan, keyinchalik 10-11-sinflarga 2022/2023-yilidan.", "2022/2023-o'quv yilidan, keyinchalik 10-11-sinflarga 2023/2024-yilidan."], ["Matnda berilgan ta'rifga koʻra, 'Axloq' tushunchasi nimani anglatadi?", "Inson xulq-atvorini tartibga soluvchi ma'naviy me'yorlar majmuasi.", "Shaxsning bilimi va dunyoqarashini kengaytiruvchi aqliy jarayon.", "Jamiyatda qabul qilingan huquqiy va ijtimoiy qoidalar tizimi.", "Insoniyat yaratgan moddiy va ma'naviy qadriyatlar majmuidir."], ["Ma'naviyatning regulyativ funksiyasi deganda nima tushuniladi?", "Inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga solish.", "Jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirish jarayoni.", "Qadriyatlarni anglash va ularga baho berish bilan bog'liq faoliyat.", "Insonda axloqiy fazilatlarni shakllantirishga qaratilgan faoliyatdir."], ["Ma'naviyatning integrativ funksiyasi qanday izohlangan?", "Jamiyat a'zolarini umumiy qadriyatlar asosida birlashtirish funksiyasi.", "Inson xulq-atvorini ma'naviy-axloqiy me'yorlar orqali tartibga solish.", "Qadriyatlarni anglash va ularga baho berish bilan bog'liq jarayondir.", "Insonda axloqiy fazilatlarni shakllantirishga yo'naltirilgan funksiyadir."], ["Umuminsoniy qadriyatlar tushunchasi matnda qanday ta'riflangan?", "Butun insoniyat uchun umumiy ahamiyatga ega boʻlgan qadriyatlar.", "Muayyan xalqning tarixiy-madaniy tajribasi bilan bog'liq qadriyatlar.", "Avlodlardan avlodlarga o'tib kelayotgan ma'naviy meros majmuasi.", "Shaxs va jamiyatning bilim, tafakkur jihatidan rivojlanishi darajasi."], ["Ma'naviy meros deganda matnda nima nazarda tutilgan?", "Avlodlardan avlodlarga o'tib kelayotgan ma'naviy, madaniy, ilmiy, axloqiy va tarixiy qadriyatlar majmui.", "Jahon sivilizatsiyasining barcha davrlardagi eng muhim yutuqlari va kashfiyotlari.", "Muayyan xalqning milliy o'ziga xosligini belgilovchi san'at va adabiyot namunalari.", "Insoniyatning ilm-fan, ta'lim, tarbiya sohasidagi barcha zamonaviy yutuqlari va ilg'or g'oyalari."], ["Oʻzbek xalqi ma'naviyatining rivojlanishini tarixiy bosqichlarga ajratishda asosiy mezonlar qatoriga qaysi biri kiradi?", "Jamiyatning ijtimoiy-siyosiy tuzumi, diniy va falsafiy qarashlar, ilm-fan rivojlanishi darajasi kiradi.", "Faqatgina siyosiy oʻzgarishlar va iqtisodiy rivojlanish koʻrsatkichlari asosiy mezonlar hisoblanadi.", "Geografik joylashuv va atrof-muhit omillari, madaniy almashinuv mezon sifatida ta'kidlanadi.", "Shaxsiy shijoat va individual qahramonliklar, shuningdek, harbiy yutuqlar asosiy mezon boʻladi."], ["Oʻzbek xalqi ma'naviyatini davrlashtirishda \"Ijtimoiy-siyosiy mezon\" deganda nimani tushuniladi?", "Davlatlar va siyosiy tuzumlarning vaqt oʻtishi bilan roʻy beradigan oʻzgarishlari nazarda tutiladi.", "Shaxslarning ijtimoiy maqomi va ularning siyosiy qaror qabul qilish jarayonlarining oʻzgarishi nazarda tutiladi.", "Ijtimoiy-siyosiy mezon aholining umumiy soni va yashash sharoitlaridagi oʻzgarishlarni anglatadi.", "Siyosiy partiyalarning shakllanishi va ularning jamiyatdagi mavqeyi oʻzgarishlarini anglatadi."], ["Matnga koʻra, \"Diniy-mafkuraviy mezon\" deganda oʻzbek xalqi ma'naviyati rivojlanishida qaysi omillar muhimligi ta'kidlangan?", "Diniy e'tiqodlar va dunyoqarashlarning evolyutsiyasi, ularning jamiyatga ta'siri hisobga olinadi.", "Milliy qadriyatlar va an'analar, shuningdek, urf-odatlarning shakllanishi va uzatilishi nazarda tutiladi.", "Ilmiy-texnikaviy taraqqiyot va yangi kashfiyotlarning jamiyatda tutgan oʻrni va ta'siri anglatiladi.", "Siyosiy elitani tashkil etuvchi shaxslarning shaxsiy e'tiqodlari va ularning qarorlari anglatiladi."], ["Oʻzbek xalqi ma'naviyatini davrlashtirishda \"Ilmiy-ma'rifiy mezon\" nimani anglatadi?", "Ilm-fan, ta'lim va tafakkurning jamiyat taraqqiyotidagi roli va rivojlanishi koʻrsatiladi.", "Madaniy merosni saqlash va uni kelajak avlodlarga yetkazish jarayoni tushuniladi.", "Adabiyot va san'atning yangi shakllari va uslublarining paydo boʻlishi nazarda tutiladi.", "Iqtisodiy sohadagi innovatsiyalar va ishlab chiqarish kuchlarining rivojlanishi nazarda tutiladi."], ["Axloqiy mezonning rivojlanishida qaysi qadriyatlar muhim hisoblanadi?", "Ezgulik, adolat, halollik va insonparvarlik kabi qadriyatlarning taraqqiyoti asosiy omil hisoblanadi.", "Moddiy boylikka intilish, shaxsiy muvaffaqiyat va ijtimoiy mavqeni mustahkamlash qadriyatlari muhim.", "Kuchga egalik qilish, gʻalabaga erishish va raqobatchilik ruhi kabi qadriyatlar ustuvor hisoblanadi.", "An'anaviy urf-odatlar va oilaviy qadriyatlar, shuningdek, diniy rasm-rusumlar asosiy ahamiyatga ega."], ["Matnda \"Madaniy mezon\" deganda oʻzbek xalqi ma'naviyati rivojlanishida qaysi sohalar nazarda tutilgan?", "Yozuv, adabiyot, san'at, me'morchilik va urf-odatlarning taraqqiyoti madaniy mezonni tashkil etadi.", "Siyosiy tuzumlar, harbiy salohiyat va xalqaro munosabatlarning shakllanishi tushuniladi.", "Tabiatni asrash, ekologik ong va atrof-muhitni muhofaza qilish harakatlari qamrab olinadi.", "Ijtimoiy tartib, qonun ustuvorligi va huquqiy normalarning rivojlanishi madaniy mezonni anglatadi."], ["Milliy oʻzlik mezoni nimani anglatadi va u oʻzbek xalqi ma'naviyati rivojida qanday rol oʻynaydi?", "Bu xalqning oʻz tili, tarixi, madaniyati va qadriyatlarini anglash jarayonini ifodalaydi va muhimdir.", "Bu faqatgina xalqning milliy liboslari va milliy taomlariga boʻlgan munosabatini ifodalaydi, shu bilan cheklanadi.", "Bu iqtisodiy mustaqillik va mamlakatning moddiy farovonligini ta'minlash yoʻllarini koʻrsatadi.", "Bu davlat chegaralarini belgilash va ularni himoya qilish strategiyalarini oʻz ichiga oladi."], ["Ma'naviy meros mezoni oʻzbek xalqi ma'naviyatini davrlashtirishda qanday ahamiyatga ega?", "Ajdodlardan qolgan ilmiy, falsafiy, diniy, axloqiy va madaniy merosning yetib kelishini anglatadi.", "Faqatgina moddiy madaniy obidalar va arxitektura yodgorliklarining saqlanishini ta'minlaydi.", "Eng yangi ilmiy kashfiyotlar va texnologik yutuqlarning keyingi avlodlarga uzatilishini ifodalaydi.", "Faqatgina ma'naviy rahnamolarning shaxsiy hayoti va ularning oilaviy an'analarini oʻz ichiga oladi."], ["Oʻzbek xalqi ma'naviyatining qadimgi ildizlarini anglashda qaysi manba muhim ahamiyatga ega ekanligi matnda ta'kidlangan?", "Zardushtiylikning muqaddas kitobi boʻlmish \"Avesto\" muhim ahamiyat kasb etadi.", "Qadimgi Yunon faylasuflarining asarlari va ularning Sharqdagi tarqalishi manba boʻlib xizmat qiladi.", "Hindistonning vedik matnlari va ularning Oʻrta Osiyoga ta'siri muhim manba sifatida qaraladi.", "Misr piramidalari va ulardagi yozuvlar qadimgi ildizlarni oʻrganishda asosiy manba sanaladi."], ["Zardushtiylik ta'limotida insonning tanlovi qanday muhimlikka ega va u qaysi qarashlar bilan bogʻliq?", "Inson ezgulik va yovuzlik oʻrtasida ongli ravishda tanlov qilishi muhimligi ta'kidlangan.", "Insonning taqdirga toʻliq boʻysunishi va uning tanlov huquqining yoʻqligi asosiy gʻoya hisoblanadi.", "Insonning jamiyat tomonidan belgilangan qoidalarga soʻzsiz amal qilishi uning tanlovini anglatadi.", "Insonning faqat oʻz shaxsiy manfaatlarini himoya qilishga intilishi muhim tanlov sanaladi."], ["Qadimgi davr ma'naviyatining asosiy xususiyatlaridan biri sifatida matnda nima koʻrsatilgan?", "Ezgulik va yovuzlik, yaxshilik va yomonlik haqidagi axloqiy qarashlarning shakllanganligidir.", "Faqatgina moddiy boylikka intilish va shaxsiy manfaatni ustuvor qoʻyish asosiy xususiyat boʻlgan.", "Siyosiy hokimiyatni mustahkamlash va davlat boshqaruvini markazlashtirishga intilish tushunilgan.", "Diniy e'tiqodlarning butunlay yoʻqligi va ateistik qarashlarning ustuvorligi asosiy xususiyat edi."], ["IX-XII asrlarda Movarounnahr va Xuroson hududlarida faoliyat olib borgan buyuk mutafakkirlar kimlar edi?", "Muhammad al-Xorazmiy, Ahmad al-Fargʻoniy, Abu Nasr Forobiy, Abu Ali ibn Sino va Abu Rayhon Beruniy.", "Mahmud Koshgʻariy, Yusuf Xos Hojib, Alisher Navoiy, Mirzo Ulugʻbek va Amir Temur kabi olimlar.", "Mahmudxoʻja Behbudiy, Abdulla Avloniy, Abdurauf Fitrat, Munavvarqori Abdurashidxonov va Islom Karimov.", "Erkin Yusupov, Kaykovus, va boshqa qadimgi Rim hamda Yunon faylasuflari bu davrda yashaganlar."], ["Abu Nasr Forobiyning \"Fozil odamlar shahri\" asarida qanday masalalar yoritilgan?", "Fozil jamiyat va insonning ma'naviy-axloqiy kamoloti masalalari batafsil yoritilgan.", "Mamlakat boshqaruvi, iqtisodiy islohotlar va harbiy strategiyalar haqida ma'lumotlar berilgan.", "Osmon jismlari, astronomik hodisalar va ularning inson hayotiga ta'siri haqida yozilgan.", "Turli kasalliklarni davolash usullari, dori-darmonlar va tibbiy amaliyotlar haqida fikrlar bayon etilgan."], ["Abu Ali ibn Sino ilmni inson hayotini yaxshilashga xizmat qiluvchi muhim vosita deb bilgan holda, uning asosiy asarlari qaysilar?", "\"Donishnoma”, “Ash-Shifo” va “Kitob an-Najot” uning ilmiy merosini tashkil etadi.", "\"Qutadg'u bilig” va \"Devonu lugʻotit turk” uning eng muhim adabiy merosi hisoblanadi.", "\"Hindiston” kitobi va \"Kanon vrachebnoy nauki” uning asosiy tibbiy va ilmiy asarlaridir.", "\"Xamsa” va \"Boburnoma” uning gumanistik gʻoyalarini ilgari surgan adabiy durdonalari edi."], ["Abu Rayhon Beruniyning \"Hindiston\" asari nimani oʻrganishda muhim manba hisoblanadi?", "Hindiston xalqi madaniyati, dini, urf-odatlari va ilmiy qarashlarini oʻrganishda muhim manba.", "Oʻrta Osiyo xalqlarining savdo aloqalari va iqtisodiy tizimlarini tahlil qilishda muhim manba.", "Qadimgi Misr sivilizatsiyasi va uning diniy e'tiqodlarini tadqiq qilishda yagona manba.", "Yevropa mamlakatlarining siyosiy tarixi va ularning harbiy yutuqlarini oʻrganishda manba."], ["XI asr turkiy ma'naviy tafakkurining muhim yodgorliklaridan biri Yusuf Xos Hojibning qaysi asaridir?", "Yusuf Xos Hojibning \"Qutadg'u bilig” asari turkiy ma'naviy tafakkurning yodgorligidir.", "Mahmud Koshg'ariyning \"Devonu lugʻotit turk” asari uning ijodiy merosini tashkil etadi.", "Alisher Navoiyning \"Xamsa” asari uning eng yirik adabiy durdonasi hisoblanadi.", "Abu Rayhon Beruniyning \"Hindiston” asari uning ilmiy tadqiqotlarining natijasi edi."], ["Mahmud Koshg'ariyning \"Devonu lugʻotit turk\" asari oʻzbek xalqi ma'naviy-madaniy merosini oʻrganishda qanday ahamiyatga ega?", "U turkiy xalqlarning tili, maqollari, she'riy namunalari, urf-odatlari va dunyoqarashiga oid ma'lumotlarni beradi.", "U astronomiya va matematika sohasidagi eng soʻnggi kashfiyotlar haqida ma'lumotlarni oʻz ichiga oladi.", "Asar Tibbiyot ensiklopediyasi boʻlib, turli kasalliklarni davolash usullarini batafsil tushuntiradi.", "Asar qadimgi davlatlarning siyosiy tuzumi va harbiy strategiyalari haqida yagona manba sifatida xizmat qiladi."], ["XIX asr oxiri va XX asr boshlarida Turkistonda yuzaga kelgan \"jadidchilik harakati\"ning asosiy gʻoyasi nimadan iborat edi?", "Jamiyat taraqqiyotini ta'lim, ilm-fan va ma'rifat bilan bogʻlash, milliy ongni yuksaltirish asosiy gʻoya edi.", "Milliy an'analarni butunlay inkor etish va Gʻarb madaniyatini toʻliq qabul qilish harakatning asosiy gʻoyasi edi.", "Siyosiy hokimiyatni zoʻravonlik yoʻli bilan egallash va avtokratik boshqaruvni oʻrnatish asosiy gʻoyani tashkil etgan.", "Iqtisodiy izolyatsiyaga intilish va tashqi savdoni toʻliq toʻxtatish harakatning maqsadi sifatida belgilangan."], ["Erkin Yusupov tomonidan berilgan \"Ma'naviyat\" ta'rifida u qanday tizim sifatida tavsiflangan?", "Inson axloqi, bilimlari, iste'dodi, qobiliyati, vijdoni, e'tiqodi va dunyoqarashini oʻz ichiga olgan mushtarak tizimdir.", "Ma'naviyat faqatgina shaxsning moddiy farovonligi va iqtisodiy yutuqlari bilan bogʻliq boʻlgan tizimdir.", "U shaxsning siyosiy qarashlari va jamiyatdagi mavqeyini belgilovchi huquqiy normalar toʻplami hisoblanadi.", "Bu faqatgina diniy aqidalar va rasm-rusumlar yigʻindisi boʻlib, ilmiy bilimlarga aloqador boʻlmagan tizimdir."], ["Ibn Sino \"Ash-Shifo\" asarida insonlararo munosabatlarga ta'rif berib, do'stlik haqida qanday fikr bildirgan?", "Do'stlik boshqa birovga yaxshilik istaladigan, oʻzi uchun emas, balki oʻsha boshqa uchungina boʻlgan holatdir.", "Do'stlik shaxsiy manfaatlarni ilgari surish va oʻzaro moddiy yordamga asoslangan munosabatdir.", "Do'stlik faqatgina oilaviy rishtalar va qarindoshlik aloqalari doirasida mavjud boʻladigan ijtimoiy bogʻdir.", "Do'stlik siyosiy ittifoqchilikni va harbiy hamkorlikni mustahkamlashga qaratilgan amaliy faoliyatdir."], ["Oʻzbek xalqi ma'naviyati rivojlanishini tarixiy bosqichlarga ajratishda qaysi mezonlar asosiy hisoblanadi?", "Jamiyatning ijtimoiy-siyosiy tuzumi, diniy va falsafiy qarashlar, ilm-fan rivojlanishi.", "Faqatgina siyosiy oʻzgarishlar, iqtisodiy rivojlanish va harbiy qudrat omillari.", "Globalizatsiya jarayonlari, texnologik innovatsiyalar va zamonaviy ta'lim tizimlari.", "Geografik joylashuv xususiyatlari, iqlimiy oʻzgarishlar va tabiiy resurslarning miqdori."], ["Zardushtiylik ta'limotida inson ongli tanlov qilishi kerak boʻlgan asosiy qadriyatlar qaysilar?", "Rostgoʻylik, adolat, mehnatsevarlik, poklik, ezgulik, tabiatni asrash tamoyillari.", "Boylik orttirish, shaxsiy manfaat, hokimiyatga intilish va kuchga tayanib yashash.", "Jaholat, yalqovlik, yolgʻonchilik, buzgʻunchilik va atrof-muhitga e'tiborsizlik.", "Tarixiy an'analarni saqlash, faqat oʻz milliy madaniyatiga sodiq qolish va oʻzlikni anglash."], ["IX-XII asrlarda Movarounnahr va Xuroson hududlarida faoliyat olib borgan buyuk mutafakkirlar qatoriga kimlar kiradi?", "Muhammad al-Xorazmiy, Ahmad al-Fargʻoniy, Abu Nasr Forobiy, Abu Ali ibn Sino va Abu Rayhon Beruniy.", "Imom Buxoriy, at-Termiziy, Bahouddin Naqshband, Najmiddin Kubro va Mirzo Ulugʻbek.", "Alisher Navoiy, Yusuf Xos Hojib, Mahmud Koshgʻariy, Lutfiy va Jomiy kabi adiblar va olimlar.", "Amir Temur, Zahiriddin Muhammad Bobur, Boborahim Mashrab, Nodira va Uvaysiy kabi hukmdorlar."], ["Abu Nasr Forobiy oʻzining qaysi asarida fozil jamiyat va insonning ma'naviy-axloqiy kamoloti masalalarini chuqur yoritgan?", "“Fozil odamlar shahri” nomli falsafiy risolada axloqiy qadriyatlar va komillikni bayon etgan.", "“Tib qonunlari” deb nomlangan kitobida tibbiyotning nazariy va amaliy asoslarini tahlil qilgan.", "“Qutadg'u bilig” deb atalgan dostonida davlat boshqaruvi va adolatli jamiyat gʻoyalarini ilgari surgan.", "“Al-Qonun fi at-Tibb” deb nomlangan ilmiy asarida inson tanasining tuzilishini ochib bergan."], ["Ibn Sino ilmni inson hayotini yaxshilashga xizmat qiluvchi muhim vosita deb bilgan. Uning fikrlariga koʻra, inson kamoloti nimadan iborat?", "Insonning aqliy rivojlanishi va axloqiy tarbiyasining bir-biridan ajralmas jarayoni orqali erishiladi.", "Faqatgina diniy e'tiqodlarga qat'iy amal qilish va ma'naviy amaliyotlarni bajarish bilan belgilanadi.", "Moddiy boyliklarni toʻplash, ijtimoiy mavqeni oshirish va shaxsiy gʻoyalarni amalga oshirishdir.", "Tabiatni toʻliq egallash, fizik qonuniyatlarni bilish va texnologik yutuqlarni amaliyotga joriy etish."], ["Abu Rayhon Beruniyning ilmiy yondashuvi qaysi jihati bilan ajralib turadi?", "Turli xalqlarning madaniyatini, dinini, urf-odatlarini xolis va ilmiy asosda oʻrganish zarurligini koʻrsatadi.", "Faqatgina astronomiya va matematika sohalarida yangi kashfiyotlar qilishga e'tibor qaratib, boshqa sohalarga ahamiyat bermagan.", "Oʻz davrining hukmdorlariga davlat boshqaruvida maslahatlar berishga va siyosiy qarorlar qabul qilishga intilgan.", "Tabiatshunoslik fanlarining nazariy asoslarini yaratishga urgʻu bergan holda, amaliy jihatlarini inkor etgan."], ["Yusuf Xos Hojibning \"Qutadg'u bilig\" asarining asosiy ahamiyati nimada?", "Turkiy xalqlarning siyosiy-axloqiy va ma'naviy tafakkuri tarixida muhim oʻrin tutuvchi yodgorlikdir.", "Sharq tibbiyotining eng qadimiy va eng mukammal ensiklopediyasi boʻlib, ming yillar davomida qoʻllanilgan.", "Qadimgi dunyo xalqlarining geografik joylashuvi va ularning ijtimoiy tuzilishi haqida ma'lumotlar beruvchi asardir.", "Islom fiqhi va shariat qonunlarining nazariy asoslarini batafsil yoritib bergan ilmiy-diniy manba hisoblanadi."], ["Mahmud Koshg'ariyning \"Devonu lugʻotit turk\" asari nima uchun muhim manba hisoblanadi?", "Turkiy xalqlarning tili, maqollari, she'riy namunalari, urf-odatlari va dunyoqarashini oʻrganishga yordam beradi.", "Oʻrta Osiyo xalqlarining qadimiy astronomik bilimlari va yulduzlar harakati haqidagi ma'lumotlarni oʻz ichiga oladi.", "Sharq musiqa san'atining nazariy asoslarini tahlil qilib, turli musiqa asboblarining tuzilishini yoritib beradi.", "Qadimgi davlatlarning harbiy strategiyalari, jang san'ati va qal'alarning qurilishi usullarini batafsil tasvirlaydi."], ["Amir Temur va Temuriylar davrida Movarounnahrda ilm-fan, adabiyot va san'atning rivojlanishiga qanday ta'sir koʻrsatildi?", "Ilmiy-madaniy taraqqiyot uchun qulay muhit yaratilib, Samarqand ilm-fan markaziga aylandi.", "Dinshunoslik va ilohiyotga ustuvor ahamiyat berilib, dunyoviy fanlar rivojiga toʻsiqlar yaratildi.", "Barcha ilmiy va ijodiy faoliyat faqatgina hukmdorlarning shaxsiy homiyligiga bogʻliq boʻlib, mustaqillik cheklandi.", "Harbiy texnologiyalarga katta e'tibor qaratildi, ammo san'at va adabiyot rivojlanishi ikkinchi darajali boʻldi."], ["Alisher Navoiyning \"Xamsa\" asari turkiy adabiyot va ma'naviy tafakkurning yirik yodgorliklaridan biri sifatida nima uchun qadrlanadi?", "Unda insonparvarlik, adolat, saxovat, mehr-oqibat, ilm va ma'rifat kabi gʻoyalar keng yoritilgan.", "Asarda Qadimgi Misr mifologiyasi va Yunon falsafasining ta'siri ostida yaratilgan hikoyalar joy olgan.", "Bu asar asosan harbiy yurishlar, davlatlararo munosabatlar va siyosiy intrigalar haqida hikoya qiladi.", "Unda oʻsha davrning kundalik hayoti, oddiy xalqning turmush tarzi va folklor elementlari mukammal aks ettirilgan."], ["XIX asr oxiri va XX asr boshlarida Turkistonda vujudga kelgan jadidchilik harakatining asosiy maqsadi nimadan iborat edi?", "Jamiyat taraqqiyotini ta'lim, ilm-fan va ma'rifat bilan bog'lash, milliy ongni yuksaltirish.", "Chor Rossiyasi hukmronligiga qarshi qurolli kurash olib borish va mustaqil davlat qurish.", "An'anaviy islom ta'limotini toʻliq rad etib, G'arb madaniyatini hech qanday cheklovsiz qabul qilish.", "Qadimgi turkiy urf-odatlarni tiklash va boshqa xalqlarning madaniy ta'sirini butunlay bartaraf etish."], ["Oʻzbekiston mustaqilligi davrida milliy ma'naviyatni rivojlantirishning asosiy yoʻnalishlari qaysilar?", "Milliy oʻzlikni anglash, ona tiliga, tarix va madaniyatga hurmat, umuminsoniy qadriyatlar uyg'unligi.", "Faqatgina iqtisodiy islohotlarga e'tibor berish, bozor iqtisodiyotini shakllantirish va investitsiyalar jalb etish.", "Texnologik rivojlanishga ustuvorlik berish, raqamli texnologiyalarni joriy etish va innovatsion iqtisodiyotni yaratish.", "Tashqi siyosatda neytral maqomni saqlash, mintaqaviy xavfsizlikni ta'minlash va boshqa davlatlar bilan hamkorlik."], ["Matnda berilgan ta'rifga koʻra, \"ma'naviyat\" tushunchasi nimani ifodalaydi?", "Inson ruhiy va aqliy olamini ifodalovchi tushuncha, falsafiy, huquqiy, ilmiy, badiiy, axloqiy, diniy tasavvurlarni oʻz ichiga oladi.", "Faqatgina moddiy boyliklar yaratish va iste'mol qilish bilan bogʻliq boʻlgan inson faoliyatining amaliy natijalari.", "Jamiyatning iqtisodiy asoslarini mustahkamlashga qaratilgan siyosiy tizim va davlat boshqaruvi prinsiplari.", "Tabiat hodisalarini oʻrganishga, ularning qonuniyatlarini tushunishga va ulardan amaliy foydalanishga qaratilgan harakat."], ["Matnda keltirilgan ta'rifga asosan, \"madaniyat\" nima?", "Jamiyat, inson ijodiy kuch va qobiliyatlari tarixiy taraqqiyotining muayyan darajasi, moddiy va ma'naviy boyliklar ifodasi.", "Faqatgina san'at, musiqa va adabiyot asarlarini yaratishga qaratilgan inson faoliyatining yig'indisi.", "Bir millatning boshqa millatlar bilan aloqa oʻrnatishdagi siyosiy va iqtisodiy yondashuvlari majmui.", "Insonning ichki kechinmalari, his-tuygʻulari va shaxsiy dunyoqarashini aks ettiruvchi ruhiy holat."], ["Erkin Yusupovning ma'naviyat haqidagi ta'rifiga koʻra, ma'naviyatning asosiy xususiyati nimada?", "Insonning ijobiy xislatlari, axloqi, bilimlari, iste'dodi va e'tiqodining oʻzaro bogʻlangan mushtarak tizimi.", "Jamiyatdagi ijtimoiy-siyosiy barqarorlikni ta'minlovchi davlat siyosatining ustuvor yoʻnalishidir.", "Faqatgina shaxsiy muvaffaqiyatga erishishga, boylik toʻplashga va mansab pogʻonalarida koʻtarilishga intilish.", "Ilm-fan va texnologiyalar taraqqiyoti, kashfiyotlar qilish va yangi ixtirolarni hayotga tatbiq etish."], ["Kaykovusning \"Qobusnoma\" asarida aqlning ahamiyati qanday ta'riflangan?", "Aql mol bilan boy boʻlgʻondan yahshiroqdir, chunki molni aql jam etadi, ammo aql oʻrganib boʻlmaydi.", "Aql insonni faqatgina moddiy boyliklarga intilishga undaydi, ma'naviy kamolotga toʻsiq boʻladi.", "Mol-dunyo va boylik insonning haqiqiy baxt-saodatiga erishish uchun asosiy va muhim omil hisoblanadi.", "Bilim olishga intilishdan koʻra, tabiat hodisalarini kuzatish va tajriba oʻtkazish insonni aqlli qiladi."], ["Oʻzbekiston Respublikasining birinchi Prezidenti Islom Karimovning \"Milliy istiqlol gʻoyasi: asosiy tushuncha va tamoyillar\" asari asosida qanday chora-tadbirlar amalga oshirilgan?", "Fan boʻyicha ta'lim dasturlarini yaratish va respublika ta'lim tizimiga joriy etish boʻyicha farmoyishlar qabul qilindi.", "Iqtisodiy rivojlanishning yangi modellarini joriy etish va xorijiy investitsiyalarni jalb qilish siyosati mustahkamlandi.", "Harbiy salohiyatni oshirish va mintaqaviy xavfsizlikni ta'minlashga qaratilgan strategik hujjatlar ishlab chiqildi.", "Madaniy meros obyektlarini qayta tiklash va turizm salohiyatini oshirishga yoʻnaltirilgan loyihalar amalga oshirildi."], ["2021 yil 26 martda qabul qilingan Oʻzbekiston Respublikasi Prezidentining “Ma`naviy-ma'rifiy ishlar tizimini tubdan takomillashtirish chora tadbirlari to`g`risida”gi PQ – 5040-son Qarori nimaga qaratilgan?", "Ezgulik va insonparvarlikka asoslangan \"Milliy tiklanishdan milliy yuksalish sari\" gʻoyasini targʻib etish.", "Ta'lim tizimida zamonaviy pedagogik texnologiyalarni joriy etish va oʻquv dasturlarini xalqaro standartlarga moslashtirish.", "Sogʻliqni saqlash tizimini isloh qilish, aholiga sifatli tibbiy xizmat koʻrsatishni ta'minlash va profilaktik tadbirlar samaradorligini oshirish.", "Qishloq xoʻjaligi sohasida yangi innovatsion texnologiyalarni joriy etish va agrosanoat kompleksini modernizatsiya qilish."], ["Forobiyning fikricha, insonlararo munosabatlarda \"boshlang'ich asos insoniylikdir\" degan gʻoyaning mazmuni nimada?", "Odamlar insoniyat turkumiga kirganliklari uchun oʻzaro tinchlikda va ahillikda yashamoqlari lozimligi.", "Har bir insonning shaxsiy manfaatlarini ustun qoʻyib, oʻz maqsadlariga erishish uchun kurashishi zarurligi.", "Jamiyatdagi ijtimoiy-iqtisodiy tengsizliklarni bartaraf etish va barcha uchun bir xil imkoniyatlar yaratish.", "Kuchli shaxsning zaiflar ustidan hukmronlik qilishi, jamiyatda tartib va intizomni ta'minlash uchun zarurligi."], ["Ibn Sino \"Ash-Shifo\" asarida do'stlikni qanday ta'riflagan?", "Do'stlik insonning shunday holatidirki, bunda boshqa birovga yaxshilik istaladi, oʻzi uchun emas, balki oʻsha boshqa uchun.", "Doʻstlik insonning oʻz manfaati yoʻlida boshqalar bilan aloqa oʻrnatishga intilishi, shaxsiy maqsadlarga erishish vositasi.", "Doʻstlik faqatgina moddiy yordamga asoslangan munosabat boʻlib, qiyin vaziyatlarda bir-biriga koʻmaklashishdan iborat.", "Doʻstlik siyosiy ittifoqchilikning muhim shakli boʻlib, davlatlar oʻrtasidagi oʻzaro ishonch va hamkorlikni mustahkamlaydi."]]}, {"name": "Manbashunoslik va tarixshunoslik", "q": [["Hamdulloh Qazviniyning \"Tarixi guzida\" asarida qaysi davr va hududlardagi voqealar bayon qilingan?", "Qadim zamonlardan to 1330-yilgacha Eron va qisman O'rta Osiyoda ro'y bergan voqealar bayon etilgan.", "XIII asrdan to XV asr boshlarigacha Yevropa va Yaqin Sharqda bo'lib o'tgan asosiy siyosiy o'zgarishlar tasvirlangan.", "Mo'g'ullar istilosidan to XVI asr oxirigacha Hindiston va Afg'onistondagi madaniy hayot yoritilgan.", "Islomiyatning dastlabki davrlaridan to Temuriylar hukmronligigacha Markaziy Osiyo tarixi tahlil qilingan."], ["Hamdulloh Qazviniyning \"Tarixi guzida\" asarining asosiy qismi kimga bag'ishlangan edi?", "Kitobning asosiy qismi hoji G'iyosuddin Muhammadga bag'ishlangan bo'lib, juda ahamiyatlidir.", "Bu asar Elxoniy Abu Sa'idning vaziri bo'lgan G'iyosuddin Muhammadga hurmat yuzasidan taqdim etilgan.", "Asar Amir Temurning davlat siyosatini ulug'lash maqsadida bevosita unga bag'ishlab yozilgan.", "Muallif uni Shayx Hoji Yazdiyga bag'ishlagan, chunki u uning shaxsiga katta hurmat bilan qaragan."], ["Hamdulloh Qazviniyning \"Tarixi guzida\" asari tuzilishi qanday tartibda edi?", "Asar muqaddima-fotiha va olti bobdan iborat bo'lib, tartibli ravishda voqealarni bayon etadi.", "U uch jild va bir umumiy xulosa qismidan tarkib topgan bo'lib, turli mavzularni o'z ichiga oladi.", "Muqaddima, asosiy matn va so'nggi yakuniy bobdan iborat, tarixiy voqealarni batafsil yoritadi.", "Asar sakkiz qismga bo'lingan bo'lib, har bir qism aniq bir davrni yoki sulolani qamrab oladi."], ["Rui Gonsales de Klavixoning \"Kundaliklari\" asari kimning elchisi sifatidagi sayohat xotiralaridan iborat?", "Kastiliya (Ispaniya) qiroli Genrix III ning elchisi sifatidagi sayohat xotiralarini o'z ichiga oladi.", "Fransiya qiroli Karl VI ning elchisi sifatida amalga oshirgan G'arbiy Yevropa bo'ylab sayohatlaridan iborat.", "Angliya qiroli Genrix IV ning Temur saroyiga yuborilgan diplomatik missiyasi haqidagi esdaliklaridir.", "Vizantiya imperatori Manuel II ning O'rta Osiyoga qilgan ilmiy ekspeditsiyasi yozuvlaridan tarkib topgan."], ["Klavixoning \"Kundaliklari\"da Samarqandning boyligi haqida qanday ma'lumotlar keltirilgan?", "Samarqandda don, may, meva-cheva, parranda go'shti va har xil go'sht mo'l-ko'l bo'lgani aytiladi.", "Shaharda asosan ipak va ziravorlar savdosi rivojlangan, bu esa aholi farovonligini ta'minlagani tasvirlanadi.", "Samarqandda oltin va kumush konlari mavjud bo'lib, bu metallar shaharni juda boyitganligi qayd etilgan.", "Bu shaharda nafis hunarmandchilik mahsulotlari va qimmatbaho toshlar ko'p bo'lganligi batafsil yoritilgan."], ["Sharafuddin Ali Yazdiy \"Zafarnoma\"sini yozishda kimning asarini negiz qilib olgan?", "Asosan Nizomiddiy Shomiyning asari negizida yozilgan, ammo yangi ma'lumotlar bilan boyitilgan.", "Hamdulloh Qazviniyning \"Tarixi guzida\" asaridagi ma'lumotlardan keng foydalangan edi.", "Mirxondning \"Ravzat us-safo\" asaridan iqtiboslar keltirib, o'zining yondashuvini yaratgan.", "Rui Gonsales de Klavixoning \"Kundaliklari\"dan muhim faktlarni o'z asariga kiritgan edi."], ["Sharafuddin Ali Yazdiyning \"Zafarnoma\"sining \"Muqaddimai Zafarnoma\" deb ataluvchi qismi nimani o'z ichiga oladi?", "Temurning nasl-nasabi, Chingizxondan Temurgacha mo'g'ullar tarixi va Temur tarixi tafsilotini.", "Amir Temurning yoshligi va harbiy faoliyatining dastlabki bosqichlari haqidagi qisqa ma'lumotlarni.", "Temuriylar davrida Movarounnahr va Eronning siyosiy-ijtimoiy ahvoli haqidagi umumiy tahlilni.", "Asar yozilishining sabablari, muallifning Haydar Yazdiga minnatdorchiligi bayonini o'z ichiga oladi."], ["Mirxondning \"Ravzat us-safo\" asari necha jilddan iborat va unda qanday davrlar yoritilgan?", "Asar muqaddima, xotima va yetti jilddan iborat bo'lib, dunyo yaratilishidan Sulton Husayn davrigacha qamraydi.", "U besh jilddan iborat bo'lib, islom olamining dastlabki davrlaridan to mo'g'ullar istilosigacha bo'lgan tarixni o'z ichiga oladi.", "Asar to'qqiz jildli bo'lib, faqat Temuriylar davri va undan keyingi voqealarga e'tibor qaratilgan, shu bilan mashhur.", "Mirxondning bu asari olti jildlik bo'lib, asosan Eron va Movarounnahrning XV-XVI asrlardagi ijtimoiy-siyosiy ahvolini yoritadi."], ["Mirxondning \"Ravzat us-safo\" asarining oltinchi jildi nimaga bag'ishlangan?", "Amir Temur va uning zamonidan to Sulton Abu Said o'limigacha (1469-y.) bo'lib o'tgan voqealarni yoritadi.", "Chingizxon va uning avlodlarining Markaziy Osiyo va Yaqin Sharqdagi hukmronlik davrini batafsil tahlil qiladi.", "Muhammad Payg'ambar, xalifayi roshidin, ummaviylar va Abbosiylar davrlarining siyosiy tarixini o'z ichiga oladi.", "Islomiyatdan avvalgi Eron podshohlari va ularning hukmronlik siyosati haqidagi ma'lumotlarni bayon etadi."], ["Mirzo Ulug'bekning tarixiy asari \"Tarixi arba' ulus\" yoki \"Ulus-i arba'yi Chingizxon\" nimani yoritadi?", "XIII-XIV asrlarda mo'g'ul imperiyasi tarkibiga kirgan mamlakatlarning ijtimoiy-siyosiy tarixini qisqa tarzda yoritadi.", "XV asrda Temuriylar davlatining iqtisodiy rivojlanishi va savdo aloqalari haqidagi to'liq ma'lumotlarni taqdim etadi.", "Mo'g'ullarning Markaziy Osiyoga bosqinidan avvalgi davrlarni, xususan, Xorazmshohlar tarixini batafsil o'rganadi.", "Chig'atoy ulusining XIV-XV asrlardagi madaniy va ilmiy yutuqlarini, olimlar hayotini chuqur tahlil qiladi."], ["Mirzo Ulug'bekning \"Tarixi arba' ulus\" asarining Muqaddima qismi nimani bayon etgan?", "Islomiyatdan avvalgi payg'ambarlar, turklarning afsonaviy ota-bobolari va Chingizxon ta'rifini bayon etgan.", "Asarning yozilish sabablari, muallifning ilmiy manbalari va tarixiy tadqiqot usullari haqida ma'lumot beradi.", "Amir Temurning kelib chiqishi, uning yoshlik yillari va taxtga o'tirishigacha bo'lgan asosiy voqealarni yoritgan.", "Chig'atoy ulusi hududidagi qadimiy shaharlar, ularning ijtimoiy hayoti va madaniy merosi haqida so'z boradi."], ["Zahiriddin Muhammad Bobur qaysi yilda Shimoliy Hindistonda Boburiylar imperiyasiga asos soldi?", "Bobur 1526-yilda Shimoliy Hindistonni bosib olib, Boburiylar (Buyuk mo'g'ullar) imperiyasiga asos soldi.", "U 1504-yilda Afg'onistonni egallaganidan so'ng, Kabulda Boburiylar davlatiga tamal toshini qo'ygan edi.", "Bobur 1512-yilda Ko'li Malik jangidagi mag'lubiyatdan so'ng, Hindistonda yangi davlat qurishga qaror qildi.", "U 1494-yilda Farg'ona taxtiga o'tirganidan so'ng darhol o'z hukmronligini kengaytirib imperiya tuzdi."], ["Boburnoma asarining asosiy xususiyati va u yoritgan mavzular nimalardan iborat?", "Me'muar tipida yozilgan ensiklopedik asar bo'lib, o'zida Farg'ona, Toshkent, Samarqandning ijtimoiy-siyosiy ahvolini yoritadi.", "Bu asar falsafiy va diniy mavzularga bag'ishlangan bo'lib, Islom olamining ma'naviy rivojlanishini tahlil qiladi.", "Boburnoma she'riy tarzda yozilgan epik poema bo'lib, Temuriylar qahramonliklari va harbiy yurishlarini tasvirlaydi.", "Asar faqat Hindistonning XVI asrdagi siyosiy tarixini o'rganishga bag'ishlangan bo'lib, boshqa hududlarni qamramaydi."], ["\"Boburnoma\"ning jahonga mashhur bo'lishida kimlarning xizmati katta bo'lgan?", "Asosan ingliz sharqshunoslarining xizmati katta bo'lgan, ular asarni birinchi marta to'liq nashr etganlar.", "Fransuz va nemis olimlari tomonidan qilingan dastlabki tarjimalar asarning Yevropada tanilishiga olib kelgan.", "Hindiston va Pokiston olimlari \"Boburnoma\"ni o'z tillariga tarjima qilib, asarning shu mintaqada mashhurligini oshirganlar.", "O'zbek va rus sharqshunoslari tomonidan tayyorlangan ilmiy-tanqidiy nashrlar asarning global miqyosda o'rganilishiga yordam bergan."], ["Klavixoning \"Kundaliklari\"da Amir Temur saroyidagi qaysi jihatlar haqida ma'lumotlar berilgan?", "Amir Temurning o'zi bilan birga olib yuradigan ko'chma masjidi hamda saroydagi ayollarning mavqei haqida.", "Temurning maxfiy kutubxonasi va u yerdagi nodir qo'lyozmalar haqida batafsil ma'lumotlar mavjud edi.", "Saroyda qo'llanilgan harbiy strategiyalar va Temur qo'shinining tarkibi haqida aniq faktlar keltirilgan.", "Klavixo Temur tomonidan qurilgan yashirin er osti yo'llari va qal'alar tizimini batafsil tasvirlagan."], ["Abdurazzoq Samarqandiy qaysi davrda va kimning saroyida qanday lavozimlarda xizmat qilgan?", "1463-yilgacha Shohrux va Abulqosim Bobur saroyida qozi, askar va imomlik lavozimida xizmat qilgan.", "XV asr oxirigacha Ulug'bek saroyida astronom va matematik sifatida faoliyat yuritgan, muhim ishlar qilgan.", "XIV asr boshlarida Rashiduddinning vazirlik davrida moliya ishlarini boshqargan va boshqa muhim vazifalarni bajargan.", "XVI asr o'rtalarida Bobur Mirzoning Hindistondagi saroyida yuqori harbiy lavozimlarni egallab, unga xizmat qilgan."], ["Mirzo Ulug'bekning \"Ziji Jadidi Ko'ragoniy\" asari nimani qamrab olgan?", "Klassik astronomiyaning nazariy va amaliy masalalarini hamda Samarqand astronomlarining ko'p yillik kuzatishlarini qamrab olgan.", "Geografiya va kartografiyaning asosiy qoidalarini o'z ichiga olgan bo'lib, dunyoning o'sha davrdagi xaritasini batafsil tasvirlagan.", "Matematikaning geometriya va algebra bo'limlaridagi muhim kashfiyotlarni, ayniqsa uchburchaklar nazariyasini tushuntirgan.", "Tibbiyot va farmakologiya sohasidagi yangi bilimlarni, dorivor o'simliklarning xususiyatlari haqida ma'lumot bergan."], ["\"Tarixi guzida\" (\"Saylangan tarix\") nomli tarixiy asarining muallifi kim hisoblanadi?", "Asar muallifi Hamdulloh Qazviniy bo'lib, XIII asr oxiri va XIV asrning boshlarida yashagan.", "Asar muallifi Rashiduddin Fazlulloh bo'lib, XIV asrning o'rtalarida ijod etgan buyuk olimdir.", "Asar muallifi G'iyosuddin Muhammad bo'lib, XIII asrning yarmida faoliyat olib borgan tarixchi.", "Asar muallifi Zaynuddin ibn Hamdulloh bo'lib, XV asrning boshlarida ijod qilgan yirik tarixnavis."], ["Hamdulloh Qazviniyning \"Tarixi guzida\" asarida Eron va qisman O'rta Osiyoda bo'lgan voqealar qaysi yilgacha bayon etilgan?", "Asarda qadim zamonlardan to 1330-yilgacha bo'lgan voqealar bayon etilgan.", "Asarda qadim zamonlardan to 1350-yilgacha bo'lgan voqealar atroflicha tahlil qilingan.", "Asarda qadim zamonlardan to 1392-yilgacha bo'lgan tarixiy jarayonlar yoritilgan.", "Asarda qadim zamonlardan to 1404-yilgacha bo'lgan davr haqida ma'lumotlar berilgan."], ["\"Tarixi guzida\" asarining matni va qisqartirilgan inglizcha tarjimasi qachon va kim tomonidan nashr qilingan?", "1910-yili ingliz sharqshunosi E.Braun tomonidan nashr etilgan.", "1960-yili Abdulhusayn Navoiy tomonidan nashrga tayyorlangan.", "1885-yili taniqli olim J. Leyden tomonidan chop etilgan.", "1972-yili A. K. Arends tomonidan tahrir qilingan."], ["Temur va Temuriylar davri tarixini o'rganishda muhim hisoblangan Rui Gonsales de Klavixoning asari qanday nomlanadi?", "Ushbu asar «Kundaliklari» deb nomlanib, elchilik sayohati xotiralarini jamlagan.", "Ushbu asar «Sayohatnoma» deb atalib, Samarqandga oid qaydlarni o'z ichiga olgan.", "Ushbu asar «Zafarnoma» deb nomlanib, Temurning g'alabalari haqida yozilgan.", "Ushbu asar «Tarixi guzida» deb nomlanib, Xitoy safarlari tafsilotlarini bergan."], ["Rui Gonsales de Klavixoning Samarqandning boyligi haqidagi kuzatishlari qaysi ifodada eng aniq aks etgan?", "«Bu yurt don-dun, may, meva-cheva, parranda go'shti, har xil go'shtga juda boydir».", "«Shaharda faqat ipak va qimmatbaho toshlar savdosi rivojlangan, boshqa narsalar yetishmaydi».", "«Samarqandda oltin va kumush juda ko'p bo'lib, boshqa mahsulotlar tashqaridan keltirilgan».", "«Bu yurt faqatgina chorvachilik mahsulotlari bilan mashhur bo'lib, dehqonchilik yaxshi emas»."], ["Klavixo Samarqanddagi asosiy savdo ko'chasining o'ziga xos arxitektura xususiyati haqida nimalar yozgan?", "«Ko'chaning tepasi gumbaz shaklida yopilgan bo'lib, yorug'lik tuynukchalardan tushgan».", "«Ko'cha bo'ylab baland minoralarga ega bo'lgan saroylar joylashgan va ular bezatilgan».", "«Ko'cha ikki yonidan baland devorlar bilan o'ralgan bo'lib, xavfsizlik ta'minlangan».", "«Ko'chaning markazida favvoralar o'rnatilgan bo'lib, suv bilan ta'minlangan edi doimo»."], ["Sharafuddin Ali Yazdiyning \"Temur Zafarnomasi\" asari tarixiy manbalarda yana qaysi nomlar bilan ma'lum?", "Asar «Jahongir Temur tarixi» va «Sohibqiron fathnomasi» nomlari bilan ham ataladi.", "Asar «Tarixi guzida» va «Nuzhat ul-qulub» nomlari bilan birga tilga olinadi.", "Asar «Matlai us-sa'dayn» va «Ravzat us-safo» nomlari bilan birgalikda zikr etiladi.", "Asar «Boburnoma» va «Tazqirat ush-shuaro» nomlari bilan tez-tez uchraydi."], ["Sharafuddin Ali Yazdiy o'zining \"Zafarnoma\" asarini kimning istagi bilan yozishni tugallagan?", "Asar Temuriy shahzodalaridan Sulton Ibrohim istagi bilan yozib tugallangan.", "Asar Elxoniy Abu Sa'idning buyrug'iga binoan, maxsus topshiriq asosida yozilgan.", "Asar G'iyosuddin Muhammadning iltimosi bilan Sharofuddin Ali Yazdiy tomonidan bitilgan.", "Asar Alisher Navoiyning shaxsiy homiyligi ostida yozilgan tarixiy hujjatdir."], ["Mirxondning \"Ravzat us-safo\" asarining oltinchi jildi qaysi davr voqealarini o'z ichiga oladi?", "Amir Temur va uning zamonidan Sulton Abu Said o'limigacha bo'lgan voqealar yoritilgan.", "Dunyoning yaratilishidan Sosoniy Yazdijard III davrigacha bo'lgan ijtimoiy-siyosiy voqealar.", "Muhammad payg'ambar va xalifa Roshiddin davrida bo'lib o'tgan asosiy voqealar.", "Chingizxon va uning avlodlari tomonidan boshqarilgan davlatlar tarixi tasvirlangan."], ["Kamoliddin Abdurazzoq ibn Jaloliddin Is'hoq Samarqandiyning asosiy tarixiy asari qanday nomlanadi?", "Uning mashhur asari «Matlai us-sa'dayn va majis ul-bahrayn» deb ataladi.", "Uning mashhur asari «Tarixi guzida» deb ataladi va keng tanilgan.", "Uning mashhur asari «Zafarnoma» deb ataladi va ma'lumotlarga boydir.", "Uning mashhur asari «Tazqirat ush-shuaro» deb ataladi va qadrlanadi."], ["Abdurazzoq Samarqandiy 1441-yilda Temuriylar davlatining Hindiston bilan munosabatlarini mustahkamlash maqsadida qaysi mamlakatga elchi qilib yuborilgan?", "U 1441-yilda Janubiy Hindistonga elchi qilib yuborilgan va muhim rol o'ynagan.", "U 1441-yilda Xitoyga elchi qilib yuborilgan va savdo aloqalarini rivojlantirgan.", "U 1441-yilda Oltin O'rdaga elchi qilib yuborilgan va siyosiy muzokaralar olib borgan.", "U 1441-yilda Misrga elchi qilib yuborilgan va madaniy almashinuvga hissa qo'shgan."], ["Davlatshoh Samarqandiyning \"Tazqirat ush-shuaro\" asarining asosiy mavzusi nima?", "Asarda shoirlarning tarjimai holi va ijodiy faoliyati haqida ma'lumotlar berilgan.", "Asarda hukmdorlarning hayoti va ularning davridagi siyosiy voqealar yoritilgan.", "Asarda falsafiy g'oyalar va ilmiy kashfiyotlar haqida chuqur tahlillar qilingan.", "Asarda geografik hududlarning tavsifi va ularning iqtisodiy holati ko'rsatilgan."], ["Mirzo Ulug'bekning klassik astronomiyaning nazariy va amaliy masalalarini qamrab olgan mashhur asari qanday nomlanadi?", "Uning mashhur asari \"Ziji Jadidi Ko'ragoniy\" deb ataladi va juda qimmatlidir.", "Uning mashhur asari \"Tarixi arba' ulus\" deb ataladi va tarixiy manbadir.", "Uning mashhur asari \"Nuzhat ul-qulub\" deb ataladi va ilmiy ahamiyatga egadir.", "Uning mashhur asari \"Matlai us-sa'dayn\" deb ataladi va astronomikdir."], ["Mirzo Ulug'bekning \"Tarixi arba' ulus\" (yoki \"Ulus-i arba'yi Chingizxon\") asari qaysi davr va hududning tarixiga bag'ishlangan?", "XIII-XIV asrlarda mo'g'ul imperiyasi tarkibidagi mamlakatlarning ijtimoiy-siyosiy tarixini yoritgan.", "XV-XVI asrlarda O'rta Osiyo xalqlari va Temuriylar davlatining iqtisodiy aloqalarini tasvirlagan.", "Qadimiy Eron podshohlari va Islomiyatdan avvalgi davrdagi voqealarni atroflicha bayon qilgan.", "XVI-XVII asrlarda Hindiston, Xitoy va Usmonli imperiyasining keng qamrovli tarixini yozgan."], ["Zahiriddin Muhammad Bobur tomonidan yozilgan \"Boburnoma\" asarida quyidagilardan qaysi biri keng tarzda yoritilgan?", "XV asr oxiri va XVI asr boshidagi Farg'ona, Afg'oniston, Shimoliy Hindistonning ahvoli.", "Temuriy hukmdorlarning harbiy yurishlari va ularning siyosiy qarorlari chuqur tahlil qilingan.", "O'rta Osiyo va Yaqin Sharqning madaniy-ma'rifiy hayoti, olimlar va shoirlar faoliyati.", "Mo'g'ullar istilosi, Chingizxon avlodlarining siyosiy kurashlari va davlat boshqaruvi."], ["Hamdulloh Qazviniyning 'Tarixi guzida' asari, muallif tomonidan dastlabki shaklida, qaysi davr voqealarini oʻz ichiga olgan?", "Qadim zamonlardan boshlab to 1330-yilgacha boʻlgan Eron va Oʻrta Osiyo voqealarini.", "Temuriylar davri boshidan to Sulton Husayn Boyqaro hukmronligi yakuniga qadar boʻlgan holatlarni.", "Islomiyatning ilk davridan to Abbosiylar xalifaligining yemirilishigacha boʻlgan muhim voqealarni.", "Chingizxon imperiyasining tashkil topishidan to Elxoniy Abu Saʼid vafotigacha boʻlgan davrni."], ["Hamdulloh Qazviniyning 'Tarixi guzida' asari nechta bobdan iborat bo'lib, uning tarkibiy tuzilishi qanday ifodalangan?", "Asar muqaddima-fotiha va Paygʻambarlar, Islomdan avvalgi Eron shohlari kabi olti bobdan tuzilgan.", "Kitob kirish qismi, uchta asosiy boʻlim va xulosa qismidan iborat boʻlib, besh bobdan tashkil topgan.", "Mazkur asar sarlavha qismi, asosiy matn va Muhammad Paygʻambar tarixi haqida yetti fasldan iborat.", "Ushbu manba toʻqqiz qismga ajratilgan boʻlib, har biri alohida sulolalar tarixini yoritib chiqqan."], ["Rui Gonsales de Klavixoning 'Kundaliklari' asarida qayd etilishicha, uning Samarqandga elchilik sayohati qachon boshlangan va qancha muddat davom etgan?", "1403-yilning 22-mayida boshlanib, Samarqandga yetib kelish uchun jami 15 oy vaqt sarflagan.", "1402-yilning bahorida yoʻlga chiqib, 1404-yilning boshlarida Amir Temur saroyiga yetib kelgan.", "1404-yilning yozida safarini boshlab, qariyb bir yil ichida Movaraunahr hududiga yetib kelgan.", "1403-yilning oktyabr oyida boshlanib, ikki yil davomida Eron va Oʻrta Osiyo boʻylab sayohat qilgan."], ["Sharafuddin Ali Yazdiyning 'Zafarnoma' asari oʻz mazmun-mohiyatiga koʻra Temur shaxsini qanday tasvirlagan?", "Unda Amir Temurning shaxsi nihoyatda idellashtirilgan va uning faoliyati ideal tarzda koʻrsatilgan.", "Temurning zolim fotihlik xislatlari va Movaraunahrdagi markazlashgan davlat asoschisi sifatidagi ziddiyatlari aks ettirilgan.", "Asarda Temurning davlat boshqaruvi va harbiy strategiyasi chuqur tahlil qilinib, obyektiv yondashuv bilan baho berilgan.", "Temurning oilaviy hayoti, saroydagi ayollar mavqei va shahzodalarning turmush tarzi realistik tarzda yoritilgan."], ["Sharafuddin Ali Yazdiyning 'Zafarnoma' asari Nizomiddin Shomiyning qaysi asari negizida yozilgan?", "Nizomiddin Shomiyning 'Zafarnoma' asari negizida yozilgan boʻlib, uni yangi faktlar bilan boyitgan.", "Nizomiddin Shomiyning 'Temur tarixi' nomli manbasi asosida yaratilgan, biroq toʻliq nusxasi saqlanmagan.", "Nizomiddin Shomiyning 'Sohibqiron fathnomasi' deb nomlangan kitobidan ilhomlanib yozilgan.", "Nizomiddin Shomiyning 'Jahongir tarixi' nomli salnomasi maʼlumotlari asosida toʻldirilgan."], ["Mirxondning 'Ravzat us-safo' asari muqaddima va xotimadan tashqari nechta jilddan iborat va unda qaysi voqealar haqida maʼlumotlar berilgan?", "Yetti jilddan iborat boʻlib, unda Dunyo yaratilishidan Sulton Husayn avlodigacha boʻlgan tarix yoritilgan.", "Besh jilddan tashkil topgan boʻlib, Islomdan avvalgi Eron va Temuriylar davri xronologik tartibda bayon etilgan.", "Sakkiz jildni oʻz ichiga olgan, Paygʻambarlar davridan moʻgʻullar istilosigacha boʻlgan voqealarni tasvirlagan.", "Olti jilddan iborat boʻlib, unda faqat Abbosiylar sulolasi va Chingizxon avlodining tarixi chuqur yoritilgan."], ["Abdurazzoq Samarqandiyning 'Matlai us-sa'dayn va majis ul-bahrayn' asari rus va xorijiy olimlar tomonidan qanday baholangan?", "Ular tomonidan birinchi darajali tarixiy manba sifatida yuksak baholangan va keng oʻrganilgan.", "Asar ikkinchi darajali manba sifatida qabul qilinib, ayrim noaniqliklar mavjudligi taʼkidlangan.", "Muallifning shaxsiy xotiralari jamlanmasi sifatida baholanib, ilmiy qimmati kamroq deb topilgan.", "Asar faqatgina oʻrta asrlar geografik maʼlumotlari uchun muhim deb eʼtirof etilgan."], ["Abdurazzoq Samarqandiyning 'Matlai us-sa'dayn' asari ikki qismdan iborat boʻlib, ikkinchi qismda qaysi davr voqealari tasvirlangan?", "Shohruxning Temuriylar imperiyasining oliy hukmdori boʻlishidan to Timuriy Abu Saʼid oʻldirilishigacha.", "Elxon Abu Saʼid davridan to Amir Temurning vafoti va Xalil Sultonning Samarqand taxtiga oʻtirishigacha.", "Chingizxon saltanatining tashkil topishidan to moʻgʻullar hukmronligining yakun topishiga qadar.", "Muhammad Paygʻambarning tugʻilishidan to Rashidun xalifalarining hukmronlik davri yakunigacha."], ["Davlatshoh Samarqandiyning 'Tazqirat ush-shuaro' asarining uchinchi-beshinchi tabaqalarida qaysi sulolalar zamonida oʻtgan shoirlar haqida maʼlumotlar keltirilgan?", "Xorazmshohlar-Anushteginlar, Elxoniylar va Muzaffariylar davrida yashagan shoirlar haqida.", "Safforiylar, Somoniylar va Gʻaznaviylar hukmronligi davrida ijod etgan isteʼdod egalari toʻgʻrisida.", "Temuriylar, Saljuqiylar va Daylamiylar sulolalari davrida ijod qilgan adiblar haqida batafsil maʼlumot.", "Ilk Islom davri, Abbosiylar xalifaligi va Rashidun davri shoirlarining hayotiy faoliyati haqida."], ["Mirzo Ulugʻbekning 'Tarixi arbaʼ ulus' asarining birinchi qismida qaysi geografik hududning tarixi yoritilgan?", "Ulugʻ yurt, yaʼni Moʻgʻuliston va Shimoliy Xitoy tarixi Ugadayxon davridan Ariqbugʻonnning avlodigacha.", "Juchi ulusi, yaʼni Oltin Oʻrda tarixi Juchixon davridan Shohruxning zamondoshi Muhammadxon hukmronligigacha.", "Chigʻatoy ulusining XIII-XIV asrlardagi ijtimoiy-siyosiy ahvoli va mahalliy xalqlar turmush tarzi.", "Movaraunahrning Chingizxon davridan to Amir Temur saltanati paydo boʻlishigacha boʻlgan bosqichlari."], ["Mirzo Ulugʻbekning 'Tarixi arbaʼ ulus' asari muqaddima qismida Oʻrta asrlar tarixchilari anʼanasiga koʻra nimalarni bayon qilgan?", "Islomiyatdan avval oʻtgan paygʻambarlar, turklarning afsonaviy ota-bobolari va Chingizxon taʼrifi.", "Temurning nasl-nasabi, Movaraunahrdagi Chingizxon avlodlarining siyosiy faoliyati va merosi.", "Oʻrta Osiyo xalqlarining urf-odatlari, iqtisodiy aloqalar va madaniy rivojlanish bosqichlari.", "Abu Saʼid Mirzo hukmronligi davridagi siyosiy vaziyat, ijtimoiy-iqtisodiy islohotlar va ularning natijalari."], ["Zahiriddin Muhammad Boburning 'Boburnoma' asari qaysi janrdagi asar boʻlib, uning umumiy xususiyati nimada?", "Memuar tipidagi ensiklopedik asar boʻlib, avtobiografik maʼlumotlar va voqealar bayonidan iborat.", "Tarixiy salnoma boʻlib, unda faqat Temuriy hukmdorlarning harbiy yurishlari va siyosiy qarorlari tahlil qilingan.", "Adabiy-ilmiy tadqiqot asari boʻlib, XVI asr madaniyoti va falsafasi haqida chuqur nazariy maʼlumotlar berilgan.", "Geografik lugʻat boʻlib, asosan Oʻrta Osiyo va Hindistonning hududiy xususiyatlari va joy nomlari keltirilgan."], ["Boburning Hindistonda amalga oshirgan eng muhim siyosiy-tarixiy yutugʻi nimadan iborat?", "1526-yilda Shimoliy Hindistonni zabt etib, Boburiylar (Buyuk moʻgʻullar) imperiyasiga asos solgan.", "Dehli sultonligini qayta tiklab, mintaqadagi siyosiy parokandalikka barham berishga muvaffaq boʻlgan.", "Hindiston va Oʻrta Osiyo oʻrtasida savdo aloqalarini mustahkamlab, madaniy almashuvni rivojlantirgan.", "Hindistonning turli xalqlarini yagona davlatga birlashtirib, keng koʻlamli maʼmuriy islohotlar oʻtkazgan."], ["Boburning 'Boburnoma' asari oʻzida qaysi hududlarning XV asr oxiri va XVI asr boshidagi ijtimoiy-siyosiy ahvolini yoritgan?", "Fargʻona, Toshkent, Samarqand, Hisori shodmon, Chagʻoniyon, Afgʻoniston va Shimoliy Hindistonning.", "Eronning Safaviylar davlati, Kichik Osiyo va Mesopotamiya hududlarining iqtisodiy hayotini.", "Oltin Oʻrda, Sibir xonligi va Ural oldi mintaqalarining madaniy va maʼnaviy hayotini.", "Xorazmshohlar davlati, Ilxoniylar davlati va Oʻrta Osiyoning Chingizxon istilosidan keyingi ahvolini."], ["Rui Gonsales de Klavixo 'Kundaliklari'da Samarqand shahridagi ulkan savdo koʻchasi haqida qanday maʼlumot bergan?", "Bu koʻcha shaharning bir chekkasidan boshlanib, oʻrtasidan oʻtib, gumbaz shaklida yopilgan va tuynukchalari bor boʻlgan.", "U savdo rastalari ikki tarafida dehqonlar joylashtirilgan, ochiq osmon ostida joylashgan katta maydon boʻlgan.", "Koʻcha shaharning markaziy qismida joylashgan boʻlib, asosan Xitoydan keltirilgan qimmatbaho mollar sotiladigan joy boʻlgan.", "Bu koʻcha faqat Amir Temurning shaxsiy buyrugʻi bilan qurilgan boʻlib, asosan hukmdor saroyiga xizmat qilgan."], ["Sharafuddin Ali Yazdiyning 'Zafarnoma' asarining 'Muqaddimai Zafarnoma' deb nomlangan qismi qachon yozib tamomlangan va unda qanday mavzular yoritilgan?", "1419-yilda yozib tamomlangan boʻlib, moʻgʻul imperiyasi va Temur davlatining ijtimoiy-siyosiy tarixini yoritgan.", "1425-yilda yakunlangan boʻlib, asosan Temurning harbiy yurishlari va gʻalabalari haqida maʼlumot bergan.", "1414-yilda yozilgan boʻlib, Temuriy shahzodalarning tarjimai holi va saroydagi siyosiy intriga masalalarini oʻz ichiga olgan.", "858 (1454) hijriy yilda yozilgan boʻlib, Nizomiddin Shomiyning asarini toʻldirish va yangi faktlarni kiritishga bagʻishlangan."], ["Mirzo Ulugʻbekning 'Tarixi arbaʼ ulus' asarining ikkinchi qismida qaysi ulusning tarixi bayon etilgan va qaysi hukmdorlar davrini qamrab olgan?", "Juchi ulusi, yaʼni Oltin Oʻrda tarixi Jujixon davridan Shohruxning zamondoshi Muhammadxongacha.", "Chigʻatoy ulusi tarixi, ayniqsa Ugadayxon davridan to Ariqbugʻonnning avlodi Urdayxon zamonigacha.", "Elxoniy Abu Saʼid hukmronligi davri va uning vafotidan keyingi siyosiy oʻzgarishlar tarixi.", "Movaraunahrning XIII-XIV asrlardagi ijtimoiy-siyosiy ahvoli, Chingizxondan Temurgacha boʻlgan davr."], ["Hamdulloh Qazviniy 'Tarixi guzida' asaridan tashqari qaysi boshqa muhim asarlarning muallifi hisoblanadi?", "'Zafarnoma' va 'Nuzhat ul-qulub' nomli asarlar muallifi sifatida ham tanilgan olim hisoblanadi.", "'Ravzat us-safo' hamda 'Matlai us-sa'dayn' kabi katta hajmli tarixiy manbalarning muallifidir.", "'Ziji Jadidi Koʻragoniy' va 'Tarixi arbaʼ ulus' nomli ilmiy asarlarning yaratuvchisi hamdir.", "'Kundaliklari' va 'Tazqirat ush-shuaro' kabi mashhur adabiy-tarixiy asarlarning yozuvchisidir."], ["Epigrafika fani qanday qadimiy yozuvlarni o'rganishga ixtisoslashgan bo'lib, uning asosiy tadqiqot ob'ektlari nimadan iborat?", "Tosh, metall, buyumlar va yog'och kabi qattiq jismlar ustida o'yib yozilgan matnlarni tadqiq etuvchi soha hisoblanadi.", "Qadimiy qo'lyozmalarni, papirus varaqlari va pergament sahifalarida bitilgan diniy marosimlarni o'rganuvchi fan tarmog'i.", "Er ostidan topilgan sopol buyumlarga ishlangan bezaklarni va guldor naqshlarning rivojlanish bosqichlarini tahlil qiluvchi yo'nalish.", "Suvosti arxeologik qazishmalar natijasida topilgan kemalar qoldiqlaridagi yog'och o'ymakorliklarini o'rganuvchi mustaqil bir yo'nalish."], ["Ahmoniylar davri epigrafik yozuvlari Markaziy Osiyo xalqlarining qaysi shaharlardan keltirilgan materiallardan saroy qurganini ko'rsatadi?", "Lidiya va Baqtriyadan oltin, Sug'diyona va Xorazmdan esa tovlanib turgan qimmatbaho toshlar olib kelingan.", "Bobil va Misrdan qimmatli metallar, shuningdek Elam va Hindistondan noyob yog'och turlari tashib keltirilgan.", "Mesopotamiya va Suriyadan sopol g'ishtlar, Parfiya va Midiya hududidan esa qurilish uchun marmarlar yetkazib berilgan.", "Yunoniston va Rimdan badiiy haykaltaroshlik buyumlari, shuningdek Kushondan fil suyagi mahsulotlari keltirilgan."], ["Perespoldagi tasvirlarga ko'ra, Sug'diylar qanday xususiyatlari bilan ajralib turganlar va ular Ahamoniylarga qanday sovg'alar keltirishgan?", "O'ziga xos oyoq kiyimida, qo'llarida qadah, mato, hayvon terisi hamda ikki bosh qo'yni etaklab kelayotgan holda tasvirlangan.", "Boshlarida baland shlyapa bilan, qo'llarida turli o'simliklar va nozik matolar bo'lgan holda, qurol-aslahalar bilan ko'rsatilgan.", "Yelkalarida og'ir yuklar, oyoqlarida o'rama paypoqlar, yonlarida esa uzun qilichlar bilan birga otlarni yetaklab kelgan.", "Murakkab uslubda tikilgan kiyimlar bilan, qo'llarida sopol idishlar va noyob zargarlik buyumlarini olib kelayotgan holda tasvirlangan."], ["Perespoldagi tasvirlarda Sakatigraxaudalar guruhi qanday ko'rinishda tasvirlangan va ular qanday sovg'alar taqdim etganlar?", "Uchi o'tkir kigiz qalpoq kiygan, ot yetaklagan va qo'llarida qimmatbaho sarpo olib kelayotgan holda aks ettirilgan.", "Boshlarida uzun patli dubulg'a bilan, yelkalarida kamon va o'qdonlari bo'lgan holda, ovlangan hayvonlarni tortiq qilganlar.", "Belida belbog', oyog'ida baland etikka ega, qo'llarida o'tkir nayzalar va qalqonlar bilan harbiy kiyimda tasvirlangan.", "Yuzlarida niqob bilan, qo'llarida turli gullar va mevalar, shuningdek ularga hamrohlik qiluvchi qushlar bilan ko'rsatilgan."], ["Perespoldagi releflarda Baqtriyaliklar qanday kiyimda tasvirlangan va ular Ahamoniylarga qanday to'lovlar olib kelishgan?", "Yaktak kiyib, sholvorlarini himargan holda, qo'llarida idishlar va tuyalar yetaklab kelayotgan kishilar sifatida ko'rsatilgan.", "Qalin charm ko'ylaklarda, oyoqlarida og'ir botinkalar bilan, qo'llarida oltin tangalar va oziq-ovqat mahsulotlari bilan tasvirlanganlar.", "Boshlarida katta salla, yelkalarida jun matodan yopinchiq bilan, qo'llarida yog'och o'ymakorliklari va metall tangachalar olib yurganlar.", "Ipak liboslarda, belida kamar bilan, qo'llarida to'qimachilik mahsulotlari va turli xil ziravorlar bilan kelayotgan qilib tasvirlanganlar."], ["Persepoldan shimolda joylashgan Husaynko'h qoyalarida topilgan yozuvlarda Ahamoniylardan qaysi shohning 19 marta urushlari va 9 ta podshoning asirga olinishi qayd etilgan?", "Doro I ning harbiy yurishlari va uning g'alabalari haqida batafsil ma'lumotlar bu yozuvlarda aniq bayon etilgan.", "Kserks I ning Eron imperiyasining kengayishi va uning qo'shni davlatlar bilan bo'lgan savdo aloqalari tarixi yoritilgan.", "Artakserksning ichki siyosati, qurilish ishlari va madaniy taraqqiyotga qo'shgan hissasi bu yozuvlarda ko'rsatilgan.", "Doro III ning imperiyaning so'nggi davri va uning Aleksandr Makedonskiyga qarshi olib borgan kurashlari to'g'risida ma'lumotlar berilgan."], ["Mashhur Behustun yozuvlari qayerda joylashgan, qancha balandlikda va Doro I buyrug'i bilan qaysi tillarda yozilgan?", "Shimoliy Eronda, Zagros tog'idagi tik qoyaga bitilgan bo'lib, Elam, Bobil va qadimgi Eron tillarida yozilgan g'alaba yodgorligidir.", "Mesopotamiya tekisligida, Furot daryosi bo'yidagi qadimiy minora devorlariga ishlangan va akkad, shumer tillarida yozilgan.", "Nil daryosi deltasida, Misr piramidalarining ichki devorlariga o'yib yozilgan va qadimgi Misr ierogliflari bilan ifodalangan.", "Yunonistonning janubiy qirg'og'ida, Afina akropolida joylashgan va lotin, yunon tillarida Grek-Rim hukmronligini tasvirlovchi matndir."], ["Behustun yozuvlarining mazmuni qanday voqealarga bag'ishlangan bo'lib, Ahamoniylar imperiyasini larzaga keltirgan xalq harakatlarining yetakchisi kim bo'lgan?", "Mil.avv. 523-522-yillardagi Gaumata, Frada, Skunka boshliq xalq harakatlari haqida hikoya qilib, ularning Achaemenid imperiyasiga qarshiligini aks ettiradi.", "Doro I ning siyosiy islohotlari, imperiyani birlashtirishdagi xizmatlari va uning qadimgi shaharlarni qurishdagi yutuqlari haqida to'liq ma'lumot beradi.", "Ahamoniylar imperiyasining qo'shni davlatlar bilan diplomatik munosabatlari, savdo yo'llari va madaniy almashinuvlariga oid muhim ma'lumotlar yoritilgan.", "Kserks I ning Yunon-Fors urushlari, uning harbiy strategiyalari va imperiyaning ushbu davrda erishgan hududiy kengayishlari to'g'risida hikoya qiladi."], ["Poliyenning mil.avv. II asrda yozilgan rivoyatiga ko'ra, forslarning saka tigraxudalar ustiga yurishida Shiroq qanday rol o'ynagan?", "U Sakalarni halokatdan qutqarish maqsadida, forslarni suvsiz qum sahrosiga boshlab borib, tashnalik va ochlik balosiga giriftor qilgan.", "U o'zining qabilasini xoinlik bilan sotib, forslarga Sakalar joylashgan hududga eng qisqa va maxfiy yo'lni ko'rsatib bergan.", "U ikki tomon o'rtasida diplomatik muzokaralarni boshlab, urushni to'xtatishga va tinchlik shartnomasini imzolashga erishgan.", "U forslar qo'shiniga qo'shilib, Sakalarga qarshi janglarda faol ishtirok etgan va ularga qarshi harbiy strategiyalarni ishlab chiqqan."], ["Avesto matnlariga ko'ra, Zardushtiylik dini Markaziy Osiyoda qachon keng tarqala boshlagan va uning asosiy g'oyalari nimaga asoslangan edi?", "Mil.avv. 1 ming yillikning birinchi yarmida tarqalib, tabiat kuchlarini (olov, er, suv, oy, yulduzlar) ilohiylashtirishga asoslangan.", "Milodiy 1-asrda paydo bo'lib, yagona xudoga sig'inish, insonning ruhiy poklanishi va yaxshilikka intilish g'oyalarini targ'ib qilgan.", "Mil.avv. 5-asrda shakllanib, hayvonlarga sig'inish, qurbonlik qilish va o'lganlarning ruhini tinchlantirish marosimlariga urg'u bergan.", "Milodiy 7-asrda islomgacha bo'lgan davrda rivojlanib, ajdodlar ruhiga hurmat, totemizm va shamanistik e'tiqodlarni o'z ichiga olgan."], ["Zoroastrizmning muqaddas kitobi «Avesto» Eron va O'rta Osiyo xalqlarining qadimiy madaniyati (e'tiqodi, tili, adabiyoti) va tarixini o'rganishda nima uchun muhim manba hisoblanadi?", "U mil.avv. VI-V asrlarda yozilgan bo'lib, mintaqa xalqlarining diniy e'tiqodlari, ijtimoiy tuzilishi va tarixiy voqealari haqida asosiy ma'lumotlarni beradi.", "Unda qadimgi imperiyalarning harbiy strategiyalari, savdo yo'llari va siyosiy munosabatlari batafsil tahlil qilinganligi sababli.", "Kitobda qadimgi sivilizatsiyalarning texnologik yutuqlari, astronomik kuzatishlari va matematika bo'yicha bilimlari chuqur yoritilganligi uchun.", "U turli xalqlarning folklori, afsonalari va eposlari to'plamini o'z ichiga olib, ularning og'zaki ijodi haqida noyob ma'lumotlar berganligi sababli."], ["«Avesto»ning asl nusxalari qanday taqdirga duch kelgan va hozirgi kungacha uning qaysi qismlari yetib kelgan?", "Uning uch nusxasidan biri Aleksandr tomonidan yoqib yuborilgan, ikkinchisi Gresiyaga olib ketilgan, uchinchisi esa to'liq bo'lmagan holda otashparstlar qo'lida saqlangan.", "Barcha nusxalari qadimgi kutubxonalarda ehtiyotkorlik bilan saqlanib, to'liq holda bizning davrimizga yetib kelgan, faqat tarjimalarida kichik farqlar mavjud.", "Uning asosiy qismlari qadimiy Fors imperiyasi qulaganda yo'q bo'lib ketgan, faqatgina kichik parchalar va ularning qadimiy izohlari orqali saqlanib qolgan.", "Bir nusxasi Xitoyga, boshqasi Rim imperiyasiga olib ketilgan, uchinchi nusxasi esa yirik tabiiy ofatlar tufayli butunlay yo'q bo'lib, izsiz ketgan."], ["«Zand Avesto» nomi bilan mashhur bo'lgan kitob qachon va kimning davrida to'liq tartibga solingan hamda asosiy qismlari qaysi tilga tarjima qilingan?", "Parfiya podshosi Volgash III va Sosoniylar davrida tayyorlanishda davom ettirilib, Sosoniy Shopur II davrida to'liq tartibga solingan va pahlaviy tiliga tarjima qilingan.", "Ahamoniylar davrida Doro I tomonidan buyruq berilgan, keyinchalik Buyuk Kir tomonidan yakunlangan va qadimgi Elam tiliga qisman tarjima qilingan.", "Kushon podsholigi davrida Kanishka tomonidan kengaytirilgan, yozma manbalar asosida turli qismlarining grek va sanskrit tillariga tarjimalari qilingan.", "Aleksandr Makedonskiy yurishlari davrida yunon olimlari tomonidan qayta ishlanib, imperatorning buyrug'i bilan aramey va suryoniy tillariga o'girilgan."], ["Yozm
