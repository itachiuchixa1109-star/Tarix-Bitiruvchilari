ng tezligi va hajmiga taʼsir qiladi, ammo mazmuniga hech qanday aloqasi yoʻq."], ["Oʻzbek tilini sohaga yoʻnaltirib oʻqitish qanday taʼlim yoʻnalishi hisoblanadi?", "Til bilimlarini muayyan kasb va faoliyat turi ehtiyojlari bilan bogʻlab oʻrgatishga qaratilgan taʼlim yoʻnalishidir.", "Faqat grammatik qoidalarni bilish bilan cheklanmasdan, umumiylikni oshirishga qaratilgan til taʼlimidir.", "Adabiy asarlarni chuqur tahlil qilishga yoʻnaltirilgan, lingvistik bilimni rivojlantiruvchi oʻqitish.", "Ogʻzaki nutq madaniyatini rivojlantirishga qaratilgan, nutqiy koʻnikmalarni shakllantiruvchi yoʻnalish."], ["Sohaga yoʻnaltirib oʻqitishning asosiy maqsadi nimadan iborat?", "Boʻlajak mutaxassisning kasbiy muloqot kompetensiyasini shakllantirish, tildan samarali foydalanish.", "Talabalarning umumiy savodxonlik darajasini oshirish, ilmiy uslubni chuqur oʻrganishga qaratilgan jarayon.", "Adabiy tilning tarixiy taraqqiyotini oʻrganish va uning turli shakllarini bilishga yoʻnaltirilganlik.", "Barcha fanlar boʻyicha yuqori natijalarga erishishga qaratilgan tizim, tilga bogʻliq boʻlmagan jihatlar."], ["Oʻzbek tilini sohaga yoʻnaltirib oʻqitishning asosiy vazifalaridan biri nimani oʻz ichiga oladi?", "Adabiy til meʼyorlariga tayangan holda toʻgʻri gapirish va yozish koʻnikmasini rivojlantirish.", "Mumtoz adabiyot namunalari asosida tilning boyligini oʻrganish va chuqur tahlil qilish.", "Faqat oʻz shevasida erkin muloqot qilishga oʻrgatish, rasmiy nutqni chetlab oʻtish.", "Zamonaviy chet tillarni oʻzlashtirish orqali umumiy nutq madaniyatini yanada yaxshilash."], ["Talabaning kasbiy faoliyatida adabiy tildan toʻgʻri foydalanish maqsadining amaliy koʻrinishi qaysi jihatlarda namoyon boʻladi?", "Soha terminlarini oʻrinli qoʻllashi, hujjatlarni meʼyor asosida tuzishi, nutq madaniyatiga rioya qilishi.", "Turli janrdagi badiiy asarlarni mustaqil tahlil qila olishi, mazmunini chuqur anglab yetishi.", "Grammatik qoidalarni yoddan bilishi, fonetik tahlil oʻtkazishi bilan nutqda aniqlikni taʼminlash.", "Taqdimotlarda faqat ogʻzaki nutq qoidalariga amal qilish, yozma nutqdan butunlay voz kechish."], ["Matn boʻyicha \"Til meʼyori\" tushunchasi qanday izohlanadi?", "Adabiy til birliklarining jamiyat tomonidan toʻgʻri, maqbul va barqaror deb eʼtirof etilgan qoʻllanish shaklidir.", "Har bir insonning shaxsiy nutq uslubini belgilovchi qoidalar yigʻindisi boʻlib, doimo oʻzgaruvchandir.", "Yozma nutqda talab qilinadigan grammatik qoidalarni oʻrganuvchi tilshunoslikning asosiy boʻlimidir.", "Ogʻzaki nutqda erkin muloqot qilish uchun shevaga xos soʻzlarni faol qoʻllashga asoslangan usul."], ["Adabiy til meʼyori tilning qaysi sathlarida amal qilishi qayd etilgan?", "Tovush, soʻz, grammatik qurilish va uslub kabi barcha til sathlarida birdek amal qiladi.", "Faqat yozma nutqda, jumladan, grammatika va imlo qoidalarida qatʼiy ravishda amal qiladi.", "Asosan ogʻzaki nutq, talaffuz va urgʻu kabi fonetik sathda namoyon boʻladi va rivojlanadi.", "Eng avvalo, lugʻat boyligi va soʻz maʼnolarini belgilashda muhim rol oʻynaydi va tasniflanadi."], ["Taqdimot materialida adabiy til meʼyorlarining qaysi turlari koʻrsatilgan?", "Leksik-semantik, talaffuz (orfoepik), yozuv (grafik), fonetik, aksentologik meʼyorlar.", "Morfologik, sintaktik, fonologik, dialektologik, etimologik hamda sotsiolingvistik meʼyorlar.", "Arxaik, neologik, frazeologik, terminologik, uslubiy hamda paralingvistik meʼyorlar.", "Etnografik, pragmatik, stilistik, retorik, shuningdek, paralingvistik va semantik meʼyorlar."], ["Leksik meʼyorning asosiy maqsadi nimadan iborat?", "Soʻzlarning maʼnosiga mos, oʻrinli va maqsadga muvofiq ravishda qoʻllanishini taʼminlash.", "Soʻz shakllarining ogʻzaki nutqda adabiy til talablariga muvofiq talaffuz qilinishi.", "Yozma nutqda tinish belgilarining toʻgʻri va oʻrinli ravishda qoʻllanishini belgilash.", "Gap boʻlaklari va feʼl shakllarining oʻzaro grammatik mosligini taʼminlab berish."], ["Orfoepik meʼyor nimani belgilaydi va qanday vazifani bajaradi?", "Soʻz va soʻz shakllarining ogʻzaki nutqda adabiy talaffuz qilinishini belgilaydi, sheva taʼsirini kamaytiradi.", "Soʻzlarning maʼnosini aniq bilish va ularni oʻrnida ishlatishni taʼminlaydi, mantiqiy bogʻliqlikni nazorat qiladi.", "Yozma nutqda harflar, bosh va kichik harflar, qisqartmalarni toʻgʻri qoʻllashni belgilaydi, savodxonlikni oshiradi.", "Nutq birliklarining aloqa vaziyati, nutq turi va maqsadga mos holda tanlanishini belgilaydi, uslubiy toʻgʻrilikni taʼminlaydi."], ["Orfoepik meʼyor nutq madaniyatini yuksaltirishga qanday hissa qoʻshadi?", "Talaffuz xatolarining oldini olish, sheva va lahja taʼsirini kamaytirish orqali nutq madaniyatini yuksaltiradi.", "Soʻzlarni toʻgʻri urgʻu bilan aytish orqali tinglovchining fikrni oson qabul qilishiga yordam beradi.", "Rasmiy hujjatlarda tilning aniqligi va bir maʼnoli boʻlishini taʼminlaydi, tushunarlilikni oshiradi.", "Ilmiy va rasmiy-idoraviy uslubda aniq ifodalarni qoʻllashni talab qiladi, matnning obroʻsini oshiradi."], ["Aksentologik meʼyor nimani belgilaydi va uning buzilishi qanday oqibatlarga olib kelishi mumkin?", "Soʻzlarda urgʻuning toʻgʻri qoʻyilishi, nutq gʻalizlashishi yoki soʻz anglashilishiga salbiy taʼsir qilishi.", "Soʻzlar va soʻz shakllarining yozma nutqda toʻgʻri imlo qoidalari bilan yozilishini belgilaydi.", "Yozma nutqda tinish belgilarining toʻgʻri qoʻllanilishi, matn aniqligini taʼminlashi va mazmunini oydinlashtirishi.", "Ogʻzaki nutqda sheva va lahja taʼsirini kamaytirish, talaffuz xatolarining oldini olib, nutqni yaxshilashi."], ["Oʻzbek tilida urgʻuning joylashishi haqida matnda qanday maʼlumot berilgan?", "Urgʻu asosan soʻz oxiriga tushishi qayd etilgan, bu nutq tushunarliligini oshiradi va aniqlik beradi.", "Urgʻu asosan soʻzning boshiga tushishi qayd etilgan, bu maʼnoni oʻzgartiradi va talaffuzni osonlashtiradi.", "Urgʻu asosan soʻzning oʻrtasiga tushishi qayd etilgan, bu talaffuzni qiyinlashtiradi va gʻalizlikni yuzaga keltiradi.", "Oʻzbek tilida urgʻu qatʼiy qoidaga boʻysunmaydi, har bir soʻzda oʻzgaruvchan boʻladi va xohishga bogʻliq."], ["Grammatik meʼyor nimani belgilaydi va uning buzilishi qanday namoyon boʻladi?", "Soʻz shakllari, soʻz birikmalari va gaplarning toʻgʻri tuzilishini belgilaydi, masalan, \"Men kitob o'qidilar\" xato.", "Soʻzlarning maʼnosiga mos, oʻrinli va maqsadga muvofiq qoʻllanishini belgilaydi, \"muhim\" soʻzining notoʻgʻri qoʻllanishi.", "Ogʻzaki nutqda talaffuz qoidalariga rioya qilishni belgilaydi, sheva taʼsirida boʻlgan soʻzlarni cheklaydi.", "Yangi soʻzlarning tilning ichki qonun-qoidalariga muvofiq yasalishini belgilaydi, \"bilim-bilimli\" kabi tuzilmalar."], ["Soʻz yasalish meʼyori qanday vazifani bajaradi?", "Yangi soʻzlarning tilning ichki qonun-qoidalariga muvofiq ravishda yasalishini belgilaydi.", "Soʻzlarning ogʻzaki nutqda toʻgʻri talaffuz qilinishini taʼminlaydi va sheva taʼsirini kamaytiradi.", "Yozma nutqda tinish belgilarining toʻgʻri va oʻrinli qoʻllanilishini aniq belgilaydi.", "Nutq birliklarining aloqa vaziyati, nutq turi va maqsadga mos holda tanlanishini belgilaydi."], ["Imloviy va grafik meʼyorlar oʻrtasidagi farq nimada?", "Imloviy meʼyor soʻz va gaplarning yozma nutqda toʻgʻri yozilishini, grafik meʼyor esa harflar va yozuv shakllarini toʻgʻri qoʻllashni belgilaydi.", "Imloviy meʼyor soʻzlarning ogʻzaki talaffuzini, grafik meʼyor esa soʻzlarda urgʻuning toʻgʻri qoʻyilishini tartibga soladi.", "Imloviy meʼyor soʻzlarning maʼnosiga mos qoʻllanilishini, grafik meʼyor esa gaplarning toʻgʻri tuzilishini belgilaydi.", "Imloviy meʼyor faqat badiiy asarlardagi matnlarni, grafik meʼyor esa ilmiy matnlarni toʻgʻri yozishni taʼminlaydi."], ["Uslubiy meʼyor nimani taʼminlaydi va u qanday ahamiyatga ega?", "Nutq birliklarining aloqa vaziyati, nutq turi va maqsadga mos holda tanlanishini taʼminlaydi.", "Soʻzlarning yozma nutqda toʻgʻri imlo qoidalariga muvofiq ravishda yozilishini taʼminlaydi.", "Soʻzlarning maʼnosiga mos, oʻrinli va maqsadga muvofiq ravishda qoʻllanishini belgilaydi.", "Yangi soʻzlarning tilning ichki qonun-qoidalariga muvofiq yasalishini nazorat qilib turadi."], ["Punktuatsion meʼyorning asosiy vazifasi nima?", "Yozma nutqda tinish belgilarining toʻgʻri va oʻrinli ravishda qoʻllanishini aniq belgilaydi.", "Soʻzlarning ogʻzaki talaffuzida urgʻuning joylashishini tartibga solishga qaratilgan asosiy qoida.", "Nutq birliklarining maʼnosiga mos keladigan lugʻaviy birliklarni tanlashni nazorat qilib boradi.", "Gaplarning grammatik jihatdan toʻgʻri tuzilishini va ularning sintaktik mosligini taʼminlashga xizmat qiladi."], ["Matn boʻyicha \"Nutqning sofligi\" tushunchasi qanday izohlanadi?", "Adabiy til va jamiyatdagi maʼnaviy-axloq qoidalariga zid boʻlgan unsurlardan butunlay xoli boʻlish bilan belgilanadi.", "Nutqda faqat shevaga xos soʻzlarni ishlatish orqali xolis ifodalarni qoʻllashni taʼminlash va tushunarlilikni oshirish.", "Yozma matnlarda tinish belgilarini toʻgʻri qoʻllash orqali matnning aniqligini va mazmuniy ravonligini taʼminlash.", "Kasbiy muloqotda grammatik qoidalarga qatʼiy rioya qilish hamda rasmiy uslubni doimiy ravishda saqlab borish."], ["Matnda nutq sofligiga putur yetkazuvchi vositalar sifatida qaysilar keltirilgan?", "Shevaga xos soʻzlar, varvarizmlar, vulgarizmlar, parazit soʻzlar va nooʻrin idoraviy soʻzlar.", "Chet tillardan olingan terminlar, yangi soʻz yasalish qoidalari va murakkab sintaktik gaplar.", "Adabiy til meʼyorlariga rioya qilish, toʻgʻri talaffuz va urgʻuni joylashtirish tartiblari.", "Ilmiy uslubdagi iboralar, qisqartmalar va rasmiy-idoraviy matnlarda ishlatiladigan soʻzlar."], ["Matnda varvarizmlar deganda nima tushuniladi va unga qanday misollar keltirilgan?", "Tilda tarjimasi mavjud boʻla turib, oʻrinsiz ishlatiladigan chet soʻzlar, masalan, \"ostanovka\" oʻrniga \"bekat\".", "Kasbiy muhitda ichki muloqotda uchrashi mumkin boʻlgan, ammo rasmiy nutqda tushunarsiz soʻzlar yigʻindisi.", "Adabiy til meʼyorlariga zid boʻlgan, maʼnaviy-axloq qoidalariga toʻgʻri kelmaydigan dagʻal iboralar.", "Tilning ichki qonun-qoidalariga muvofiq yasalmagan yangi soʻzlar boʻlib, ulardan faqat norasmiy nutqda foydalaniladi."], ["Oʻzbek tilini sohaga yoʻnaltirib oʻqitish qanday taʼlim yoʻnalishidir?", "Til bilimlarini muayyan kasb va faoliyat turi ehtiyojlari bilan bogʻlab oʻrgatishga qaratilgan yoʻnalishdir.", "Faqatgina grammatik qoidalarni chuqur oʻrganishga va adabiy tilning tarixini tadqiq etishga moʻljallangan.", "Asosan ogʻzaki nutq madaniyatini rivojlantirishga va yozma muloqotni ikkinchi darajaga tushirishga urgʻu beradi.", "Til bilimlari umumiy tayyorgarlik doirasida qolib, kasbiy kommunikatsiya bilan bogʻlanmagan yoʻnalishdir."], ["Sohaga yoʻnaltirilgan oʻqitishning asosiy maqsadi nimadan iborat?", "Boʻlajak mutaxassisning kasbiy muloqot kompetensiyasini shakllantirish, tilni kasbda samarali qoʻllash.", "Talabalarni faqat grammatik qoidalarni yodlatish va soʻz boyligini uzluksiz oshirib borishni maqsad qiladi.", "Umumiy til tayyorgarligini mustahkamlash, lekin uni kasbiy faoliyat bilan mutlaqo bogʻlamaslikni koʻzlaydi.", "Ogʻzaki nutqda sheva elementlaridan faol foydalanishni ragʻbatlantirish, rasmiy uslubni chetga surishdir."], ["Sohaga yoʻnaltirilgan oʻqitish maqsadining amaliy koʻrinishlaridan biri qaysi?", "Soha terminlarini oʻrinli qoʻllash, hujjat va matnlarni me'yor asosida tuzishni bilishdir.", "Har qanday kasbiy vaziyatda faqat adabiy tilning eng qatʼiy qoidalariga rioya etishni taʼminlashdir.", "Ilmiy yoki rasmiy fikrni faqat ogʻzaki shaklda ravon bayon etish, yozma nutqga ahamiyat bermaslikdir.", "Nutq madaniyatiga rioya qilmasdan ham oʻz fikrini erkin ifodalash imkoniyatini yaratishdir."], ["Sohaga yoʻnaltirilgan oʻqitishning asosiy vazifalaridan biri nimadan iborat?", "Adabiy til me'yorlariga tayangan holda toʻgʻri gapirish va yozish ko'nikmasini rivojlantirish.", "Faqatgina umumiy grammatik qoidalarni bilish va ularni nazariy jihatdan chuqur oʻrganishdir.", "Soha terminlarini faqat yozma shaklda qoʻllash va ularni ogʻzaki nutqda ishlatmaslikdir.", "Faqat ogʻzaki muloqotda nutq odobiga rioya qilish, yozma nutqni esa eʼtiborsiz qoldirishdir."], ["Til me'yori tushunchasining toʻgʻri taʼrifini toping.", "Adabiy til birliklarining jamiyat tomonidan toʻgʻri, maqbul va barqaror deb e'tirof etilgan qoʻllanish shaklidir.", "Har bir shaxsning oʻziga xos nutq xususiyatlari, individualligi va erkin soʻzlashuv tarzidir.", "Tilning tarixiy rivojlanishi davomida yuzaga kelgan, ammo hozirda oʻzgaruvchan qoidalar majmuidir.", "Maʼlum bir hududda keng tarqalgan sheva elementlari va mahalliy soʻzlashuv shakllari yigʻindisidir."], ["Adabiy til me'yori tilning qaysi sathlarida amal qilishi belgilangan?", "U tilning barcha sathlarida — tovush, soʻz, grammatik qurilish va uslubda amal qiladi.", "Faqatgina soʻz, grammatik qurilish hamda uslubiy jihatlarda amal qiladi, tovushlar bundan mustasno.", "Asosan fonetik va leksik sathlarda, ammo grammatik hamda uslubiy meʼyorlarga rioya etmaydi.", "Yozma nutqda aniq amal qiladi, ogʻzaki nutqda esa uning ahamiyati cheklangan hisoblanadi."], ["Leksik-semantik me'yorning asosiy vazifasi qaysi javobda toʻgʻri koʻrsatilgan?", "Soʻzlarning ma'nosiga mos, o'rinli va maqsadga muvofiq qoʻllanishini ta'minlashdan iborat.", "Soʻz va soʻz shakllarining faqat ogʻzaki nutqda toʻgʻri talaffuzini belgilab berishdir.", "Yozma nutqda tinish belgilarining toʻgʻri va oʻrinli qoʻllanishini tartibga solib borishdir.", "Gaplarning morfologik va sintaktik jihatdan toʻgʻri tuzilishini aniqlab berishdan iborat."], ["Orfoepik me'yorning asosiy maqsadi nimadan iborat?", "Ogʻzaki nutqda sheva va lahja ta'sirini kamaytirish, talaffuz xatolarining oldini olishdir.", "Soʻzlarda urgʻuning toʻgʻri qoʻyilishini belgilash va tinglovchilar fikrini oson qabul qilishdir.", "Yangi soʻzlarning tilning ichki qonun-qoidalariga muvofiq yasalishini taʼminlashga qaratilgan.", "Harflar, bosh va kichik harflar, qisqartmalarning toʻgʻri qoʻllanishini tartibga solishdir."], ["Aksentologik me'yor qaysi til jihatini tartibga soladi?", "So'zlarda urg'uning to'g'ri qo'yilishi va talaffuzda ajratib aytilishini belgilaydi.", "Soʻzlarning maʼnosiga mos, oʻrinli va maqsadga muvofiq qoʻllanishini taʼminlab beradi.", "Yozma nutqda tinish belgilarining toʻgʻri va oʻrinli qoʻllanishini tartibga soladi.", "Soʻz va soʻz shakllarining ogʻzaki nutqda adabiy til talablariga muvofiq talaffuzini."], ["Grammatik me'yor tilning qaysi jihatlarini tartibga soladi?", "Soʻz shakllari, soʻz birikmalari va gaplarning morfologik hamda sintaktik tuzilishini.", "Faqatgina soʻzlarning yozilish qoidalarini va tinish belgilarining qoʻllanishini.", "Asosan ogʻzaki nutqdagi talaffuz meʼyorlarini va urgʻu oʻrnini aniqlashni.", "Soʻzlarning maʼnosiga mos kelishini va ularning uslubiy jihatdan tanlanishini."], ["Soʻz yasalish me'yori qanday qoidalarni belgilaydi?", "Yangi soʻzlarning tilning ichki qonun-qoidalariga muvofiq yasalishini belgilaydi.", "Mavjud soʻzlarning sinonimik qatorlarini va antonimik juftliklarini shakllantirishni.", "Nutq birliklarining aloqa vaziyati, nutq turi va maqsadga mos holda tanlanishini.", "Yozma nutqda tinish belgilarining toʻgʻri va oʻrinli qoʻllanish qoidalarini aniqlaydi."], ["Imloviy me'yorning asosiy vazifasi nima?", "Soʻz va gaplarning yozma nutqda toʻgʻri yozilishini belgilash va savodxonlikni oshirish.", "Nutqning umumiy tushunarliligini taʼminlash, professional jargonni rasmiy nutqda qoʻllash.", "Harflar, bosh va kichik harflar, qisqartmalarni toʻgʻri qoʻllashni tartibga solish.", "Soʻzlarning maʼnosiga mos, oʻrinli va maqsadga muvofiq qoʻllanishini taʼminlab berish."], ["Grafik me'yor qaysi yozuv jihatlarini tartibga soladi?", "Harflar, bosh va kichik harflar, qisqartmalar hamda yozuv shakllarining toʻgʻri qoʻllanishini.", "Yozma nutqda tinish belgilarining toʻgʻri va oʻrinli qoʻllanishi bilan bogʻliq qoidalarni.", "Soʻz va soʻz shakllarining ogʻzaki nutqda adabiy til talablariga muvofiq talaffuzini.", "Nutq birliklarining aloqa vaziyati, nutq turi va maqsadga mos holda tanlanishini."], ["Uslubiy me'yor nutqning qaysi jihatini ta'minlaydi?", "Nutq birliklarining aloqa vaziyati, nutq turi va maqsadga mos holda tanlanishini ta'minlaydi.", "Faqat ilmiy-texnik matnlarda grammatik aniqlikni taʼminlash va rasmiy uslubni cheklashdir.", "Ogʻzaki nutqda sheva elementlarining erkin qoʻllanishi va adabiy tilni soddalashtirishdir.", "Yozma nutqda tinish belgilarining toʻgʻri ishlatilishini va imlo qoidalariga rioyani."], ["Punktuatsion me'yorning asosiy vazifasi nimadan iborat?", "Yozma nutqda tinish belgilarining toʻgʻri va oʻrinli qoʻllanishini belgilab berishdir.", "Soʻzlarning maʼnosiga mos, oʻrinli va maqsadga muvofiq qoʻllanishini taʼminlaydi.", "Soʻz va soʻz shakllarining ogʻzaki nutqda toʻgʻri talaffuzini tartibga solib boradi.", "Nutq birliklarining aloqa vaziyati, nutq turi va maqsadga mos holda tanlanishini."], ["Nutqning sofligi deganda nimani tushunasiz?", "Adabiy til va jamiyatdagi ma'naviy-axloq qoidalariga yot unsurlardan xoli boʻlishdir.", "Faqat adabiy tilning grammatik qoidalariga toʻliq rioya qilishni taʼminlashdir.", "Nutqda chet tillardan kirgan soʻzlarni faqatgina ilmiy maqsadlarda qoʻllashdir.", "Sheva elementlarini va jargonni har qanday nutq vaziyatida erkin ishlatishdir."], ["Varvarizmlarga berilgan misollardan qaysi biri toʻgʻri?", "Tilda tarjimasi mavjud boʻla turib, oʻrinsiz ishlatiladigan chet soʻzlar, masalan, “svet” oʻrniga “chiroq”.", "Faqatgina rasmiy nutqda qoʻllanadigan, maxsus maʼnoga ega boʻlmagan, eskirgan iboralar.", "Shevaga xos boʻlgan, ammo adabiy tilda qabul qilinmaydigan soʻzlar va iboralar.", "Maʼlum bir professional guruh doirasida qoʻllanadigan, umumxalq tushunmaydigan jargon."], ["Mutaxassis nutq madaniyatining muhim koʻrsatkichi sifatida nimani bilish talab etiladi?", "Til me'yorlarini nazariy bilish bilan birga, ularni kasbiy vaziyatlarda amalda qoʻllay olish.", "Faqat adabiy til meʼyorlarini chuqur nazariy bilish va ularni amaliyotda qoʻllamaslik.", "Professional terminologiyadan chetga chiqmasdan, sheva elementlaridan foydalanish.", "Ogʻzaki nutqda faqat jargondan foydalanish va yozma nutqda standart qoidalarni buzish."], ["Sohaga yo'naltirib o'qitish natijasida til bilimlari qanday shaklga kirishi aytilgan?", "Natijada til bilimlari amaliy kasbiy kompetensiyaga aylanadi, muloqot samaradorligini oshiradi.", "Faqat nazariy bilimlar toʻplami boʻlib qoladi, amaliy vaziyatlarda qoʻllash imkoni boʻlmaydi.", "Faqatgina kasbiy terminologiyani oʻzlashtirishga yordam beradi, umumiy til koʻnikmalarini hisobga olmasdan.", "Talabaning shaxsiy nutq uslubini rivojlantirishga olib keladi, ammo meʼyorlardan chetga chiqadi."], ["Oʻzbek-lotin yozuviga asoslangan imlo qoidalari qaysi yilda tasdiqlangan?", "Oʻzbekiston Respublikasi Vazirlar Mahkamasining 1995-yil 24-avgustdagi qarori bilan tasdiqlangan.", "Oʻzbekiston Respublikasi Prezidentining 1996-yil 15-sentabrdagi farmoni asosida qabul qilingan.", "Oliy Majlis tomonidan 2000-yil 12-iyuldagi qonun bilan amaliyotga joriy etilgan.", "Madaniyat va sport vazirligining 1998-yil 3-martdagi buyrugʻi bilan kuchga kirgan."], ["Oʻzbek-lotin yozuviga asoslangan amaldagi imlo qoidalari nechta boʻlim va qoidani oʻz ichiga oladi?", "Mazkur imlo qoidalari 7 ta boʻlimdan va jami 82 ta qoidadan iboratdir.", "Ushbu imlo qoidalari 6 ta boʻlimni hamda 75 ta alohida qoidani oʻz ichiga oladi.", "Qabul qilingan imlo qoidalari 8 ta boʻlimni hamda 90 ta asosiy qoidani qamrab oladi.", "Oʻzbek-lotin yozuvi imlo qoidalari 5 ta boʻlimni va 68 ta muhim qoidani oʻz ichiga oladi."], ["Qoʻshimcha qoʻshilishi natijasida asos tarkibidagi unli tovushda qanday oʻzgarish kuzatilishi mumkin?", "Asosdagi \"a\" unlisi ayrim hollarda \"o\" tovushiga aylanib, yozuvda ham \"o\" bilan ifodalanadi.", "Asosdagi \"i\" unlisi aksariyat hollarda \"u\" tovushiga oʻzgarib, yozuvda \"u\" bilan aks ettiriladi.", "Asosdagi \"e\" unlisi baʼzan \"a\" tovushiga oʻzgarib, talaffuzda va yozuvda \"a\" shaklini oladi.", "Asosdagi \"u\" unlisi ayrim holatlarda \"i\" tovushiga oʻzgarib, yozuvda \"i\" bilan aks ettiriladi."], ["Qaysi olmoshlarga -da, -dan, -day, -dagi qoʻshimchalari qoʻshilganda \"n\" tovushi orttiriladi?", "U, bu, shu, oʻsha kabi koʻrsatish olmoshlariga qoʻshilganda \"n\" tovushi orttiriladi.", "Men, sen, u, biz kabi kishilik olmoshlariga qoʻshilganda \"n\" tovushi orttiriladi.", "Har kim, har narsa, hech kim kabi gumon olmoshlariga qoʻshilganda \"n\" tovushi orttiriladi.", "Kim, nima, qayer kabi soʻroq olmoshlariga qoʻshilganda \"n\" tovushi orttiriladi."], ["Qabulxona, tabriknoma, orombaxsh, kamquvvat kabi soʻzlar qoʻshma ot yoki sifat hisoblanib, nima uchun ular qoʻshib yoziladi?", "Bu turdagi birliklar ikki yoki undan ortiq qism bitta tushunchani ifodalagani uchun yaxlit yoziladi.", "Ular tarkibidagi birinchi qism har doim mustaqil soʻz boʻlib kelgani uchun qoʻshib yozilishi shart.", "Ushbu soʻzlar fonetik oʻzgarishlarga uchrab, yangi maʼno kasb etgani sababli yagona yoziladi.", "Grafik jihatdan ularning qismlarini ajratish talaffuzda qiyinchilik tugʻdirgani uchun yagona yoziladi."], ["Juft va takror soʻz qismlari, shuningdek, -ma, -ba vositalari yordamida tuzilgan birliklar qanday yoziladi?", "Juft va takror soʻz qismlari, -ma, -ba vositali birliklar har doim chiziqcha bilan yoziladi.", "Juft va takror soʻz qismlari ajratib yoziladi, -ma, -ba vositali birliklar esa qoʻshib yoziladi.", "Bunday soʻzlar faqat qatʼiy qoidalar asosida qoʻshib yoziladi, chiziqcha bilan yozish istisnodir.", "Juft va takror soʻz qismlari koʻpincha qoʻshib yoziladi, -ma, -ba vositali birliklar ajratib yoziladi."], ["Arab raqamlari bilan yozilgan tartib sonlarda chiziqcha qanday holatlarda ishlatiladi?", "5-sinf, 2-mart kabi sanalar va tartib sonlarni ifodalashda chiziqcha qoʻllaniladi.", "Faqat bir xonali raqamlar bilan yozilgan tartib sonlarda chiziqcha ishlatilishi shartdir.", "Aslida bunday holatlarda chiziqcha ishlatilmaydi, raqam va soʻz ajratib yoziladi.", "Chiziqcha faqat muddatlarni koʻrsatishda, masalan, 2010-2020-yillar kabi ishlatiladi."], ["Qaysi yuklamalar oʻzidan oldingi soʻzdan chiziqcha bilan ajratilib yozilishi mumkin?", "-u (-yu), -da, -ku, -chi kabi yuklamalar ayrim holatlarda chiziqcha bilan ajratiladi.", "-mi, -chi, -qani, -oʻ kabi soʻroq yuklamalari har doim chiziqcha bilan yoziladi.", "-gina, -roq, -cha kabi kichraytirish va qiyoslash yuklamalari chiziqcha bilan ajratiladi.", "-lar, -ni, -dan kabi egalik va kelishik qoʻshimchalari yuklamalar bilan birga ajratiladi."], ["Bosh harflar imlosi yulduzlar, sayyoralar va boshqa osmon jismlarining atoqli otlari uchun qanday qoʻllaniladi?", "Hulkar, Qavs kabi osmon jismlarining atoqli otlari bosh harf bilan yoziladi.", "Yulduz va sayyoralar nomi umumiy ot sifatida kichik harf bilan yozilishi lozim.", "Faqat Quyosh, Oy, Yer kabi nomlar bosh harf bilan yoziladi, qolganlari kichik harf bilan yoziladi.", "Astronomiyada qoʻllaniladigan barcha atamalar bosh harf bilan yozilishi shart qilib qoʻyilgan."], ["Madaniy-maishiy va savdo korxonalari, transport vositalari nomlarida bosh harflar qanday ishlatiladi?", "Nom tarkibidagi birinchi soʻz bosh harf bilan yoziladi, masalan: \"Fan va texnika davlat qo'mitasi\".", "Har bir soʻz bosh harf bilan yoziladi, masalan: \"Fan Va Texnika Davlat Qo'mitasi\".", "Faqat bir kishilik nomlar bosh harf bilan yoziladi, korxona nomlari esa kichik harf bilan yoziladi.", "Nomlar tirnoq ichida berilgan hollarda bosh harf ishlatilmaydi, faqat tirnoq oʻzi kifoya."], ["Oʻzbek-lotin yozuvida tutuq belgisi unli tovushdan keyin kelganda qanday vazifani bajaradi?", "Unli tovushning choʻziqroq talaffuz qilinishini bildiradi, masalan: ta'til, she'r, me'mor.", "Undosh tovushning oldidagi unlini undan ajratib talaffuz qilishga xizmat qiladi.", "Soʻz oxiridagi undosh tovushning kuchliroq boʻgʻin hosil qilishini ifodalaydi.", "Ikkita yonma-yon kelgan unli tovushni alohida-alohida oʻqishni taʼminlaydi, masalan: aeroport."], ["Oʻzbek-lotin yozuvida tutuq belgisi undosh tovushdan keyin kelganda qanday vazifani bajaradi?", "Unlini undoshdan ajratib talaffuz qilishga xizmat qiladi, masalan: san'at, jur'at, qat'iy.", "Undosh tovushni yumshoqroq talaffuz qilishni bildiradi, masalan: do'st, mo'min.", "Unli tovushni qisqaroq talaffuz etishni koʻrsatadi va soʻzni tezroq oʻqishga yordam beradi.", "Soʻzning grammatik shaklini oʻzgartirish uchun ishlatiladi, masalan: otning koʻplik shakli."], ["Asos va qoʻshimchalar imlosi nimalarni toʻgʻri ifodalashni talab qiladi?", "Soʻzga qoʻshimchalar qoʻshilganda yuz beradigan tovush va harf oʻzgarishlarini toʻgʻri ifodalashni talab qiladi.", "Faqat bir necha turdagi qoʻshimchalar qoʻshilganda yuzaga keladigan oʻzgarishlarni toʻgʻri ifodalashni talab qiladi.", "Soʻzning maʼno oʻzgarishlarini aks ettiruvchi harf birikmalarini faqatgina toʻgʻri yozishni talab qiladi.", "Tovushlarning grammatik funktsiyalarini aniqlashda yordam beruvchi belgilarni toʻgʻri qoʻllashni talab qiladi."], ["Qoʻshma soʻzlarning yozilishida xona, noma, poya, bop, xush, baxsh, kam, unum kabi qismlar nima uchun qoʻshib yoziladi?", "Bu qismlar yordamida yasalgan qoʻshma ot va sifatlarning bir tushunchani ifodalashini belgilash uchun qoʻshib yoziladi.", "Bu qismlar mustaqil soʻz maʼnosiga ega boʻlmagani sababli doim asosiy soʻzga qoʻshib yoziladi.", "Bu qismlar bilan yasalgan qoʻshma soʻzlar faqat fonetik jihatdan bir butunlikni tashkil etgani uchun qoʻshib yoziladi.", "Bu qismlar oʻzbek tilida qadimdan qadimiy yozuv meʼyorlariga koʻra qoʻshib yozilish odatiga ega."], ["Qaysi turdagi soʻzlarga qoʻshimcha qoʻshish orqali hosil qilingan ayrim ot va feʼllar ham qoʻshib yoziladi?", "Pirpirak (pir-pir+ak) va hayhaylamoq (hay-hay+la) kabi takror-taqlid soʻzlarga qoʻshimcha qoʻshganda qoʻshib yoziladi.", "Kelishik qoʻshimchalari qabul qilgan asoslarga, masalan, ishchi+lar, kitob+dan kabi soʻzlar qoʻshib yoziladi.", "Sifatlarning daraja shakllari hosil qilinganda, masalan, goʻzal+roq, baland+roq kabi soʻzlar qoʻshib yoziladi.", "Oʻrin-payt holati qoʻshimchalari bilan tugagan feʼllarga, masalan, kel+ganda, bor+gach kabi soʻzlar qoʻshib yoziladi."], ["Olaqargʻa, achchiqtosh kabi qoʻshma otlar nima asosida qoʻshib yoziladi?", "Narsaning rangi, mazasi yoki oʻziga xos belgisi asosida nomlanganligi sababli qoʻshib yoziladi.", "Bu turdagi qoʻshma otlar faqat bir boʻgʻindan iborat boʻlganligi uchun doimo qoʻshib yoziladi.", "Ular tarixiy rivojlanish jarayonida birikib, maʼnosi oʻzgarganligi bois qoʻshib yoziladi.", "Bu kabi otlar frazeologik birliklar tarkibiga kirganligi sababli yagona holatda yoziladi."], ["Qaysi qoʻshimchalar \"k\" tovushi bilan tugagan soʻzlarga qoʻshilganda \"g\" tovushi \"k\" tarzida aytiladi va yoziladi?", "-ga, -gach, -guncha, -gacha, -gudek kabi qoʻshimchalar qoʻshilganda \"k\" tovushi \"g\" tarzida aytiladi.", "-lar, -siz, -lik, -dosh kabi qoʻshimchalar qoʻshilganda \"k\" tovushi \"g\" ga oʻzgarishi kuzatiladi.", "-ning, -dan, -da, -ga kabi kelishik qoʻshimchalari qoʻshilganda \"k\" tovushi \"g\" ga aylanadi.", "-chan, -chi, -bon, -kor kabi kasb-hunar bildiruvchi qoʻshimchalar \"k\" tovushini \"g\" ga oʻzgartiradi."], ["Tutuq belgisi \"sh\" va \"ch\" harflari orasiga qoʻyilishi qanday holatlarda kuzatiladi?", "Ikki alohida tovushni ifodalagan holatlarda, masalan: Is'hoq, as'hob, as'har kabi soʻzlarda.", "Soʻzda jarangli va jarangsiz undoshlar yonma-yon kelganda, masalan: boshqarish.", "Qoʻshma soʻzlar tarkibida harf birikmalarini ajratish uchun, masalan: ish'chi.", "Bosh boʻgʻin urgʻu qabul qilganda va keyingi boʻgʻin unli bilan boshlanganda, masalan: to'shak."], ["Tutuq belgisining asosiy vazifasi faqat yozuv belgisi boʻlib qolmasdan yana nimani koʻrsatadi?", "Soʻzning toʻgʻri oʻqilishi va talaffuz qilinishini koʻrsatadigan vosita vazifasini ham bajaradi.", "Faqatgina soʻzlarning maʼno nozikliklarini ajratishga yordam beruvchi grafik vosita hisoblanadi.", "Asosan soʻzlarning grammatik shakllarini aniqlashda muhim ahamiyatga ega boʻlgan belgi hisoblanadi.", "Yozma nutqda urgʻuni aniq koʻrsatish va soʻzning sintaktik aloqasini ifodalash uchun qoʻllaniladi."], ["Imlo qoidalarini puxta egallash ayniqsa qaysi sohada muhimdir?", "Kasbiy va rasmiy yozishmalarda mazmunning aniq yetkazilishi hamda mutaxassis savodxonligi uchun muhim.", "Badiiy adabiyotda, sheʼriyatda va publitsistikada soʻzning stilistik tusini oshirish uchun muhim.", "Ogʻzaki nutqda talaffuz meʼyorlarini saqlash va dialektik xususiyatlarni aniqlash uchun muhim.", "Bolalar bogʻchasi va boshlangʻich sinflarda oʻqitish jarayonida xatlarni chiroyli yozish uchun muhim."], ["Oʻzbek tilining lotin yozuviga asoslangan amaldagi imlo qoidalari qaysi sana va qaror bilan tasdiqlangan?", "1995-yil 24-avgustda Vazirlar Mahkamasining 339-sonli qarori bilan tasdiqlangan.", "1994-yil 15-sentyabrda Prezident farmoyishining 210-sonli hujjati orqali tasdiqlangan.", "1996-yil 10-iyulda Xalq ta'limi vazirligi buyrugʻining 125-sonli qarori bilan tasdiqlangan.", "1997-yil 5-oktyabrda Oliy Majlis qarorining 400-sonli hujjati orqali mustahkamlangan."], ["Lotin-oʻzbek yozuviga asoslangan imlo qoidalari tarkibida nechta boʻlim va qoida mavjud?", "Mazkur imlo qoidalari 7 boʻlim va jami 82 ta alohida qoidani oʻz ichiga oladi.", "Ushbu imlo qoidalari 5 boʻlimdan tashkil topgan boʻlib, ularda 60 ta qoida mavjuddir.", "Berilgan imlo qoidalari 8 ta alohida boʻlimni va 95 ta aniq qoidani oʻzida mujassam etadi.", "Imlo qoidalarida 6 ta boʻlim va umumiy hisobda 75 ta me'yoriy qoida keltirilgan."], ["Yozma nutqning savodli va bir xil shaklda qoʻllanishini ta'minlashda imlo qoidalarining asosiy maqsadi nimadan iborat?", "Yozma nutqning bir xilligi, aniqligi va umumiy savodxonligini me'yoriy tartibga solish.", "Ogʻzaki nutqning ravonligi va ifodaliligini ta'minlash hamda tushunarliligini oshirish.", "Badiiy adabiyotda soʻzlarni stilistik jihatdan boyitish va grammatik xatolarni oldini olish.", "Ilmiy-texnik terminologiyani standartlashtirish hamda professional yozishmalarni rivojlantirish."], ["Asos va qoʻshimchalar imlosi qoidalariga koʻra, 'a' unlisi bilan tugagan soʻzlarga -v, -q, -qi qoʻshimchalari qoʻshilganda qanday oʻzgarish yuz beradi?", "Asosdagi 'a' tovushi 'o' tarzida aytilib, yozuvda ham 'o' bilan ifodalanadi ('sayla+v' → 'saylov').", "Asosdagi 'a' tovushi oʻzgarishsiz qoladi, faqat qoʻshimcha 'y' oraliq tovushi bilan birikadi.", "Asosdagi 'a' tovushi 'u' tarzida talaffuz etiladi, ammo yozuvda 'a' shaklida saqlanib qoladi.", "Asosdagi 'a' tovushi 'i' ga oʻzgaradi va qoʻshimcha undoshga moslashib, yangi shakl hosil qiladi."], ["Oʻzbek imlosida 'u, bu, shu, o'sha' olmoshlariga -da, -dan, -day, -dagi qoʻshimchalari qoʻshilganda qanday holat kuzatiladi?", "Olmosh va qoʻshimcha orasiga 'n' tovushi orttiriladi: unday, shunda, o'shandagi kabi.", "Qoʻshimchaning boshlangʻich undoshi oʻzgarmaydi va olmosh bilan toʻgʻridan-toʻgʻri birikadi.", "Olmoshning oxirgi unlisi tushib qoladi, soʻngra qoʻshimcha hech qanday tovushsiz birikadi.", "Qoʻshimcha boshidagi undosh oʻzidan oldingi olmoshning oxirgi tovushiga moslashadi."], ["'k' tovushi bilan tugagan soʻzlarga -ga, -gach, -guncha, -gacha, -gudek kabi qoʻshimchalar qoʻshilganda qanday yozish qoidasi amal qiladi?", "Qoʻshimcha boshidagi 'g' tovushi 'k' tarzida aytilishi va yozilishi bilan ifodalanadi.", "Asosdagi 'k' tovushi 'x' tarzida oʻzgaradi, qoʻshimcha esa oʻzgarmasdan qoʻshilib ketadi.", "Qoʻshimcha boshidagi 'g' tovushi 'q' tarzida yozilib, talaffuzda 'k' tovushi saqlanib qoladi.", "Asosdagi 'k' tovushi tushib qoladi, faqat qoʻshimcha toʻgʻridan-toʻgʻri soʻzga birikadi."], ["Qoʻshma soʻzlarning qoʻshib yozilishiga oid qoidalarga koʻra, 'xona, noma, poya, bop, xush, baxsh, kam, unum' kabi qismlar qanday yoziladi?", "Bu qismlar yordamida yasalgan qoʻshma ot va sifatlar asos bilan birgalikda qoʻshib yoziladi.", "Ushbu qismlar doim chiziqcha bilan ajratilib yoziladi, ularni birlik sifatida koʻrsatmaydi.", "Yuqoridagi qismlar asosdan alohida yoziladi, chunki ular mustaqil ma'noga ega boʻladi.", "Ba'zi hollarda qoʻshib yozilsa, ba'zida ajratib yoziladi, muayyan qoidalarga asoslanmaydi."], ["Takror-taqlid soʻzlarga qoʻshimcha qoʻshish orqali hosil boʻlgan ayrim ot va fe'llar qanday yoziladi?", "Ular pirpirak ('pir-pir + ak'), hayhaylamoq ('hay-hay + la') kabi qoʻshib yoziladi.", "Bunday soʻzlar faqat chiziqcha bilan birikadi, ular mustaqil boʻgʻinlar sifatida koʻriladi.", "Bu turdagi soʻzlar asosan ajratib yoziladi, faqat ayrim istisnolarda qoʻshib yozilishi mumkin.", "Takror-taqlid soʻzlar hech qanday qoʻshimcha qabul qilmaydi, asl shaklida qoladi."], ["Narsaning rangi, mazasi yoki oʻziga xos belgisi asosida nomlangan ayrim qoʻshma otlar qanday yoziladi?", "Ular olaqarg'a, achchiqtosh kabi birliklar misolida qoʻshib yoziladi.", "Bunday soʻzlar doimo ajratib yoziladi, chunki ular ikki mustaqil soʻzning birikmasidir.", "Bu turdagi soʻzlar har doim chiziqcha yordamida bogʻlanadi, masalan, ola-qargʻa.", "Ular faqatgina birinchi qismi katta harf bilan, ikkinchisi kichik harf bilan yoziladi."], ["Juft va takror soʻz qismlari Oʻzbek imlosida qanday yoziladi?", "Ular 'uy-roʻzgʻor', 'baland-baland' kabi chiziqcha yordamida bogʻlanib yoziladi.", "Bu turdagi soʻzlar har doim qoʻshib yoziladi, ularni bir butun soʻz sifatida ifodalaydi.", "Ular ajratib yoziladi, har bir qism mustaqil soʻz sifatida alohida koʻrsatiladi.", "Faqat birinchi qismi bosh harf bilan yoziladi, ikkinchisi kichik harf bilan yoziladi."], ["-ma, -ba vositalari yordamida tuzilgan ayrim birliklar chiziqcha bilan yozilishiga misol keltiring.", "Koʻchama-koʻcha, qadam-baqadam kabi soʻzlar chiziqcha bilan yoziladi.", "Bunday birliklar doimiy ravishda qoʻshib yoziladi, ularning orasiga chiziqcha qoʻyilmaydi.", "Bu turdagi birliklar ajratib yoziladi, ular ikki mustaqil soʻzning birikmasi hisoblanadi.", "Faqat 'ma' bilan tugaganlar chiziqcha bilan yoziladi, 'ba' bilan tugaganlar qoʻshib yoziladi."], ["Arab raqamlari bilan yozilgan tartib sonlar qanday yoziladi?", "Ular 5-sinf, 2-mart kabi chiziqcha yordamida yoziladi.", "Ular ajratib yoziladi, raqam va soʻz oʻrtasida boʻsh joy qoldiriladi.", "Ular faqat qoʻshib yoziladi, raqam va soʻz bir butunlikni tashkil etadi.", "Tartib sonlar har doim soʻzlar bilan toʻliq yoziladi, raqamlardan foydalanilmaydi."], ["-u (-yu), -da, -ku, -chi kabi yuklamalar ayrim holatlarda qanday yoziladi?", "Ular 'bordim-ku, sen-chi' misollarida koʻrsatilganidek, chiziqcha bilan ajratiladi.", "Yuklamalar har doim oʻzidan oldingi soʻzga qoʻshib yoziladi, ular ajratilmaydi.", "Ular oʻzidan oldingi soʻzdan alohida yoziladi, ammo orasida hech qanday belgi boʻlmaydi.", "Faqat -u (-yu) yuklamasi chiziqcha bilan yoziladi, qolganlari esa qoʻshib yoziladi."], ["Yulduzlar, sayyoralar va boshqa osmon jismlarining atoqli otlari Oʻzbek imlosida qanday yoziladi?", "Ular 'Hulkar', 'Qavs' kabi misollarda koʻrsatilganidek, bosh harf bilan yoziladi.", "Osmon jismlarining otlari kichik harf bilan yoziladi, faqat jumla boshida katta boʻlishi mumkin.", "Bu otlar faqat ilmiy matnlarda bosh harf bilan yoziladi, umumiy holatda kichik harfdir.", "Ular qoʻshma soʻz boʻlganligi sababli chiziqcha bilan yoziladi, masalan, Hulkar-Yulduz."], ["Madaniy-maishiy va savdo korxonalari, transport vositalari nomlarida bosh harf imlosi qanday qoʻllaniladi?", "“Navro'z” xayriya jamg'armasi, “Paxtakor” stadioni kabi nomlar bosh harf bilan yoziladi.", "Bunday nomlarda faqat nomning birinchi soʻzi bosh harf bilan yoziladi, qolganlari kichik boʻladi.", "Korxona va tashkilot nomlari toʻliq kichik harflar bilan yoziladi, rasmiyatchilikda oʻzgaradi.", "Ular faqat matnning sarlavha qismida bosh harf bilan yozilishi shart qilib qoʻyiladi."], ["Vazirlik, idora, korxona va tashkilot nomlarida bosh harf imlosi qanday qoʻllaniladi?", "Nom tarkibidagi birinchi soʻz bosh harf bilan yoziladi ('Fan va texnika davlat qo'mitasi').", "Ushbu turdagi barcha nomlar toʻliq bosh harflar bilan yozilishi majburiy hisoblanadi.", "Faqat bir soʻzli nomlar bosh harf bilan yoziladi, koʻp soʻzli nomlar kichik harf bilan yoziladi.", "Bu nomlar asosan chiziqcha bilan yoziladi, har bir qismning bosh harfi katta boʻladi."], ["Oʻzbek-lotin yozuvida tutuq belgisi (apostrof) unli tovushdan keyin kelganda qanday vazifani bajaradi?", "U unli tovushning choʻziqroq talaffuz qilinishini bildiradi: ta'til, she'r, me'mor.", "U unli tovushning qisqa va qattiq talaffuz qilinishini ta'minlab, ajralishni koʻrsatadi.", "Tutuq belgisi unli tovushni mutlaqo oʻzgartiradi, uni boshqa tovushga aylantiradi.", "U undosh tovushga urgʻu berish uchun ishlatiladi, unli tovushga ta'siri yoʻq."], ["Tutuq belgisi (apostrof) undosh tovushdan keyin kelganda qanday vazifani bajaradi?", "U unlini undoshdan ajratib talaffuz qilishga xizmat qiladi: san'at, jur'at, qat'iy.", "U undosh tovushni yumshoq qilib talaffuz etishni ta'minlaydi, unli tovushga ta'sir qilmaydi.", "Tutuq belgisi undosh tovushni ikki marta takrorlashni anglatadi, bu jaranglilikni oshiradi.", "U undosh tovushdan keyingi unlini tushirib qoldirishga olib keladi, qisqartma hosil qiladi."], ["Qaysi holatda 'sh' harflari orasiga tutuq belgisi qoʻyilishi qayd etilgan?", "'Sh' harflari ikki alohida tovushni ifodalagan holatlarda (Is'hoq, as'hob, as'har).", "Faqat 'sh' harfi soʻzning boshida kelganda, uning talaffuzini yumshatish uchun.", "Ikki 'sh' harfi yonma-yon kelib, bitta tovushni ifodalaganda, ularni ajratish maqsadida.", "'Sh' harfi oldidan yoki keyin undosh tovush kelsa, urgʻu berish uchun ishlatiladi."], ["Tutuq belgisi oʻzbek-lotin yozuvida qanday muhim vazifalarni bajaradi?", "Soʻzning toʻgʻri oʻqilishi va talaffuzini koʻrsatuvchi vosita hamda yozuv belgisi.", "Soʻz turkumlarini bir-biridan ajratishda asosiy grammatik koʻrsatkich vazifasini bajaradi.", "Soʻzlarning emotsional yukini kuchaytirishda stilistik vosita sifatida qoʻllaniladi.", "Faqatgina ilmiy atamalarni qisqartirishda ishlatiladigan rasmiy imlo belgisidir."], ["Taqdimot materialida 'Tinish belgilarining qoʻllanilishi' boʻlimi haqida qanday ma'lumot berilgan?", "Rejada bor, ammo alohida qoidalar va misollar slaydlarda kengaytirilmagan.", "Bu boʻlim toʻliq hajmda taqdimotda yoritilgan, barcha qoidalar batafsil izohlangan.", "Tinish belgilari umuman koʻrib chiqilmagan, chunki ular imlo qoidalariga kirmaydi.", "Faqat jumla boshidagi va oxiridagi tinish belgilari haqida qisqacha ma'lumot berilgan."], ["Oʻzbek tilining lotin yozuviga asoslangan amaldagi imlo qoidalari Oʻzbekiston Respublikasi Vazirlar Mahkamasining qaysi qarori bilan tasdiqlangan?", "1995-yil 24-avgustdagi 339-sonli qarori bilan toʻliq tasdiqlangan va joriy etilgan.", "1994-yil 21-avgustdagi 321-sonli qarori bilan bir qism oʻzgarishlar kiritilib tasdiqlangan.", "1996-yil 15-sentyabrdagi 345-sonli qarori bilan qisman kuchga kiritilgan edi.", "1997-yil 10-iyuldagi 350-sonli qarori bilan yangi tahrirda qabul qilingan."], ["Lotin-oʻzbek yozuviga asoslangan imlo qoidalari jami nechta boʻlim va nechta qoidani oʻz ichiga oladi, aniq koʻrsating?", "Ushbu imlo qoidalari tarkibida 7 ta boʻlim hamda 82 ta alohida qoida mavjud.", "Bu imlo qoidalari jami 6 ta boʻlim hamda 78 ta batafsil qoidani oʻz ichiga oladi.", "Taqdim etilgan imlo qoidalari 8 ta boʻlim va 85 ta turli qoidalarni jamlagan.", "Qabul qilingan imlo qoidalari 5 ta boʻlim hamda 75 ta asosiy qoidadan iborat."], ["Qaysi qoʻshimchalar qoʻshilganda asosdagi 'a' unlisi 'o' tarzida aytilib, yozuvda ham 'o' bilan ifodalanadi?", "-v, -q, -qi qoʻshimchalari qoʻshilganda asosdagi 'a' 'o' ga oʻzgarishi kuzatiladi.", "-da, -dan, -day qoʻshimchalari qoʻshilganda asosdagi 'a' 'o' ga oʻzgarishi kuzatiladi.", "-gan, -gach, -guncha qoʻshimchalari qoʻshilganda asosdagi 'a' 'o' ga oʻzgarishi kuzatiladi.", "-ma, -ba, -li qoʻshimchalari qoʻshilganda asosdagi 'a' 'o' ga oʻzgarishi kuzatiladi."], ["'u, bu, shu, oʻsha' olmoshlariga -da, -dan, -day, -dagi qoʻshimchalari qoʻshilganda qaysi tovush orttiriladi?", "Mazkur olmoshlarga koʻrsatilgan qoʻshimchalar qoʻshilganda 'n' tovushi orttiriladi.", "Mazkur olmoshlarga koʻrsatilgan qoʻshimchalar qoʻshilganda 'y' tovushi orttiriladi.", "Mazkur olmoshlarga koʻrsatilgan qoʻshimchalar qoʻshilganda 'm' tovushi orttiriladi.", "Mazkur olmoshlarga koʻrsatilgan qoʻshimchalar qoʻshilganda 'v' tovushi orttiriladi."], ["'k' tovushi bilan tugagan soʻzlarga -ga, -gach, -guncha, -gacha, -gudek kabi qoʻshimchalar qoʻshilganda qanday fonetik oʻzgarish yuz beradi?", "Qoʻshimcha boshidagi 'g' tovushi 'k' tarzida aytiladi va yozuvda aks etadi.", "Qoʻshimcha boshidagi 'g' tovushi 'x' tarzida aytiladi va yozuvda aks etadi.", "Qoʻshimcha boshidagi 'g' tovushi 'q' tarzida aytiladi va yozuvda aks etadi.", "Qoʻshimcha boshidagi 'g' tovushi 'ch' tarzida aytiladi va yozuvda aks etadi."], ["Qabulxona, tabriknoma, orombaxsh, kamquvvat kabi qoʻshma soʻzlar qaysi qismlar yordamida yasalganligi ta'kidlangan?", "Xona, noma, poya, bop, xush, baxsh, kam, unum kabi qismlar bilan yasalgan.", "Bosh, oʻrin, bir, ikki, uch, toʻrt, besh, olti kabi qismlar bilan yasalgan.", "Togʻ, suv, havo, yer, osmon, daraxt, oʻsimlik kabi qismlar bilan yasalgan.", "Qizil, koʻk, yashil, oq, qora, sariq, jigarrang kabi qismlar bilan yasalgan."], ["Takror-taqlid soʻzlarga qoʻshimcha qoʻshish orqali hosil qilingan ayrim ot va fe'llar qanday yoziladi?", "Bu turdagi soʻzlar, masalan, pirpirak, hayhaylamoq kabi, qoʻshib yoziladi.", "Bu turdagi soʻzlar, masalan, pir-pirak, hay-haymoq kabi, ajratib yoziladi.", "Bu turdagi soʻzlar, masalan, pir-pir-ak, hay-hay-lamoq kabi, chiziqcha bilan yoziladi.", "Bu turdagi soʻzlar, masalan, pirpir + ak, hayhay + la kabi, qisqartirib yoziladi."], ["Narsaning rangi, mazasi yoki oʻziga xos belgisi asosida nomlangan ayrim qo'shma otlarga qaysi misollar keltirilgan?", "Olaqargʻa, achchiqtosh kabi qoʻshma otlar qoʻshib yozilishini talab qiladi.", "Qora suv, shirin olma kabi qoʻshma otlar ajratib yozilishini talab qiladi.", "Qizil-gul, asal-tosh kabi qoʻshma otlar chiziqcha bilan yozilishini talab qiladi.", "Yashil-daraxt, moviy-osmon kabi qoʻshma otlar yonma-yon yozilishini talab qiladi."], ["Juft va takror so'z qismlari oʻrtasida qaysi tinish belgisi yordamida bogʻlanadi?", "Ular uy-roʻzgʻor, besh-oltita, baland-baland kabi chiziqcha bilan bogʻlanadi.", "Ular uy roʻzgʻor, besh oltita, baland baland kabi ajratib yozish orqali bogʻlanadi.", "Ular uy+roʻzgʻor, besh+oltita, baland+baland kabi plyus belgisi bilan bogʻlanadi.", "Ular uy~roʻzgʻor, besh~oltita, baland~baland kabi tilda belgisi bilan bogʻlanadi."], ["-ma, -ba vositalari yordamida tuzilgan birliklarga qaysi misollar keltirilgan va ular qanday yoziladi?", "Koʻchama-koʻcha, qadam-baqadam kabi birliklar chiziqcha bilan yoziladi.", "Koʻcha ma koʻcha, qadam ba qadam kabi birliklar ajratib yoziladi.", "Koʻchama koʻcha, qadam baqadam kabi birliklar qoʻshib yoziladi.", "Koʻcha-ma-koʻcha, qadam-ba-qadam kabi birliklar ikki chiziqcha bilan yoziladi."], ["Arab raqamlari bilan yozilgan tartib sonlarda chiziqcha qaysi holatlarda ishlatiladi?", "5-sinf, 2-mart kabi sanalar va sinflar raqamlari bilan birga ishlatiladi.", "Faqatgina pul miqdorini ifodalashda arab raqamlari bilan birga ishlatiladi.", "Vaqtni belgilashda, masalan, 10-00, 15-30 kabi holatlarda ishlatiladi.", "Telefon raqamlari yozuvida, masalan, 99-888-77-66 kabi holatlarda ishlatiladi."], ["-u (-yu), -da, -ku, -chi kabi yuklamalar ayrim holatlarda oʻzidan oldingi soʻzdan qanday ajratiladi?", "Bu yuklamalar oʻzidan oldingi soʻzdan chiziqcha bilan ajratilib yoziladi.", "Bu yuklamalar oʻzidan oldingi soʻzdan vergul bilan ajratilib yoziladi.", "Bu yuklamalar oʻzidan oldingi soʻz bilan qoʻshib yozilib ishlatiladi.", "Bu yuklamalar oʻzidan oldingi soʻzdan ikki nuqta bilan ajratiladi."], ["Yulduzlar, sayyoralar va boshqa osmon jismlarining atoqli otlari oʻzbek-lotin yozuvida qanday yoziladi?", "Bu turdagi nomlar, masalan Hulkar, Qavs, doimo bosh harf bilan yoziladi.", "Bu turdagi nomlar, masalan hulkar, qavs, faqat gap boshida bosh harf bilan yoziladi.", "Bu turdagi nomlar, masalan Hulkar, Qavs, qoʻshtirnoq ichida yoziladi.", "Bu turdagi nomlar, masalan Hulkar, Qavs, barchasi kichik harflar bilan yoziladi."], ["Madaniy-maishiy va savdo korxonalariga, transport vositalariga qoʻyilgan nomlar qanday yoziladi?", "“Navro'z” xayriya jamg'armasi kabi nomlarda bosh harf ishlatiladi.", "Faqat birinchi soʻzi bosh harf bilan yoziladi, qolganlari kichik harf boʻladi.", "Ushbu nomlar, jumladan, transport vositalari, toʻliq kichik harflar bilan yoziladi.", "Mazkur nomlar barcha soʻzlari bosh harf bilan yozilishi shart hisoblanadi."], ["Vazirlik, idora, korxona va tashkilot nomlarida nom tarkibidagi birinchi so'zning yozilishi qanday boʻladi?", "Nom tarkibidagi birinchi so'z doim bosh harf bilan yozilishi shartdir.", "Nom tarkibidagi barcha so'zlar bosh harf bilan yozilishi shartdir.", "Nom tarkibidagi barcha so'zlar kichik harf bilan yozilishi shartdir.", "Nom tarkibidagi birinchi so'z faqat qisqartmalarda bosh harf bilan yoziladi."], ["Tutuq belgisi unli tovushdan keyin kelib, shu unlining cho'ziqroq talaffuz qilinishini qaysi misollarda bildiradi?", "Ta'til, she'r, me'mor, ne'mat kabi soʻzlarda ushbu vazifani bajaradi.", "San'at, jur'at, qat'iy kabi soʻzlarda ushbu vazifani bajaradi.", "Is'hoq, as'hob, as'har kabi soʻzlarda ushbu vazifani bajaradi.", "Ulash, oʻzlash, kirish, chiqish kabi soʻzlarda ushbu vazifani bajaradi."], ["Tutuq belgisi undoshdan keyin kelganda unlini undoshdan ajratib talaffuz qilishga qaysi misollarda xizmat qiladi?", "San'at, jur'at, qat'iy kabi soʻzlarda fonetik ajratishni ta'minlaydi.", "Ta'til, she'r, me'mor, ne'mat kabi soʻzlarda fonetik ajratishni ta'minlaydi.", "Is'hoq, as'hob, as'har kabi soʻzlarda fonetik ajratishni ta'minlaydi.", "Oʻqish, yozish, gapirish, tinglash kabi soʻzlarda fonetik ajratishni ta'minlaydi."], ["Taqdimotda 'sh' harflari ikki alohida tovushni ifodalagan holatlarda ularning orasiga tutuq belgisi qo'yilishiga qaysi misollar keltirilgan?", "Is'hoq, as'hob, as'har kabi soʻzlarda tutuq belgisi ikki tovushni ajratadi.", "She'r, ne'mat, ta'til kabi soʻzlarda tutuq belgisi ikki tovushni ajratadi.", "Qoʻshish, yashash, ushlab kabi soʻzlarda tutuq belgisi ikki tovushni ajratadi.", "Ma'lumot, mu'jiza, sa'y-harakat kabi soʻzlarda tutuq belgisi ikki tovushni ajratadi."], ["Imlo qoidalarining yozma nutq savodxonligini ta'minlashdagi asosiy roli nimada?", "Yozma nutqning bir xilligi, aniqligi va savodxonligini ta'minlovchi me'yorlar tizimidir.", "Yozma nutqning tezligini oshirish va matnlarni qisqartirishni ta'minlashdir.", "Yozma nutqning badiiy jozibasini oshirishga va ifodaviylikni kuchaytirishga xizmat qiladi.", "Yozma nutqning oʻquvchiga ta'sirini kuchaytirish va matn mazmunini murakkablashtirishdir."], ["Imlo qoidalarini puxta egallash ayniqsa qaysi sohada muhim ahamiyatga ega va nima uchun?", "Kasbiy va rasmiy yozishmalarda muhim boʻlib, mutaxassis savodxonligini koʻrsatadi.", "Badiiy adabiyotda eng muhim boʻlib, ijodkorning shaxsiy uslubini rivojlantiradi.", "Ogʻzaki nutqda ahamiyatli boʻlib, soʻzlarni toʻgʻri talaffuz qilishga yordam beradi.", "Har kungi yozishmalarda, shaxsiy muloqotlarda muhim boʻlib, vaqtni tejashga xizmat qiladi."], ["Tilshunoslikning uslubiyat bo‘limi o‘rganadigan asosiy ob’ekt va vazifa qaysi javobda to‘g‘ri ifodalangan?", "Nutq jarayonida til vositalaridan vaziyat, maqsad va muhitga mos foydalanish qonuniyatlari", "Tildagi barcha so‘zlarning kelib chiqishi, etimologiyasi va tarixiy shakllanish jarayonlari", "Gap tarkibidagi so‘zlarning faqat sintaktik aloqalari hamda grammatik qoidalarining bayoni", "Leksik birliklarning lug‘aviy manbalardagi izohlanish mezonlari va imloviy me’yor tizimlari"], ["Nutqda so‘zning denotativ va konnotativ ma’nolari o‘zaro qanday munosabatda farqlanadi?", "Denotativ ma’no so‘zning asl, tub mohiyati bo‘lsa, konnotativ ma’no uning hissiy-uslubiy bo‘yog‘idir", "Denotativ ma’no faqat ko‘chma tushunchani bildirsa, konnotativ ma’no birlamchi o‘zak shaklidir", "Denotativ ma’no faqat badiiy matnga xos bo‘lsa, konnotativ ma’no atamashunoslik sohasiga taalluqlidir", "Denotativ ma’no so‘zning ohangdor shakli bo‘lsa, konnotativ ma’no yozma nutqning tayanch belgisidir"], ["Quyida keltirilgan sinonimik qatordagi so‘zlarning uslubiy bo‘yoqlari to‘g‘ri ko‘rsatilgan javobni aniqlang.", "“Bola” so‘zi betaraf, “farzand” kitobiy, “jujuq” so‘zlashuvga xos, “churvaqa” salbiy munosabatga ega", "“Bola” so‘zi rasmiy, “farzand” erkalash, “jujuq” ilmiy uslubga xos, “churvaqa” betaraf maqomga ega", "“Bola” so‘zi salbiy, “farzand” ommabop, “jujuq” badiiy uslubga xos, “churvaqa” kitobiy tusga ega", "“Bola” so‘zi shevaga xos, “farzand” betaraf, “jujuq” rasmiy doiraga xos, “churvaqa” ardoqlash ifodasidir"], ["So‘zlashuv uslubiga xos fonetik o‘zgarishlardan tovushlarning o‘rin almashinuvi qaysi javobda berilgan?", "Tuproq — turpoq, la’nat — nalat, aylandi — aynaldi", "Kelsa — kesa, bo‘lsa — bo‘sa, tashlamoq — tashamoq", "Yangidan — yangitdan, boshqadan — boshqattan shakli", "Munchoq — mo‘nchoq, ko‘ylak — ko‘ynak, qamish — qamich"], ["So‘zlashuv uslubida qo‘shimcha qo‘shilishi natijasida o‘zak-negiz qisqarishi kuzatilgan holatni toping.", "Olibdi — opti, kelibdi — kepti ko‘rinishida qo‘llanishi", "Qulflamoq — quflamoq, kelsa — kesa tarzida tovush tushishi", "Bog‘lamoq — boylamoq, ketdi — ketti kabi tovush almashishi", "Yangidan — yangitdan kabi qo‘shimcha tovush orttirilishi"], ["So‘zlashuv uslubida ayrim otlarning qisqartirib ishlatilishiga xos to‘g‘ri qatorni ko‘rsating.", "Kilogramm — kilo, million — mil, metropoliten — metro", "Avtomobil — ulov, tramvay — vagon, trolleybus — avtobus", "Diplomat — elchi, mutaxassis — usta, talaba — shogird", "Muassasa — idora, mudir — boshliq, maosh — oylik pul"], ["So‘zlashuv uslubida fe’llarning o‘ziga xos grammatik qo‘llanish shakllari qaysi javobda to‘g‘ri berilgan?", "Fe’lning -i(b) edi shakli o‘rnida -uvdi, -ovdi shakllarining ishlatilishi", "Fe’llarning har doim majhul nisbat va sifatdosh shaklida qo‘llanilishi", "Fe’l shakllarining qat’iy ravishda buyruq maylining uchinchi shaxsida kelishi", "Fe’l o‘rniga asosan harakat nomlari va ravishdosh birikmalarining tanlanishi"], ["Rasmiy-idoraviy uslubning umumiy va sintaktik xususiyatlariga oid to‘g‘ri mulohazani belgilang.", "Jumlalar inversiyasiz tuziladi, qoliplashgan shakllar va darak gaplar ustuvor bo‘ladi", "Jumlalar hissiy bo‘yoqqa boy bo‘lib, badiiy tasvir vositalari keng o‘rin egallaydi", "Gaplarda so‘z tartibi erkin bo‘lib, ritorik so‘roq gaplar faol ravishda qo‘llanadi", "Shevaga xos so‘zlar va so‘zlashuv qisqartmalari matn mazmunini to‘ldirib turadi"], ["Rasmiy uslubda bo‘yoqdor so‘zlar ishlatilmasa-da, qaysi sohada hurmat va ehtirom ifodalari qo‘llanishi mumkin?", "Xalqaro diplomatik munosabatlar va yozishmalarda", "Sud majlislari va prokuratura bayonnomalarida", "Korxona ichki hisobotlari va dalolatnomalarida", "Moliyaviy hisob-kitoblar va bank to‘lov daftarlarida"], ["Rasmiy-idoraviy uslubning grammatik qurilishida qaysi vositalar yetakchi o‘rin egallaydi?", "Harakat nomi, fe’lning majhul nisbati va buyruq-istak maylining uchinchi shaxsi", "Kichraytirish-erkalash qo‘shimchalari hamda modal ma’no ifodalovchi yuklamalar", "Undov so‘zlar, kirish so‘zlar va his-hayajonni ifodalovchi to‘liqsiz gaplar tizimi", "Shart va istak maylidagi fe’llarning birinchi shaxs ko‘plik shaklidagi namunalari"], ["Rasmiy hujjatlarda shaxslarning tavsifiy atalishiga doir to‘g‘ri misollar qatorini ko‘rsating.", "“uyni ijaraga oluvchi”, “mansabdor shaxslar”, “o‘g‘il qilib oluvchi”", "“mahalla oqsoqoli”, “yosh ijodkor”, “yurtdoshimiz”, “qardoshlarimiz”", "“mehnatkash inson”, “muhtaram otaxon”, “aziz talaba”, “yurt posboni”", "“mehribon ustoz”, “jonkuyar rahbar”, “fidoyi xodim”, “faol yoshlar”"], ["Ilmiy uslubning matn yaratishdagi eng asosiy va o‘ziga xos xususiyatlari qaysilar hisoblanadi?", "Mantiqiylik, aniqlik, obyektivlik, bir ma’nolilik va qat’iy xulosalarning ustunligi", "Badiiy timsollilik, subyektiv yondashuv, so‘z o‘yinlari va ko‘chma ma’nolar mo‘lligi", "Da’vatkorlik ruhi, qisqa dialogik tuzilish, ohangdorlik va ritorik murojaatlilik", "Erkin nutqiy tuzilish, inversiyaga moyillik hamda aralash uslubiy vositalar ustunligi"], ["Ilmiy uslubning sintaktik xususiyatiga oid to‘g‘ri ma’lumot berilgan javobni belgilang.", "Ellipsis deyarli uchramaydi, qoida va ta’riflarni ochishda ajratilgan bo‘laklar qo‘llanadi", "Matnda to‘liqsiz gaplar juda faol qo‘llanadi va gap bo‘laklari erkin tushirib qoldiriladi", "Kesimlar doimo o‘tgan zamon hikoya fe’llari bilan birinchi shaxsda ifodalanadi", "His-hayajon gaplar hamda chaqiriq ifodalovchi yoyiq undalmalar asosiy o‘rin tutadi"], ["Ilmiy-ommabop uslubning sof ilmiy uslubdan ajratib turuvchi asosiy jihati nimalardan iborat?", "Ilmiy fikrlarning keng ommaga tushunarli tilda, qisman obrazli unsurlar vositasida berilishi", "Matnlarda terminlarning butunlay qo‘llanilmasligi va sheva so‘zlariga tayanilishi", "Faqat qonuniy normalarga asoslanishi hamda rasmiy buyruq jumlalaridan tashkil topishi", "Estetik zavq bag‘ishlash maqsadida badiiy to‘qimalardan keng foydalanilishi"], ["Qaysi javobda faqat yozma publitsistikaning janr ko‘rinishlari berilgan?", "Bosh maqolalar, felyetonlar, pamfletlar, chaqiriqlar, murojaatnomalar", "Kundalik yangiliklar eshittirishi, notiqlik san’ati, suhbatdosh nutqi", "Diplomatik notalar, da’vo arizalari, xalqaro shartnomalar, dalolatnomalar", "Darsliklar, ilmiy monografiyalar, dissertatsiyalar, laboratoriya xulosalari"], ["Publitsistik uslubning morfologik jihatdan so‘z yasalishiga oid okkazionalizm namunalarini aniqlang.", "Davlatxona, gazetaxona, barakaxona, da’vatnoma, musibatnoma", "Oliy Bosh Qo‘mondon, Harbiy gospital, Mudofaa vazirligi", "Guvohnoma, dalolatnoma, bildirishnoma, tushuntirish xati", "Nuriston, Toshkentnoma, sho‘xshanlashmoq, ko‘kning qopqasi"], ["Nima sababdan tilshunoslikda badiiy uslub “aralash uslub” sifatida ta’riflanadi?", "Qahramonlar nutqida so‘zlashuv, sheva va barcha boshqa uslub unsurlari qamrab olinishi tufayli", "Uslubda hech qanday adabiy me’yor va qoidalarga qat’iy amal qilinmasligi tufayli", "Matnlarda faqat chet tilidan kirib kelgan varvarizm va neologizmlar ishlatilishi tufayli", "U faqat ilmiy dalillar bilan publitsistik murojaatlarning teng qo‘shilishidan iboratligi sababli"], ["G‘afur G‘ulom va Oybek ijodida qo‘llangan individual-mualliflik neologizmlari to‘g‘ri berilgan qatorni toping.", "“qopqa”, “sho‘xshanlashmoq” (G‘.G‘ulom); “miljinglamoq”, “jabrkor” (Oybek)", "“gazetaxona”, “davlatxona” (G‘.G‘ulom); “barakaxona”, “shaharsoz” (Oybek)", "“nuriston”, “nurobod” (G‘.G‘ulom); “zakonchi”, “zakalat”, “iskovich” (Oybek)", "“protest”, “deklaratsiya” (G‘.G‘ulom); “kassatsiya”, “turg‘unlik” (Oybek)"], ["Uslubni shakllantiruvchi vositalar tizimida fonetik vositalar guruhiga qaysilar kiradi?", "Nutq tovushlari, ohang va urg‘u", "Frazeologik iboralar va ko‘p ma’noli so‘zlar", "Barcha so‘z turkumlari va qo‘shimchalar", "Undalmalar, kirish so‘zlar va so‘roq gaplar"], ["Nutq uslublarining asosiy vazifaviy doiralari to‘g‘ri muvofiqlashtirilgan javobni ko‘rsating.", "So‘zlashuv — kundalik muloqotga, rasmiy — hujjatchilikka, ilmiy — mantiqiy bayonga, badiiy — estetik tasvirga", "So‘zlashuv — qonunchilikka, rasmiy — estetik ta’sirga, ilmiy — ommaviy tashviqotga, badiiy — dalillashga", "So‘zlashuv — mavhum axborotga, rasmiy — xususiy suhbatga, ilmiy — his-tuyg‘uga, badiiy — qat’iy me’yorga", "So‘zlashuv — rasmiy hisobotga, rasmiy — ommabop maqolaga, ilmiy — dialogga, badiiy — farmoyish tuzishga"], ["Matnda keltirilgan ta'rifga binoan, ish yuritish tushunchasining tub mohiyati nimani anglatadi?", "Boshqaruv faoliyatini hujjatlar orqali tashkil etish, rasmiylashtirish, hisobga olish va saqlashni", "Xodimlarning ichki tartib qoidalariga rioya etishini nazorat qilish va ularning intizomini ta'minlashni", "Tashkilotning yillik moliyaviy hisobotlarini tayyorlash hamda bank operatsiyalarini amalga oshirishni", "Xizmat xatlarini faqat axborot texnologiyalari vositasida elektron tizimlarga kiritish va jo'natishni"], ["Sohada davlat tilida ish yuritishning eng asosiy maqsadi qaysi javobda to'g'ri ko'rsatilgan?", "Mutaxassisda hujjatlarni mazmunan aniq, mantiqan izchil va til me'yoriga mos tuzish ko'nikmasini shakllantirish", "Xodimlarning barchasiga badiiy va publitsistik uslubdagi matnlarni erkin tahrir qilish amaliyotini o'rgatish", "Idora faoliyatidagi barcha qog'ozbozlik jarayonlarini qisqa muddat ichida to'liq bekor qilishga erishish", "Muassasalar o'rtasidagi rasmiy yozishmalarni faqat og'zaki muzokaralar asosida tashkil etishni yo'lga qo'yish"], ["Sohaviy faoliyatda terminlarning bir xil va to'g'ri ma'noda qo'llanishi qanday amaliy natijaga olib keladi?", "Kasbiy muloqotda yuzaga kelishi mumkin bo'lgan noaniqliklarning oldini oladi va uyg'unlikni ta'minlaydi", "Hujjat matnining hajmini maksimal darajada kengaytirib, undagi huquqiy atamalar sonini oshirishga xizmat qiladi", "Rasmiy hujjatlarning barchasida erkin publitsistik jumlalar qo'llanishiga to'liq sharoit yaratib beradi", "Korxona xodimlarining faoliyatini baholashda yagona mezonlar tizimini avtomatik tarzda shakllantiradi"], ["Quyidagilardan qaysi biri davlat tilida ish yuritishning asosiy vazifalaridan biri hisoblanmaydi?", "Hujjat matnida shevaga xos so'zlar va erkin badiiy tasvir vositalaridan keng foydalanishni yo'lga qo'yish", "Rasmiy hujjatlarni o'zbek adabiy tili me'yorlariga qat'iy rioya qilgan holda to'g'ri shakllantirish", "Hujjat turiga mos shakl, qolip hamda qonuniy belgilangan rekvizitlardan o'rinli ravishda foydalanish", "Elektron hujjatlar bilan ishlashda ham davlat tili va rasmiy-idoraviy uslub talablarini to'liq saqlash"], ["Rasmiy uslub talablariga ko'ra, hujjat matnida qanday til birliklaridan qochish qat'iyan tavsiya etiladi?", "Shevaga xos birliklar, jargonlar, ortiqcha hissiy-bo'yoqdor so'zlar va ko'p ma'noli mavhum iboralardan", "Umumqabul qilingan huquqiy atamalar, rasmiy idoraviy qoliplar hamda aniq statistik ma'lumotlardan", "Mantiqiy izchillikni ta'minlovchi standart bog'lovchilar, sabab-oqibat ifodalari va aniq sanalardan", "Hujjatning qisqa va lo'nda bo'lishini ta'minlaydigan turg'un birikmalar va rasmiy jumlalardan"], ["Rasmiy-idoraviy uslubda standart qoliplar va turg'un birikmalarning qo'llanishidan ko'zlangan asosiy maqsad nima?", "Hujjat tilini bir xillashtirish, matnni qisqa, tushunarli qilish va ifodaning bir xilligini ta'minlash", "Hujjat mazmunini chuqur o'rganmasdan faqat mexanik takrorlash orqali yangi hujjat matnini tuzish", "Matn muallifining individual ijodiy mahoratini va o'ziga xos badiiy so'z boyligini namoyish etish", "Idoralararo munosabatlarda erkin suhbat ohangini shakllantirish va yozishmalarni tezlashtirish"], ["Sohaviy hujjatchilikda terminologik aniqlikni ta'minlash uchun qaysi qoidaga amal qilish lozim?", "Muayyan tushunchani matn davomida turli sinonimlar bilan almashtirmasdan, bir xil termin bilan ifodalash", "Tushunarsiz terminlarni yashirish maqsadida ularning o'rniga faqat xalqaro ko'p ma'noli so'zlarni qo'llash", "Har bir bandda yangi atamalarni ixtiro qilish orqali matnning leksik rang-barangligini oshirib borish", "Terminlarning ma'nosini matn ichida ifodalamasdan faqat umumiy tushunchalar bilan cheklanib qolish"], ["Hujjat tilida qisqartmalardan foydalanishning qanday me'yori belgilangan?", "Faqat umumqabul qilingan yoki matnning boshida maxsus izohlangan qisqartmalarni qo'llash joiz", "Matn hajmini qisqartirish uchun istalgan ko'p bo'g'inli so'zlarni ixtiyoriy shaklda qisqartirish mumkin", "Qisqartmalar faqat xorijiy tillardagi xalqaro standart qisqartmalardan iborat bo'lishi shart", "Hujjatning faqatgina yakuniy qaror qismida har xil erkin shaxsiy qisqartmalardan foydalaniladi"], ["Hujjat matniga qo'yiladigan talablardan biri bo'lgan \"qisqalik\" tamoyili nimani anglatadi?", "Zaruriy axborot mazmunini saqlagan holda matnni ortiqcha so'z va keraksiz unsurlarsiz lo'nda ifodalashni", "Zarur ma'lumotlarning yetishmasligiga olib kelsa ham jumlalar sonini sun'iy ravishda kamaytirishni", "Hujjatdagi barcha rasmiy rekvizitlar va asoslovchi faktlarni chiqarib tashlab qisqa xat yozishni", "Matn mazmunini faqat bitta gapdan iborat qilib tuzish va barcha tushuntirishlarni chetlab o'tishni"], ["Hujjat matniga qo'yiladigan \"mantiqiylik\" talabi qanday ifodalanadi?", "Keltirilayotgan ma'lumotlarning qat'iy izchil hamda sabab-oqibat aloqadorligida joylashishi orqali", "Hujjat tuzuvchining shaxsiy his-tuyg'ulari va subyektiv qarashlarining ifodalanishi orqali", "Murakkab qo'shma gaplarning juda ko'p qo'llanishi va atamalarning chuqur tavsifi orqali", "Hujjatning bosh qismida darhol yakuniy qarorlar va topshiriqlarning bayon qilinishi orqali"], ["Boshqaruv amaliyotida vazifasi va mazmuniga ko'ra hujjatlar asosan qaysi guruhlarga ajratiladi?", "Tashkiliy, farmoyish, ma'lumot-axborot hujjatlari hamda xizmat yozishmalari guruhlariga", "Badiiy, ilmiy-ommabop, falsafiy-tahliliy hamda shaxsiy kundalik qaydlar guruhlariga", "Faqatgina ichki buyruqlar, ma'muriy dalolatnomalar hamda kadrlar hisoboti guruhlariga", "Moliyaviy taftish xulosalari, texnik chizmalar hamda loyiha-smeta hujjatlari guruhlariga"], ["Hujjat matni odatda qanday uchta asosiy mazmuniy qismdan tashkil topadi?", "Kirish, asosiy qism va yakuniy mazmuniy qismlardan", "Muqaddima, tahliliy sharh va tanqidiy xulosalardan", "Sarlavha, ilmiy asosnoma va tushuntirish xatidan", "Adresat, moliyaviy hisob-kitob va nazorat rejasidan"], ["Ariza hujjatiga berilgan to'g'ri ta'rif qaysi javobda keltirilgan?", "Shaxsning muassasa rahbariga iltimos, so'rov, taklif yoki shikoyat bilan yozma murojaat qilish hujjatidir", "Xodimning muayyan davrdagi faoliyatiga tashkilot nomidan rasmiy baho beruvchi tavsiflovchi hujjatdir", "Kollegial tadbirning borishi, muhokama qilingan masalalar va qabul qilingan qarorlarni qayd etuvchi hujjatdir", "Muayyan shaxsning o'qishi yoki ishlash holatini boshqa tashkilotga tasdiqlab beruvchi rasmiy dalildir"], ["Arizaning matni ko'pincha qanday turg'un sintaktik konstruksiya bilan yakunlanadi?", "\"Sizdan ... so'rayman\" shaklidagi aniq konstruksiya bilan", "\"Ma'lumot uchun taqdim etiladi\" degan jumlalar bilan", "\"Qaror qilindi va tasdiqlansin\" tarzidagi amr bilan", "\"Haqiqatan ham ushbu idorada ishlaydi\" jumlasi bilan"], ["Ma'lumotnoma hujjatining turlari mazmuniga ko'ra qanday ajratiladi?", "Shaxsga oid ma'lumotnomalar va xizmat mazmunidagi ma'lumotnomalarga", "Tashkiliy-huquqiy ma'lumotnomalar va sud tergov ma'lumotnomalariga", "Xalqaro diplomatik ma'lumotnomalar va tijorat hisob ma'lumotnomalariga", "Maxfiy idoraviy ma'lumotnomalar va ommaviy axborot ma'lumotnomalariga"], ["Bayonnomaning asosiy matn qismi qanday maxsus bo'limlardan iborat bo'lishi mumkin?", "\"ESHITILDI\", \"SO'ZGA CHIQDI\", \"QAROR QILINDI\" kabi bo'limlardan", "\"KIRISH SO'ZI\", \"IJODIY BAHOSI\", \"TAVSIYA ETILADI\" kabi bo'limlardan", "\"BUYURAMAN\", \"VAZIFALANTIRILSIN\", \"IJROSI TEKSHIRILSIN\" kabi qismlardan", "\"ILTIMOSNOMA\", \"SURISHTIRUV\", \"YAKUNIY XULOSA\" kabi bo'limlardan"], ["Tavsifnoma tuzishda qanday ifodalardan foydalanish xolislik talabiga mos keladi?", "\"Topshiriqlarni o'z vaqtida bajaradi\", \"fanlarni yaxshi o'zlashtirgan\" kabi tekshiriladigan jumlalardan", "\"Juda ajoyib inson\", \"beqiyos xodim\", \"tengsiz iqtidor egasi\" kabi yuksak hissiy iboralardan", "\"Har tomonlama namunali\", \"hech qanday xatoga yo'l qo'ymaydigan mutaxassis\" kabi umumiy maqtovlardan", "\"Jamoaning sevimli a'zosi\", \"barcha ishni mukammal uddalaydi\" kabi subyektiv tavsiflardan"], ["Tavsifnoma va tavsiyanoma hujjatlarining o'zaro asosiy farqi nimada namoyon bo'ladi?", "Tavsifnoma mavjud faoliyatni baholaydi, tavsiyanoma esa kelajakdagi imkoniyat yoki vazifaga tavsiya beradi", "Tavsifnoma faqat jismoniy shaxslarga, tavsiyanoma esa faqat yuridik tashkilotlarga nisbatan yoziladi", "Tavsifnomada imzo qo'yish talab etilmaydi, tavsiyanomada esa rahbar imzosi qat'iy bo'lishi shart", "Tavsifnoma erkin og'zaki nutqda beriladi, tavsiyanoma esa qat'iy davlat blankida tasdiqlanadi"], ["Elektron ish yuritish tizimida hujjatlar bilan ishlashda qaysi jihatga e'tibor qaratish talab etiladi?", "Fayl nomi, versiyasi, sanasi va manzilini aniq belgilab, tahrirlar chalkashmasligini ta'minlashga", "Matnda messenjerlarga xos erkin belgilar, emodzilar va norasmiy qisqartmalarni ko'p ishlatishga", "Rasmiy-idoraviy uslub talablarini bekor qilib, o'rniga so'zlashuv uslubidan erkin foydalanishga", "Yakuniy nusxani saqlamasdan faqat dastlabki xomaki qoralamalarni arxivda saqlab qolishga"], ["Matnda \"hujjat aylanishi\" tushunchasi qanday jarayonlarni o'z ichiga olishi bayon etilgan?", "Hujjatning yaratilishidan boshlab ro'yxatga olish, ijro, nazorat, yakunlash va saqlashgacha bo'lgan davrni", "Faqatgina xatlarni bitta bo'limdan boshqa bo'limga pochta xodimlari orqali yetkazish jarayonini", "Eskirgan va muddati o'tgan barcha qog'oz hujjatlarni maxsus ro'yxat tuzmasdan yo'q qilish bosqichini", "Tashkilot xodimlarining lavozim maoshlarini hisoblash va oylik hisobotlarini topshirish vaqtini"]]}, {"name": "Turkiy davlatlar tarixi", "q": [["«Turkiy davlatlar tarixi» fanining tadqiqot obyekti nimalarni oʻz ichiga oladi?", "Turkiy xalqlar yashagan hududlarda qadimdan shakllangan siyosiy tuzilmalar, davlatlar, jamiyatlar, ijtimoiy-iqtisodiy munosabatlar, madaniy jarayonlar va ular bilan bogʻliq tarixiy hodisalar majmuidir.", "Faqat bugungi mustaqil turkiy davlatlarning tashkil topishi va rivojlanish bosqichlari, ularning zamonaviy diplomatiyasi va iqtisodiy aloqalari.", "Antik davr G'arbiy Yevropa imperiyalarining siyosiy va harbiy tizimlarini, Sharq sivilizatsiyasining ta'sirini o'rganish va tahlil qilish.", "Boshqa zamonaviy davlatlar, ularning ijtimoiy-siyosiy institutlari, xo'jalik shakllari hamda madaniy taraqqiyotining umumiy qonuniyatlari."], ["Tarixiy tadqiqotlarda “anaxronizm” tushunchasi nimani anglatadi?", "Tarixiy hodisa yoki tushunchani oʻz davriga mos kelmaydigan keyingi davr tushunchalari bilan izohlashni anglatadi.", "O'tmishdagi jarayonlarni zamonaviy taraqqiyot mezonlariga yaqinlashtirib, ularni qayta baholash jarayonidir.", "Tarixiy manbalarni tanqidiy tahlil qilish va ularning ishonchliligini baholashning asosiy metodologik tamoyilidir.", "Turli davrlardagi siyosiy tizimlarni qiyosiy oʻrganish va ularning oʻzaro ta'sirini aniqlash usulidir."], ["Tarixiy tadqiqotlarda “modernizatsiya” muammosi nimani anglatadi?", "Tarixiy jamiyatlarni zamonaviy taraqqiyot modeli asosida izohlash yoki o'tmishdagi jarayonlarni bugungi taraqqiyot mezonlariga yaqinlashtirishni anglatadi.", "Qadimgi jamiyatlardagi tushunchalarni oʻz davrining shart-sharoitlari asosida tushuntirish zaruriyatini ifodalaydi.", "Tarixiy faktlarni toʻplash va ularni xronologik tartibda tizimlashtirish bilan bogʻliq metodologik yondashuvdir.", "Turli davrlardagi etnik guruhlarning shakllanishi va ularning siyosiy birlashuvi jarayonlarini oʻrganishdir."], ["«Turkiy davlatlar tarixi» fanining asosiy maqsadi nimalardan iborat?", "Bakalavr talabalarga turkiy xalqlar va davlatlarning tarixiy taraqqiyoti haqida ilmiy, tizimli, xolis bilim berish, manbalarni tahlil qilish ko'nikmasini shakllantirish.", "Faqat qadimgi turkiy davlatchilikning paydo boʻlish omillarini tushuntirish va ularni zamonaviy davlatlar bilan qiyoslashni o'rgatish.", "Asosan yozma manbalar asosida turkiy xalqlarning harbiy yurishlarini o'rganish va siyosiy raqobatlarni tahlil qilish ko'nikmasini berish.", "Talabalarni zamonaviy siyosiy atamalarni qadimgi jamiyatga qoʻllashga oʻrgatish va tarixiy voqealarni faqat iqtisodiy omillar nuqtai nazaridan baholash."], ["«Turkiy davlatlar tarixi» fanining asosiy vazifalaridan biri boʻlgan “Manbashunoslik koʻnikmasini shakllantirish” nimani nazarda tutadi?", "Talabalarni yozma, arxeologik, epigrafik, numizmatik va boshqa manbalar bilan ishlashga oʻrgatishni nazarda tutadi.", "Tarixiy jarayonlarni faqat zamonaviy ommaviy axborot vositalari ma'lumotlari asosida tahlil qilishni o'rgatishni nazarda tutadi.", "Qadimgi turkiy tilning grammatik qoidalarini o'rganish va uni boshqa tillar bilan qiyoslashni nazarda tutadi.", "Faqat bir xil turdagi manbalarni, masalan, faqat xorijiy yilnomalarni chuqur o'rganishni nazarda tutadi."], ["Turkiy tarixni tadqiq etishda qaysi turdagi manbalar muhim ma'lumotlarni beradi?", "Xitoy yilnomalari, fors-tojik va arab tarixiy asarlari, Orxon-Yenisey bitiklari hamda arxeologik topilmalar.", "Faqat g'arbiy Yevropa sayohatchilarining yozuvlari va zamonaviy tilshunoslarning tadqiqotlari.", "Asosan geologik izlanishlar va paleontologik qazilmalar orqali topilgan qadimiy hayvonlar suyaklari.", "Faqat Markaziy Osiyo xalqlarining folklor namunalari va diniy marosimlarining yozma tavsiflari."], ["Qadimgi turkiy davlatchilikning shakllanishidagi “siyosiy birlashuv” omili nimani anglatadi?", "Turli qabila va urugʻlarning umumiy siyosiy manfaatlar asosida birlashuvi yirik siyosiy tuzilmalarning vujudga kelishiga zamin yaratgan.", "Faqatgina Buyuk Ipak yoʻli boʻylab savdo aloqalarining rivojlanishi natijasida yuzaga kelgan iqtisodiy integratsiya jarayonidir.", "Qoʻshni davlatlarning harbiy bosqinchilik siyosati natijasida turkiy qabilalarning yagona dushman atrofida majburiy birlashuvi.", "Diniy g'oyalarning tarqalishi va yagona diniy markazning shakllanishi asosida yuzaga kelgan madaniy birlashuv jarayoni."], ["Turk xoqonligining siyosiy tizimida uchraydigan unvon va lavozimlarga qaysilar kiradi?", "Xoqon, yabgʻu, shad, eltabar, tudun kabi unvon va lavozimlar uchraydi.", "Sulton, vazir, noib, qozikalon kabi unvon va lavozimlar uchraydi.", "Imperator, prokonsul, senator, tribun kabi unvon va lavozimlar uchraydi.", "Boshliq, muhandis, savdogar, dehqon kabi unvon va lavozimlar uchraydi."], ["Tizimli yondashuvning asosiy bosqichlaridan biri boʻlgan “Hududni aniqlash” nimaga qaratilgan?", "Voqea qaysi geografik makonda yuz berganligini aniqlashga qaratilgan.", "Tarixiy hodisaning qachon sodir bo'lganligini aniqlashga qaratilgan.", "Hodisaning yuzaga kelishiga qanday omillar ta'sir ko'rsatganligini aniqlashga qaratilgan.", "Unda qaysi siyosiy kuchlar, qabilalar, sulolalar va xalqlar ishtirok etganligini aniqlashga qaratilgan."], ["Turkiy xalqlarning etnogenezi masalasida nimalarni qiyoslash zarur deb hisoblanadi?", "Etnogenez masalasida yozma manbalar bilan birga arxeologiya, tarixiy antropologiya, tilshunoslik va boshqa fanlarning ma'lumotlarini qiyoslash zarur.", "Faqat afsonalar va ogʻzaki ijod namunalarini, xalq eposlarini chuqur oʻrganish va ularni madaniy tahlil qilish zarur.", "Faqat bir xil turdagi arxeologik topilmalarni, masalan, faqat sopol idishlarni qiyoslash va ularning geografik tarqalishini aniqlash zarur.", "Faqat zamonaviy genetik tadqiqotlar natijalarini va ularning turkiy xalqlarning qon guruhlari bilan bogʻliqligini oʻrganish zarur."], ["Markaziy Osiyodagi koʻchmanchi va oʻtroq jamiyat munosabatlariga qaysi elementlar kiradi?", "Koʻchmanchi chorvachilik, voha dehqonchiligi, shahar madaniyati va savdo oʻrtasidagi oʻzaro aloqalar kiradi.", "Faqatgina diniy ta'limotlarning tarqalishi va yagona madaniy qadriyatlarning shakllanishi kiradi.", "Asosan harbiy yurishlar va siyosiy raqobat asosida yuzaga kelgan hududiy oʻzgarishlar kiradi.", "Faqatgina metallurgiya va qurol ishlab chiqarishga asoslangan texnologik almashinuvlar kiradi."], ["Turkiy davlatlar tarixini oʻrganishda xalqaro siyosiy va iqtisodiy jarayonlar bilan bogʻliqlikni hisobga olish nima uchun muhim?", "Turkiy davlatlarning rivojlanishi Xitoy, Eron, Vizantiya, Arab xalifaligi va boshqa siyosiy markazlar bilan chambarchas bog'liq boʻlgani uchun.", "Turkiy davlatlar butunlay yakkalangan holda rivojlangan va tashqi aloqalar ularning taraqqiyotiga ta'sir ko'rsatmagan.", "Faqat ichki siyosiy qarorlar va mahalliy qabila nizolari turkiy davlatlarning tarixini belgilab bergan.", "Xalqaro savdo va diplomatiya oʻz davrida mavjud boʻlmaganligi sababli, ularning ahamiyati cheklangan edi."], ["Tizimli yondashuvning “Sabablarni aniqlash” bosqichida nima o'rganiladi?", "Hodisaning yuzaga kelishiga qanday omillar ta'sir ko'rsatganligini aniqlashga qaratilgan.", "Tarixiy hodisaning qaysi geografik makonda sodir bo'lganligini aniqlashga qaratilgan.", "Voqeada qaysi siyosiy kuchlar, qabilalar, sulolalar va xalqlar ishtirok etganligini aniqlashga qaratilgan.", "Tarixiy hodisaning siyosiy, iqtisodiy va madaniy oqibatlari qanday boʻlganligini aniqlashga qaratilgan."], ["Qadimgi turkiy davlatchilikni oʻrganishda tarixiy terminologiyaga ehtiyotkorlik bilan yondashish nimani anglatadi?", "“Davlat”, “imperiya”, “xalq”, “millat” kabi tushunchalarning tarixiy mazmunini aniq farqlash zarurligini anglatadi, ularni keyingi davr mazmuni bilan tenglashtirmaslik kerak.", "Barcha tarixiy atamalarni zamonaviy siyosatshunoslik nuqtai nazaridan yagona ma'no asosida tushunish va ularni soddalashtirishni anglatadi.", "Faqatgina turkiy tildagi terminologiyadan foydalanish, boshqa tillardagi tushunchalarni butunlay inkor etish muhimligini anglatadi.", "Tarixiy atamalarni faqat iqtisodiy kategoriyalar nuqtai nazaridan baholash va ularning siyosiy yoki madaniy ma'nosini cheklashni anglatadi."], ["G'arbiy Turk xoqonligi hududlari qaysi mintaqalarni qamrab olgan?", "G'arbiy Turk xoqonligi hududlari Movarounnahr va Yettisuvning katta qismini qamrab olgan.", "G'arbiy Turk xoqonligi faqat Sibirning shimoliy qismlarini va Ural tog'lari atrofini o'z ichiga olgan.", "G'arbiy Turk xoqonligi faqat Xitoyning sharqiy hududlari va Tinch okeani sohillarini qamrab olgan.", "G'arbiy Turk xoqonligi asosan Yevropaning g'arbiy qismlarini va O'rta yer dengizi hududlarini qamrab olgan."], ["Fanning vazifalaridan biri boʻlgan “Tarixiy tafakkurni rivojlantirish” nimani anglatadi?", "Talabada voqea va hodisalarni sabab-oqibat, xronologik va hududiy jihatdan tahlil qilish qobiliyatini rivojlantirishni anglatadi.", "Talabani faqatgina faktlarni yodlashga va sanalarni eslab qolishga o'rgatishni, tahlilga e'tibor bermaslikni anglatadi.", "Talabaga zamonaviy voqealarni qadimgi davr bilan solishtirish orqali kelajakni bashorat qilishni o'rgatishni anglatadi.", "Talabaning faqat bir xil turdagi manbalar asosida xulosalar chiqarish qobiliyatini rivojlantirishni anglatadi."], ["Tizimli yondashuvning “Jarayonni tahlil qilish” bosqichida nima o'rganiladi?", "Hodisaning qanday rivojlanganligini, bosqichlarini va ichki dinamikasini o'rganishga qaratilgan.", "Voqeaning aniq vaqtini va uning sodir bo'lgan sanasini aniqlashga qaratilgan.", "Hodisaning kelib chiqishiga ta'sir etgan sabablarni va ularning asosiy omillarini aniqlashga qaratilgan.", "Hodisa natijasida yuzaga kelgan siyosiy, iqtisodiy va madaniy oqibatlarni baholashga qaratilgan."], ["Turkiy davlatlar tarixi fanining tadqiqot obyekti deganda nima tushuniladi, uning keng qamrovli mazmunini aniqlang?", "Turkiy xalqlar yashagan hududlardagi qadimdan shakllangan siyosiy tuzilmalar, davlatlar, jamiyatlar, ijtimoiy-iqtisodiy munosabatlar va madaniy jarayonlar majmuasi.", "Faqat zamonaviy turkiy davlatlarning tashkil topish tarixini va ularning bugungi kundagi siyosiy ta'sirini o'rganishga qaratilgan tadqiqot sohasi.", "Turkiy xalqlarning faqat harbiy yurishlari va bosqinchilik siyosatini aks ettiruvchi manbalar asosida tuzilgan ma'lumotlar to'plami hisoblanadi.", "Antik davrdagi qabilalarning ovchilik va terimchilikka asoslangan turmush tarzini batafsil o'rganishga xizmat qiladigan tarixiy fan."], ["\"Turkiy davlatlar tarixi\" fani tadqiqotining predmeti nimalarni oʻz ichiga oladi, bu tushunchaning ahamiyatini belgilang?", "Turkiy xalqlarning etnik va siyosiy shakllanish jarayonlari, davlat boshqaruvi institutlari, xoqon, yabgʻu kabi unvonlarning tarixiy oʻrni va qabila munosabatlari.", "Faqatgina Buyuk Ipak yoʻli orqali amalga oshirilgan savdo aloqalari hamda turli mamlakatlar orasidagi madaniy almashinuvning asosiy jihatlari.", "Turkiy xalqlarining keyingi asrlardagi iqtisodiy islohotlarini, zamonaviy moliya tizimini va ularning ta'lim sohasidagi yutuqlarini oʻrganish.", "Qadimgi turkiy davlatlarning faqat yozma madaniyatini, epik dostonlarini, musiqiy asarlarini va ularning bugungi kungacha saqlanishini tahlil qilish."], ["\"Turkiy davlatlar tarixi\" fanining asosiy maqsadi bakalavr talabalariga nimalarni berishga qaratilganini aniqlang?", "Talabalarga turkiy xalqlar va turkiy davlatlarning tarixiy taraqqiyoti haqida ilmiy, tizimli, xolis bilim berish hamda ularning jahon tarixidagi oʻrnini tushuntirish.", "Asosiy e'tibor zamonaviy geosiyosiy vaziyatni tahlil qilish, shu bilan birga turkiy davlatlarning iqtisodiy rivojlanish strategiyalarini ishlab chiqish.", "Talabalarni qadimgi turkiy yozma manbalarni yod olishga oʻrgatish va ularning diniy-falsafiy asoslarini chuqur tahlil qilish koʻnikmasini shakllantirish.", "Faqat bir sulolaning hokimiyat tepasiga kelishi va uning davlatni boshqarish usullarini batafsil oʻrganish orqali tarixiy bilimlarni yetkazish."], ["Fanning asosiy vazifalaridan biri boʻlgan \"Manbashunoslik koʻnikmasini shakllantirish\" qanday faoliyatni oʻz ichiga oladi?", "Talabalarni yozma, arxeologik, epigrafik, numizmatik va boshqa tarixiy manbalar bilan mustaqil ishlashga, ularni tahlil qilishga oʻrgatish jarayoni.", "Faqatgina arxeologik qazishmalar natijasida topilgan buyumlarni kataloglash va ularni saqlash usullarini talabalarga oʻrgatishga yoʻnaltirilgan vazifa.", "Tarixiy hodisalarning faqatgina sabab va oqibatlarini aniqlashga qaratilgan, manbalarning ishonchliligini baholashni inobatga olmaydigan yondashuv.", "Talabalarni zamonaviy texnologiyalardan foydalanib, tarixiy ma'lumotlarni elektron shaklda saqlash va ularni kompyuterda qayta ishlashga o'rgatish."], ["Turkiy davlatlar tarixini oʻrganishda yozma manbalar qanday ahamiyatga ega va ular qanday turlarni oʻz ichiga oladi?", "Xitoy yilnomalari, fors-tojik va arab tarixiy asarlari kabi yozma manbalar qadimgi turkiy siyosiy tuzilmalar, sulolalar va davlatlar haqida muhim ma'lumotlarni beradi.", "Asosan zamonaviy arxiv hujjatlari va davlat qonunlari yigʻindisi boʻlib, qadimgi davrlar uchun toʻgʻridan-toʻgʻri ma'lumot taqdim eta olmaydi.", "Yozma manbalar faqat epik she'riyat va xalq ogʻzaki ijodiyoti namunalari bilan cheklanadi, rasmiy hujjatlar esa kam uchraydi.", "Bu manbalar asosan qadimgi geografik xaritalar va turli xil savdo shartnomalaridan iborat bo'lib, siyosiy ma'lumotlar juda kam berilgan."], ["Orxon-Yenisey bitiklari turkiy tarixni oʻrganishda qanday oʻrin tutadi va ularning qimmatliligi nimada?", "Ular Kultegin, Bilga xoqon va Tonyukuk bitiklari orqali turkiy siyosiy tafakkur, davlat boshqaruvi, harbiy siyosat haqidagi bevosita tarixiy maʼlumotlarni beruvchi oʻzida yaratilgan epigrafik manbalardir.", "Bu bitiklar faqatgina qadimgi turkiy xalqlarning diniy marosimlarini tasvirlaydi va ularning ijtimoiy-siyosiy hayotiga oid ma'lumotlar juda kam uchraydi.", "Orxon-Yenisey bitiklari faqat tashqi kuzatuvchilar tomonidan yozilgan, shuning uchun ularning obyektivligi shubha ostida qoladigan manbalar sirasiga kiradi.", "Bu bitiklar asosan qadimgi turkiy savdogarlarning savdo yoʻllari haqidagi qaydnomalaridan iborat boʻlib, siyosiy yoki madaniy ahamiyatga ega emas."], ["Turkiy tarixni to'liq anglash uchun qaysi turdagi manbalar oʻzaro bogʻliq holda tahlil qilinishi kerakligini matn asosida koʻrsating?", "Yozma manba, arxeologik dalil, epigrafik material va numizmatik ma'lumotlar birgalikda, oʻzaro aloqadorlikda tahlil qilinishi zarur.", "Faqat yozma manbalar asosida tarixni oʻrganish yetarli boʻladi, boshqa turdagi manbalar esa qoʻshimcha ahamiyatga ega emas.", "Eng muhimi, numizmatik ma'lumotlar boʻlib, tangalar orqali barcha tarixiy jarayonlarni toʻliq tushunish mumkin.", "Arxeologik dalillar va epigrafik materiallar birinchi oʻrinda turadi, yozma manbalar esa ularning toʻgʻriligini tasdiqlash uchun xizmat qiladi."], ["Qadimgi turkiy davlatchilikning shakllanishiga ta'sir koʻrsatgan eng muhim omillardan biri sifatida nima koʻrsatilgan?", "Turli qabila va urug'larning umumiy siyosiy manfaatlar asosida birlashuvi, bu yirik siyosiy tuzilmalarning vujudga kelishiga zamin yaratgan.", "Faqatgina tashqi bosqinlar va boshqa davlatlar bilan boʻlgan doimiy ziddiyatlar turkiy davlatchilikni shakllantirishga asos boʻlgan.", "Asosiy omil savdo monopoliyasi boʻlib, boshqa davlatlarning savdo yoʻllarini nazorat qilishga urinishlar davlatchilikka olib kelgan.", "Faqat bir sulolaning diniy islohotlari va
